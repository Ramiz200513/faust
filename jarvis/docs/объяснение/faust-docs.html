adlew bootJar            ← один «толстый» jar со всеми зависимостями\nСтадия 2 &quot;run&quot;:    eclipse-temurin:21-jre   (только JRE, без компилятора — меньше и безопаснее)\n   COPY --from=build .../*.jar app.jar\n   useradd relay; USER relay        ← не от root\n   ENTRYPOINT java -jar app.jar\n<\/code><\/pre>\n<p>Почему два этапа: инструменты сборки (JDK, Gradle, исходники) в итоговый образ не попадают.<\/p>\n<p><code>.dockerignore<\/code> исключает <code>build/<\/code>, <code>.gradle/<\/code>, <code>docs/<\/code>, <code>scripts/<\/code>, <code>.env<\/code> — быстрее сборка и секреты не попадут в образ.<\/p>\n<h4><code>Dockerfile.local<\/code> — быстрый путь<\/h4>\n<p>У честной сборки внутри Docker есть цена: при сброшенном кэше Docker заново качает из интернета Gradle и все библиотеки (~0,5 ГБ). 2 октября на медленной сети это заняло больше 10 минут. На ПК разработчика всё это уже лежит в кэше Gradle, поэтому появился второй файл:<\/p>\n<pre><code>FROM eclipse-temurin:21-jre\nCOPY app.jar app.jar          ← jar уже собран Gradle на самом компьютере\nuseradd relay; USER relay     ← не от root, как и в основном\nENTRYPOINT java -jar app.jar\n<\/code><\/pre>\n<p>Им пользуется <code>faust.ps1<\/code> (функция <code>Build-RelayLocally<\/code>): <code>gradlew.bat bootJar<\/code> → jar копируется в <code>build/docker-local/app.jar<\/code> (отдельная папка-контекст, потому что <code>.dockerignore<\/code> исключает <code>build/<\/code> целиком) → <code>docker build -f Dockerfile.local -t jarvis-relay-relay:latest build\\docker-local<\/code>. Интернет не нужен, вся пересборка — около минуты. Если локальная сборка не удалась (нет Java, сломан кэш), скрипт сам возвращается к основному <code>Dockerfile<\/code>. На защите это значит: пересборка релея не зависит от сети в аудитории.<\/p>\n<h3>4.2 <code>docker-compose.yml<\/code> — два сервиса<\/h3>\n<table>\n<thead>\n<tr>\n<th>Сервис<\/th>\n<th>Образ<\/th>\n<th>Порт<\/th>\n<th>Особенности<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>postgres<\/code> (контейнер <code>jarvis-relay-db<\/code>)<\/td>\n<td><code>postgres:16-alpine<\/code><\/td>\n<td>5432<\/td>\n<td>Том <code>jarvis-db-data<\/code> — данные переживают перезапуск; healthcheck <code>pg_isready<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>relay<\/code> (контейнер <code>jarvis-relay<\/code>)<\/td>\n<td>собирается из <code>Dockerfile<\/code><\/td>\n<td>8080<\/td>\n<td><code>depends_on: postgres: condition: service_healthy<\/code> — ждёт готовности базы; healthcheck — слушает ли порт 8080 (через <code>/dev/tcp<\/code> bash, без curl)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>У обоих <code>restart: unless-stopped<\/code> → поднимаются сами после перезапуска Docker/Windows.<\/p>\n<p>Внутри Docker-сети релей обращается к базе по имени сервиса: <code>jdbc:postgresql://postgres:5432/jarvis<\/code>.<\/p>\n<p><strong>Как контейнер видит Ollama.<\/strong> Своя модель работает в Ollama <strong>на самом компьютере<\/strong>, а не в контейнере (ей нужна видеокарта). Из контейнера <code>localhost<\/code> — это сам контейнер, поэтому адрес модели — <code>http://host.docker.internal:11434<\/code>. Docker Desktop знает это имя сам; строка <code>extra_hosts: &quot;host.docker.internal:host-gateway&quot;<\/code> в compose нужна, чтобы то же работало на Linux-сервере.<\/p>\n<h3>4.3 <code>.env<\/code> — секреты<\/h3>\n<table>\n<thead>\n<tr>\n<th>Переменная<\/th>\n<th>По умолчанию<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>JARVIS_ADMIN_TOKEN<\/code><\/td>\n<td><code>dev-admin-change-me<\/code><\/td>\n<td>Секрет админского эндпоинта кодов. <strong>Сменить<\/strong>, если релей виден из сети<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_OPEN_REGISTRATION<\/code><\/td>\n<td><code>false<\/code><\/td>\n<td>Разрешить новым ПК регистрироваться самим<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_LLM_API_KEY<\/code><\/td>\n<td>пусто<\/td>\n<td>Ключ Gemini. Пусто → regex-режим<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_LLM_MODEL<\/code><\/td>\n<td><code>gemini-3.6-flash<\/code><\/td>\n<td>Имя модели<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_DB_USER<\/code> / <code>JARVIS_DB_PASSWORD<\/code><\/td>\n<td><code>jarvis<\/code> / <code>jarvis<\/code><\/td>\n<td>Учётка БД. Менять только до первого создания тома<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_INTENT_ENGINE<\/code><\/td>\n<td><code>auto<\/code><\/td>\n<td>Кто разбирает фразу: <code>auto<\/code> — своя модель, при неудаче Gemini; <code>local<\/code> — только своя модель и правила, без интернета; <code>gemini<\/code> — как было до своей модели<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_LOCAL_LLM_URL<\/code><\/td>\n<td><code>http://host.docker.internal:11434<\/code><\/td>\n<td>Адрес Ollama. Пусто — своя модель выключена целиком<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_LOCAL_LLM_MODEL<\/code><\/td>\n<td><code>faust-intent<\/code><\/td>\n<td>Имя модели в Ollama<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_LOCAL_LLM_MIN_CONFIDENCE<\/code><\/td>\n<td><code>0.9<\/code><\/td>\n<td>Ниже этой уверенности ответ своей модели перепроверяет Gemini<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_LOCAL_LLM_TRUST_UNKNOWN_ABOVE<\/code><\/td>\n<td><code>2.0<\/code><\/td>\n<td>«Не понял» своей модели обычно перепроверяет Gemini; значение больше 1 — перепроверять всегда<\/td>\n<\/tr>\n<tr>\n<td><code>JARVIS_FORBIDDEN_GOALS<\/code><\/td>\n<td><code>true<\/code><\/td>\n<td>Запрет опасных целей для агента. Выключатель — на случай ложного запрета на защите<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>docker compose<\/code> сам читает <code>.env<\/code> рядом с собой. <code>.env<\/code> в <code>.gitignore<\/code>.<\/p>\n<p>Шесть последних переменных в <code>.env.example<\/code> пока <strong>не вписаны<\/strong> — они работают по значениям по умолчанию из <code>docker-compose.yml<\/code> и <code>application.yml<\/code>. Чтобы поменять, достаточно дописать строку в <code>.env<\/code>.<\/p>\n<p><code>faust.ps1<\/code> при запуске сам выставляет <code>JARVIS_OPEN_REGISTRATION=true<\/code> (переменная окружения важнее файла) — чтобы ПК подключался кнопкой «Подключить» без кода от администратора. Для дома это то, что нужно; на публичном сервере релей так запускать не стоит.<\/p>\n<h3>4.4 <code>application.yml<\/code><\/h3>\n<pre><code class=\"language-yaml\">server.port: 8080\njarvis:\n  admin-token: ${JARVIS_ADMIN_TOKEN:dev-admin-change-me}\n  pairing.ttl-minutes: ${JARVIS_PAIRING_TTL_MINUTES:10}      # срок жизни кода\n  open-registration.enabled: ${JARVIS_OPEN_REGISTRATION:false}\n  open-registration.per-hour: ${JARVIS_OPEN_REGISTRATION_PER_HOUR:10}\n  llm.api-key: ${JARVIS_LLM_API_KEY:}\n  llm.model: ${JARVIS_LLM_MODEL:gemini-3.6-flash}\n  intent.engine: ${JARVIS_INTENT_ENGINE:auto}                # auto | local | gemini\n  local-llm.url: ${JARVIS_LOCAL_LLM_URL:http://host.docker.internal:11434}\n  local-llm.model: ${JARVIS_LOCAL_LLM_MODEL:faust-intent}\n  local-llm.min-confidence: ${JARVIS_LOCAL_LLM_MIN_CONFIDENCE:0.9}\n  local-llm.trust-unknown-above: ${JARVIS_LOCAL_LLM_TRUST_UNKNOWN_ABOVE:2.0}\n  forbidden-goals.enabled: ${JARVIS_FORBIDDEN_GOALS:true}\nspring:\n  datasource: url/username/password из JARVIS_DB_*\n  jpa.hibernate.ddl-auto: update     # Hibernate сам создаёт/дополняет таблицы по сущностям\n  jpa.open-in-view: false\n<\/code><\/pre>\n<p>Синтаксис <code>${ИМЯ:дефолт}<\/code> — взять переменную окружения, а если её нет — дефолт.<\/p>\n<p><code>ddl-auto: update<\/code> — удобно для MVP: схема подстраивается под Java-классы. Для продакшена нужны явные миграции (Flyway/Liquibase) — <code>update<\/code> не удаляет колонки и может «молча» делать неожиданное.<\/p>\n<h3>4.5 Режимы запуска<\/h3>\n<ul>\n<li><strong>Каждый день:<\/strong> <code>C:\\diplom\\start-faust.bat start<\/code> — поднимет Docker, базу, релей, проверит Ollama, запустит агента. Сам сравнивает время изменения исходников со временем сборки образа и пересобирает релей только если код менялся.<\/li>\n<li><strong>Вручную:<\/strong> <code>docker compose up -d --wait --build<\/code> — всё в Docker.<\/li>\n<li><strong>Разработка:<\/strong> <code>docker compose up -d postgres --wait<\/code> + <code>./gradlew bootRun<\/code> — релей процессом на хосте, быстрее цикл правок. (В этом режиме адрес Ollama — <code>http://127.0.0.1:11434<\/code>, а не <code>host.docker.internal<\/code>.)<\/li>\n<\/ul>\n<p><strong>Помни:<\/strong> <code>gradlew compileJava<\/code> контейнер <strong>не обновляет<\/strong>. Правка кода → <code>start-faust.bat start<\/code> или <code>docker compose up -d --build<\/code>.<\/p>\n<h2>5. Протокол на Java<\/h2>\n<p>Пакет <code>protocol/<\/code> — зеркало Kotlin-протокола из <code>jarvis/shared<\/code>. Точно такая же копия лежит в агенте.<\/p>\n<h3>Как Jackson понимает <code>&quot;type&quot;<\/code><\/h3>\n<pre><code class=\"language-java\">@JsonTypeInfo(use = JsonTypeInfo.Id.NAME, include = JsonTypeInfo.As.PROPERTY, property = &quot;type&quot;)\n@JsonSubTypes({\n    @JsonSubTypes.Type(value = JarvisMessage.Auth.class, name = &quot;auth&quot;),\n    @JsonSubTypes.Type(value = JarvisMessage.AuthResult.class, name = &quot;auth_result&quot;),\n    ...\n})\npublic sealed interface JarvisMessage permits ... {\n    String requestId();\n    record Auth(String requestId, String deviceId, String token, DeviceRole role, int protocolVersion) implements JarvisMessage {}\n    ...\n}\n<\/code><\/pre>\n<p><code>@JsonTypeInfo<\/code> говорит: «при чтении посмотри поле <code>type<\/code> и по таблице <code>@JsonSubTypes<\/code> выбери класс». При записи Jackson сам добавит <code>&quot;type&quot;:&quot;auth&quot;<\/code>. Это полный аналог <code>classDiscriminator = &quot;type&quot;<\/code> в Kotlin.<\/p>\n<p>Enum-значения задаются <code>@JsonProperty(&quot;phone&quot;)<\/code> — чтобы в JSON было <code>&quot;phone&quot;<\/code>, а не <code>&quot;PHONE&quot;<\/code>.<\/p>\n<p>Классы: <code>JarvisMessage<\/code> (12 видов сообщений + вложенные <code>PlanItem<\/code> и <code>PlanItemStatus<\/code>), <code>Command<\/code> (24 команды, у каждой метод <code>name()<\/code>), <code>ResultData<\/code> (5 видов данных + вспомогательные <code>ProcessInfo<\/code>, <code>FileEntry<\/code>), <code>CommandStatus<\/code>, <code>DeviceRole<\/code>, <code>ImageFormat<\/code>, <code>AgentScope<\/code>.<\/p>\n<p>Добавлено 30 сентября: сообщения <code>agent_question<\/code> (вопрос ИИ-агента человеку) и <code>agent_plan<\/code> (план многоэтапной задачи), команды <code>answer_question<\/code> (ответ на вопрос) и <code>set_display_option<\/code> (что показывать на экране ПК). Релей в их смысл не вникает: сообщения пересылает телефонам, команды проверяет белым списком и отдаёт агенту. <code>AgentQuestionProtocolTest<\/code> проверяет, что вопрос и план проходят через релей <strong>без потери полей<\/strong>.<\/p>\n<h3>Главная ловушка<\/h3>\n<p>Релей <strong>десериализует<\/strong> сообщение агента в свой Java-класс и <strong>сериализует заново<\/strong> перед отправкой телефону. Значит, если в Kotlin и в агенте добавили поле, а в релее — нет, <strong>релей молча его выбросит<\/strong>. Так и случилось с <code>screenWidth/screenHeight<\/code> в <code>ScreenFrame<\/code> — тапы по экрану промахивались. Отсюда инвариант: протокол меняется <strong>синхронно в трёх местах<\/strong>.<\/p>\n<p>С новым <strong>типом<\/strong> сообщения хуже, чем с новым полем: Jackson не найдёт <code>&quot;type&quot;:&quot;agent_question&quot;<\/code> в таблице <code>@JsonSubTypes<\/code> и бросит исключение на разборе. Поэтому релей, собранный до 30 сентября, с новым агентом несовместим — их обновляют вместе. Так и вышло 30.09: Docker после холодного старта не сразу отдал сведения о контейнере, скрипт решил «не знаю — не пересобираю» и поднял старый образ. С тех пор <code>faust.ps1<\/code> делает несколько попыток <code>docker inspect<\/code>.<\/p>\n<p><code>protocolVersion<\/code> в <code>Auth<\/code> приходит, но релей его <strong>не проверяет<\/strong> — поле зарезервировано на будущее.<\/p>\n<h2>6. WebSocket: сердце релея<\/h2>\n<h3>6.1 <code>WebSocketConfig.java<\/code><\/h3>\n<pre><code class=\"language-java\">registry.addHandler(handler, &quot;/ws&quot;).setAllowedOrigins(&quot;*&quot;);\n<\/code><\/pre>\n<p>Адрес подключения: <code>ws://&lt;хост&gt;:8080/ws<\/code>. Буфер текстового сообщения поднят до <strong>8 МБ<\/strong> (по умолчанию у Spring 8 КБ — скриншот в base64 «рвал» соединение). Таймаут простоя — 10 минут.<\/p>\n<h3>6.2 <code>SessionRegistry.java<\/code> — кто на связи<\/h3>\n<pre><code class=\"language-java\">Map&lt;String, WebSocketSession&gt; agents   // id агента -&gt; его сокет\nMap&lt;String, PhoneEntry&gt;       phones   // id сокета телефона -&gt; (сокет, targetAgentId)\nSet&lt;String&gt; streamingAgents            // кто сейчас стримит экран\n<\/code><\/pre>\n<p><code>ConcurrentHashMap<\/code> — колбэки WebSocket приходят из разных потоков.<\/p>\n<table>\n<thead>\n<tr>\n<th>Метод<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>registerAgent(agentId, session)<\/code><\/td>\n<td>Запомнить сокет агента (новый вытесняет старый)<\/td>\n<\/tr>\n<tr>\n<td><code>registerPhone(session, targetAgentId)<\/code><\/td>\n<td>Запомнить телефон и его ПК<\/td>\n<\/tr>\n<tr>\n<td><code>remove(session)<\/code><\/td>\n<td>Убрать закрытый сокет. Сравнение <strong>по id сокета<\/strong>, а не по agentId: если агент уже переподключился, новый сокет не тронем<\/td>\n<\/tr>\n<tr>\n<td><code>agentFor(targetAgentId)<\/code><\/td>\n<td>Сокет нужного агента. <code>targetAgentId == null<\/code> (старая схема) → никто; <strong>любой<\/strong> живой агент — только при <code>jarvis.legacy-phones.enabled=true<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>isAgentOnline(id)<\/code><\/td>\n<td>Для <code>agentOnline<\/code> в <code>auth_result<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>phonesOf(agentId)<\/code><\/td>\n<td>Телефоны этого ПК (+ телефоны старой схемы, если она включена) — им пересылаются результаты<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Почему старая схема выключена (30.10).<\/strong> Телефон без конкретного ПК получал бы кадры экрана, шаги и вопросы <strong>всех<\/strong> агентов релея и командовал бы первым попавшимся. Пока ПК один, это незаметно; при нескольких ПК — прямая утечка. Теперь по умолчанию такой телефон не проходит Auth («привяжите ПК заново по QR-коду»), а реестр не выдаёт ему ни агента, ни чужих сообщений. Проверка — <code>SessionIsolationTest<\/code>.\n| <code>setStreaming / isStreaming<\/code> | Учёт стримов (сейчас только записывается) |<\/p>\n<\/blockquote>\n<p>Реестр живёт <strong>в памяти<\/strong>: перезапуск релея = все переподключаются (клиенты делают это сами).<\/p>\n<h3>6.3 <code>JarvisWebSocketHandler.java<\/code> — вся логика сообщений<\/h3>\n<p>Наследует <code>TextWebSocketHandler<\/code>; Spring вызывает <code>handleTextMessage<\/code> на каждое сообщение и <code>afterConnectionClosed<\/code> при закрытии.<\/p>\n<pre><code>handleTextMessage(session, text):\n    msg = Jackson.readValue(text, JarvisMessage.class)\n    role = session.attributes[&quot;role&quot;]\n    if role == null:                         ← ещё не вошёл\n        msg is PairRequest ? handlePair : handleAuth\n        return\n    switch (msg):\n        Ping           -&gt; отправить Pong\n        CommandRequest -&gt; handleCommand\n        CommandResult  -&gt; если от агента: status OK ? lessons.confirm(requestId)\n                                                    : lessons.reject(requestId)\n                          затем forwardToPhones\n        ScreenFrame | AgentStep | AgentQuestion | AgentPlan -&gt; forwardToPhones\n        default        -&gt; warning в лог\n<\/code><\/pre>\n<p>Новое в этой развилке — строка про <code>lessons<\/code>: итог выполнения команды заодно служит проверкой «урока» для своей модели. Фразу, которую понял только Gemini, релей запоминает <strong>лишь если команда удалась<\/strong> (подробно — 10.5).<\/p>\n<p>Состояние сессии хранится в <code>session.getAttributes()<\/code> — это <code>Map<\/code> у каждого сокета: <code>role<\/code>, <code>deviceId<\/code>, <code>targetAgentId<\/code>.<\/p>\n<h4><code>handleAuth<\/code><\/h4>\n<ol>\n<li>Если первое сообщение не <code>Auth<\/code> → <code>auth_result{ok:false,&quot;expected auth first&quot;}<\/code> и закрыть (<code>POLICY_VIOLATION<\/code>).<\/li>\n<li><code>DeviceAuthService.authenticate(deviceId, token, role)<\/code> → <code>Result<\/code>.<\/li>\n<li>Отказ → <code>auth_result{ok:false, reason}<\/code> и закрыть (<code>NOT_ACCEPTABLE<\/code>). В <code>reason<\/code> — только причина, не токен.<\/li>\n<li>Успех → записать <code>role<\/code>, <code>deviceId<\/code> в атрибуты.\n<ul>\n<li>Агент → <code>sessions.registerAgent<\/code>.<\/li>\n<li>Телефон → <code>targetAgentId<\/code> → <code>registerPhone<\/code>, вычислить <code>agentOnline<\/code>.<\/li>\n<\/ul>\n<\/li>\n<li>Ответ <code>auth_result{ok:true, reason: newToken, agentOnline}<\/code>.<\/li>\n<\/ol>\n<p><strong>Хитрость с <code>reason<\/code>:<\/strong> при самой первой привязке агента по коду релей возвращает <strong>новый постоянный токен в поле <code>reason<\/code><\/strong> (единственный раз, когда токен существует в открытом виде). Формат сообщения при этом не менялся. Агент видит <code>ok=true<\/code> + непустой <code>reason<\/code> → сохраняет токен. Это «перегрузка» поля — работает, но на защите стоит назвать как технический долг (лучше отдельное поле <code>newToken<\/code>).<\/p>\n<h4><code>handlePair<\/code><\/h4>\n<p><code>DeviceAuthService.pairPhone(code)<\/code> → <code>pair_result{ok, deviceId=agentId, deviceToken, deviceName}<\/code> или <code>{ok:false, reason}<\/code>. <strong>Соединение сразу закрывается<\/strong> — это разовый обмен; дальше телефон войдёт обычным <code>auth<\/code>. Токен в лог не пишется.<\/p>\n<h4><code>handleCommand<\/code> — главный путь команды<\/h4>\n<pre><code>1. role != PHONE → игнор (команды шлёт только телефон)\n2. command is NaturalLanguage → intentParser.parse(text, requestId)     ← связка разборщиков, раздел 10\n       null → audit(ERROR &quot;не понял&quot;) + command_result{ERROR,&quot;не понял команду&quot;}; return\n3. denied = whitelist.denyReason(command)                                ← имя команды И цель задачи агенту\n       denied != null → lessons.reject(requestId)\n                        audit(DENIED) + command_result{DENIED,&quot;команда запрещена: &lt;причина&gt;&quot;}; return\n4. agent = sessions.agentFor(targetAgentId)\n       нет/закрыт → lessons.reject(requestId)\n                    audit(ERROR &quot;агент не в сети&quot;) + command_result{ERROR,&quot;агент не в сети&quot;}; return\n5. audit(SENT)\n6. Start/StopScreenStream → sessions.setStreaming\n7. отправить агенту command_request(тот же requestId, (возможно переписанная) команда)\n<\/code><\/pre>\n<p>Порядок <strong>важен<\/strong>: белый список проверяется <strong>после<\/strong> ИИ — поэтому даже если ИИ «уговорили» выдать <code>shutdown<\/code>, он не пройдёт.<\/p>\n<p>Что изменилось в этом пути:<\/p>\n<ul>\n<li>В разборщик теперь передаётся <code>requestId<\/code>: если фразу поймёт только Gemini, «урок» привяжется к этому запросу и будет ждать его результата.<\/li>\n<li>Вместо <code>isAllowed<\/code> — <code>denyReason<\/code>: человек на телефоне видит <strong>причину<\/strong> («команда запрещена: агенту нельзя поручать: выключение компьютера»), а не безликое «запрещена».<\/li>\n<li><code>lessons.reject<\/code> в ветках отказа: запрещённому свою модель не учим, а команда, которая не выполнялась, урок подтвердить не может.<\/li>\n<li><code>answer_question<\/code> и <code>set_display_option<\/code> идут тем же путём, что всё остальное: белый список → аудит → агент. Фразой их не вызвать — их шлёт приложение.<\/li>\n<\/ul>\n<h4><code>forwardToPhones<\/code><\/h4>\n<p>Только от агента: <code>CommandResult<\/code>, <code>ScreenFrame<\/code>, <code>AgentStep<\/code>, <code>AgentQuestion<\/code>, <code>AgentPlan<\/code> → всем <code>phonesOf(agentId)<\/code>. Отдельная ветка в релее нужна только сообщениям, которые агент шлёт <strong>сам, посреди задачи<\/strong> (шаг, вопрос, план); буфер обмена, файлы и т.п. едут внутри <code>CommandResult.data<\/code>.<\/p>\n<p>Вопрос агента получают <strong>все<\/strong> телефоны этого ПК, а ответить может любой: агент примет первый ответ с верным <code>questionId<\/code>, остальным вернёт «вопрос уже неактуален».<\/p>\n<h4><code>send<\/code><\/h4>\n<pre><code class=\"language-java\">synchronized (session) { session.sendMessage(new TextMessage(json)); }\n<\/code><\/pre>\n<p>Сокет нельзя писать из двух потоков одновременно (например, кадр стрима и результат команды) — поэтому блокировка на объекте сессии.<\/p>\n<h4>Ping<\/h4>\n<p>Релей <strong>отвечает<\/strong> <code>pong<\/code> на <code>ping<\/code>, но сам пинги <strong>не рассылает<\/strong> (комментарий в Kotlin-протоколе «Relay pings» не соответствует коду). Живость соединения держится TCP и таймаутом простоя.<\/p>\n<h2>7. Авторизация и привязка<\/h2>\n<h3>7.1 Три вида «пропусков»<\/h3>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Где хранится<\/th>\n<th>Как выглядит<\/th>\n<th>Живёт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Одноразовый код<\/td>\n<td><code>pairing_codes<\/code> (открытым текстом)<\/td>\n<td>6 цифр <code>482931<\/code><\/td>\n<td>10 минут, 1 раз<\/td>\n<\/tr>\n<tr>\n<td>Постоянный токен агента<\/td>\n<td><code>devices.token_hash<\/code> (BCrypt)<\/td>\n<td>32 случайных байта в base64url<\/td>\n<td>Пока не удалят<\/td>\n<\/tr>\n<tr>\n<td>Постоянный токен телефона для ПК<\/td>\n<td><code>phone_bindings.token_hash<\/code> (BCrypt)<\/td>\n<td>то же<\/td>\n<td>Пока не удалят<\/td>\n<\/tr>\n<tr>\n<td>Админ-токен<\/td>\n<td><code>.env<\/code><\/td>\n<td>строка<\/td>\n<td>Постоянно<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Код бывает двух типов:<\/p>\n<ul>\n<li><code>agent_id = NULL<\/code> → <strong>код устройства<\/strong>: регистрирует новый ПК через <code>auth<\/code>.<\/li>\n<li><code>agent_id = 'pc-…'<\/code> → <strong>код телефона<\/strong>: даёт телефону доступ к этому ПК через <code>pair_request<\/code>.<\/li>\n<\/ul>\n<p>Код одного типа нельзя использовать для другого (<code>isForPhone()<\/code> проверяется в <code>tryConsume<\/code>).<\/p>\n<h3>7.2 <code>DeviceAuthService.authenticate<\/code> — три пути<\/h3>\n<pre><code>authenticate(deviceId, token, role):\n\n  Путь 1 — телефон, привязанный к ПК (новая схема):\n    role == PHONE и есть phone_bindings с agent_id == deviceId\n      → токен совпадает с ЛЮБЫМ из хэшей? → success(targetAgentId = deviceId)\n      → иначе fail(&quot;bad token&quot;)\n\n  Путь 2 — известное устройство из devices (агент или телефон старой схемы):\n    devices.findById(deviceId) есть\n      → роль совпадает? токен совпадает с хэшем? → success(null)\n\n  Путь 2б — новое устройство:\n    token трактуется как одноразовый код устройства\n      → pairingService.tryConsumeDeviceCode(token)\n      → нет → fail(&quot;unknown device or invalid pairing code&quot;)\n      → есть → сгенерировать токен, сохранить Device(deviceId, label, role, BCrypt(token))\n             → paired(newToken)   ← вернётся в auth_result.reason\n<\/code><\/pre>\n<p>Обрати внимание: у телефона <code>deviceId<\/code> в <code>auth<\/code> — это <strong>id агента<\/strong>. Поэтому один телефон, привязанный к трём ПК, имеет три разных токена и входит в три «разных» <code>deviceId<\/code>.<\/p>\n<p><code>generateToken()<\/code>: <code>SecureRandom<\/code> → 32 байта → Base64 URL-safe без <code>=<\/code>. <code>SecureRandom<\/code> — криптостойкий генератор (обычный <code>Random<\/code> предсказуем).<\/p>\n<h3>7.3 <code>DeviceAuthService.pairPhone(code)<\/code><\/h3>\n<ol>\n<li>Пустой код → отказ.<\/li>\n<li><code>tryConsumePhoneCode(code)<\/code> — существует, не истёк, не использован, <strong>выписан для телефона<\/strong>.<\/li>\n<li>Найти агента <code>agentId<\/code> в <code>devices<\/code>.<\/li>\n<li>Сгенерировать токен, сохранить <code>PhoneBinding(agentId, label, BCrypt(token))<\/code>.<\/li>\n<li>Вернуть <code>(agentId, имя ПК, токен)<\/code>.<\/li>\n<\/ol>\n<h3>7.4 <code>PairingService<\/code><\/h3>\n<ul>\n<li><code>generateCode(label, agentId)<\/code> — 6 случайных цифр (<code>String.format(&quot;%06d&quot;, …)<\/code>), повтор, пока код уникален; срок = сейчас + <code>ttl-minutes<\/code>.<\/li>\n<li><code>tryConsume(code, forPhone)<\/code> — найти, проверить <code>isValidNow<\/code> (не <code>used<\/code> и не истёк) и тип; пометить <code>used=true, usedAt=now<\/code>. Второй вызов с тем же кодом вернёт пусто — это и есть «одноразовость».<\/li>\n<\/ul>\n<h3>7.5 <code>AgentAuthService<\/code><\/h3>\n<p>Общая проверка для REST-эндпоинтов агента: <code>deviceId<\/code> есть в <code>devices<\/code>, роль <code>AGENT<\/code>, токен совпадает с хэшем. Используется в <code>AgentPairingController<\/code> и <code>AgentLlmController<\/code> (агент присылает <code>X-Device-Id<\/code> и <code>X-Device-Token<\/code>).<\/p>\n<h3>7.6 BCrypt — почему не просто сравнить строки<\/h3>\n<p>BCrypt превращает токен в хэш вида <code>$2a$10$...<\/code> с солью. Из хэша токен <strong>не восстановить<\/strong>, а проверка специально медленная (~десятки мс) — перебор дорог. Если базу украдут, токены не утекут. <code>passwordEncoder.matches(presented, hash)<\/code> — единственный способ проверить.<\/p>\n<p>Цена: чтобы найти телефон, приходится прогонять <code>matches<\/code> по всем привязкам ПК (их обычно 1–3 — не страшно).<\/p>\n<h2>8. REST-эндпоинты<\/h2>\n<table>\n<thead>\n<tr>\n<th>Метод и путь<\/th>\n<th>Класс<\/th>\n<th>Кто вызывает<\/th>\n<th>Защита<\/th>\n<th>Тело → ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>POST /api/pairing-codes<\/code><\/td>\n<td><code>PairingController<\/code><\/td>\n<td>Администратор, <code>start-jarvis.ps1<\/code>, <code>pair-phone.ps1<\/code><\/td>\n<td>Заголовок <code>X-Admin-Token<\/code><\/td>\n<td><code>{label, agentId?}<\/code> → <code>{code, expiresAt, agentId}<\/code>. С <code>agentId<\/code> — код телефона (ПК должен существовать и быть агентом)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/agent/register<\/code><\/td>\n<td><code>AgentRegistrationController<\/code><\/td>\n<td>Новый агент (кнопка «Подключить»)<\/td>\n<td>Выключатель <code>open-registration<\/code> + лимит 10/час на IP<\/td>\n<td><code>{label}<\/code> → <code>{code, expiresAt}<\/code> (код устройства). Выключено → <strong>403<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/agent/phone-pairing-code<\/code><\/td>\n<td><code>AgentPairingController<\/code><\/td>\n<td>Агент (окно «Привязать телефон»)<\/td>\n<td><code>X-Device-Id<\/code> + <code>X-Device-Token<\/code> агента<\/td>\n<td><code>{label}<\/code> → <code>{code, expiresAt}<\/code> — код телефона <strong>только для себя<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/agent/llm/generate<\/code><\/td>\n<td><code>AgentLlmController<\/code><\/td>\n<td>Vision-агент, планировщик и проверяющий на ПК<\/td>\n<td><code>X-Device-Id<\/code> + <code>X-Device-Token<\/code>, 20 запросов/мин, тело ≤ 6 МБ<\/td>\n<td><code>{prompt, imageBase64?, mimeType?}<\/code> → <code>{text}<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/admin/llm/generate<\/code><\/td>\n<td><code>AdminLlmController<\/code><\/td>\n<td>Скрипты обучения <code>jarvis-ml<\/code> (<code>build_trainset.py<\/code>, <code>distill.py<\/code>) — Gemini как «учитель»<\/td>\n<td><code>X-Admin-Token<\/code><\/td>\n<td><code>{prompt, temperature?=0.9, json?=true}<\/code> → <code>{text}<\/code>; ошибка Gemini → <strong>502<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/admin/intent/parse<\/code><\/td>\n<td><code>IntentEvalController<\/code><\/td>\n<td>Скрипт замера <code>eval/intent_eval.py<\/code><\/td>\n<td><code>X-Admin-Token<\/code><\/td>\n<td><code>{phrase, engine?}<\/code> → команда, кто разобрал, уверенность, время. <code>engine<\/code>: <code>stub<\/code> / <code>gemini<\/code> / <code>local<\/code> / <code>system<\/code> (по умолчанию)<\/td>\n<\/tr>\n<tr>\n<td><code>GET /api/admin/intent/lessons<\/code><\/td>\n<td><code>IntentEvalController<\/code><\/td>\n<td><code>jarvis-ml/retrain.py<\/code><\/td>\n<td><code>X-Admin-Token<\/code><\/td>\n<td>→ список подтверждённых уроков <code>{phrase, command, localAnswer, confirmedAt}<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Три админских эндпоинта — <strong>служебные, для научной части<\/strong>: рабочему пути команды они не нужны. Их общий смысл — инвариант 3: скрипты на Python ключа Gemini не знают, они предъявляют админский секрет, а ключ остаётся на релее. <code>/parse<\/code> команды <strong>никуда не отправляет<\/strong> — ни агенту, ни в журнал аудита: только разбирает и возвращает результат. В режиме <code>system<\/code> он проверяет ещё и белый список с запретом опасных целей: запрещённая команда возвращается как «не понял» с пометкой <code>denied<\/code>. Вызовы <code>gemini<\/code> тратят квоту модели — поэтому секрет.<\/p>\n<p><strong>Сравнение админ-токена за постоянное время<\/strong> (<code>MessageDigest.isEqual<\/code>): обычное <code>equals<\/code> выходит на первом несовпавшем символе, и по времени ответа можно угадывать секрет посимвольно. <code>isEqual<\/code> сравнивает всё целиком.<\/p>\n<p><strong>Почему открытая регистрация не опасна для чужих ПК<\/strong> (из javadoc <code>AgentRegistrationController<\/code>): она даёт зарегистрировать только <strong>самого себя<\/strong> как новое устройство. Доступ к чужому ПК требует кода телефона, который показывает сам этот ПК. Риск — только «насоздают пустых устройств», поэтому есть выключатель и лимит по IP (в памяти, сбрасывается при перезапуске — защита от зацикливания клиента, а не от ботнета).<\/p>\n<h2>9. База данных<\/h2>\n<p>Hibernate создаёт таблицы сам (<code>ddl-auto: update<\/code>) по классам из <code>persistence/<\/code>.<\/p>\n<pre><code>┌──────────────── devices ────────────────┐        ┌───────────── pairing_codes ─────────────┐\n│ id (PK, deviceId)   &quot;pc-1a2b3c4d&quot;       │        │ id (PK, автоинкремент)                   │\n│ name                &quot;DESKTOP-ABC&quot;       │        │ code (unique, 6)   &quot;482931&quot;              │\n│ role                AGENT | PHONE       │◄───┐   │ label              &quot;phone&quot;               │\n│ token_hash          $2a$10$…            │    │   │ agent_id           NULL | &quot;pc-…&quot;         │\n│ paired_at                                │    │   │ created_at, expires_at                  │\n└─────────────────────────────────────────┘    │   │ used, used_at                            │\n          ▲ device_id (FK)                      │   └──────────────────────────────────────────┘\n┌─────────┴──────── audit_log ────────────┐    │   ┌──────────── phone_bindings ─────────────┐\n│ id, occurred_at                          │    └───│ agent_id  (логическая ссылка на devices)│\n│ device_id  → devices.id                  │        │ name, token_hash, paired_at, id          │\n│ command    &quot;set_volume&quot;                  │        └──────────────────────────────────────────┘\n│ status     SENT | DENIED | ERROR         │        ┌──────────── agent_llm_log ──────────────┐\n│ details    &quot;req a1…&quot;                     │        │ id, device_id, occurred_at,             │\n└──────────────────────────────────────────┘        │ latency_ms, ok                          │\n                                                    └──────────────────────────────────────────┘\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Сущность<\/th>\n<th>Таблица<\/th>\n<th>Назначение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Device<\/code><\/td>\n<td><code>devices<\/code><\/td>\n<td>Агенты (и телефоны старой схемы). <code>id<\/code> = <code>deviceId<\/code> из протокола, суррогатный ключ не нужен<\/td>\n<\/tr>\n<tr>\n<td><code>PairingCode<\/code><\/td>\n<td><code>pairing_codes<\/code><\/td>\n<td>Одноразовые коды; методы <code>isValidNow<\/code>, <code>markUsed<\/code>, <code>isForPhone<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>PhoneBinding<\/code><\/td>\n<td><code>phone_bindings<\/code><\/td>\n<td>Связь «телефон → ПК», у каждой свой токен<\/td>\n<\/tr>\n<tr>\n<td><code>AuditLog<\/code><\/td>\n<td><code>audit_log<\/code><\/td>\n<td>Кто, что, когда, с каким исходом. <code>@ManyToOne<\/code> на <code>Device<\/code> (lazy)<\/td>\n<\/tr>\n<tr>\n<td><code>AgentLlmLog<\/code><\/td>\n<td><code>agent_llm_log<\/code><\/td>\n<td>Каждый вызов ИИ агентом: задержка и успех — данные для эмпирической главы<\/td>\n<\/tr>\n<tr>\n<td><code>IntentLesson<\/code><\/td>\n<td><code>intent_lesson<\/code><\/td>\n<td>«Уроки» для своей модели: фраза, которую понял только Gemini, и команда, в которую он её превратил<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Поля <code>intent_lesson<\/code>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Поле<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>phrase<\/code> / <code>phrase_norm<\/code><\/td>\n<td>Фраза как сказана / приведённая к виду для поиска (по ней повтор той же фразы отвечается из памяти)<\/td>\n<\/tr>\n<tr>\n<td><code>command_json<\/code><\/td>\n<td>Команда, которую назвал Gemini, в формате протокола<\/td>\n<\/tr>\n<tr>\n<td><code>local_answer<\/code><\/td>\n<td>Что ответила своя модель — видно, <strong>в чём<\/strong> она ошиблась<\/td>\n<\/tr>\n<tr>\n<td><code>request_id<\/code><\/td>\n<td>Запрос телефона, результата которого урок ждёт<\/td>\n<\/tr>\n<tr>\n<td><code>created_at<\/code><\/td>\n<td>Когда урок предложен<\/td>\n<\/tr>\n<tr>\n<td><code>confirmed_at<\/code><\/td>\n<td>Когда агент успешно выполнил команду; <code>NULL<\/code> — урок ещё не подтверждён и в обучение не идёт<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Таблицу создаёт Hibernate сам при первом запуске нового релея (<code>ddl-auto: update<\/code>) — отдельной миграции не было.<\/p>\n<p>Репозитории — просто интерфейсы: <code>findByCode<\/code>, <code>existsByCode<\/code>, <code>findByAgentId<\/code> — Spring строит SQL по имени метода.<\/p>\n<p><code>AuditService.log<\/code> использует <code>deviceRepository.getReferenceById(deviceId)<\/code> — «ссылку» без лишнего <code>SELECT<\/code> (устройство точно есть — только что по нему вошли).<\/p>\n<h2>10. ИИ: разбор фраз и прокси для агента<\/h2>\n<h3>10.1 <code>IntentParser<\/code> — интерфейс<\/h3>\n<pre><code class=\"language-java\">Command parse(String phrase);                       // null = не понял\ndefault Command parse(String phrase, String requestId) { return parse(phrase); }\n<\/code><\/pre>\n<p>Вторая форма — с <code>requestId<\/code> запроса телефона: она нужна только связке, чтобы привязать «урок» к запросу и потом узнать, выполнилась ли команда.<\/p>\n<p>Три реализации: <code>HybridIntentParser<\/code> (с <code>@Primary<\/code> — его получает обработчик WebSocket), <code>GeminiIntentParser<\/code> и <code>StubIntentParser<\/code>. Сменить провайдера (OpenAI, другая локальная модель) = написать новый <code>@Component<\/code> — обработчик менять не нужно. Именно так 5 октября была добавлена своя модель: появился новый класс с <code>@Primary<\/code>, а логика обработчика сокета осталась прежней.<\/p>\n<h3>10.1а <code>HybridIntentParser<\/code> — связка, которая на самом деле отвечает телефону<\/h3>\n<pre><code>фраза\n  │ 1. «навык …» / «запусти скрипт …»   ── код (StubIntentParser.skillOrScript), без моделей\n  │ 2. уже выученный урок (та же фраза)   ── память (IntentLessons.recall), без моделей\n  │ 3. НАША модель (LocalIntentParser → Ollama, ~0,1–0,3 с)\n  │       уверена (≥ 0,9) и ответ годный ─────────► команда            источник: local\n  │       не уверена / «не понял» / мусор / недоступна\n  ▼\n  4. Gemini (интернет, 2–3 с) ── понял ──────────► команда + УРОК     источник: gemini\n  │       недоступен → минуту его не трогаем\n  ▼\n  5. годный ответ нашей модели                                          источник: local-offline\n     иначе регулярные выражения (StubIntentParser)                      источник: stub / none\n<\/code><\/pre>\n<p>Метод <code>decide(phrase, requestId)<\/code> возвращает <code>Decision(command, source, confidence, localRaw, localMs, geminiMs)<\/code> — не только команду, но и <strong>кто<\/strong> её разобрал, с какой уверенностью и за сколько. Это идёт в лог (<code>Разбор «сделай потише» -&gt; set_volume [local, уверенность 0.99]<\/code>) и в замеры.<\/p>\n<p>Детали, которые стоит уметь объяснить:<\/p>\n<ul>\n<li><strong>Режимы<\/strong> (<code>jarvis.intent.engine<\/code>): <code>auto<\/code> — вся цепочка; <code>local<\/code> — без Gemini (офлайн); <code>gemini<\/code> — без своей модели, как было раньше. Пока модели в Ollama нет, <code>auto<\/code> ведёт себя как <code>gemini<\/code> — релей с этим кодом можно ставить заранее.<\/li>\n<li><strong>Три причины уйти в Gemini:<\/strong> ответ не прошёл проверку формата; модель сказала «не понял»; уверенность ниже порога. Уверенность — произведение вероятностей слов ответа, которые отдаёт Ollama.<\/li>\n<li><strong>«Не понял» перепроверяется всегда<\/strong> (<code>trust-unknown-above = 2.0<\/code>, а уверенность не бывает больше 1): вдруг Gemini поймёт необычную формулировку. Цена — платный запрос на каждую болтовню.<\/li>\n<li><strong>Предохранитель<\/strong> <code>geminiDownUntil<\/code>: если Gemini только что не ответил (нет интернета, кончилась квота), минуту его не спрашиваем. Иначе каждая непонятная фраза ждала бы заведомо неудачного запроса — замер 6 октября показал около полсекунды на фразу.<\/li>\n<li><strong>Урок записывается, только если своя модель была спрошена и не справилась.<\/strong> Если её просто нет — это не «чего она не знает», а «её не спросили».<\/li>\n<li><strong>Белый список и запрет опасных целей — после разбора<\/strong>, в обработчике сокета, одинаково для любого из пяти путей.<\/li>\n<\/ul>\n<p><code>LocalIntentParser<\/code> — HTTP-клиент к Ollama: шлёт фразу, получает JSON и вероятности, <strong>проверяет ответ кодом<\/strong> (тип из списка, громкость 0–100, адрес с точкой и т.п.) и возвращает <code>Result(kind, command, confidence, raw, ms)<\/code>, где <code>kind<\/code> — <code>COMMAND<\/code>, <code>UNKNOWN<\/code> или <code>UNAVAILABLE<\/code>. Таймаут 20 с — с запасом на первую загрузку модели в память. Формат ответа модели, обучение и цифры — файл 5.<\/p>\n<h3>10.2 <code>GeminiIntentParser<\/code><\/h3>\n<p>Теперь это <strong>вторая ступень<\/strong> связки и «учитель». У него два входа: <code>parse(phrase)<\/code> — с короткими путями и запасным разбором правилами (так он работает в режиме <code>gemini<\/code>), и <code>parseModelOnly(phrase)<\/code> — только модель: <code>null<\/code>, если она ответила «unknown», исключение при любой ошибке. Вторым пользуются связка (ей надо отличать «не понял» от «недоступен») и замеры — обычный <code>parse<\/code> прятал бы ошибки модели за запасным путём.<\/p>\n<p>Как устроен <code>parse<\/code>:<\/p>\n<ol start=\"0\">\n<li>Фраза про навык или скрипт → сразу <code>agent_task<\/code>, без модели.<\/li>\n<li>Нет ключа → сразу <code>StubIntentParser<\/code> (без сети).<\/li>\n<li>Запрос <code>POST https://generativelanguage.googleapis.com/v1beta/models/&lt;model&gt;:generateContent<\/code>, ключ — в заголовке <code>x-goog-api-key<\/code> (не в URL, чтобы не попасть в логи прокси). Таймаут 8 с.<\/li>\n<li>Тело:\n<ul>\n<li><code>systemInstruction<\/code> — <strong>системный промпт<\/strong>: список команд с точным JSON-форматом и примерами («сделай потише» → <code>{&quot;type&quot;:&quot;set_volume&quot;,&quot;level&quot;:30}<\/code>, «найди на ютубе…» → <code>agent_task<\/code>, «сколько будет 2+2» → <code>{&quot;type&quot;:&quot;unknown&quot;}<\/code>);<\/li>\n<li><code>contents<\/code> — фраза пользователя;<\/li>\n<li><code>generationConfig<\/code>: <code>temperature: 0<\/code> (детерминированно), <code>responseMimeType: application/json<\/code> (только JSON).<\/li>\n<\/ul>\n<\/li>\n<li>Ответ: <code>candidates[0].content.parts[0].text<\/code> → срезать <code>```json<\/code> если модель всё же обернула → если <code>type == &quot;unknown&quot;<\/code> — fallback → иначе <code>mapper.readValue(json, Command.class)<\/code>.<\/li>\n<li><strong>Любая ошибка<\/strong> (сеть, не 200, кривой JSON, неизвестный <code>type<\/code>) → fallback на regex. Сервис деградирует, но не ломается.<\/li>\n<\/ol>\n<p>Ключевая идея: модель отвечает <strong>прямо в формате нашего протокола<\/strong>, и Jackson превращает ответ в <code>Command<\/code> той же магией <code>@JsonSubTypes<\/code>. Если модель выдумала несуществующий тип — Jackson упадёт, сработает fallback. Если выдумала существующий, но опасный (<code>shutdown<\/code>) — его остановит белый список.<\/p>\n<p>Логи: пишется только <code>имя команды<\/code>, <strong>тело ответа Google и ключ не логируются<\/strong>.<\/p>\n<p>В системном промпте нет команд живого экрана, буфера, файлов, отмены, ответа на вопрос и настроек показа — они отправляются кнопками приложения напрямую, не фразами.<\/p>\n<p>5 октября промпт дополнен двумя правилами, найденными замером: <strong>папки открывает <code>open_app<\/code><\/strong>, а не агент, и <strong>запрещённое и неподдерживаемое — «unknown»<\/strong> (раньше «выключи компьютер» Gemini превращал в задачу агенту — см. раздел 11). Этот же текст промпта берёт <code>jarvis-ml/distill.py<\/code>, когда Gemini размечает живые фразы для обучения своей модели, — учитель и рабочий разборщик отвечают одинаково.<\/p>\n<h3>10.3 <code>StubIntentParser<\/code> — правила по ключевым словам<\/h3>\n<table>\n<thead>\n<tr>\n<th>Если во фразе…<\/th>\n<th>Команда<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>начинается с «навык », «выполни навык », «запусти навык », «скрипт », «выполни скрипт », «запусти скрипт »<\/td>\n<td><code>AgentTask(фраза целиком, SCREEN, 20)<\/code><\/td>\n<\/tr>\n<tr>\n<td>«потише» / «тише»<\/td>\n<td><code>SetVolume(30)<\/code><\/td>\n<\/tr>\n<tr>\n<td>«погромче» / «громче»<\/td>\n<td><code>SetVolume(80)<\/code><\/td>\n<\/tr>\n<tr>\n<td>«заблокир»<\/td>\n<td><code>LockScreen<\/code><\/td>\n<\/tr>\n<tr>\n<td>начинается с «закрой »<\/td>\n<td><code>KillProcess(остаток)<\/code><\/td>\n<\/tr>\n<tr>\n<td>начинается с «запусти »<\/td>\n<td><code>OpenApp(остаток)<\/code><\/td>\n<\/tr>\n<tr>\n<td>«процесс»<\/td>\n<td><code>ListProcesses<\/code><\/td>\n<\/tr>\n<tr>\n<td>«скрин» / «экран»<\/td>\n<td><code>Screenshot<\/code><\/td>\n<\/tr>\n<tr>\n<td>«лайк» / «найди»<\/td>\n<td><code>AgentTask(фраза, BROWSER, 15)<\/code><\/td>\n<\/tr>\n<tr>\n<td>«ютуб» / «youtube»<\/td>\n<td><code>OpenUrl(&quot;https://youtube.com&quot;)<\/code><\/td>\n<\/tr>\n<tr>\n<td>«открой X.Y»<\/td>\n<td><code>OpenUrl(&quot;https://X.Y&quot;)<\/code><\/td>\n<\/tr>\n<tr>\n<td>иначе<\/td>\n<td><code>null<\/code> → «не понял команду»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Порядок проверок важен: «найди на ютубе» сработает как <code>agent_task<\/code> раньше, чем «ютуб».<\/p>\n<p>Первая строка таблицы — статический метод <code>skillOrScript<\/code>, им пользуются все три разборщика. Почему навыки и скрипты узнаёт <strong>код<\/strong>, а не модель: «запусти скрипт сервер» легко спутать с «запусти блокнот» (<code>open_app<\/code>), а «навык утро» — вообще не команда, которую модель знает. Что за навык или скрипт — решает уже агент на ПК: только у него есть список выученного. Релей лишь гарантирует, что такая фраза дойдёт до агента быстро и всегда одинаково.<\/p>\n<p>На экзамене из 250 фраз одни эти правила дают 39,6% — это честная цена работы совсем без моделей.<\/p>\n<h3>10.4 <code>AgentLlmController<\/code> — прокси к Gemini для агента<\/h3>\n<p>Зачем: vision-агенту на ПК нужен ИИ, но <strong>ключ не должен лежать на ПК<\/strong> (инвариант 3). Агент шлёт промпт (и, возможно, скриншот) сюда, релей добавляет ключ и идёт в Google.<\/p>\n<p>Через этот же прокси теперь ходят ещё два «мозга» агента: <strong>планировщик<\/strong> многоэтапных задач и <strong>проверяющий<\/strong> результат подзадачи (файл 4). Оба шлют текст без картинки. Лимит 20 запросов в минуту общий на всё устройство — длинная задача по плану тратит его заметно быстрее одиночной.<\/p>\n<p>Проверки по порядку:<\/p>\n<ol>\n<li><code>X-Device-Id<\/code> + <code>X-Device-Token<\/code> → <code>AgentAuthService<\/code> → иначе <strong>401<\/strong>.<\/li>\n<li>Ключ не задан → <strong>503<\/strong> «LLM is not configured».<\/li>\n<li>Тело &gt; 6 МБ → <strong>413<\/strong>.<\/li>\n<li>Больше 20 запросов за минуту с этого устройства → <strong>429<\/strong> (окно в памяти, <code>RateWindow<\/code> на <code>deviceId<\/code>).<\/li>\n<li>Тело — <code>byte[]<\/code>, разбирается вручную, чтобы при ошибке кодировки (не UTF-8 кириллица) ответить понятным <strong>400<\/strong>, не логируя сам текст.<\/li>\n<li>Пустой промпт → <strong>400<\/strong>.<\/li>\n<\/ol>\n<p>Запрос к Gemini: <code>contents.parts = [text, inlineData{mimeType, data}]<\/code>, <code>temperature 0<\/code>, таймаут <strong>90 с<\/strong> (мультимодальный запрос со скриншотом занимает 12–30+ с). <strong>Повтор<\/strong> при 503 («model is overloaded») и сетевых сбоях: паузы 1 с и 2 с. 429 не повторяется (квота — повтор не поможет).<\/p>\n<p>Ошибка → <strong>502<\/strong> «gemini call failed». В <code>finally<\/code> — строка в <code>agent_llm_log<\/code> (задержка, успех) и строка в логе (без содержимого).<\/p>\n<h3>10.5 <code>IntentLessons<\/code> — «не понял → спросил Gemini → запомнил»<\/h3>\n<pre><code>наша модель не справилась ──► Gemini назвал команду ──► propose()   урок «предложен»\nагент выполнил её успешно ───────────────────────────► confirm()   урок «подтверждён»\nта же фраза ещё раз ──────────────────────────────────► recall()    ответ сразу, без моделей\nнакопились подтверждённые ──► jarvis-ml/retrain.py ──► новая версия модели понимает и похожие фразы\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Метод<\/th>\n<th>Кто вызывает<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>propose(requestId, phrase, command, localAnswer)<\/code><\/td>\n<td><code>HybridIntentParser<\/code>, когда понял только Gemini<\/td>\n<td>Сохраняет урок без даты подтверждения<\/td>\n<\/tr>\n<tr>\n<td><code>confirm(requestId)<\/code><\/td>\n<td>Обработчик сокета на <code>CommandResult<\/code> со статусом <code>OK<\/code><\/td>\n<td>Ставит <code>confirmed_at<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>reject(requestId)<\/code><\/td>\n<td>Обработчик сокета: результат не <code>OK<\/code>, команда запрещена, агент не в сети<\/td>\n<td>Удаляет неподтверждённые уроки этого запроса<\/td>\n<\/tr>\n<tr>\n<td><code>recall(phrase)<\/code><\/td>\n<td><code>HybridIntentParser<\/code>, ступень 2<\/td>\n<td>Возвращает команду подтверждённого урока с такой же фразой<\/td>\n<\/tr>\n<tr>\n<td><code>confirmed()<\/code><\/td>\n<td><code>GET /api/admin/intent/lessons<\/code><\/td>\n<td>Список для дообучения<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Почему урок подтверждается <strong>выполнением<\/strong>: Gemini тоже ошибается. Если команда не выполнилась или человек её отменил, учить на ней свою модель нельзя — она выучила бы ошибку учителя. Успешное выполнение — самый дешёвый признак «понято верно», для которого не надо ничего спрашивать у человека.<\/p>\n<p>Тонкости:<\/p>\n<ul>\n<li>У урока-задачи агенту при повторе <strong>цель берётся из того, что человек сказал сейчас<\/strong>: сохранённая цель заменяется текущей фразой, из записи используются только режим (<code>browser<\/code>/<code>screen<\/code>) и лимит шагов.<\/li>\n<li><strong>Чему не учимся никогда:<\/strong> фразам длиннее 300 символов и фразам со словами про пароль, ПИН, CVV, паспорт, ИИН, номер карты — таких данных в базе быть не должно.<\/li>\n<li>Любая ошибка базы в этих методах только пишется в лог: недоступная таблица уроков — не повод не выполнить команду.<\/li>\n<li>Написано и покрыто тестами (<code>HybridIntentParserTest<\/code>), но вживую цикл «урок → дообучение → новая версия» на 13 октября не прогонялся.<\/li>\n<\/ul>\n<h3>10.6 <code>GeminiClient<\/code> и <code>AdminLlmController<\/code> — Gemini как «учитель»<\/h3>\n<p><code>GeminiClient<\/code> — простой текстовый запрос к Gemini: без картинок, без формата команд, с настраиваемой температурой (0 — один и тот же ответ, около 1 — разнообразие) и таймаутом 120 с. Нужен там, где Gemini <strong>придумывает<\/strong> данные для обучения: перефразировки одной просьбы и живые фразы «как говорят люди».<\/p>\n<p>Разбор фраз (<code>GeminiIntentParser<\/code>) и прокси агента (<code>AgentLlmController<\/code>) ходят в Gemini своим кодом — их намеренно не переводили на общий клиент, чтобы не сломать работающее. Это дублирование стоит назвать на защите техническим долгом.<\/p>\n<h2>11. Белый список и аудит<\/h2>\n<h3><code>CommandWhitelist.java<\/code> — граница безопасности<\/h3>\n<pre><code class=\"language-java\">private static final Set&lt;String&gt; ALLOWED = Set.of(\n    &quot;set_volume&quot;, &quot;lock_screen&quot;, &quot;list_processes&quot;, &quot;kill_process&quot;,\n    &quot;open_url&quot;, &quot;open_app&quot;, &quot;screenshot&quot;, &quot;agent_task&quot;,\n    &quot;click&quot;, &quot;type_text&quot;, &quot;scroll&quot;,\n    &quot;start_screen_stream&quot;, &quot;stop_screen_stream&quot;,\n    &quot;get_clipboard&quot;, &quot;set_clipboard&quot;,\n    &quot;list_files&quot;, &quot;send_file_to_phone&quot;, &quot;send_file_to_pc&quot;,\n    &quot;cancel_task&quot;,\n    &quot;answer_question&quot;,        // ответ на вопрос ИИ-агента\n    &quot;set_display_option&quot;);    // что показывать на экране ПК (рентген, панель плана)\n<\/code><\/pre>\n<p><code>shutdown<\/code> и <code>reboot<\/code> <strong>намеренно исключены<\/strong> — их протокол знает, но до агента они не дойдут (телефон получит <code>denied<\/code>). <code>nl<\/code> тоже не в списке — но он и не должен сюда доходить: к моменту проверки фраза уже заменена конкретной командой.<\/p>\n<p>Почему две новые команды безопасно разрешить:<\/p>\n<ul>\n<li><code>answer_question<\/code> сама по себе ничего на ПК не делает: агент примет её, только если <strong>прямо сейчас<\/strong> ждёт ответа на вопрос с таким же случайным <code>questionId<\/code>, — иначе вернёт «вопрос неактуален».<\/li>\n<li><code>set_display_option<\/code> принимает только два ключа (<code>xray<\/code>, <code>plan<\/code>) — настройки безопасности агента через неё не поменять.<\/li>\n<\/ul>\n<p>Это единственное место, где решается «можно ли». Он стоит <strong>после<\/strong> ИИ → защищает от prompt injection: ИИ может предложить что угодно, но выполнится только разрешённое.<\/p>\n<p>Kotlin-копия в <code>jarvis/shared/Whitelist.kt<\/code> устарела и нигде не применяется — эталон здесь.<\/p>\n<h3><code>denyReason<\/code> и <code>ForbiddenGoals<\/code> — вторая проверка<\/h3>\n<pre><code class=\"language-java\">public String denyReason(Command command) {\n    if (!ALLOWED.contains(command.name())) return &quot;команды нет в белом списке&quot;;\n    if (goalsGuard &amp;&amp; command instanceof Command.AgentTask task) {\n        String why = ForbiddenGoals.reason(task.goal());\n        if (why != null) return &quot;агенту нельзя поручать: &quot; + why;\n    }\n    return null;   // можно\n}\n<\/code><\/pre>\n<p><strong>Откуда взялась вторая проверка — находка замера 5 октября.<\/strong> Белый список не пропускает команду <code>shutdown<\/code>. Но фразу «выключи компьютер» Gemini превращал не в <code>shutdown<\/code>, а в <strong>задачу агенту<\/strong> с целью «выключи компьютер». <code>agent_task<\/code> — команда разрешённая, и агент на ПК дошёл бы мышью до «Пуск → Завершение работы». То же с «отформатируй диск c», «переведи маме пять тысяч», «купи билет»: из 7 таких просьб в экзамене Gemini отправил агенту 6. Имя команды было в порядке — опасной была <strong>цель<\/strong>.<\/p>\n<p><code>ForbiddenGoals.reason(goal)<\/code> — список регулярных выражений по тексту цели:<\/p>\n<table>\n<thead>\n<tr>\n<th>Причина отказа<\/th>\n<th>Что ловится (примеры)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>выключение компьютера<\/td>\n<td>«выключи / выруби / отключи / заверши работу» + «компьютер / комп / пк / ноутбук / windows» рядом<\/td>\n<\/tr>\n<tr>\n<td>перезагрузка компьютера<\/td>\n<td>«перезагрузи / перезапусти / ребутни / reboot / restart» + то же<\/td>\n<\/tr>\n<tr>\n<td>форматирование диска<\/td>\n<td>«отформатируй / format» + «диск / флешку / раздел»<\/td>\n<\/tr>\n<tr>\n<td>массовое удаление<\/td>\n<td>«удали / сотри / очисти / снеси» + «все / весь» + «файлы / данные / папки / фото»<\/td>\n<\/tr>\n<tr>\n<td>перевод денег<\/td>\n<td>«переведи / перечисли / скинь / закинь» + деньги, сумма, «на карту»<\/td>\n<\/tr>\n<tr>\n<td>покупка или оплата<\/td>\n<td>«купи / закажи / оплати / оформи заказ»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Правила <strong>намеренно узкие<\/strong>: между глаголом и объектом допускается не больше двух-трёх слов, поэтому «выключи звук», «перезагрузи страницу», «переведи текст», «удали файл отчёт» разрешены. <code>ForbiddenGoalsTest<\/code> проверяет оба списка — «должно быть запрещено» и «должно быть разрешено», и второй не короче первого.<\/p>\n<p>Проверка стоит в белом списке, поэтому действует <strong>одинаково<\/strong> для любого разборщика, для рецептов с телефона (они приходят готовой <code>agent_task<\/code>, минуя разбор) и для уроков из памяти. Выключатель — <code>JARVIS_FORBIDDEN_GOALS=false<\/code>, на случай ложного запрета на защите.<\/p>\n<p>Честная оговорка: это список правил, а не понимание. Необычную формулировку он может пропустить — тогда остаются защиты агента (запрет терминала, подтверждения на ПК и на телефоне, отказ вводить пароли).<\/p>\n<h3><code>AuditService<\/code> — журнал<\/h3>\n<p>Одна строка на каждую команду: <code>SENT<\/code> (ушла агенту), <code>DENIED<\/code> (белый список), <code>ERROR<\/code> (не понял / агент офлайн). Результат выполнения (успех на ПК) <strong>не пишется<\/strong> — только факт отправки.<\/p>\n<p>Нюанс: для телефона новой схемы <code>deviceId<\/code> в сессии = id <strong>агента<\/strong>. Поэтому в <code>audit_log<\/code> команда телефона записывается на устройство-ПК, и различить, <strong>какой именно<\/strong> из нескольких телефонов её дал, нельзя. Улучшение: хранить id привязки (<code>phone_bindings.id<\/code>) в атрибутах сессии и писать его.<\/p>\n<h2>12. Сквозные сценарии<\/h2>\n<h3>A. Первая регистрация ПК<\/h3>\n<pre><code>Агент                                   Релей                                БД\n  │ POST /api/agent/register {label}     │                                    │\n  │─────────────────────────────────────►│ enabled? лимит IP?                 │\n  │                                      │ generateCode(label, null) ────────►│ pairing_codes\n  │◄──────────── {code:&quot;482931&quot;} ────────│                                    │\n  │ WS /ws                               │                                    │\n  │ auth{deviceId:&quot;pc-1a2b&quot;, token:&quot;482931&quot;, role:agent}                      │\n  │─────────────────────────────────────►│ devices.findById → нет             │\n  │                                      │ tryConsumeDeviceCode → used=true ─►│\n  │                                      │ save Device(BCrypt(newToken)) ────►│ devices\n  │◄─ auth_result{ok, reason:newToken} ──│ registerAgent                      │\n  │ сохраняет token.properties           │                                    │\n<\/code><\/pre>\n<h3>B. Привязка телефона<\/h3>\n<pre><code>Агент: POST /api/agent/phone-pairing-code (X-Device-Id/Token) → {code:&quot;731205&quot;}  (agent_id = pc-1a2b)\nАгент показывает QR: jarvis-pair://pair?code=731205&amp;relay=ws://192.168.1.171:8080/ws&amp;name=…\nТелефон: WS → pair_request{code:&quot;731205&quot;}\nРелей:   tryConsumePhoneCode → save PhoneBinding(pc-1a2b, BCrypt(t)) → pair_result{ok, deviceId:&quot;pc-1a2b&quot;, deviceToken:t}\n         закрывает сокет\nТелефон: WS → auth{deviceId:&quot;pc-1a2b&quot;, token:t, role:phone}\nРелей:   путь 1: phone_bindings[pc-1a2b] → matches → registerPhone(target=pc-1a2b)\n         auth_result{ok:true, agentOnline:true}\n<\/code><\/pre>\n<h3>C. Команда, запрещённая белым списком<\/h3>\n<pre><code>Телефон: command_request{nl:&quot;выключи компьютер&quot;}\nРелей:   своя модель → {&quot;type&quot;:&quot;unknown&quot;}            ← её так учили\n         «не понял» перепроверяет Gemini; дальше три возможных исхода — и все заканчиваются отказом:\n\n   а) Gemini → unknown (так велит новый промпт)\n        → audit(ERROR) → command_result{status:&quot;error&quot;,&quot;не понял команду&quot;}\n   б) Gemini → {&quot;type&quot;:&quot;shutdown&quot;}\n        → denyReason: &quot;shutdown&quot; ∉ ALLOWED\n        → audit(DENIED) → command_result{status:&quot;denied&quot;,&quot;команда запрещена: команды нет в белом списке&quot;}\n   в) Gemini → {&quot;type&quot;:&quot;agent_task&quot;,&quot;goal&quot;:&quot;выключи компьютер&quot;}      ← дыра, найденная 5 октября\n        → denyReason: ForbiddenGoals → &quot;выключение компьютера&quot;\n        → audit(DENIED) → command_result{status:&quot;denied&quot;,\n                          &quot;команда запрещена: агенту нельзя поручать: выключение компьютера&quot;}\nАгент:   ничего не получил\n<\/code><\/pre>\n<p>Какой бы «мозг» ни ошибся и как бы его ни обманули — решение принимает код после него.<\/p>\n<h3>C2. Простая команда без интернета<\/h3>\n<pre><code>Телефон: command_request{nl:&quot;сделай потише&quot;}, интернета на ПК нет\nРелей:   навык/скрипт? нет → урок в памяти? нет\n         своя модель → {&quot;type&quot;:&quot;set_volume&quot;,&quot;level&quot;:30}, уверенность 0,99 ≥ 0,9  → источник local\n         (Gemini не спрашивали вообще)\n         белый список → audit(SENT) → агенту\nВсего:   ~0,14 с на разбор вместо ~2 с\n<\/code><\/pre>\n<h3>C3. Фразу понял только Gemini — рождается урок<\/h3>\n<pre><code>Телефон: command_request{requestId:&quot;a7&quot;, nl:&quot;доброе утро, пора работать&quot;}\nРелей:   своя модель → unknown → Gemini → {&quot;type&quot;:&quot;agent_task&quot;,&quot;scope&quot;:&quot;screen&quot;}\n         lessons.propose(&quot;a7&quot;, фраза, команда, ответ своей модели)      ← урок предложен\n         белый список → агенту\nАгент:   выполнил → command_result{requestId:&quot;a7&quot;, status:&quot;ok&quot;}\nРелей:   lessons.confirm(&quot;a7&quot;)                                           ← урок подтверждён\n         → телефону\nПотом:   та же фраза → ступень 2 (память) → команда сразу, без моделей\n         retrain.py заберёт урок через GET /api/admin/intent/lessons\n<\/code><\/pre>\n<h3>D. Кадр живого экрана<\/h3>\n<p>Агент → <code>screen_frame{seq:17,…}<\/code> → <code>handleTextMessage<\/code> → роль AGENT → <code>forwardToPhones<\/code> → все телефоны <code>pc-1a2b<\/code>. Релей картинку не смотрит и не хранит.<\/p>\n<h3>E. Вопрос агента и ответ человека<\/h3>\n<pre><code>Агент:   agent_question{requestId:&quot;r1&quot;, questionId:&quot;q7&quot;, question:&quot;Отправить файл в Избранное?&quot;,\n                        options:[&quot;Да&quot;,&quot;Нет&quot;], timeoutSeconds:120}\nРелей:   роль AGENT → forwardToPhones → все телефоны этого ПК (релей вопрос не читает и не хранит)\nТелефон: command_request{requestId:&quot;r2&quot;, command:{type:&quot;answer_question&quot;, questionId:&quot;q7&quot;, answer:&quot;Да&quot;}}\nРелей:   не nl → разбор не нужен → denyReason: answer_question ∈ ALLOWED → audit(SENT) → агенту\nАгент:   ждёт q7? да → будит поток задачи → command_result{requestId:&quot;r2&quot;, status:&quot;ok&quot;,&quot;ответ передан агенту&quot;}\n         (уже не ждёт → status:&quot;error&quot;,&quot;вопрос уже неактуален&quot;)\n<\/code><\/pre>\n<p>В <code>audit_log<\/code> остаётся строка <code>answer_question<\/code> — видно, что человек отвечал агенту и когда. Сам текст ответа в журнал не пишется.<\/p>\n<h2>13. Скрипты запуска<\/h2>\n<h3><code>C:\\diplom\\faust.ps1<\/code> — основной запуск (через <code>start-faust.bat<\/code>)<\/h3>\n<p>Лежит не в папке релея, а в корне проекта, потому что поднимает <strong>всё<\/strong>: Docker, релей, свою модель, агента. Что он делает для релея (<code>Start-Relay<\/code>):<\/p>\n<ol>\n<li>Выставляет <code>JARVIS_OPEN_REGISTRATION=true<\/code> на время запуска.<\/li>\n<li>Если контейнер уже работает, регистрация открыта и код релея не менялся после сборки образа — ничего не трогает (секунда вместо полминуты).<\/li>\n<li>Иначе сравнивает время самого нового файла в <code>src<\/code>, <code>build.gradle.kts<\/code>, <code>Dockerfile<\/code> со временем создания образа. Код новее → пересборка: сначала быстрый локальный путь (<code>Build-RelayLocally<\/code> + <code>Dockerfile.local<\/code>), при неудаче — обычный <code>docker compose up -d --wait --build<\/code>.<\/li>\n<li><code>docker inspect<\/code> повторяется до 5 раз: сразу после запуска Docker Desktop движок уже отвечает, но сведения о контейнерах отдаёт не мгновенно. А если образ контейнера Docker уже не находит (после чистки), сравнение идёт со временем создания самого контейнера.<\/li>\n<\/ol>\n<p><code>Start-LocalModel<\/code> проверяет, установлена ли Ollama, отвечает ли порт 11434 (если нет — запускает её) и есть ли в ней <code>faust-intent<\/code>. Эта функция <strong>никогда не останавливает запуск<\/strong>: без своей модели релей разбирает фразы через Gemini, как раньше.<\/p>\n<p><code>stop<\/code> останавливает контейнеры командой <code>docker compose stop<\/code> — том <code>jarvis-db-data<\/code> с базой сохраняется.<\/p>\n<h3><code>scripts/start-jarvis.ps1<\/code> (старый, двойной клик по <code>.bat<\/code>)<\/h3>\n<p>Остался с сентября и работает, но про Ollama, быструю пересборку и «пересобирать, только если код менялся» не знает.<\/p>\n<ol>\n<li><strong>Docker:<\/strong> если <code>docker info<\/code> падает — запускает Docker Desktop и ждёт до 3 минут.<\/li>\n<li><strong>База + релей:<\/strong> создаёт <code>.env<\/code> из <code>.env.example<\/code>, если нет; <code>docker compose up -d --wait --build<\/code>.<\/li>\n<li><strong>Агент:<\/strong> если процесса <code>com.jarvis.agent.AgentMain<\/code> нет — запускает <code>gradlew run<\/code> в отдельном окне. Если агент ещё не привязан (<code>token.properties<\/code> нет) — сам выписывает код через админский эндпоинт и передаёт аргументом.<\/li>\n<li><strong>Адрес для телефона:<\/strong> перечисляет физические адаптеры (отсекая Radmin/Hyper-V/vEthernet/VPN/TAP/WireGuard/Bluetooth и 169.254.*), печатает <code>ws://IP:8080/ws<\/code>, предупреждает, если IP сменился с прошлого раза (<code>last-ip.txt<\/code>), показывает Tailscale-адрес как постоянный.<\/li>\n<\/ol>\n<h3><code>scripts/pair-phone.ps1<\/code><\/h3>\n<p>Выписывает через админский эндпоинт два кода: для экрана первого запуска (старая схема, без <code>agentId<\/code>) и для привязки к этому ПК (<code>agentId<\/code> из <code>token.properties<\/code>). Сейчас основной путь — QR из окна агента; скрипт — запасной.<\/p>\n<h2>14. Тесты и оценка качества<\/h2>\n<p>Пять тестовых классов, 25 тестов:<\/p>\n<ul>\n<li><code>GeminiIntentParserTest<\/code> (4) — JSON <code>set_volume<\/code> и <code>agent_task<\/code> правильно превращаются в команды; без ключа работает fallback («сделай потише» → <code>SetVolume<\/code>, «абракадабра» → <code>null<\/code>); фразы про навык и скрипт уходят агенту без модели.<\/li>\n<li><code>HybridIntentParserTest<\/code> (12) — связка на поддельных разборщиках: уверенный ответ своей модели идёт без Gemini, неуверенный и «не понял» — в Gemini, отказ Gemini — запасной путь, урок предлагается только когда своя модель была и не справилась, режимы <code>local<\/code>/<code>gemini<\/code>.<\/li>\n<li><code>ForbiddenGoalsTest<\/code> (3) — список «должно быть запрещено», список «должно быть разрешено», проверка через белый список.<\/li>\n<li><code>AgentQuestionProtocolTest<\/code> (4) — вопрос и план проходят через релей без потери полей, <code>answer_question<\/code> разбирается и проходит белый список, <code>shutdown<\/code> по-прежнему заблокирован.<\/li>\n<li><code>AgentLlmControllerTest<\/code> (2) — без верного токена <strong>401<\/strong>, без ключа <strong>503<\/strong>.<\/li>\n<\/ul>\n<p>Запуск: <code>.\\gradlew test<\/code>.<\/p>\n<h3>Оценка качества разбора — уже не сырьё, а измерения<\/h3>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Где<\/th>\n<th>Суть<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Экзамен А<\/td>\n<td><code>eval/intent_test.jsonl<\/code><\/td>\n<td>250 фраз с эталоном-правилом (диапазон громкости, допустимые домены и т.п.); писал автор<\/td>\n<\/tr>\n<tr>\n<td>Экзамен Б<\/td>\n<td><code>eval/intent_test_b.jsonl<\/code><\/td>\n<td>201 живая фраза, придуманная и размеченная Gemini; измеряет согласие с Gemini<\/td>\n<\/tr>\n<tr>\n<td>Замер<\/td>\n<td><code>eval/intent_eval.py --engine …<\/code> (<code>stub<\/code>, <code>gemini<\/code>, <code>local<\/code>, <code>system<\/code>)<\/td>\n<td>Гонит экзамен через <code>/api/admin/intent/parse<\/code>, считает точность типа и команды, задержку; <code>--resume<\/code> доделывает оборванный прогон<\/td>\n<\/tr>\n<tr>\n<td>Отчёты<\/td>\n<td><code>eval/results/*.md<\/code><\/td>\n<td>По каждой фразе: ожидалось, получено, кто разобрал<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Итог на 8 октября (экзамен А, точность команды / медиана задержки): правила 39,6% / 0 мс; Gemini 100% / 2013 мс; своя модель 97,2% / 133 мс; <strong>вся связка 100% / 140 мс<\/strong> — 82% фраз разбирает своя модель. На экзамене Б своя модель согласна с Gemini в 89,1% случаев, связка — 96,5% (расчёт по готовым ответам, не прогон). Все оговорки к этим цифрам — в файле 5, разделы 8 и 14.<\/p>\n<p>Прежний <code>eval/phrases_ru.csv<\/code> (115 фраз) вошёл в экзамен А.<\/p>\n<h2>15. Модель безопасности и честные слабые места<\/h2>\n<p><strong>Что сделано хорошо:<\/strong><\/p>\n<ul>\n<li>Токены только в виде BCrypt, одноразовые коды с TTL, <code>SecureRandom<\/code>.<\/li>\n<li>Белый список <strong>после<\/strong> ИИ; <code>shutdown/reboot<\/code> вне списка.<\/li>\n<li>Запрет опасных <strong>целей<\/strong> у задачи агенту (<code>ForbiddenGoals<\/code>) — закрыта дыра, найденная замером: «выключи компьютер» как <code>agent_task<\/code>.<\/li>\n<li>Ответ своей модели проверяется кодом (формат, диапазоны), а при неуверенности — перепроверяется Gemini; ни одной модели на слово не верим.<\/li>\n<li>В «уроки» не попадают фразы с паролями и платёжными данными; урок засчитывается только после успешного выполнения.<\/li>\n<li>Служебные эндпоинты обучения и замеров закрыты админским секретом; <code>/parse<\/code> команды никуда не отправляет.<\/li>\n<li>Ключ ИИ только в <code>.env<\/code>, не логируется ни ключ, ни тело ответа Google, ни токены.<\/li>\n<li>Админ-токен сравнивается за постоянное время.<\/li>\n<li>Лимиты: 20 запросов ИИ/мин на агента, 10 регистраций/час на IP, 6 МБ тело, 8 МБ сообщение.<\/li>\n<li>Контейнер работает не от root, в образе нет компилятора.<\/li>\n<\/ul>\n<p><strong>Что стоит назвать самому на защите:<\/strong><\/p>\n<ol>\n<li><strong>Нет TLS<\/strong> — <code>ws://<\/code> и <code>http://<\/code>. Токены и скриншоты идут открытым текстом. Решение: обратный прокси с HTTPS (Caddy/nginx + Let's Encrypt) → <code>wss://<\/code>; или Tailscale (шифрует туннель).<\/li>\n<li><code>setAllowedOrigins(&quot;*&quot;)<\/code> — для не-браузерных клиентов безопасно, но стоит сузить.<\/li>\n<li>Дефолтный <code>dev-admin-change-me<\/code> — опасен, если релей виден из интернета.<\/li>\n<li>Аудит не различает телефоны одного ПК (см. раздел 11) и не пишет итог выполнения.<\/li>\n<li><code>protocolVersion<\/code> не проверяется.<\/li>\n<li>Нет серверных пингов; мёртвое соединение обнаруживается по таймауту TCP/простоя.<\/li>\n<li><code>SessionRegistry<\/code> и лимиты — в памяти: один экземпляр релея, без горизонтального масштабирования.<\/li>\n<li><code>ddl-auto: update<\/code> вместо миграций.<\/li>\n<li>Перегрузка поля <code>reason<\/code> для передачи токена.<\/li>\n<li>Токены бессрочные; нет ротации и API отзыва (кроме удаления строки в БД).<\/li>\n<li><strong>Фразы пользователя теперь хранятся в базе<\/strong> (<code>intent_lesson.phrase<\/code>) — те, что понял только Gemini. В лог релея фраза писалась и раньше (сейчас — <code>Разбор «…»<\/code>, первые 80 символов). Хранение в базе — осознанная плата за самообучение; в продукте нужны срок хранения и согласие.<\/li>\n<li>Запрет опасных целей — список регулярных выражений, а не понимание: необычную формулировку он пропустит, а «закажи пиццу» и «купи билет» запретит всегда — даже если человек именно этого и хотел. Покупки и оплата закрыты целиком сознательно.<\/li>\n<li>За точность связки платит Gemini: каждое «не понял» и каждый ответ с уверенностью ниже 0,9 — платный запрос (на экзамене А это 16% фраз).<\/li>\n<li>Три обращения к Gemini написаны тремя разными кусками кода (<code>GeminiIntentParser<\/code>, <code>AgentLlmController<\/code>, <code>GeminiClient<\/code>).<\/li>\n<li>Адрес Ollama зашит как <code>host.docker.internal<\/code> — релей на отдельном сервере без своей Ollama тихо работает в режиме <code>gemini<\/code>.<\/li>\n<li>Самообучение на уроках написано и покрыто тестами, но вживую не прогонялось.<\/li>\n<\/ol>\n<p><strong>Модель угроз коротко:<\/strong> злоумышленник без токена → не войдёт; с украденным телефоном → сможет только разрешённые команды, опасные потребуют подтверждения человека за ПК (агент), всё в аудите; prompt injection → ИИ может «захотеть» опасного, но белый список, запрет опасных целей и проверки агента это отсекут; утечка БД → хэши токенов и накопленные фразы-уроки, ключа ИИ там нет; подмена своей модели в Ollama → её ответ всё равно проходит проверку формата, белый список и запрет целей.<\/p>\n<h2>16. Отладка<\/h2>\n<pre><code class=\"language-powershell\">docker ps                                   # живы ли jarvis-relay и jarvis-relay-db\ndocker compose logs -f relay                # логи релея\ndocker compose up -d --build                # пересобрать после правки кода\n\n# заглянуть в базу\ndocker exec -it jarvis-relay-db psql -U jarvis -d jarvis\n  \\dt\n  select id, name, role, paired_at from devices;\n  select agent_id, name, paired_at from phone_bindings;\n  select code, agent_id, used, expires_at from pairing_codes order by id desc limit 5;\n  select occurred_at, device_id, command, status, details from audit_log order by id desc limit 20;\n  select avg(latency_ms), count(*) filter (where ok) * 100.0 / count(*) from agent_llm_log;\n  select phrase, command_json, local_answer, confirmed_at from intent_lesson order by id desc limit 10;\n<\/code><\/pre>\n<p>Проверить разбор фразы без телефона и без выполнения (PowerShell; к релею и Ollama ходи по <code>127.0.0.1<\/code>, а не <code>localhost<\/code> — на этом ПК <code>localhost<\/code> сначала пробует IPv6 и теряет около 2 секунд):<\/p>\n<pre><code class=\"language-powershell\">$h = @{ 'X-Admin-Token' = 'dev-admin-change-me' }\n$b = @{ phrase = 'сделай потише'; engine = 'system' } | ConvertTo-Json\nInvoke-RestMethod -Method Post -Uri http://127.0.0.1:8080/api/admin/intent/parse -Headers $h -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($b))\n# → engine, source (local/gemini/…), confidence, localRaw, localMs, geminiMs, ms, command\n\nollama list                      # есть ли faust-intent\nollama ps                        # загружена ли модель в память сейчас\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Что в логе<\/th>\n<th>Значит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>LLM: ключа нет, regex-режим<\/code><\/td>\n<td><code>JARVIS_LLM_API_KEY<\/code> пуст<\/td>\n<\/tr>\n<tr>\n<td><code>Authenticated AGENT (device pc-…)<\/code><\/td>\n<td>Агент вошёл<\/td>\n<\/tr>\n<tr>\n<td><code>DENIED command 'shutdown'<\/code><\/td>\n<td>Сработал белый список<\/td>\n<\/tr>\n<tr>\n<td><code>LLM call failed (…), using regex fallback<\/code><\/td>\n<td>Gemini недоступен/вернул мусор (режим <code>gemini<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>Разбор фраз: режим auto, порог уверенности своей модели 0.9<\/code><\/td>\n<td>Строка при старте: какой режим связки включён<\/td>\n<\/tr>\n<tr>\n<td><code>Разбор «сделай потише» -&gt; set_volume [local, уверенность 0.99]<\/code><\/td>\n<td>Фразу разобрала своя модель<\/td>\n<\/tr>\n<tr>\n<td><code>Разбор «…» -&gt; agent_task [gemini, уверенность 0.62]<\/code><\/td>\n<td>Своя модель не была уверена, ответил Gemini<\/td>\n<\/tr>\n<tr>\n<td><code>Разбор «…» -&gt; … [local-offline…]<\/code> / <code>[stub]<\/code><\/td>\n<td>Gemini недоступен: взят ответ своей модели / правила<\/td>\n<\/tr>\n<tr>\n<td><code>Gemini недоступен (…), следующая попытка через 60 с<\/code><\/td>\n<td>Сработал предохранитель: минуту Gemini не спрашиваем<\/td>\n<\/tr>\n<tr>\n<td><code>Урок подтверждён выполнением: «…»<\/code><\/td>\n<td>Фраза, понятая только Gemini, выполнилась — запомнена<\/td>\n<\/tr>\n<tr>\n<td><code>DENIED command 'agent_task' (req …): агенту нельзя поручать: …<\/code><\/td>\n<td>Сработал запрет опасных целей<\/td>\n<\/tr>\n<tr>\n<td><code>LLM proxy: device=… latencyMs=… ok=false<\/code><\/td>\n<td>Vision-агент не получил ответ ИИ<\/td>\n<\/tr>\n<tr>\n<td><code>Connection closed: CloseStatus[code=1009…]<\/code><\/td>\n<td>Сообщение больше буфера (проверь 8 МБ)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Проверка без телефона — <code>wscat -c ws://localhost:8080/ws<\/code> и ручные JSON-сообщения (примеры в <code>README.md<\/code> релея).<\/p>\n<h2>17. Как расширять<\/h2>\n<p><strong>Новая команда:<\/strong> <code>record<\/code> + <code>@JsonSubTypes<\/code> в <code>protocol/Command.java<\/code> (и то же в агенте и Kotlin) → имя в <code>CommandWhitelist<\/code> → при необходимости строка в системном промпте <code>GeminiIntentParser<\/code> и правило в <code>StubIntentParser<\/code> → пересобрать релей.<\/p>\n<p>Если команду должны вызывать <strong>фразой<\/strong>, теперь есть ещё три места: тип и проверка параметров в <code>LocalIntentParser.interpret<\/code> (иначе ответ своей модели с новым типом не пройдёт проверку формата), шаблоны в <code>jarvis-ml/build_trainset.py<\/code> + переобучение (иначе своя модель о команде не узнает и фраза будет уходить в Gemini), фразы в экзамен <code>eval/build_testset.py<\/code>. Пока модель не переобучена, система всё равно работает — через Gemini.<\/p>\n<p><strong>Новое сообщение от агента телефону<\/strong> (как <code>agent_question<\/code>): <code>record<\/code> + <code>@JsonSubTypes<\/code> в <code>JarvisMessage.java<\/code> трёх копий → ветка <code>case … -&gt; forwardToPhones<\/code> в <code>handleTextMessage<\/code>. И обновлять релей вместе с агентом.<\/p>\n<p><strong>Другой LLM для разбора фраз:<\/strong> новый класс <code>implements IntentParser<\/code> — либо как ещё одна ступень внутри <code>HybridIntentParser<\/code>, либо с <code>@Primary<\/code> вместо него. Другая <strong>локальная<\/strong> модель — просто другое имя в <code>JARVIS_LOCAL_LLM_MODEL<\/code> (формат ответа должен совпасть). Для агента — поменять <code>askGemini<\/code> в <code>AgentLlmController<\/code>.<\/p>\n<p><strong>Новое правило запрета:<\/strong> строка <code>rule(&quot;причина&quot;, &quot;регулярка&quot;)<\/code> в <code>ForbiddenGoals<\/code> + по примеру в оба списка <code>ForbiddenGoalsTest<\/code> («запрещено» и «разрешено»).<\/p>\n<p><strong>Команда требует подтверждения на сервере:<\/strong> можно не отправлять агенту сразу, а слать телефону запрос подтверждения — но сейчас подтверждение живёт на ПК (<code>ConfirmationGate<\/code>), и это сознательно: человек за компьютером видит, что происходит.<\/p>\n<p><strong>Миграции:<\/strong> добавить Flyway, скрипт <code>V1__init.sql<\/code> из текущей схемы, <code>ddl-auto: validate<\/code>.<\/p>\n<h2>18. Шпаргалка<\/h2>\n<pre><code class=\"language-powershell\">C:\\diplom\\start-faust.bat start             # всё сразу: Docker, релей (пересоберёт при правках), Ollama, агент\nC:\\diplom\\start-faust.bat status            # что запущено\nC:\\diplom\\start-faust.bat stop              # остановить (база сохранится)\n\ncd C:\\diplom\\jarvis-relay\ncopy .env.example .env                      # один раз\ndocker compose up -d --wait --build         # поднять/обновить всё вручную\ndocker compose logs -f relay                # логи\ndocker compose down                         # остановить (данные в томе сохранятся)\n.\\gradlew test                              # тесты\n\n# выписать код вручную (админ)\ncurl -X POST http://localhost:8080/api/pairing-codes -H &quot;X-Admin-Token: dev-admin-change-me&quot; -H &quot;Content-Type: application/json&quot; -d &quot;{\\&quot;label\\&quot;:\\&quot;мой ПК\\&quot;}&quot;\n\n# замер точности разбора (из папки eval; режим gemini тратит платные запросы — 250 штук на экзамен А)\ncd eval\npython intent_eval.py --engine system       # вся связка, как её видит телефон\npython intent_eval.py --engine local        # только своя модель\npython intent_eval.py --engine stub         # только правила\n<\/code><\/pre>\n<p>В cmd из-под некоторых оболочек Gradle надо звать как <code>.\\gradlew.bat<\/code>, а не <code>gradlew<\/code>.<\/p>\n<h3>Итоговая карта «кто за что отвечает»<\/h3>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Одной строкой<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>RelayApplication<\/code><\/td>\n<td><code>main<\/code>, запуск Spring<\/td>\n<\/tr>\n<tr>\n<td><code>WebSocketConfig<\/code><\/td>\n<td><code>/ws<\/code>, буфер 8 МБ<\/td>\n<\/tr>\n<tr>\n<td><code>JarvisWebSocketHandler<\/code><\/td>\n<td>Вход, маршрутизация, разбор фраз, белый список, аудит<\/td>\n<\/tr>\n<tr>\n<td><code>SessionRegistry<\/code><\/td>\n<td>Кто онлайн, кому пересылать<\/td>\n<\/tr>\n<tr>\n<td><code>DeviceAuthService<\/code><\/td>\n<td>Три пути входа + привязка телефона<\/td>\n<\/tr>\n<tr>\n<td><code>PairingService<\/code><\/td>\n<td>Выпуск и погашение кодов<\/td>\n<\/tr>\n<tr>\n<td><code>PairingController<\/code><\/td>\n<td>Админский выпуск кодов<\/td>\n<\/tr>\n<tr>\n<td><code>AgentRegistrationController<\/code><\/td>\n<td>Самостоятельная регистрация нового ПК<\/td>\n<\/tr>\n<tr>\n<td><code>AgentPairingController<\/code><\/td>\n<td>Агент просит код для своего телефона<\/td>\n<\/tr>\n<tr>\n<td><code>AgentAuthService<\/code><\/td>\n<td>Проверка агента для REST<\/td>\n<\/tr>\n<tr>\n<td><code>HybridIntentParser<\/code><\/td>\n<td>Связка разборщиков: навык → урок → своя модель → Gemini → правила<\/td>\n<\/tr>\n<tr>\n<td><code>LocalIntentParser<\/code><\/td>\n<td>Своя модель в Ollama: запрос, уверенность, проверка формата ответа<\/td>\n<\/tr>\n<tr>\n<td><code>GeminiIntentParser<\/code> / <code>StubIntentParser<\/code><\/td>\n<td>Фраза → команда (Gemini / правила по ключевым словам)<\/td>\n<\/tr>\n<tr>\n<td><code>IntentLessons<\/code><\/td>\n<td>Уроки: предложить, подтвердить выполнением, вспомнить, отдать на дообучение<\/td>\n<\/tr>\n<tr>\n<td><code>AgentLlmController<\/code><\/td>\n<td>Прокси к Gemini для агента: зрение, планировщик, проверка результата<\/td>\n<\/tr>\n<tr>\n<td><code>GeminiClient<\/code> / <code>AdminLlmController<\/code><\/td>\n<td>Текстовый запрос к Gemini / «учитель» для скриптов обучения<\/td>\n<\/tr>\n<tr>\n<td><code>IntentEvalController<\/code><\/td>\n<td>Замер разбора без выполнения и выгрузка уроков<\/td>\n<\/tr>\n<tr>\n<td><code>CommandWhitelist<\/code><\/td>\n<td>Что разрешено: имя команды + цель задачи агенту<\/td>\n<\/tr>\n<tr>\n<td><code>ForbiddenGoals<\/code><\/td>\n<td>Какие цели агенту поручать нельзя<\/td>\n<\/tr>\n<tr>\n<td><code>SecurityBeansConfig<\/code><\/td>\n<td>BCrypt<\/td>\n<\/tr>\n<tr>\n<td><code>AuditService<\/code><\/td>\n<td>Журнал команд<\/td>\n<\/tr>\n<tr>\n<td><code>Device<\/code>, <code>PairingCode<\/code>, <code>PhoneBinding<\/code>, <code>AuditLog<\/code>, <code>AgentLlmLog<\/code>, <code>IntentLesson<\/code><\/td>\n<td>Таблицы БД<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n"}, {"nav": "Агент", "file": "4-Агент.md", "heads": ["Оглавление", "1. Что делает агент", "2. Структура проекта и сборка", "3. Как всё связано: схема классов", "4. Старт: AgentMain", "5. Настройки и файлы на диске", "6. Привязка и интерфейс", "7. Связь с релеем: RelayClient", "8. Исполнение команд: CommandExecutor", "9. AppCatalog и FileCatalog", "10. ConfirmationGate", "11. ScreenStreamer — живой экран", "12. ИИ-агент: общий цикл", "13. RelayLlmClie

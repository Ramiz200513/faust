 известен из контекста плана: «скачан файл C:\\…\\report.pdf (351 Б)»), в память пишется не путь, а метка <code>{скачанный файл}<\/code>. При повторе метка заменяется тем, что скачалось <strong>сейчас<\/strong>: вместо вчерашнего <code>report (1).pdf<\/code> вставится сегодняшний. Без этого выученная цепочка «скачай и отправь» отправляла бы старый файл. Если при повторе неизвестно, что скачано, — «не знаю, какой файл скачан в этот раз», и задача решается заново с моделью.<\/p>\n<p><strong>Связь с планом.<\/strong> Если проверка результата (раздел 30) опровергла «готово» подзадачи, её траектория забывается — <code>TrajectoryCache.forgetGoal(goal)<\/code>: выученный путь привёл к неверному результату, повторять его из памяти нельзя.<\/p>\n<p><strong>Честное ограничение:<\/strong> повтор проверяет, что шаги <strong>выполнились<\/strong>, но не что цель <strong>достигнута<\/strong>. Внутри плана это теперь закрывает отдельная проверка результата; у одиночной задачи из памяти — по-прежнему нет.<\/p>\n<p>Пункт трея «Забыть выученные задачи» — нужен и для замеров: «первый раз» должен быть действительно первым.<\/p>\n<h2>18. Вспомогательные классы ИИ<\/h2>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Суть<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>SensitiveInputGuard<\/code><\/td>\n<td>Ключевые слова (password, пароль, номер карты, cvv, пин-код, оплат…) + регэксп номера карты (13–19 цифр с пробелами/дефисами). Слова «карта», «card», «pin» с 30 сентября ищутся <strong>только целым словом<\/strong> — раньше подстрока «карт» блокировала «картинку» и «карточку товара». Проверяется: цель до старта, вводимый текст, атрибуты поля, буфер обмена перед отправкой на телефон. Эвристика неполная — это <strong>последний рубеж<\/strong> после запрета в промпте<\/td>\n<\/tr>\n<tr>\n<td><code>ShellGuard<\/code><\/td>\n<td>Запрет терминалов и системных инструментов — три рубежа кодом (раздел 32)<\/td>\n<\/tr>\n<tr>\n<td><code>DoneVerdict<\/code><\/td>\n<td>Достигнута ли цель, когда модель сказала <code>done<\/code>: поле <code>success<\/code>, а если его нет — слова отказа в причине (раздел 30)<\/td>\n<\/tr>\n<tr>\n<td><code>Clarifications<\/code> / <code>UserAsker<\/code><\/td>\n<td>Правила вопросов человеку в рамках одной задачи / транспорт вопроса (раздел 28)<\/td>\n<\/tr>\n<tr>\n<td><code>ActionPhrases<\/code><\/td>\n<td>Действие человеческой фразой: <code>click(12)<\/code> → «Нажимаю «Отправить»» — для экрана ПК и телефона<\/td>\n<\/tr>\n<tr>\n<td><code>StepReporter<\/code><\/td>\n<td>Колбэк «шаг выполнен» → <code>AgentStep<\/code> телефону. <code>needsScreenshot()<\/code> = false, когда идёт стрим (не снимать дважды). Координаты: при картинке — в её пикселях, без картинки — в пикселях экрана<\/td>\n<\/tr>\n<tr>\n<td><code>CancelSignal<\/code><\/td>\n<td><code>isCancelled()<\/code> — проверяется <strong>между шагами<\/strong>. Запрос к ИИ прервать нельзя → реакция до одного шага (несколько секунд) — это честно сказано в приложении<\/td>\n<\/tr>\n<tr>\n<td><code>RunJournal<\/code><\/td>\n<td>Одна задача → <code>runs/дата-id.jsonl<\/code>: goal, scope, maxSteps, completed, stepsTaken, durationMs, <strong>fromMemory<\/strong>, <strong>llmCalls<\/strong>, trace; с 30 сентября ещё <strong>questionsAsked<\/strong>, <strong>questionsAnswered<\/strong>, <strong>waitedForHumanMs<\/strong> и сведения о плане — <strong>mode<\/strong> (<code>single<\/code> / <code>direct<\/code> / <code>plan<\/code> / <code>skill<\/code>), <strong>subtasks<\/strong>, <strong>replans<\/strong>, <strong>plannerCalls<\/strong>, <strong>checksPassed<\/strong>, <strong>checksFailed<\/strong>, <strong>planFromMemory<\/strong>. Метрики вычитываются из трейса по меткам <code>TrajectoryCache<\/code> — чтобы не менять <code>AgentReport<\/code> (это правка протокола в трёх местах). Сырьё для таблиц диплома; сводит их в таблицу <code>scripts/runs-table.ps1<\/code>. <strong>Журналы до 30 сентября завышают успех<\/strong> — тогда любое <code>done<\/code> считалось успехом<\/td>\n<\/tr>\n<tr>\n<td><code>ImageUtil<\/code><\/td>\n<td><code>scaleDown(img, maxW)<\/code> (билинейно), <code>toJpeg(img, quality)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>PageElement<\/code> / <code>UiaElement<\/code><\/td>\n<td>«Глаза» агента в DOM / UIA<\/td>\n<\/tr>\n<tr>\n<td><code>*Demo<\/code><\/td>\n<td>Ручные прогоны без телефона и релея-WS (ИИ всё равно через релей — агент должен быть привязан)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>19. Оверлеи «Фауст»<\/h2>\n<p>Зачем: человек за ПК должен <strong>видеть<\/strong>, что компьютером управляют, и иметь кнопку «Стоп». Плюс это эффектно на защите.<\/p>\n<h3><code>FaustOverlayController<\/code> — единая точка входа<\/h3>\n<p>Остальной код знает только его. Три сценария:<\/p>\n<table>\n<thead>\n<tr>\n<th>Сценарий<\/th>\n<th>Вызовы<\/th>\n<th>Что на экране<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Обычная команда<\/td>\n<td><code>onCommand(&quot;Открываю Telegram&quot;)<\/code><\/td>\n<td>Виджет на 2.5 с, без «Стоп»<\/td>\n<\/tr>\n<tr>\n<td>«Экран ПК» с телефона<\/td>\n<td><code>onRemoteControlStart(stop)<\/code> / <code>onClick<\/code> / <code>onRemoteControlEnd<\/code><\/td>\n<td>Рамка + ореол курсора + всплески тапов + «Остановить»<\/td>\n<\/tr>\n<tr>\n<td>ИИ-задача<\/td>\n<td><code>onTaskStart<\/code> / <code>onThinking<\/code> / <code>onStep<\/code> / <code>onClick<\/code> / <code>ghostClick<\/code> / <code>onTaskEnd<\/code> (в <code>finally<\/code>)<\/td>\n<td>Заставка → рамка + ореол + виджет «Думаю · шаг N» / «Нажимаю» + «Стоп»<\/td>\n<\/tr>\n<tr>\n<td>ИИ-задача, режим UIA<\/td>\n<td><code>onSeen(окно, элементы)<\/code> / <code>onChosen(index)<\/code> / <code>onSeenDone()<\/code><\/td>\n<td><strong>Рентген<\/strong>: рамки и номера элементов, вспышка выбранного<\/td>\n<\/tr>\n<tr>\n<td>ИИ-задача по плану<\/td>\n<td><code>onPlan(items, revision)<\/code> / <code>onThought(действие, зачем)<\/code> / <code>onVerify(состояние, текст)<\/code> / <code>onMemory(true)<\/code><\/td>\n<td><strong>Панель «План и мысли»<\/strong>: чек-лист, обоснование модели, итог проверки, значок «ИЗ ПАМЯТИ»<\/td>\n<\/tr>\n<tr>\n<td>Настройка с телефона<\/td>\n<td><code>onDisplayOptionsChanged()<\/code><\/td>\n<td>Выключенный оверлей исчезает сразу, не дожидаясь конца задачи<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Кнопки «Стоп» делают то же, что <code>cancel_task<\/code> с телефона: <code>cancelRequested = true<\/code> (передано в <code>install(...)<\/code> из <code>CommandExecutor<\/code>).<\/p>\n<p>Потоки: окна трогать можно <strong>только в потоке Swing (EDT)<\/strong> → всё через <code>invokeLater<\/code>. Исключения — <code>onClick<\/code> и <code>ghostMove<\/code> <strong>ждут<\/strong> (сразу после них будет реальное нажатие в ту же точку).<\/p>\n<h3>Четыре варианта<\/h3>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Вариант<\/th>\n<th>Что это<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>FaustIntroOverlay<\/code><\/td>\n<td>A<\/td>\n<td>Заставка: экран темнеет, раскрывается логотип, три «радиоволны», «Фауст на связи», логотип улетает в угол. Анимация — <strong>функция от времени t<\/strong>, а не «сдвиг за кадр» → не зависит от тормозов<\/td>\n<\/tr>\n<tr>\n<td><code>FaustFrameOverlay<\/code><\/td>\n<td>B<\/td>\n<td>Тёплое свечение по краю + бегущие «хвосты» + плашка «Фауст управляет компьютером / Остановить». <strong>4 окна-полосы по 120 px<\/strong>, а не одно на весь экран (Java перерисовывает прозрачное окно целиком). 10 fps по умолчанию: на 60 fps рамка ела ~40% ядра, на 10 — 5–10%. Свечение кэшируется картинкой<\/td>\n<\/tr>\n<tr>\n<td><code>FaustStatusWidget<\/code><\/td>\n<td>C<\/td>\n<td>Карточка в правом нижнем углу: логотип с дугами, текст шага, «Стоп». Таймер ~60 Гц<\/td>\n<\/tr>\n<tr>\n<td><code>FaustCursorOverlay<\/code><\/td>\n<td>D<\/td>\n<td>Ореол с логотипом вокруг курсора, сжатие дуг и медный круг при клике; <strong>курсор-призрак<\/strong> в режиме браузера. Системный курсор не подменяется (если агент упадёт, чужой курсор остался бы во всей системе)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>FaustLogoPainter<\/code> — логотип «( · )» в сетке 100×100, один на все оверлеи. <code>Easing<\/code> — кривые разгона/торможения.<\/p>\n<h3>Три новых оверлея (30 сентября — 1 октября)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Что это<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>FaustXrayOverlay<\/code><\/td>\n<td><strong>«Рентген».<\/strong> В режиме UIA модель получает не картинку, а пронумерованный список: <code>[12] &lt;button&gt; &quot;Отправить&quot;<\/code>. Этот самый список рисуется поверх окна — рамка вокруг каждого элемента и его номер. Перед кликом выбранная рамка вспыхивает<\/td>\n<td>Зритель видит, что агент не «угадал пиксель», а <strong>выбрал элемент из списка<\/strong>, который дала Windows. Главная научная идея режима UIA, показанная глазами<\/td>\n<\/tr>\n<tr>\n<td><code>FaustPlanOverlay<\/code><\/td>\n<td><strong>Панель «План и мысли»<\/strong> справа: шаги плана (✓ готов, ● идёт и пульсирует, ○ ждёт), под ними — «ДУМАЮ: …» (настоящее поле <code>reason<\/code> из ответа модели, а не заготовка), «Нажимаю «Избранное»», «ПРОВЕРКА: ✓ в чате видно отправленный файл»<\/td>\n<td>Многоэтапность — суть темы диплома, и здесь она видна без объяснений: какие шаги придумал агент, где он сейчас, что думает и как проверил себя<\/td>\n<\/tr>\n<tr>\n<td><code>FaustRecordingOverlay<\/code><\/td>\n<td><strong>Панель «● Запись навыка»<\/strong> сверху с кнопками «Готово» и «Отмена», красная пульсирующая точка<\/td>\n<td>Практика (кнопки) и доверие: пока агент записывает действия человека, это <strong>видно<\/strong> — никакой скрытой записи<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Цена и как она ограничена: окно рентгена — на весь экран, а прозрачные окна в Java дорого перерисовывать. Поэтому его таймер тикает <strong>только пока что-то движется<\/strong> (проявление рамок за 250 мс, вспышка) — меньше секунды на шаг, остальное время окно просто висит. Панель плана небольшая и перерисовывается при изменениях плюс ~8 раз в секунду ради пульсации текущего шага.<\/p>\n<p>Все три, как и прежние, прозрачны для мыши (кроме кнопок панели записи — её можно нажать, но фокус она не забирает) и скрыты от снимков экрана: <strong>модель свои же рамки никогда не увидит<\/strong>.<\/p>\n<p>Включаются флагами <code>overlay.xray<\/code> и <code>overlay.plan<\/code> — в <code>agent.properties<\/code> или переключателями в настройках телефона (команда <code>set_display_option<\/code>). Рентген проверен скриншотами 30 сентября.<\/p>\n<h3>Как оверлеи не мешают агенту — <code>WinOverlayUtil<\/code> + <code>AgentOverlays<\/code><\/h3>\n<p>Через JNA получить <code>HWND<\/code> окна и выставить флаги Windows:<\/p>\n<ul>\n<li><code>WS_EX_TRANSPARENT<\/code> — клики <strong>проходят сквозь<\/strong> окно (декоративные окна);<\/li>\n<li><code>WS_EX_TOOLWINDOW<\/code> — нет в панели задач и Alt+Tab;<\/li>\n<li><code>WS_EX_NOACTIVATE<\/code> — клик не забирает фокус у программы, куда агент печатает;<\/li>\n<li><code>SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE)<\/code> — окно <strong>не видно на снимках экрана<\/strong> → ИИ его не видит.<\/li>\n<\/ul>\n<p>Вызывать <strong>после<\/strong> <code>setVisible(true)<\/code> (HWND создаётся при показе). Ничего не бросает — вернёт <code>false<\/code>.<\/p>\n<p><code>AgentOverlays<\/code> — реестр окон и <strong>страховка<\/strong>, если Windows не выполнила просьбу (старая Windows, нет JNA, или <code>excludeFromCapture=false<\/code> для записи демо):<\/p>\n<ul>\n<li><code>capture(() -&gt; robot.createScreenCapture(...))<\/code> — на долю секунды убрать окна, не исключённые из захвата;<\/li>\n<li><code>mouseAction(x, y, click)<\/code> — убрать окно, только если клик приходится прямо на него и оно ловит мышь.<\/li>\n<\/ul>\n<h2>20. Потоки — сводная таблица<\/h2>\n<table>\n<thead>\n<tr>\n<th>Поток<\/th>\n<th>Что в нём<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>main<\/code><\/td>\n<td>Старт, потом <code>join()<\/code> навсегда<\/td>\n<\/tr>\n<tr>\n<td>Потоки <code>HttpClient<\/code> (WebSocket)<\/td>\n<td><code>onText<\/code> → парсинг → быстрые команды, <code>cancel_task<\/code>, <strong><code>answer_question<\/code><\/strong>, <code>set_display_option<\/code>, <code>ping<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>jarvis-agent-task<\/code> (1)<\/td>\n<td><code>agent_task<\/code> целиком, включая окно подтверждения, план, все подзадачи и <strong>ожидание ответа на вопрос<\/strong> (спит на <code>CompletableFuture<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>script-output<\/code><\/td>\n<td>Чтение вывода доверенного скрипта, пока он работает<\/td>\n<\/tr>\n<tr>\n<td><code>demo-hooks<\/code>, <code>demo-worker<\/code>, <code>demo-snapshots<\/code><\/td>\n<td>Обучение показом: ловушки Windows с циклом сообщений / разбор событий / снимки окна каждые полсекунды. Живут только во время записи<\/td>\n<\/tr>\n<tr>\n<td><code>jarvis-confirm<\/code> (1)<\/td>\n<td><code>kill_process<\/code>, <code>send_file_to_phone/pc<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>screen-streamer<\/code> (1, scheduled)<\/td>\n<td>Кадры стрима, автостоп<\/td>\n<\/tr>\n<tr>\n<td>Scheduler <code>RelayClient<\/code><\/td>\n<td>Переподключение<\/td>\n<\/tr>\n<tr>\n<td>EDT (Swing)<\/td>\n<td>Все окна: трей, мастер, QR, подтверждение, оверлеи<\/td>\n<\/tr>\n<tr>\n<td><code>app-catalog-warmup<\/code><\/td>\n<td>Однократное чтение «Пуска»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Разделяемое состояние: <code>busyGoal<\/code> (<code>AtomicReference<\/code>), <code>cancelRequested<\/code> (<code>AtomicBoolean<\/code>), <code>session<\/code> в стримере (<code>volatile<\/code> + <code>synchronized<\/code>), <code>send<\/code> (<code>synchronized<\/code>).<\/p>\n<h2>21. Сквозные сценарии<\/h2>\n<h3>A. «Открой телеграм»<\/h3>\n<ol>\n<li>Релей: Gemini → <code>open_app{appName:&quot;telegram&quot;}<\/code> → белый список → агенту.<\/li>\n<li><code>RelayClient.handle<\/code> → <code>poolFor<\/code> = null → в потоке чтения <code>execute<\/code>.<\/li>\n<li><code>onCommand(&quot;Открываю Telegram&quot;)<\/code> → виджет на 2.5 с.<\/li>\n<li><code>launchApp(&quot;telegram&quot;)<\/code> → псевдонима нет → кэш «Пуска» → «telegram» ≈ «Telegram» → <code>explorer.exe shell:AppsFolder\\…<\/code>.<\/li>\n<li><code>CommandResult{OK, &quot;запущено: Telegram&quot;}<\/code>.<\/li>\n<\/ol>\n<h3>B. ИИ-задача в браузере (первый раз)<\/h3>\n<ol>\n<li><code>agent_task{goal:&quot;найди на youtube видео про котов и открой первое&quot;, scope:browser, maxSteps:15}<\/code> → <code>agentPool<\/code>.<\/li>\n<li><code>busyGoal<\/code> занят → окно «Разрешить автономному агенту…» → «Разрешить».<\/li>\n<li><code>onTaskStart<\/code> → заставка, рамка, ореол, виджет.<\/li>\n<li><code>BrowserAgent.run<\/code>: памяти нет → Chrome → youtube.com.<\/li>\n<li>Шаг 1: снимок 80 элементов → ИИ: <code>click(3)<\/code> (поле поиска) → призрак летит → клик → <code>AgentStep<\/code> телефону.<\/li>\n<li>Шаг 2: <code>type(&quot;видео про котов&quot;)<\/code> → Enter.<\/li>\n<li>Шаг 3: <code>click(17)<\/code> — первое видео. Шаг 4: <code>done<\/code>.<\/li>\n<li><code>TrajectoryCache.record<\/code> → шаблон «найди на youtube {slot} и открой первое».<\/li>\n<li><code>onTaskEnd<\/code>, <code>RunJournal<\/code>, финальный кадр + <code>CommandResult{OK,&quot;цель достигнута за 4 шаг(ов), 23 с&quot;, AgentReport}<\/code>.<\/li>\n<\/ol>\n<h3>C. Та же задача про собак<\/h3>\n<p>Шаги 1–3 из памяти: поле по подписи, <code>type<\/code> со слотом «видео про собак», первая ссылка по <code>ordinal<\/code>. 0 обращений к ИИ, несколько секунд.<\/p>\n<h3>D. Отмена<\/h3>\n<p>Телефон: «⛔ Стоп» → <code>cancel_task<\/code> → поток чтения → <code>cancelRequested = true<\/code> → «отменяю: …». Цикл в <code>agentPool<\/code> проверит флаг перед следующим шагом → «стоп: задачу отменил пользователь» → итог «задача отменена за N шаг(ов)».<\/p>\n<h3>E. Попытка ввести пароль<\/h3>\n<p>Модель (обманутая страницей) → <code>type(&quot;qwerty123&quot;)<\/code> в поле <code>type=password<\/code> → <code>SensitiveInputGuard(fieldHint)<\/code> → <code>SecurityException<\/code> → «стоп: похоже на пароль/платёжные данные — отказываюсь вводить».<\/p>\n<h2>22. Безопасность агента<\/h2>\n<table>\n<thead>\n<tr>\n<th>Уровень<\/th>\n<th>Механизм<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Кто может прислать команду<\/td>\n<td>Только релей после входа по токену; <code>shutdown/reboot<\/code> отсекаются релеем, а агент их и не умеет<\/td>\n<\/tr>\n<tr>\n<td>Согласие человека<\/td>\n<td><code>ConfirmationGate<\/code> для ИИ-задачи, <code>kill_process<\/code>, файлов; таймаут = отказ<\/td>\n<\/tr>\n<tr>\n<td>Согласие человека на телефоне<\/td>\n<td>Необратимый шаг плана (отправить, удалить, опубликовать, купить) и <strong>любой<\/strong> запуск скрипта — вопрос «Да / Нет»; «да» засчитывает код, молчание = нет; подтверждение спрашивается и у плана из памяти<\/td>\n<\/tr>\n<tr>\n<td>Что можно запустить<\/td>\n<td><code>AppCatalog<\/code> — только каталог; модели дополнительно закрыты терминалы и системные инструменты (<code>ShellGuard<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Что можно выполнить «как в терминале»<\/td>\n<td>Только доверенные скрипты из <code>~/.jarvis-agent/scripts<\/code>, которые положил человек; без аргументов, только по имени<\/td>\n<\/tr>\n<tr>\n<td>Какие файлы<\/td>\n<td><code>FileCatalog<\/code> и <code>FileTools<\/code> — 4 папки, без <code>..<\/code>, ≤ 5 МБ на передачу; папка <code>.jarvis-agent<\/code> (там токен) недоступна никак; zip — только в разрешённые папки, с защитой от zip-slip и zip-бомбы (≤ 5000 файлов, ≤ 500 МБ)<\/td>\n<\/tr>\n<tr>\n<td>Что может ИИ<\/td>\n<td>Промпты «данные ≠ инструкции», запрет паролей; <code>SensitiveInputGuard<\/code>; UIA-флаг пароля; <code>safeUrl<\/code> (только http/https); запрет <code>alt+f4<\/code>, <code>win<\/code>; <code>ShellGuard<\/code>; ≤ 20 шагов и ≤ 3 мин на цикл, по плану ≤ 10 мин, ≤ 8 подзадач, ≤ 2 перестроек; одна задача<\/td>\n<\/tr>\n<tr>\n<td>Что ИИ может спросить<\/td>\n<td>≤ 5 вопросов на задачу; вопросы про пароль, код из SMS, данные карты на телефон не уходят<\/td>\n<\/tr>\n<tr>\n<td>Запись действий человека<\/td>\n<td>Только пока видна панель «● Запись навыка»; нажатия клавиш по символам не пишутся, содержимое полей пароля — никогда<\/td>\n<\/tr>\n<tr>\n<td>Ключ ИИ<\/td>\n<td>У агента нет — только креды устройства<\/td>\n<\/tr>\n<tr>\n<td>Буфер обмена<\/td>\n<td>Похожее на пароль/карту не отправляется на телефон<\/td>\n<\/tr>\n<tr>\n<td>Права<\/td>\n<td>Обычный пользователь, не администратор<\/td>\n<\/tr>\n<tr>\n<td>Контроль человеком<\/td>\n<td>Оверлеи видны всегда, «Стоп»/«Остановить», управление с телефона прекращается кнопкой на ПК<\/td>\n<\/tr>\n<tr>\n<td>Трассируемость<\/td>\n<td><code>agent.log<\/code>, <code>runs/*.jsonl<\/code>, аудит на релее<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>23. Отладка и типичные проблемы<\/h2>\n<table>\n<thead>\n<tr>\n<th>Симптом<\/th>\n<th>Причина<\/th>\n<th>Что делать<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Изменения «не работают»<\/td>\n<td>Агент не перезапущен / автозапуск крутит старую копию<\/td>\n<td>Сравнить время запуска процесса и время сборки; <code>installDist<\/code> + <code>install-autostart.ps1<\/code><\/td>\n<\/tr>\n<tr>\n<td>Трей красный «не привязан»<\/td>\n<td>Токен отвергнут (база релея пересоздана)<\/td>\n<td>«Настроить заново» → перезапуск → «Подключить»<\/td>\n<\/tr>\n<tr>\n<td>Трей серый «нет связи»<\/td>\n<td>Релей не запущен / неверный <code>relayUrl<\/code><\/td>\n<td><code>docker ps<\/code>; <code>agent.properties<\/code><\/td>\n<\/tr>\n<tr>\n<td>«vision-агент недоступен»<\/td>\n<td>Нет токена<\/td>\n<td>Привязать ПК<\/td>\n<\/tr>\n<tr>\n<td>ИИ-задача сразу «LLM недоступна: HTTP 503»<\/td>\n<td>На релее нет ключа Gemini<\/td>\n<td><code>JARVIS_LLM_API_KEY<\/code> в <code>.env<\/code> + пересобрать релей<\/td>\n<\/tr>\n<tr>\n<td>«HTTP 429»<\/td>\n<td>&gt; 20 запросов ИИ в минуту<\/td>\n<td>Подождать<\/td>\n<\/tr>\n<tr>\n<td>«не подтверждено на ПК за 20 с»<\/td>\n<td>Никто не нажал «Разрешить»<\/td>\n<td>Нажать или <code>confirmSensitiveCommands=false<\/code> (только для разработки!)<\/td>\n<\/tr>\n<tr>\n<td>«не знаю такую программу»<\/td>\n<td>Нет в «Пуске» / PowerShell заблокирован<\/td>\n<td>Проверить <code>Get-StartApps<\/code> в PowerShell<\/td>\n<\/tr>\n<tr>\n<td>Chrome не стартует<\/td>\n<td>Нет Chrome / Selenium Manager не скачал драйвер (нет интернета)<\/td>\n<td>Установить Chrome, проверить сеть<\/td>\n<\/tr>\n<tr>\n<td>UIA всегда «пусто» → пиксели<\/td>\n<td>Нет .NET Desktop Runtime 9<\/td>\n<td>Установить; <code>gradlew runUiaDemo<\/code><\/td>\n<\/tr>\n<tr>\n<td>Кракозябры в логе<\/td>\n<td>Запуск не через Gradle без <code>-Dstdout.encoding=UTF-8<\/code><\/td>\n<td>Запускать через <code>run<\/code>/ярлык<\/td>\n<\/tr>\n<tr>\n<td>Кракозябры в выводе <code>gradlew run…<\/code><\/td>\n<td>Gradle портит кириллицу в консоли<\/td>\n<td>Запускать класс напрямую через <code>java -cp &quot;build/install/jarvis-agent/lib/*&quot; …<\/code><\/td>\n<\/tr>\n<tr>\n<td>Агент сразу отключается после входа, в логе релея ошибка разбора JSON<\/td>\n<td>Релей собран до 30.09 и не знает <code>agent_question<\/code> / <code>agent_plan<\/code><\/td>\n<td><code>start-faust.bat start<\/code> — пересоберёт релей<\/td>\n<\/tr>\n<tr>\n<td>Клики мимо кнопок при масштабе 125–150%<\/td>\n<td>Старая сборка агента без <code>UiaSnapshot.toLogical<\/code><\/td>\n<td>Пересобрать и перезапустить агента<\/td>\n<\/tr>\n<tr>\n<td>«агенту нельзя: терминалы…»<\/td>\n<td>Модель попыталась открыть PowerShell/cmd или напечатать команду — сработал <code>ShellGuard<\/code><\/td>\n<td>Так и задумано; для «терминальных» дел — доверенный скрипт<\/td>\n<\/tr>\n<tr>\n<td>«нет доверенного скрипта «X»; есть: …»<\/td>\n<td>Скрипта с таким названием нет в папке<\/td>\n<td>Положить <code>.bat/.cmd/.ps1<\/code> в <code>~/.jarvis-agent/scripts<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>.bat<\/code> со своей кириллицей выполняется с ошибками<\/td>\n<td><code>cmd<\/code> после <code>chcp 65001<\/code> путает строки с кириллицей<\/td>\n<td>Писать такой скрипт как <code>.ps1<\/code><\/td>\n<\/tr>\n<tr>\n<td>Задача стоит, трей «ждёт ответа на телефоне»<\/td>\n<td>Агент задал вопрос<\/td>\n<td>Ответить на телефоне; через <code>ask.timeoutSec<\/code> (120 с) продолжит сам, считая молчание отказом<\/td>\n<\/tr>\n<tr>\n<td>После «Открыть Telegram» агент работает не в том окне<\/td>\n<td>Окно не вышло вперёд<\/td>\n<td><code>WindowFocus<\/code> проверяет это сам и сообщает в трейс; смотреть <code>agent.log<\/code><\/td>\n<\/tr>\n<tr>\n<td>«на ПК сейчас идёт запись навыка»<\/td>\n<td>Не закрыта панель «● Запись навыка»<\/td>\n<td>Нажать «Готово» или «Отмена»<\/td>\n<\/tr>\n<tr>\n<td>Задача «выполнена», а результата нет<\/td>\n<td>Подзадача без проверки (<code>check<\/code>/<code>expect_file<\/code> не заданы) или <code>plan.verify=false<\/code><\/td>\n<td>Смотреть в журнале <code>checksPassed<\/code>/<code>checksFailed<\/code>; включить <code>plan.verify<\/code><\/td>\n<\/tr>\n<tr>\n<td>Вторая попытка той же задачи идёт «не так»<\/td>\n<td>Запомнился неудачный путь или план<\/td>\n<td>Трей → «Забыть выученные задачи»; план — удалить запись из <code>plans.json<\/code><\/td>\n<\/tr>\n<tr>\n<td>Антивирус ругается<\/td>\n<td>Robot + запуск процессов + JNA<\/td>\n<td>Ожидаемо, добавить в исключения<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Где смотреть: трей → «Открыть лог» (<code>agent.log<\/code>); последние задачи — <code>runs\\<\/code>.<\/p>\n<h2>24. Слабые места и вопросы на защите<\/h2>\n<p><strong>Честные ограничения:<\/strong><\/p>\n<ol>\n<li>Только Windows (Core Audio, UIA, JNA-оверлеи, <code>Get-StartApps<\/code>).<\/li>\n<li><code>kill_process<\/code> по <strong>подстроке<\/strong> имени — «chrome» закроет и <code>chromedriver<\/code>. Подтверждение на ПК снижает риск.<\/li>\n<li>ИИ-задача не прерывается посреди запроса к модели — отмена до одного шага.<\/li>\n<li><code>TrajectoryCache<\/code> проверяет выполнение шагов, но не достижение цели (внутри плана это закрывает отдельная проверка).<\/li>\n<li><code>SensitiveInputGuard<\/code> — эвристика: пропустит пароль без ключевых слов. Ложное срабатывание на «картинку» исправлено 30 сентября (целые слова).<\/li>\n<li>Повтор кликов в пиксельном режиме замечается, но не запрещается.<\/li>\n<li>Протокол скопирован вручную (релей и агент) — риск рассинхронизации.<\/li>\n<li>Токен в <code>token.properties<\/code> открытым текстом (защищён только правами папки пользователя).<\/li>\n<li>Selenium работает в своём профиле Chrome — нет логинов пользователя (это и плюс: ИИ не имеет доступа к твоим аккаунтам).<\/li>\n<li><code>set_volume<\/code> только абсолютный.<\/li>\n<li><strong>Цифры многоэтапных сценариев — по одному прогону на ячейку.<\/strong> Модель не детерминирована; для диплома нужны повторы (раздел 34).<\/li>\n<li><strong>Проверка результата тоже ошибается.<\/strong> 30 сентября проверяющий отверг правильную отправку файла из-за номера копии в имени. Поэтому сомнение в необратимом шаге решает человек («Повторить / Уже сделано»), а неуверенная проверка итог не отменяет.<\/li>\n<li><strong>Неточная проверка провоцирует «подгонку».<\/strong> На прогоне агент скопировал README в корень папки, чтобы проверка «файл появился» прошла. Наблюдение для научной части: формулировка проверки — часть задачи, а не формальность.<\/li>\n<li>План зависит от одного текстового запроса к Gemini. Планировщик недоступен → задача идёт прежним одиночным циклом (не падает, но и многоэтапной не становится).<\/li>\n<li>Вставка файла через буфер проверена в Telegram и Проводнике; в WhatsApp — не проверена.<\/li>\n<li>Обучение показом: самопроверка <code>DemoSelfTest<\/code> (Калькулятор) вживую до конца не прошла — человек был за ПК и закрыл окно; повторить отдельно. Показ записывает клики «по элементам» и поэтому работает только там, где окно отдаёт UI Automation.<\/li>\n<li><code>ShellGuard<\/code> и признаки необратимого действия — списки слов: необычное название терминала или формулировку «переправь» вместо «отправь» они могут не узнать.<\/li>\n<li>В <code>agent.properties<\/code> на этом ПК для прогонов стоит <code>confirmSensitiveCommands=false<\/code> — <strong>к защите вернуть <code>true<\/code><\/strong>.<\/li>\n<\/ol>\n<p><strong>Вероятные вопросы:<\/strong><\/p>\n<ul>\n<li><em>Чем это отличается от «одной команды»?<\/em> — задача режется на подзадачи в разных программах; итог одной (путь к скачанному файлу) передаётся следующей; каждый шаг проверяется; при неудаче план перестраивается.<\/li>\n<li><em>Что делает агент, когда не знает?<\/em> — спрашивает человека на телефоне: до начала работы (планировщик) или посреди шага (исполнитель). Не больше 5 вопросов, ответы запоминаются до конца задачи.<\/li>\n<li><em>Кто решает, можно ли отправить файл?<\/em> — человек, а засчитывает ответ <strong>код<\/strong>: «да» — только ответ целиком из слов согласия. Модель подтверждение не интерпретирует.<\/li>\n<li><em>Почему агенту нельзя терминал, но можно скрипты?<\/em> — в терминале команду пишет модель, любую; скрипт написал человек, модель может только запустить его по имени, и перед запуском всё равно спрашивается подтверждение.<\/li>\n<li><em>Как вы узнали, что задача действительно выполнена?<\/em> — три уровня: <code>success<\/code> в ответе модели, проверка кодом (файл на диске, что скачалось), отдельный взгляд другой модели-запроса на окно. В журнале — сколько ложных «готово» поймано (<code>checksFailed<\/code>).<\/li>\n<li><em>Почему агент сам подключается к релею?<\/em> — NAT: домашний ПК недоступен извне; исходящее соединение проходит.<\/li>\n<li><em>Где ключ ИИ?<\/em> — только на релее; агент ходит через прокси со своим токеном.<\/li>\n<li><em>Что если ИИ решит сделать что-то опасное?<\/em> — белый список на релее, подтверждение на ПК, каталоги программ/папок, <code>SensitiveInputGuard<\/code>, лимиты, и человек видит всё на экране с кнопкой «Стоп».<\/li>\n<li><em>Чем DOM/UIA лучше скриншотов?<\/em> — модель выбирает номер из короткого текстового списка, а не угадывает координаты: быстрее, дешевле, точнее. Пиксели — запасной путь для программ без разметки.<\/li>\n<li><em>Как агент не кликает по собственным анимациям?<\/em> — окна прозрачны для мыши и скрыты от захвата экрана (JNA); если не вышло — на миг убираются.<\/li>\n<li><em>Как понять, что задача выполнена успешно?<\/em> — модель возвращает <code>done<\/code>; метрики — <code>runs/*.jsonl<\/code> (success rate, шаги, время, обращения к ИИ, доля из памяти).<\/li>\n<li><em>Зачем память траекторий?<\/em> — повтор без ИИ: секунды вместо десятков, 0 запросов; модель «обучает» систему сценариям.<\/li>\n<\/ul>\n<h2>25. Как расширять<\/h2>\n<p><strong>Новая простая команда (например, <code>mute_toggle<\/code>):<\/strong><\/p>\n<ol>\n<li><code>protocol/Command.java<\/code>: <code>record MuteToggle() implements Command { public String name() { return &quot;mute_toggle&quot;; } }<\/code> + <code>@JsonSubTypes<\/code> + в <code>permits<\/code>. То же в релее и Kotlin.<\/li>\n<li><code>CommandExecutor.execute<\/code>: <code>case Command.MuteToggle c -&gt; ok(requestId, toggleMute());<\/code><\/li>\n<li><code>describeCommand<\/code>: <code>case Command.MuteToggle c -&gt; &quot;Выключаю звук&quot;;<\/code><\/li>\n<li>Белый список на релее. Перезапустить агента, пересобрать релей.<\/li>\n<\/ol>\n<p><strong>Новое действие ИИ (например, двойной клик):<\/strong> поле/значение в <code>AgentAction<\/code>/<code>ScreenAction<\/code> + <code>toString<\/code> → строка в промпте <code>GeminiVisionAgent<\/code> (общие блоки правил вынесены в константы — чтобы действие не появилось в одном режиме и не забылось в другом) → ветка в <code>apply<\/code>/<code>applyInWindow<\/code> → фраза в <code>ActionPhrases<\/code> → при необходимости <code>stepFrom<\/code> в <code>ScreenAgent<\/code>, чтобы шаг запоминался, и ветка повтора.<\/p>\n<p><strong>Новый вид подзадачи плана:<\/strong> значение в <code>PlanStep.Kind<\/code> → описание в правилах <code>GeminiTaskPlanner<\/code> и ветка разбора <code>scope<\/code> → ветка в <code>PlanRunner.execute<\/code> → если шаг необратим или опасен — в <code>confirmFor<\/code>. Образец — <code>RUN_SCRIPT<\/code>, добавленный 1 октября.<\/p>\n<p><strong>Новый узкий инструмент вместо терминала<\/strong> (как <code>extract_archive<\/code>): статический метод в <code>FileTools<\/code> с проверкой путей <code>checkAllowed<\/code> → действие в <code>FILE_RULES<\/code> промпта → ветка в <code>ScreenAgent<\/code> → тест. Терминал при этом остаётся запрещён — <code>ShellGuard<\/code> не трогать.<\/p>\n<p><strong>Новый эталонный сценарий:<\/strong> запись <code>new Scenario(…)<\/code> в <code>ScenarioRunner<\/code> с разрешённым получателем — правило ответов «Да» только для него.<\/p>\n<p><strong>Другой ИИ:<\/strong> новая реализация <code>VisionAgent<\/code> или изменение прокси на релее — циклы не меняются.<\/p>\n<p><strong>Новая программа в каталог:<\/strong> <code>program(&quot;code.exe&quot;, &quot;vscode&quot;, &quot;вс код&quot;)<\/code> в <code>AppCatalog<\/code> — но обычно она и так найдётся в «Пуске».<\/p>\n<h2>26. Шпаргалка<\/h2>\n<pre><code class=\"language-powershell\">cd C:\\diplom\\jarvis-agent\n\n# первый запуск (или откроется окно «Подключить»)\n.\\gradlew run --args=&quot;ws://localhost:8080/ws&quot;\n.\\gradlew run --args=&quot;ws://localhost:8080/ws 482931&quot;      # с кодом от админа\n.\\gradlew run --args=&quot;--pair-phone&quot;                        # сразу окно QR\n\n# ручные проверки без телефона\n.\\gradlew runVisionDemo --args=&quot;найди на youtube видео про котов и открой первое&quot;\n.\\gradlew runScreenDemo --args=&quot;открой Пуск и запусти Калькулятор&quot;\n.\\gradlew runUiaDemo\n.\\gradlew runOverlayDemo --args=&quot;record&quot;\n\n# проверки промптов без управления экраном (нужен релей с ключом и привязанный агент; тратят запросы к Gemini)\n.\\gradlew runAskCheck               # задаёт ли модель вопросы там, где нужно\n.\\gradlew runPlanCheck              # какие планы составляет модель\n\n# тесты (109) — без сети, без экрана\n.\\gradlew test\n\n# эталонные сценарии без телефона (сначала installDist; напрямую через java — чтобы кириллица не портилась)\n.\\gradlew installDist\njava -cp &quot;build/install/jarvis-agent/lib/*&quot; com.jarvis.agent.ScenarioRunner send plan\njava -cp &quot;build/install/jarvis-agent/lib/*&quot; com.jarvis.agent.ScenarioRunner send single   # базовая линия без планировщика\npowershell -NoProfile -ExecutionPolicy Bypass -File scripts\\runs-table.ps1                # таблица из журналов\n\n# автозапуск (после любых правок!)\n.\\gradlew installDist\npowershell -NoProfile -ExecutionPolicy Bypass -File scripts\\install-autostart.ps1\n\n# где что лежит\nexplorer $env:USERPROFILE\\.jarvis-agent\nGet-Content $env:USERPROFILE\\.jarvis-agent\\agent.log -Tail 50 -Wait\n<\/code><\/pre>\n<p>Пример <code>agent.properties<\/code>:<\/p>\n<pre><code class=\"language-properties\">relayUrl=ws://localhost:8080/ws\nphoneRelayUrl=ws://100.101.102.103:8080/ws\nconfirmSensitiveCommands=true\noverlay.excludeFromCapture=true\noverlay.xray=true\noverlay.plan=true\nuia.enabled=true\nask.enabled=true\nask.timeoutSec=120\nplan.enabled=true\nplan.maxMinutes=10\nplan.verify=true\nfiles.enabled=true\n<\/code><\/pre>\n<p>Сценарии <code>ScenarioRunner<\/code>: <code>rate<\/code> (курс с сайта → Блокнот → файл), <code>copy<\/code> (папка и копирование файла в Проводнике), <code>send<\/code> (скачать архив → Telegram, «Избранное»), <code>unzip<\/code> (скачать архив → распаковать → отправить файл из папки в «Избранное»), <code>script<\/code> (запустить доверенный скрипт «сервер диплома»). Второй аргумент — <code>plan<\/code> или <code>single<\/code>. Сценарии с отправкой пишут только в «Избранное» — чат с самим собой.<\/p>\n<h3>Итоговая карта «кто за что отвечает»<\/h3>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Одной строкой<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>AgentMain<\/code><\/td>\n<td>Порядок старта, связывание объектов<\/td>\n<\/tr>\n<tr>\n<td><code>AgentConfig<\/code> / <code>AgentSettings<\/code><\/td>\n<td>Адрес релея / флаги поведения<\/td>\n<\/tr>\n<tr>\n<td><code>TokenStore<\/code> / <code>AgentLog<\/code><\/td>\n<td>Токен+deviceId / лог в файл<\/td>\n<\/tr>\n<tr>\n<td><code>RelayClient<\/code><\/td>\n<td>WebSocket, вход, реконнект, выбор потока для команды<\/td>\n<\/tr>\n<tr>\n<td><code>SelfRegistration<\/code> / <code>FirstRunWizard<\/code><\/td>\n<td>Регистрация ПК одной кнопкой<\/td>\n<\/tr>\n<tr>\n<td><code>PairPhoneDialog<\/code> / <code>LanAddress<\/code><\/td>\n<td>QR для телефона / правильный IP<\/td>\n<\/tr>\n<tr>\n<td><code>AgentTray<\/code><\/td>\n<td>Значок, статус, меню<\/td>\n<\/tr>\n<tr>\n<td><code>CommandExecutor<\/code><\/td>\n<td>Выполнение всех команд; выбор пути ИИ-задачи: навык, скрипт, план или один цикл<\/td>\n<\/tr>\n<tr>\n<td><code>PlanRunner<\/code><\/td>\n<td>Многоэтапная задача: план, подтверждение, подзадачи, проверка, перестройка<\/td>\n<\/tr>\n<tr>\n<td><code>TaskPlanner<\/code> / <code>GeminiTaskPlanner<\/code> / <code>PlannerReply<\/code> / <code>PlanStep<\/code><\/td>\n<td>Просьба → план, вопрос или отказ<\/td>\n<\/tr>\n<tr>\n<td><code>StepVerifier<\/code> / <code>ResultVerifier<\/code><\/td>\n<td>Проверка «готово» подзадачи: файл на диске + отдельный взгляд модели<\/td>\n<\/tr>\n<tr>\n<td><code>PlanMemory<\/code><\/td>\n<td>Память планов: та же просьба во второй раз — без планировщика<\/td>\n<\/tr>\n<tr>\n<td><code>Clarifications<\/code> / <code>PhoneQuestions<\/code> / <code>UserAsker<\/code><\/td>\n<td>Правила вопросов / доставка на телефон и ожидание / интерфейс «спросить человека»<\/td>\n<\/tr>\n<tr>\n<td><code>DoneVerdict<\/code><\/td>\n<td>Успех или отказ стоит за словом <code>done<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>FileTools<\/code> / <code>DownloadWatcher<\/code><\/td>\n<td>Найти, вставить, распаковать файл / что скачалось за задачу<\/td>\n<\/tr>\n<tr>\n<td><code>WindowFocus<\/code><\/td>\n<td>Вывести окно открытой программы вперёд и проверить это<\/td>\n<\/tr>\n<tr>\n<td><code>ShellGuard<\/code> / <code>ScriptCatalog<\/code><\/td>\n<td>Запрет терминалов / доверенные скрипты человека<\/td>\n<\/tr>\n<tr>\n<td><code>DemoRecorder<\/code> / <code>SkillStore<\/code> / <code>SkillTeacher<\/code><\/td>\n<td>Запись показа / хранилище навыков / сценарий обучения из трея<\/td>\n<\/tr>\n<tr>\n<td><code>ScenarioRunner<\/code> / <code>AskPromptCheck<\/code> / <code>PlanPromptCheck<\/code> / <code>DemoSelfTest<\/code><\/td>\n<td>Прогоны и проверки для научной части, без телефона<\/td>\n<\/tr>\n<tr>\n<td><code>ActionPhrases<\/code><\/td>\n<td>Действие агента человеческой фразой<\/td>\n<\/tr>\n<tr>\n<td><code>AppCatalog<\/code> / <code>FileCatalog<\/code><\/td>\n<td>Что можно открыть / какие файлы трогать<\/td>\n<\/tr>\n<tr>\n<td><code>ConfirmationGate<\/code><\/td>\n<td>«Разрешить / Отклонить» на ПК<\/td>\n<\/tr>\n<tr>\n<td><code>ScreenStreamer<\/code><\/td>\n<td>Живой экран<\/td>\n<\/tr>\n<tr>\n<td><code>RelayLlmClient<\/code><\/td>\n<td>ИИ через релей<\/td>\n<\/tr>\n<tr>\n<td><code>GeminiVisionAgent<\/code><\/td>\n<td>Промпты и разбор ответа<\/td>\n<\/tr>\n<tr>\n<td><code>BrowserAgent<\/code><\/td>\n<td>ИИ в Chrome (DOM) + память + чтение страницы + скачивание<\/td>\n<\/tr>\n<tr>\n<td><code>ScreenAgent<\/code><\/td>\n<td>ИИ в любых программах (UIA/пиксели) + память + файлы + повтор навыка<\/td>\n<\/tr>\n<tr>\n<td><code>UiaSnapshot<\/code> + <code>UiaDump.exe<\/code><\/td>\n<td>Список элементов окна от Windows (в логических пикселях)<\/td>\n<\/tr>\n<tr>\n<td><code>TrajectoryCache<\/code><\/td>\n<td>Память успешных решений — браузер и программы<\/td>\n<\/tr>\n<tr>\n<td><code>SensitiveInputGuard<\/code><\/td>\n<td>Запрет паролей и карт<\/td>\n<\/tr>\n<tr>\n<td><code>RunJournal<\/code><\/td>\n<td>Журнал задач для метрик<\/td>\n<\/tr>\n<tr>\n<td><code>FaustOverlayController<\/code> + <code>Faust*<\/code> + <code>AgentOverlays<\/code> + <code>WinOverlayUtil<\/code><\/td>\n<td>Анимации на экране ПК, не мешающие агенту: рамка, курсор, виджет, рентген, панель плана, панель записи<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h1>Часть 2. Многоэтапные задачи<\/h1>\n<p>Всё в этой части появилось с 30 сентября по 1 октября. Причина — требование темы диплома: <strong>по-настоящему многоэтапные задачи через несколько программ<\/strong>, эталонный пример — «скачай файл в браузере и отправь его нескольким людям». И второе требование: чтобы ИИ <strong>сам спрашивал человека<\/strong> — что делать, какой файл, кому, — а не молча сдавался.<\/p>\n<p>Одна мысль связывает все разделы ниже: <strong>модели не верим на слово ни в одном месте, где ошибка дорого стоит.<\/strong> Подтверждение засчитывает код. Что скачалось — узнаёт код. Появился ли файл — проверяет код. Выполнен ли шаг — смотрит другой запрос, а не сам исполнитель. Терминал запрещён кодом, а не просьбой в промпте.<\/p>\n<h2>27. Как теперь идёт ИИ-задача: общая схема<\/h2>\n<pre><code> agent_task(goal)\n   │  окно на ПК «Разрешить агенту действовать?»                      ConfirmationGate\n   ▼\n ┌─ есть в памяти траекторий? ───────────► повтор без модели           TrajectoryCache\n ├─ это навык, выученный показом? ───────► повтор записанных шагов     SkillStore → ScreenAgent.runSkill\n ├─ «запусти скрипт X»? ─────────────────► готовый план из 1 шага ─┐   ScriptCatalog\n └─ иначе ──► ПЛАНИРОВЩИК ──┬─ вопрос человеку → план заново        │   GeminiTaskPlanner\n                            ├─ отказ → стоп                         │\n                            ├─ одна подзадача, ничего необратимого  │\n                            │      → обычный одиночный цикл         │   (режим &quot;direct&quot;)\n                            └─ план из нескольких подзадач ◄────────┘\n                                   │  есть необратимое или скрипт → «…?»  Да / Нет   (решает код)\n                                   ▼\n                     для каждой подзадачи по очереди:                   PlanRunner\n                        open_app   → открыть + вывести окно вперёд      AppCatalog + WindowFocus (без модели)\n                        run_script → запустить доверенный скрипт        ScriptCatalog (без модели)\n                        browser    → цикл в Chrome                      BrowserAgent (+ DownloadWatcher)\n                        screen     → цикл в программе                   ScreenAgent  (+ FileTools, ShellGuard)\n                           │  исполнитель может спросить человека       Clarifications → PhoneQuestions\n                           ▼\n                        ПРОВЕРКА результата                             ResultVerifier\n                           ✓ → итог подзадачи передаётся следующим\n                           ✗ → перестроить хвост плана (≤ 2 раз)\n                                   ▼\n                     чистый успех → план запоминается                   PlanMemory\n<\/code><\/pre>\n<p>На телефон всё это время идут: <code>agent_plan<\/code> (чек-лист при каждом изменении), <code>agent_step<\/code> (шаги со сквозной нумерацией), <code>agent_question<\/code> (вопросы), в конце — кадр экрана и <code>command_result<\/code> с итогом.<\/p>\n<h2>28. Вопросы человеку<\/h2>\n<p>Раньше у агента было два исхода неясной ситуации — угадать или сдаться. Теперь третий: спросить.<\/p>\n<p>Три класса, три роли:<\/p>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Роль<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>UserAsker<\/code> (интерфейс)<\/td>\n<td>«Способ спросить живого человека и дождаться ответа». Циклы не знают, <strong>как<\/strong> вопрос доходит. В demo-запусках спросить некого — там <code>UserAsker.NONE<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>PhoneQuestions<\/code><\/td>\n<td>Транспорт: отправить <code>agent_question<\/code> на телефон и уснуть до ответа<\/td>\n<\/tr>\n<tr>\n<td><code>Clarifications<\/code><\/td>\n<td>Правила: память ответов, повторы, лимит, секреты, молчание. Создаётся на каждую задачу заново<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3><code>PhoneQuestions<\/code> — где встречаются два потока<\/h3>\n<pre><code>поток задачи (jarvis-agent-task)                 поток чтения сокета\n  ask(requestId, вопрос, варианты, 120 с)\n    questionId = случайный UUID\n    pending[questionId] = new CompletableFuture   ← регистрируем ДО отправки\n    send(AgentQuestion(…))\n    каждые 300 мс: отменили? → null                 пришла команда answer_question(questionId, &quot;Да&quot;)\n                   reply.get(300 мс) ◄───────────── answer(): pending[questionId].complete(&quot;Да&quot;) → true\n    finally: pending.remove(questionId)             (вопроса уже нет в pending → false, «вопрос уже неактуален»)\n<\/code><\/pre>\n<p>Детали, на которые стоит обратить внимание:<\/p>\n<ul>\n<li><strong>Регистрация до отправки.<\/strong> Телефон может ответить быстрее, чем поток дойдёт до следующей строки, — ответ не должен потеряться.<\/li>\n<li><strong>Ключ — случайный <code>questionId<\/code>.<\/strong> Ответ на старый, уже брошенный вопрос (человек нажал кнопку через пять минут) не попадёт по ошибке в следующий.<\/li>\n<li><strong>Ответить можно, только пока вопрос ждёт.<\/strong> Поэтому команда <code>answer_question<\/code> сама по себе ничего на ПК сделать не может — а это важно, ведь она проходит белый список релея как самостоятельная команда.<\/li>\n<li><strong>Отмена проверяется каждые 300 мс<\/strong> — кнопка «Стоп» на телефоне срабатывает и во время ожидания ответа.<\/li>\n<li>Ответ длиннее 500 символов обрезается — чтобы не раздувать промпт.<\/li>\n<\/ul>\n<h3><code>Clarifications<\/code> — правила, которые не зависят от послушности модели<\/h3>\n<p>Метод <code>request(вопрос, варианты, cancel)<\/code> возвращает <code>Reply(answer, note)<\/code>: сам ответ и <strong>строку для трейса<\/strong>. Модель прочтёт её в «УЖЕ СДЕЛАНО» — поэтому каждая ветка не только сообщает, что произошло, но и подсказывает, что делать дальше.<\/p>\n<table>\n<thead>\n<tr>\n<th>Ситуация<\/th>\n<th>Что уходит человеку<\/th>\n<th>Что видит модель<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Вопрос про пароль, CVV, ПИН, код из SMS, данные карты<\/td>\n<td>Ничего<\/td>\n<td>«такое не спрашиваю… — заверши done»<\/td>\n<\/tr>\n<tr>\n<td>Тот же вопрос уже задавали<\/td>\n<td>Ничего<\/td>\n<td>«уже спрашивал — ответ был: «…»»<\/td>\n<\/tr>\n<tr>\n<td><code>ask.enabled=false<\/code><\/td>\n<td>Ничего<\/td>\n<td>«спрашивать выключено — действуй сам; необратимое не делай»<\/td>\n<\/tr>\n<tr>\n<td>Телефон не подключён<\/td>\n<td>Ничего<\/td>\n<td>«спросить некого — действуй сам; необратимое не делай»<\/td>\n<\/tr>\n<tr>\n<td>Лимит (5) исчерпан<\/td>\n<td>Ничего<\/td>\n<td>«лимит вопросов исчерпан — действуй сам или заверши done»<\/td>\n<\/tr>\n<tr>\n<td>Человек промолчал<\/td>\n<td>Вопрос<\/td>\n<td>«ответа нет (120 с). Считай это ответом „нет“: необратимое не делай»<\/td>\n<\/tr>\n<tr>\n<td>Человек ответил<\/td>\n<td>Вопрос<\/td>\n<td>«→ ответ: «Лере и Маше» (ждал 14 с)»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Четыре решения и их причины:<\/p>\n<ol>\n<li><strong>Память ответов — в самой цели.<\/strong> Модель видит только 8 последних строк истории. В длинной задаче ответ «отправь Лере и Маше» уехал бы за край через несколько шагов. Поэтому <code>goalFor(goal)<\/code> приклеивает ответы к цели блоком «УТОЧНЕНИЯ ОТ ПОЛЬЗОВАТЕЛЯ (считай это частью цели)», и они видны на каждом шаге до конца задачи. Пока вопросов не было, промпт не меняется ни на символ.<\/li>\n<li><strong>Молчание = «нет».<\/strong> Иначе агент, не дождавшись ответа на «Отправить файл Лере?», мог бы решить, что можно, — а это ровно то необратимое действие, ради которого он спрашивал.<\/li>\n<li><strong>Время ожидания не съедает лимит задачи<\/strong> (<code>waitedMs<\/code>, <code>extend(deadline)<\/code>): человек может думать две минуты, и это не должно обрывать трёхминутную подзадачу.<\/li>\n<li><strong>Свой узкий список секретных слов.<\/strong> Общий <code>SensitiveInputGuard<\/code> здесь не годится: для ввода текста перестраховка оправдана, а вопрос — это разговор, и ложный отказ на «Какую картинку отправить?» ломал бы ту самую функцию, ради которой класс написан.<\/li>\n<\/ol>\n<p><code>Clarifications<\/code> несёт и <strong>контекст плана<\/strong> (<code>setTaskContext<\/code>): исходную просьбу и итоги прошлых подзадач. Он живёт здесь, а не приклеивается к цели подзадачи, намеренно: по цели подзадача ищется в памяти траекторий, и «скачай файл» с приклеенной историей чужих шагов никогда бы там не нашлась.<\/p>\n<p>Когда модель спрашивает — задано промптом (<code>ASK_RULES<\/code>, общий для трёх режимов): не хватает данных; вариантов несколько («два контакта „Лера“» — перечислить их кнопками); <strong>перед необратимым действием — один раз на всю серию<\/strong>, с перечислением, что и кому; дважды попробовал и не понимает, куда нажать. Спрашивать перед каждым кликом нельзя — человек устанет и начнёт жать «Да» не глядя.<\/p>\n<p>Измерено проверкой промпта без экрана (<code>runAskCheck<\/code>, 30 сентября): модель спросила или промолчала там, где ожидалось, в 18 случаях из 18 — в одном прогоне.<\/p>\n<h2>29. Планировщик и <code>PlanRunner<\/code><\/h2>\n<h3>Зачем резать задачу<\/h3>\n<p>Исполнитель видит одну программу за раз и помнит 8 последних шагов. На задаче из 30 шагов через три программы он терялся. План режет её на куски, каждый — <strong>в одной программе<\/strong> и такой длины, с которой исполнитель уже справляется.<\/p>\n<h3><code>PlanStep<\/code> — одна подзадача<\/h3>\n<p><code>PlanStep(kind, goal, app, check, expectFile)<\/code>:<\/p>\n<table>\n<thead>\n<tr>\n<th><code>kind<\/code><\/th>\n<th>В промпте<\/th>\n<th>Кто выполняет<\/th>\n<th>Модель на шаге?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>BROWSER<\/code><\/td>\n<td><code>{&quot;scope&quot;:&quot;browser&quot;,&quot;goal&quot;:&quot;…&quot;}<\/code><\/td>\n<td><code>BrowserAgent<\/code><\/td>\n<td>да<\/td>\n<\/tr>\n<tr>\n<td><code>SCREEN<\/code><\/td>\n<td><code>{&quot;scope&quot;:&quot;screen&quot;,&quot;goal&quot;:&quot;…&quot;}<\/code><\/td>\n<td><code>ScreenAgent<\/code><\/td>\n<td>да<\/td>\n<\/tr>\n<tr>\n<td><code>OPEN_APP<\/code><\/td>\n<td><code>{&quot;scope&quot;:&quot;open_app&quot;,&quot;app&quot;:&quot;Telegram&quot;}<\/code><\/td>\n<td>код: каталог + вывод окна вперёд<\/td>\n<td><strong>нет<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>RUN_SCRIPT<\/code><\/td>\n<td><code>{&quot;scope&quot;:&quot;run_script&quot;,&quot;script&quot;:&quot;сервер диплома&quot;}<\/code><\/td>\n<td>код: <code>ScriptCatalog.run<\/code><\/td>\n<td><strong>нет<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>check<\/code> — что должно быть видно в окне после шага («в чате Избранное последнее сообщение — файл»); <code>expectFile<\/code> — какой файл должен появиться («Рабочий стол\\курс.txt»). Оба необязательны и нужны проверяющему (раздел 30).<\/p>\n<h3><code>GeminiTaskPlanner<\/code> — один текстовый запрос<\/h3>\n<p>Ходит в модель через тот же прокси релея, <strong>без картинки<\/strong>: планировщику экран не нужен, ему нужна просьба. К правилам добавляются список программ, установленных на этом ПК, и список доверенных скриптов.<\/p>\n<p>Ответ — один из трёх видов (<code>PlannerReply<\/code>), и все три нормальные:<\/p>\n<pre><code>{&quot;steps&quot;:[…],&quot;confirm&quot;:&quot;Отправить report.pdf Лере и Маше в WhatsApp?&quot;}     → Steps\n{&quot;ask&quot;:&quot;Какой файл отправить?&quot;,&quot;options&quot;:[&quot;отчёт.pdf&quot;,&quot;смета.xlsx&quot;]}        → Ask\n{&quot;give_up&quot;:&quot;нужен ввод пароля&quot;}                                             → GiveUp\n<\/code><\/pre>\n<p>Главное в правилах промпта — что умеет каждый вид подзадачи и чего <strong>не<\/strong> умеет:<\/p>\n<ul>\n<li>браузер агента — отдельный, с чистым профилем, вход никуда не выполнен; годится для открытых сайтов;<\/li>\n<li>в установленных программах (WhatsApp, Telegram) пользователь уже вошёл в аккаунт — переписка идёт там;<\/li>\n<li>одинаковые действия для разных людей — <strong>отдельными подзадачами<\/strong> («отправить Лере», «отправить Маше»);<\/li>\n<li>в <code>goal<\/code> писать всё, что нужно исполнителю, — он не видит исходную просьбу целиком;<\/li>\n<li>«прикрепить файл и отправить» — <strong>одна<\/strong> подзадача: искать файл отдельным шагом не нужно;<\/li>\n<li>терминалы не планировать; zip распаковывается одним действием;<\/li>\n<li>простая просьба в одной программе — одна подзадача, не усложнять; не больше 8;<\/li>\n<li>есть необратимое — заполнить <code>confirm<\/code> одним вопросом, где перечислено, что и кому;<\/li>\n<li><strong>РЕЦЕПТ:<\/strong> если человек сам перечислил шаги («1. … 2. …»), план строго по ним и в том же порядке — не пропускать и не добавлять своих (кроме <code>open_app<\/code> перед работой в программе). Так выполняются навыки-рецепты с телефона;<\/li>\n<li>спрашивать — только если без ответа действие вообще не выполнить; не спрашивать то, что агент найдёт сам, и то, что можно выполнить буквально.<\/li>\n<\/ul>\n<p>Проверка промпта без выполнения (<code>runPlanCheck<\/code>, 30 сентября): вид плана совпал с ожидаемым в 24 случаях из 24; на шести рутинах-рецептах 1 октября — 6 из 6. По одному прогону.<\/p>\n<h3><code>PlanRunner<\/code> — выполнение<\/h3>\n<p>Объект одноразовый: на каждую задачу новый. Четыре этапа.<\/p>\n<p><strong>0. Готовый план.<\/strong> Если просьба прямо называет скрипт (<code>withPreset<\/code>) — план из одного шага без планировщика. Если просьба есть в памяти планов (<code>withMemory<\/code>) — план оттуда. В обоих случаях подтверждение всё равно спрашивается: <strong>память ускоряет, но не отменяет «Да» на необратимое.<\/strong><\/p>\n<p><strong>1. План, уточнения, подтверждение.<\/strong> Цикл: спросить планировщика → <code>GiveUp<\/code> (стоп) / <code>Ask<\/code> (вопрос человеку, ответ попадает в цель, планируем заново; не больше 3 кругов) / <code>Steps<\/code>.<\/p>\n<ul>\n<li>Планировщик недоступен → <code>Outcome.Direct<\/code>: задача всё равно выполнится прежним одиночным циклом.<\/li>\n<li>План из <strong>одной<\/strong> подзадачи <code>browser<\/code> или <code>screen<\/code> без подтверждения — «тривиальный»: тоже <code>Direct<\/code>, но в режиме, который выбрал планировщик (он видел просьбу целиком). Поэтому простые команды работают ровно как раньше, ценой одного короткого текстового запроса.<\/li>\n<li>Есть вопрос-подтверждение → человеку, с кнопками «Да» / «Нет».<\/li>\n<\/ul>\n<p><strong>2. Выполнение.<\/strong> Подзадачи по очереди. Перед каждой — <code>publish()<\/code> (на телефон и на панель уходит весь план со статусами) и <code>questions.setTaskContext(исходная просьба + «уже сделано в этой задаче: …»)<\/code>. У каждой подзадачи свои 3 минуты, но не дальше общего лимита задачи. Итог каждой — <code>StepResult(step, completed, summary)<\/code>; успешный проходит проверку (раздел 30).<\/p>\n<p><strong>3. Неудача → перестройка.<\/strong> Планировщик получает: что уже сделано, что и почему сломалось, что оставалось, — и строит новый хвост плана. <code>revision<\/code> растёт, телефон видит «план перестроен». Стоп вместо перестройки — если задачу отменили, лимит перестроек (2) исчерпан, план был готовым (придумывать за человека другой способ запуска его скрипта нельзя) или проверка сомневается в необратимом шаге, а человек не разрешил повтор.<\/p>\n<h3>Подтверждение: решает код<\/h3>\n<pre><code class=\"language-java\">static String confirmFor(Steps s)   // вопрос от планировщика; а если он промолчал, но в плане есть\n                                    // необратимое, — вопрос собирает КОД из самих подзадач\n<\/code><\/pre>\n<ul>\n<li><strong>Признаки необратимого<\/strong> — регулярное выражение по тексту подзадач: «отправ…», «перешл…», «удали…», «сотри», «опублик…», «выложи», «купи», «закаж…», «оплат…». На послушность модели в этом месте полагаться нельзя.<\/li>\n<li><strong>Запуск скрипта спрашивается всегда<\/strong> — даже если планировщик написал своё подтверждение, но забыл в нём скрипт: скрипт делает на ПК всё, что в нём записано, и человек должен видеть, какой именно.<\/li>\n<li><strong><code>verdict(ответ)<\/code><\/strong> — три исхода. <code>YES<\/code> — только если ответ <strong>целиком<\/strong> состоит из слов согласия («да», «да, отправляй», «ок», «давай»). <code>NO<\/code> — «нет», «не надо», «отмена», «стоп», а также молчание. <code>OTHER<\/code> — всё остальное: «да, но только Лере» — это не согласие, а <strong>уточнение<\/strong>, и план составляется заново и снова подтверждается.<\/li>\n<li><strong>После перестройки повторно не спрашивается<\/strong>, если план уже подтверждён: перестройка после неудачи меняет способ, а не то, что и кому делается. На прогоне 30 сентября без этого правила за одну отправку файла прозвучало три подтверждения — так человек быстро приучится жать «Да» не читая.<\/li>\n<\/ul>\n<h3>Как имя скачанного файла доходит до шага, который его отправляет<\/h3>\n<ol>\n<li>Подзадача 1 (<code>browser<\/code>): модель нажала «Скачать». <code>DownloadWatcher<\/code> дождался конца загрузки и дописал в трейс «факт: скачан файл C:\\Users\\…\\Downloads\\Hello-World-master (7).zip (351 Б)».<\/li>\n<li><code>PlanRunner<\/code> кладёт итог подзадачи в <code>done<\/code>, а перед подзадачей 3 собирает контекст: «Уже сделано в этой задаче: … скачан файл C:\\…\\Hello-World-master (7).zip».<\/li>\n<li>Подзадача 3 (<code>screen<\/code>): цель «прикрепи файл, скачанный на прошлом шаге» + этот контекст → модель отвечает <code>{&quot;action&quot;:&quot;paste_file&quot;,&quot;path&quot;:&quot;C:\\…\\Hello-World-master (7).zip&quot;}<\/code>.<\/li>\n<\/ol>\n<p>Точный путь ни разу не проходит через «память» модели — он лежит в тексте, который код ей показывает.<\/p>\n<h2>30. Проверка результата<\/h2>\n<p>Три уровня, от дешёвого к дорогому.<\/p>\n<h3>Уровень 1. <code>DoneVerdict<\/code> — что стоит за словом <code>done<\/code><\/h3>\n<p><strong>Ошибка, найденная живым прогоном 30 сентября.<\/strong> Раньше успехом считалось любое <code>done<\/code>, кроме «LLM недоступна». Но модель заканчивает цикл и тогда, когда сдаётся. Так записался «успех» задачи, в которой агент дошёл до страницы входа и отказался, и ещё один — где он нашёл курс, но в Блокнот ничего не записал. Для таблиц диплома это худшая из ошибок: <strong>цифры успеха завышены<\/strong>, а ложные успехи ещё и попадали в память.<\/p>\n<p>Теперь модель обязана писать <code>&quot;success&quot;: true|false<\/code>. Правило <code>succeeded(flag, reason)<\/code>:<\/p>\n<ul>\n<li><code>success<\/code> есть → он и решает (но «LLM недоступна» — всегда неуспех, даже при <code>true<\/code>: такой <code>done<\/code> подставляет сам агент);<\/li>\n<li><code>success<\/code> нет (старый формат, модель забыла) → смотрим на причину: слова «отказыва…», «недостижим», «не удалось», «невозможно», «не могу», «не получилось», «не подтвердил», «не выполнен», «не найден» означают неуспех.<\/li>\n<\/ul>\n<h3>Уровень 2. Код — когда есть что проверить на диске<\/h3>\n<p><code>expectFile<\/code> → <code>ResultVerifier.checkFile<\/code>: файл либо есть, либо нет; ждём до 3 секунд (файлу нужно мгновение после «Сохранить»). Никакая модель тут не нужна и ошибиться не может. Файла нет → итог опровергнут, дальше смотреть незачем.<\/p>\n<p>Отдельный случай — <strong>скачивание<\/strong>. Имя скачанного файла заранее не знает никто: Chrome сохраняет «Hello-World-master (5).zip», а планировщик ждал «master.zip». На прогоне такая «проверка» ложно провалила скачивание, и архив скачался второй раз. Поэтому, если ожидается файл в «Загрузках», а в итоге подзадачи есть «скачан файл», — подтверждением считается факт от <code>DownloadWatcher<\/code>.<\/p>\n<h3>Уровень 3. Отдельный взгляд модели на окно<\/h3>\n<p><code>check<\/code> → <code>ResultVerifier.checkWindow<\/code>: снимок активного окна (UI Automation, до 80 элементов) + текст проверки → <strong>отдельный запрос<\/strong> к модели. Ответ — <code>{&quot;ok&quot;:true|false|null,&quot;reason&quot;:&quot;…&quot;}<\/code>.<\/p>\n<p>Почему отдельный запрос, а не сам исполнитель: исполнитель склонен считать свою работу сделанной. Проверяющему показывают только цель и окно — и прямо просят не верить исполнителю на слово.<\/p>\n<p>Для подзадач в браузере взгляд модели не используется: окно браузера агента Windows описывает бедно, а скачивание и так проверяет код.<\/p>\n<h3>Что делает <code>PlanRunner<\/code> с ответом проверки<\/h3>\n<table>\n<thead>\n<tr>\n<th>Ответ<\/th>\n<th>Действие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ok: true<\/code><\/td>\n<td><code>checksPassed++<\/code>, подзадача готова<\/td>\n<\/tr>\n<tr>\n<td><code>ok: null<\/code> («не понять»)<\/td>\n<td>Итог <strong>не отменяется<\/strong>: лучше пропустить ошибку, чем сломать выполненную задачу из-за того, что проверке было плохо видно<\/td>\n<\/tr>\n<tr>\n<td><code>ok: false<\/code>, шаг обратимый<\/td>\n<td><code>checksFailed++<\/code>, выученная траектория подзадачи забывается, подзадача считается неудачной → перестройка плана. Планировщик узнаёт, <strong>что именно<\/strong> не подтвердилось<\/td>\n<\/tr>\n<tr>\n<td><code>ok: false<\/code>, шаг необратимый<\/td>\n<td>Вопрос человеку: «Не уверен, что шаг „…“ выполнен: … Повторить его или он уже сделан?» — «Повторить» / «Уже сделано». Молчание — остановить план, ничего не повторяя<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Последняя строка — тоже из прогона: проверяющий отверг <strong>правильную<\/strong> отправку файла из-за номера копии в имени. Автоматический повтор отправил бы файл второй раз. Проверка тоже ошибается — поэтому повтор необратимого решает человек.<\/p>\n<p><code>checksFailed<\/code> в журнале — это «сколько ложных „готово“ поймано»: самостоятельная цифра для диплома.<\/p>\n<p>Выключатель — <code>plan.verify=false<\/code> (на один запрос к модели меньше на подзадачу).<\/p>\n<h2>31. Файлы, загрузки и фокус окна<\/h2>\n<h3><code>FileTools<\/code> — точные инструменты вместо глаз<\/h3>\n<p>Самое хрупкое место в задаче «скачай файл и отправь его» — прикрепить файл в программе. Обычный путь — кнопка-скрепка, системное окно «Открыть», навигация по папкам, выбор файла: 5–8 шагов, в каждом из которых модель может промахнуться. Два действия заменяют весь этот путь.<\/p>\n<p><strong><code>find(запрос)<\/code><\/strong> — найти файл по части имени.<\/p>\n<ul>\n<li>Где: только Загрузки, Документы, Рабочий стол, Изображения (те же папки, что уже разрешены для передачи на телефон).<\/li>\n<li>Как: «все слова запроса есть в имени», причём и как написано, и в транслите — «отчёт июнь» найдёт и «Отчёт_июнь.docx», и «otchet-iyun.pdf».<\/li>\n<li>Порядок: новые первыми — в многоэтапной задаче нужный файл почти всегда тот, что только что скачали.<\/li>\n<li>Ограничения: глубина 4 уровня, не больше 20 000 просмотренных файлов и 2 секунд, до 5 результатов.<\/li>\n<\/ul>\n<p><strong><code>copyToClipboard(файл)<\/code><\/strong> — положить файл в буфер обмена так же, как «Копировать» в Проводнике (формат списка файлов, <code>CF_HDROP<\/code>). После Ctrl+V мессенджер прикрепляет файл к сообщению, а Проводник копирует его в папку. Инструмент общий, не «про чаты»: работает в любой программе, принимающей файлы из буфера.<\/p>\n<p><strong><code>extractZip(&quot;архив → папка&quot;)<\/code><\/strong> — узкий безопасный инструмент <strong>вместо терминала<\/strong>:<\/p>\n<ul>\n<li>только <code>.zip<\/code>; архив и папка назначения — только внутри разрешённых папок (<code>checkAllowed<\/code>);<\/li>\n<li>защита от <strong>zip slip<\/strong> — записи в <code>..\\..\\Windows<\/code> через хитрое имя внутри архива;<\/li>\n<li>защита от <strong>zip-бомбы<\/strong> — не больше 5000 записей и 500 МБ после распаковки;<\/li>\n<li>существующие файлы не перезаписываются; папка назначения создаётся сама.<\/li>\n<\/ul>\n<p><strong><code>checkAllowed(путь)<\/code><\/strong> — общая проверка для всех трёх: путь нормализуется и обязан лежать внутри одной из четырёх папок. Папка агента <code>.jarvis-agent<\/code> (там токен) недоступна никак.<\/p>\n<p>Выключатель — <code>files.enabled=false<\/code>: модель про действия не узнает, а если всё же попросит — получит отказ.<\/p>\n<h3><code>DownloadWatcher<\/code> — что скачалось за задачу<\/h3>\n<p>Решает две проблемы сразу.<\/p>\n<ol>\n<li><strong>Точный путь.<\/strong> Следующему шагу нужен точный путь к файлу, а у Chrome имя на диске часто не то, что на сайте: «report (1).pdf». Код запоминает, что лежало в «Загрузках» до задачи (<code>start()<\/code>), и после неё смотрит, что добавилось.<\/li>\n<li><strong>Недокачанный файл.<\/strong> Модель говорит «готово», как только нажала «Скачать», а файл ещё качается — Chrome пишет его как <code>*.crdownload<\/code>. <code>finish(60 с, отмена)<\/code> ждёт, пока загрузки закончатся.<\/li>\n<\/ol>\n<p>Итог — строки «факт: скачан файл &lt;путь&gt; (&lt;размер&gt;)» в трейсе. Их читает <code>PlanRunner<\/code> (передаёт следующим подзадачам), <code>CommandExecutor<\/code> (дописывает в итог для телефона) и <code>ScreenAgent<\/code> (подстановка свежего файла при повторе из памяти).<\/p>\n<p>Слежение ни от какого флага не зависит: оно ничего не делает, только сообщает.<\/p>\n<h3><code>WindowFocus<\/code> — окно открытой программы должно быть впереди<\/h3>\n<p><strong>Найдено на прогоне 30 сентября.<\/strong> «Открыть Telegram» при уже запущенном Telegram не делает его окно активным: Windows не даёт фоновому процессу забирать фокус. После шага плана «Открыть Telegram» впереди остался Chrome, и исполнитель следующей подзадачи увидел не то окно. В тот раз он догадался открыть Telegram ещё раз — но мог бы и начать печатать в Chrome.<\/p>\n<p>Теперь после запуска код сам находит окно программы (по имени exe; браузеры по заголовку окна не берутся — заголовок вкладки может случайно содержать название программы), разворачивает свёрнутое и выводит вперёд. Используется <code>SwitchToThisWindow<\/code> — функция, которой пользуется сама Windows при Alt+Tab: её не касается запрет на «кражу фокуса», из-за которого <code>SetForegroundWindow<\/code> из фонового процесса часто молча не срабатывает. А затем <strong>проверяет<\/strong>, что получилось: исполнитель подзадачи должен начинать работу в нужном окне, а не надеяться на это.<\/p>\n<h2>32. <code>ShellGuard<\/code> и доверенные скрипты<\/h2>\n<h3>Откуда взялся запрет<\/h3>\n<p><strong>Найдено на живом прогоне 30 сентября.<\/strong> В задаче «скачай архив и распакуй его» агент, не найдя сразу кнопку, сам открыл PowerShell через <code>open_app<\/code> и набрал <code>Expand-Archive … -Force<\/code>. Цель была безобидной, но путь — нет: через терминал модель может выполнить <strong>любую<\/strong> команду, в обход белого списка релея, подтверждений и всех проверок. Win+R и Alt+F4 были запрещены и раньше; оказалось, что этого мало.<\/p>\n<p>Три рубежа, все — кодом, а не просьбой в промпте:<\/p>\n<table>\n<thead>\n<tr>\n<th>Рубеж<\/th>\n<th>Метод<\/th>\n<th>Что закрыто<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Нельзя открыть<\/td>\n<td><code>isForbiddenApp<\/code><\/td>\n<td>PowerShell, pwsh, cmd / «командная строка», Terminal / «терминал», WSL, bash, Ubuntu; редактор реестра, планировщик заданий, службы, gpedit, msconfig, «управление компьютером», mmc<\/td>\n<\/tr>\n<tr>\n<td>Нельзя печатать в окно<\/td>\n<td><code>isShellWindow<\/code><\/td>\n<td>Окно терминала, <strong>даже если его открыл человек<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Нельзя напечатать команду<\/td>\n<td><code>looksLikeCommand<\/code><\/td>\n<td>Текст, похожий на команду запуска: адресная строка Проводника тоже выполняет «powershell» или «cmd»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Нарушение — <code>SecurityException<\/code>, а не обычный промах: цикл останавливается, как при попытке ввести пароль. Такие попытки не должны повторяться «другим способом».<\/p>\n<p>Запрет касается только <strong>решений модели<\/strong>. Человек с телефона по-прежнему может открыть любую программу командой <code>open_app<\/code>.<\/p>\n<p>Цена запрета измерена: сразу после него сценарий с распаковкой архива занял 40 шагов и 318 секунд — агент распаковывал мышью через Проводник. С узким инструментом <code>extract_archive<\/code> — 9 шагов и 56 секунд. Запрет без замены плох; запрет с узким безопасным инструментом — лучше и терминала, и мыши.<\/p>\n<h3><code>ScriptCatalog<\/code> — то, что по природе делается в терминале<\/h3>\n<p>«Подними сервер в Docker», «git pull», «npm run dev» узким инструментом не закрыть. Для этого — доверенные скрипты.<\/p>\n<p><strong>Почему это не дыра, которую только что закрыли.<\/strong> Терминал запрещён, потому что там команду пишет <strong>модель<\/strong> — любую. Здесь команду пишет <strong>человек<\/strong>: он кладёт <code>.bat<\/code>, <code>.cmd<\/code> или <code>.ps1<\/code> в папку <code>~/.jarvis-agent/scripts<\/code>, и агент может только запустить такой файл <strong>по имени<\/strong>. Изменить команду, передать аргументы или запустить файл из другой папки модель не может. Для неё скрипт — кнопка, которую сделал человек.<\/p>\n<table>\n<thead>\n<tr>\n<th>Метод<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>names()<\/code><\/td>\n<td>Названия скриптов (имя файла без расширения) — попадают в промпт планировщика<\/td>\n<\/tr>\n<tr>\n<td><code>requestedName(цель)<\/code><\/td>\n<td>Просьба вида «запусти скрипт X» → X<\/td>\n<\/tr>\n<tr>\n<td><code>resolve(имя)<\/code><\/td>\n<td>Найти скрипт по названию<\/td>\n<\/tr>\n<tr>\n<td><code>run(имя)<\/code><\/td>\n<td>Запустить и вернуть итог для трейса и следующих шагов<\/td>\n<\/tr>\n<tr>\n<td><code>ensureFolder()<\/code><\/td>\n<td>Создать папку и «ПРОЧТИ МЕНЯ.txt» с пояснением<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Как запускается: <code>.ps1<\/code> — <code>powershell.exe -NoProfile -ExecutionPolicy Bypass -File …<\/code>, остальное — <code>cmd.exe /c …<\/code>; рабочая папка — папка скриптов; ввод закрыт сразу (скрипту нечего ждать с клавиатуры — <code>pause<\/code> не повесит агента). Вывод читается отдельным потоком, в итог идёт его хвост.<\/p>\n<p>Три исхода:<\/p>\n<ul>\n<li>закончился с кодом 0 → «скрипт «X» выполнен; вывод: …»;<\/li>\n<li>закончился с другим кодом → ошибка шага;<\/li>\n<li>не закончился за <code>scripts.waitSec<\/code> (90 с) → значит, это что-то долгоживущее (dev-сервер): <strong>оставляем работать в фоне<\/strong>, шаг считаем выполненным.<\/li>\n<\/ul>\n<p>Два пути к запуску: просьба прямо называет скрипт («запусти скрипт сервер диплома») — план из одного шага без планировщика; или планировщик сам ставит шаг <code>run_script<\/code> в составной план («подними сервер и напиши в чат, что готово»). В обоих случаях <strong>подтверждение на телефоне спрашивается всегда<\/strong>.<\/p>\n<p>Проверено вживую 1 октября: «запусти скрипт сервер диплома» — 8 секунд, с подтверждением. Тогда же найдено: <code>.bat<\/code> с кириллицей ломается (<code>cmd<\/code> после <code>chcp 65001<\/code> путает строки), поэтому рабочий скрипт — <code>.ps1<\/code>.<\/p>\n<h2>33. Навыки показом<\/h2>\n<p>Третий способ научить агента рутине (первые два — рецепт словами на телефоне и доверенный скрипт): <strong>показать один раз мышью<\/strong>.<\/p>\n<pre><code>Трей → «Научить навыку показом…»                                    SkillTeacher\n  → название («утро») и фразы-триггеры («доброе утро, начинаем работу»)\n  → сверху панель «● Запись навыка»; человек делает задачу мышью      FaustRecordingOverlay + DemoRecorder\n  → «Готово» → список записанных шагов → «Сохранить»                  SkillStore → skills.json\nПотом с телефона: «Фауст, навык утро» или «Фауст, доброе утро».\n<\/code><\/pre>\n<h3><code>DemoRecorder<\/code> — как показ превращается в шаги<\/h3>\n<ul>\n<li><strong>Низкоуровневые ловушки Windows<\/strong> (<code>WH_MOUSE_LL<\/code>, <code>WH_KEYBOARD_LL<\/code>) сообщают о каждом клике и нажатии — в отдельном потоке с циклом сообщений, как требует Windows. Сама ловушка только кладёт событие в очередь: долго думать в ней нельзя, иначе у человека начнёт тормозить мышь.<\/li>\n<li><strong>Снимки окна каждые полсекунды<\/strong> (UI Automation, как у рентгена). Клик сопоставляется с <strong>последним снимком до клика<\/strong>: к моменту обработки события окно уже могло измениться от самого клика.<\/li>\n<li>Клик превращается в «нажать элемент такого-то типа с такой-то подписью» — самый маленький элемент под курсором. <strong>Координаты не записываются<\/strong>: окно в следующий раз может стоять в другом месте.<\/li>\n<\/ul>\n<p>Результат — шаги в том же формате, что память траекторий (<code>TrajectoryCache.Step<\/code>). Поэтому повтор навыка идёт тем же кодом, что повтор из памяти.<\/p>\n<h3>Что НЕ записывается — важно для доверия<\/h3>\n<ul>\n<li><strong>Нажатия клавиш по символам.<\/strong> Это был бы кейлоггер. Записывается только факт ввода, а <em>что<\/em> введено — берётся из поля через UI Automation уже после ввода. Отдельные клавиши-команды (Enter, Esc, Tab, стрелки, Delete, F2, F5, Home/End) записываются как действие <code>key<\/code>.<\/li>\n<li><strong>Поле пароля.<\/strong> Windows помечает его сама — содержимое не попадает в запись никогда.<\/li>\n<li><strong>Действия самого агента.<\/strong> <code>Robot<\/code> помечается Windows как «искусственный ввод» (флаг <code>INJECTED<\/code>) — такие события отбрасываются.<\/li>\n<li><strong>Клики по панели записи<\/strong> («Готово», «Отмена»).<\/li>\n<\/ul>\n<p>Запись идёт, только пока на экране панель «● Запись навыка». Пока агент занят ИИ-задачей, учить нельзя; пока идёт запись — нельзя запустить ИИ-задачу.<\/p>\n<h3>Повтор: сценарий и туториал одновременно<\/h3>\n<p><code>SkillStore.match(цель)<\/code> узнаёт навык по названию или фразе-триггеру — с приставкой («навык утро», «выполни навык утро») или без («доброе утро»). Только точное совпадение после нормализации: навык выполняет действия на ПК.<\/p>\n<p><code>ScreenAgent.runSkill<\/code>:<\/p>\n<ol>\n<li><strong>Дословный повтор<\/strong> записанных шагов, без модели. На телефон и на панель идёт чек-лист шагов навыка.<\/li>\n<li>Если окно изменилось и повторить дословно нельзя — записанные шаги становятся для модели <strong>инструкцией<\/strong>: «человек показал так: 1) … 2) …», и она доделывает навык обычным циклом.<\/li>\n<\/ol>\n<p>Показ работает и как готовый сценарий, и как туториал.<\/p>\n<p><strong>Честно о состоянии.<\/strong> Код написан и покрыт тестами (<code>SkillsTest<\/code>). Самопроверка от записи до повтора — <code>DemoSelfTest<\/code>: <code>Robot<\/code> изображает человека в Калькуляторе (C, 7, +, 8, =), запись, закрытие, запуск навыка обычным путём, на дисплее должно быть 15. Вживую она до конца <strong>не прошла<\/strong>: человек был за ПК и закрыл окно. Запускать её нужно отдельно, предупредив, — она двигает мышь.<\/p>\n<h2>34. Память планов, прогоны и цифры<\/h2>\n<h3><code>PlanMemory<\/code> — «учится на глазах»<\/h3>\n<p>Успешно выполненная просьба запоминается <strong>вместе со своим планом<\/strong> (<code>~/.jarvis-agent/plans.json<\/code>, до 30 записей, ключ — нормализованный текст просьбы). В следующий раз та же просьба не идёт к планировщику.<\/p>\n<p>Почему мало памяти траекторий подзадач: планировщик каждый раз формулирует подзадачи немного по-разному («Открой чат Избранное…» / «Найди чат «Избранное»…»), и память по тексту подзадачи почти никогда бы не срабатывала. Одинаковый план → одинаковые тексты подзадач → каждая находит свою выученную траекторию. Так вся многоэтапная задача повторяется почти без модели.<\/p>\n<p>Запоминается только <strong>чистый<\/strong> успех: без перестроек, без опровергнутых проверок и без уточнений у человека (ответы могли относиться только к тому разу). Перестроенный план хранить нельзя — в нём неудачный шаг. Подтверждение необратимого спрашивается и у плана из памяти.<\/p>\n<p>В итоге задачи появляется сравнение с первым разом, на панели — значок «ИЗ ПАМЯТИ».<\/p>\n<h3><code>ScenarioRunner<\/code> — прогоны без телефона<\/h3>\n<p>Задача идёт ровно тем путём, что и с телефона: <code>CommandExecutor<\/code>, планировщик, вопросы, журнал. Отличий два: на вопросы отвечает правило из сценария, а окно «Разрешить агенту действовать?» на ПК выключено — запуск и так делает человек за этим ПК.<\/p>\n<p><strong>Правило ответов — главная защита прогона.<\/strong> «Да» на подтверждение ставится, <strong>только если в вопросе упомянут разрешённый получатель сценария<\/strong> («Избранное» — чат с самим собой; у сценария со скриптом — название именно этого скрипта). Любой другой вопрос «Да/Нет» получает «Нет». Так прогон не может отправить файл живому человеку, даже если модель ошибётся с чатом и спросит об этом.<\/p>\n<h3>Что измерено (30 сентября — 1 октября, этот ПК)<\/h3>\n<p>Источник — журналы <code>~/.jarvis-agent/runs/*.jsonl<\/code>; сводит их <code>scripts/runs-table.ps1<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Сценарий<\/th>\n<th>С планировщиком<\/th>\n<th>Без планировщика (один цикл)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>copy<\/code> — папка и копирование файла в Проводнике<\/td>\n<td>✓ 10 шагов, 52 с (4 подзадачи)<\/td>\n<td>✓ 14 шагов, 87 с<\/td>\n<\/tr>\n<tr>\n<td><code>rate<\/code> — курс с сайта → Блокнот → <code>курс.txt<\/code><\/td>\n<td>✓ 13 шагов, 99 с (3 подзадачи)<\/td>\n<td>✗<\/td>\n<\/tr>\n<tr>\n<td><code>send<\/code> — скачать zip → Telegram, «Избранное»<\/td>\n<td>✓ 6 шагов, 36 с, 1 вопрос (3 подзадачи)<\/td>\n<td>✗<\/td>\n<\/tr>\n<tr>\n<td><code>unzip<\/code> — скачать → распаковать → отправить файл<\/td>\n<td>✓ 9 шагов, 56 с, 1 вопрос (5 подзадач)<\/td>\n<td>не запускался<\/td>\n<\/tr>\n<tr>\n<td><code>send<\/code> во второй раз, из памяти плана<\/td>\n<td>✓ 18 с, <strong>0 обращений к модели<\/strong> (в первый раз 53 с)<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><code>script<\/code> — доверенный скрипт<\/td>\n<td>✓ 8 с, с подтверждением<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Как это читать:<\/p>\n<ul>\n<li><strong>В одной программе план не нужен<\/strong> (<code>copy<\/code>: одиночный цикл справляется, план лишь немного быстрее). <strong>Через несколько программ без плана задача не выполняется<\/strong> (<code>rate<\/code>, <code>send<\/code>) — это и есть довод в пользу планировщика.<\/li>\n<li><code>unzip<\/code> до запрета терминала агент «решал» через PowerShell; сразу после запрета — 40 шагов и 318 с мышью; с <code>extract_archive<\/code> — 9 шагов и 56 с.<\/li>\n<li>Проверки промптов без экрана: вопросы 18 из 18, планировщик 24 из 24, рутины-рецепты 6 из 6.<\/li>\n<\/ul>\n<p><strong>Оговорки, которые надо назвать самому:<\/strong><\/p>\n<ol>\n<li><strong>По одному прогону на ячейку.<\/strong> Модель не детерминирована: в журналах есть и неудачные, и вдвое более долгие прогоны тех же сценариев (например, <code>rate<\/code> с планом — от 13 до 25 шагов). Для диплома нужны повторы — 5–10 на ячейку — и доля успеха, а не одно число.<\/li>\n<li><strong>Журналы до 30 сентября и часть журналов того дня завышают успех<\/strong> — до <code>DoneVerdict<\/code> любое <code>done<\/code> считалось успехом. В таблице — только прогоны, итог которых проверен по факту (файл на диске, сообщение в чате).<\/li>\n<li>Сценарии и их формулировки писал автор системы.<\/li>\n<li>Цена задачи в деньгах и разбивка времени шага пока не измерялись.<\/li>\n<\/ol>\n<h2>35. Тесты агента<\/h2>\n<p>До 30 сентября тестов в агенте не было вовсе. Сейчас — 17 классов, 109 тестов; все работают без сети, экрана и телефона (модель, окно, планировщик подменяются подделками).<\/p>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Тестов<\/th>\n<th>Что проверяет<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>plan/PlanRunnerTest<\/code><\/td>\n<td>25<\/td>\n<td>Порядок подзадач, передача итогов, подтверждение («да» / «нет» / уточнение), перестройка, лимиты, готовый план, память, сомнение в необратимом шаге<\/td>\n<\/tr>\n<tr>\n<td><code>vision/ClarificationsTest<\/code><\/td>\n<td>11<\/td>\n<td>Память ответов, повторы, лимит, секреты, молчание, время ожидания<\/td>\n<\/tr>\n<tr>\n<td><code>FileToolsTest<\/code><\/td>\n<td>9<\/td>\n<td>Поиск по словам и в транслите, новые первыми, пропуск скрытых папок и недокачанных файлов; разрешённые папки, папка агента — стоп; буфер как «Копировать» в Проводнике<\/td>\n<\/tr>\n<tr>\n<td><code>plan/ResultVerifierTest<\/code><\/td>\n<td>8<\/td>\n<td>Файл есть / нет (в том числе во вложенной папке), независимый взгляд модели, «не понять» — не неудача, браузерные шаги не проверяются<\/td>\n<\/tr>\n<tr>\n<td><code>SkillsTest<\/code><\/td>\n<td>8<\/td>\n<td>Навык находится только по точному названию или триггеру; клик сопоставляется с наименьшим элементом под курсором; просьба о скрипте распознаётся; скрипт запускается только из своей папки; ошибка скрипта — не успех; вывод читается в обеих кодировках консоли<\/td>\n<\/tr>\n<tr>\n<td><code>plan/GeminiTaskPlannerTest<\/code><\/td>\n<td>7<\/td>\n<td>Три вида ответа планировщика, разбор проверок, список программ в промпте, починка небрежных шагов, промпт перестройки называет, что и почему сломалось<\/td>\n<\/tr>\n<tr>\n<td><code>vision/GeminiVisionAgentParseTest<\/code><\/td>\n<td>6<\/td>\n<td>Разбор действий: <code>ask<\/code>, файлы, <code>success<\/code>, <code>reason<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>PhoneQuestionsTest<\/code><\/td>\n<td>5<\/td>\n<td>Ответ из потока сокета будит задачу, неизвестный вопрос отвергается, таймаут и поздний ответ, отмена, пустые варианты<\/td>\n<\/tr>\n<tr>\n<td><code>ExtractZipTest<\/code><\/td>\n<td>5<\/td>\n<td>Распаковка в новую папку, zip-slip, без перезаписи, запрет вне папок, только <code>.zip<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>vision/ShellGuardTest<\/code><\/td>\n<td>5<\/td>\n<td>Терминалы запрещены, обычные программы — нет; команды распознаются, обычный текст — нет; окна терминалов<\/td>\n<\/tr>\n<tr>\n<td><code>vision/UiaMemoryTest<\/code><\/td>\n<td>5<\/td>\n<td>Скачанный путь запоминается меткой и заменяется новым; без факта скачивания — не повторять; траектории браузера и программ не смешиваются<\/td>\n<\/tr>\n<tr>\n<td><code>DownloadWatcherTest<\/code><\/td>\n<td>4<\/td>\n<td>Ничего не скачано, готовый файл с полным путём, ожидание недокачанного, зависшая загрузка<\/t

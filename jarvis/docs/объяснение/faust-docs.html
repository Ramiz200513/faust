\/td>\n<td>обычное<\/td>\n<td>Тип сервиса «пишем звук» (Android 14+)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Прочее:<\/p>\n<ul>\n<li><code>&lt;queries&gt;<\/code> с <code>RecognitionService<\/code> и <code>TTS_SERVICE<\/code> — на Android 11+ приложение не «видит» другие пакеты. Без этого блока <code>SpeechRecognizer.isRecognitionAvailable()<\/code> вернёт <code>false<\/code>, а озвучка не найдёт движок.<\/li>\n<li><code>android:usesCleartextTraffic=&quot;true&quot;<\/code> — разрешает незашифрованный <code>ws://<\/code>. Иначе Android заблокирует соединение. В продакшене должен быть <code>wss://<\/code> (TLS).<\/li>\n<li>Сервис <code>JarvisConnectionService<\/code> объявлен с <code>foregroundServiceType=&quot;dataSync|microphone&quot;<\/code>; конкретный тип выбирается в коде при старте.<\/li>\n<li><code>android:label=&quot;Faust&quot;<\/code> — имя в лаунчере.<\/li>\n<\/ul>\n<h2>7. Разбор по файлам<\/h2>\n<h3>7.1 <code>MainActivity.kt<\/code> — вход, навигация и экран чата (1494 строки)<\/h3>\n<p>Самый большой файл. Состоит из нескольких частей.<\/p>\n<h4>Навигация<\/h4>\n<pre><code class=\"language-kotlin\">private enum class AppScreen { CHAT, DEVICES, SCREEN_VIEW, HISTORY, MULTI_PC, CUSTOM_ACTIONS }\n<\/code><\/pre>\n<p><code>MainActivity.onCreate<\/code> → <code>setContent { JarvisTheme { … } }<\/code>:<\/p>\n<ol>\n<li>Создаёт <code>DeviceRepository<\/code> и подписывается на список ПК (<code>collectAsState(initial = null)<\/code>).<\/li>\n<li><code>null<\/code> — DataStore ещё не прочитан → ничего не показывает (чтобы не мигнуть экраном привязки).<\/li>\n<li>Пустой список → <code>PairingScreen()<\/code> (первый запуск).<\/li>\n<li>Есть хотя бы один ПК → переменная <code>screen<\/code> и <code>Crossfade<\/code> (плавная смена) между разделами.<\/li>\n<\/ol>\n<p>Когда <code>PairingScreen<\/code> успешно привяжет ПК, он запишет его в DataStore → <code>devices<\/code> изменится → <code>MainActivity<\/code> <strong>сама<\/strong> переключится на чат. Явного сигнала «привязано» нет — это реактивность.<\/p>\n<h4>Быстрые подсказки и действия<\/h4>\n<pre><code class=\"language-kotlin\">QUICK_PHRASES  // вставляют текст в поле: &quot;скриншот&quot;, &quot;процессы&quot;, &quot;запусти блокнот&quot;, &quot;сделай потише&quot;, &quot;найди на ютубе &quot;\nQUICK_ACTIONS  // сразу шлют Command: 🔒 LockScreen, 🔇 SetVolume(0), 🔊 SetVolume(50), 🌐 OpenApp(&quot;браузер&quot;), 📋⬆, 📋⬇\n<\/code><\/pre>\n<p>Разница: <code>QUICK_PHRASES<\/code> идут через релей как фраза (<code>nl<\/code>) и разбираются ИИ; <code>QUICK_ACTIONS<\/code> шлют <strong>готовую команду<\/strong> через <code>vm.sendCommand(...)<\/code> — быстрее и детерминированно. «найди на ютубе » с пробелом — шаблон, который ты дописываешь.<\/p>\n<h4><code>ChatScreen<\/code> — главный экран<\/h4>\n<p>Что он собирает из ViewModel (<code>collectAsState<\/code>): <code>messages<\/code>, <code>busy<\/code>, <code>status<\/code>, <code>activeDevice<\/code>, <code>unauthorized<\/code>, <code>repairing<\/code>, <code>wakeWordEnabled<\/code>, <code>wakeState<\/code>, <code>customActions<\/code>, <code>liveFrame<\/code>, <code>livePreview<\/code>, а с 30 сентября ещё <code>openQuestion<\/code> (открытый вопрос агента), <code>xrayEnabled<\/code> и <code>planPanelEnabled<\/code> (переключатели показа на ПК).<\/p>\n<p>Ключевые механизмы внутри:<\/p>\n<table>\n<thead>\n<tr>\n<th>Механизм<\/th>\n<th>Как работает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Отправка<\/strong> <code>submit(text)<\/code><\/td>\n<td>Единая точка для текста из поля и распознанной речи → <code>vm.send(t)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Голос с правкой<\/strong> <code>onSpeechText<\/code><\/td>\n<td>Распознанная фраза попадает в поле на <strong>1.5 с<\/strong> — можно поправить; потом уходит то, что в поле<\/td>\n<\/tr>\n<tr>\n<td><strong>Кнопка 🎤<\/strong> <code>onMicClick<\/code><\/td>\n<td>Проверяет разрешение; ставит <code>WakeWordBus.suspended = true<\/code>, чтобы Vosk отпустил микрофон (два потребителя <code>AudioRecord<\/code> одновременно не работают)<\/td>\n<\/tr>\n<tr>\n<td><strong>Разрешения<\/strong><\/td>\n<td><code>rememberLauncherForActivityResult(RequestPermission())<\/code> — отдельные лаунчеры для микрофона, wake-word и уведомлений<\/td>\n<\/tr>\n<tr>\n<td><strong>Жизненный цикл<\/strong><\/td>\n<td><code>LifecycleEventObserver<\/code>: <code>ON_STOP<\/code> → <code>vm.onAppBackgrounded()<\/code>, <code>ON_START<\/code> → <code>vm.onAppForegrounded()<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Авто-прокрутка<\/strong><\/td>\n<td><code>LaunchedEffect(messages.size) { listState.animateScrollToItem(last) }<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Озвучка<\/strong><\/td>\n<td>При новом сообщении от ПК без картинки → <code>voice.speak(text)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Голосовой диалог<\/strong><\/td>\n<td>Если новое сообщение — <strong>вопрос агента<\/strong>, телефон его озвучивает (к вопросу «Да/Нет» добавляет «Скажите „да“ или „нет“»), а когда договорит — <strong>сам включает микрофон<\/strong>, если вопрос ещё открыт и разрешение на микрофон выдано. Распознанное идёт обычным путём <code>submit → vm.send<\/code>, а <code>send<\/code>, видя открытый вопрос, отправляет это ответом<\/td>\n<\/tr>\n<tr>\n<td><strong>Поле ввода как поле ответа<\/strong><\/td>\n<td>Пока есть открытый вопрос, подсказка в поле меняется на «ответ для Фауста…»: всё напечатанное уходит агенту ответом, а не новой командой<\/td>\n<\/tr>\n<tr>\n<td><strong>Сторож стрима<\/strong><\/td>\n<td>Пока включено окошко живого экрана — раз в 4 с <code>vm.restartStreamIfSilent()<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Повторная привязка<\/strong><\/td>\n<td>Если релей отверг токен (<code>unauthorized<\/code>), вместо «Подкл.» кнопка «Привязать заново» → сканер QR<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Разметка сверху вниз: боковое меню (<code>ModalNavigationDrawer<\/code> → <code>ChatDrawer<\/code>), <code>TopAppBar<\/code> (заголовок «Faust», цветная точка статуса, индикатор wake-word, кнопка живого экрана, настройки) → плашка «ПК: имя» + «Подкл./Откл.» → список сообщений (<code>LazyColumn<\/code>) с окошком живого экрана поверх → ряд быстрых действий (включая «⛔ Стоп», видимый только пока <code>busy<\/code>) → ряд подсказок → поле ввода + 🎤 + отправить.<\/p>\n<p>Статус подключения определяется <strong>по строке<\/strong>: <code>connected = status.contains(&quot;✓&quot;)<\/code>. Это простой, но хрупкий приём (см. раздел 12).<\/p>\n<h4>Прочие Composable в файле<\/h4>\n<table>\n<thead>\n<tr>\n<th>Функция<\/th>\n<th>Что рисует<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ChatDrawer<\/code>, <code>DrawerLink<\/code><\/td>\n<td>Выдвижное меню: Устройства, Мульти-ПК, Экран ПК, Файлы, История задач, Свои команды, Настройки. Раньше были 7 кнопок в шапке — не помещались на 360dp<\/td>\n<\/tr>\n<tr>\n<td><code>WakeStateIndicator<\/code><\/td>\n<td>Иконка ⌛/👂/🎤 по состоянию wake-word, с подписью для TalkBack<\/td>\n<\/tr>\n<tr>\n<td><code>PillChip<\/code><\/td>\n<td>Чип-«пилюля» из макета<\/td>\n<\/tr>\n<tr>\n<td><code>statusDotColor<\/code><\/td>\n<td>Зелёный/красный/серый по тексту статуса<\/td>\n<\/tr>\n<tr>\n<td><code>SettingsDialog<\/code><\/td>\n<td>Адрес релея, переключатели «Просыпаться по Фауст» и «Озвучивать ответы», <strong>«Рентген: как ИИ видит окно»<\/strong> и <strong>«План и мысли агента»<\/strong> (оба управляют тем, что рисуется на экране ПК), «Отвязать этот ПК»<\/td>\n<\/tr>\n<tr>\n<td><code>QuestionBubble<\/code><\/td>\n<td>Карточка-вопрос агента: текст, кнопки-варианты, обратный отсчёт «осталось N с», строка состояния («отправляю ответ…», «✓ агент получил ответ „Да“», «вопрос закрыт — агент продолжил без ответа»). Варианты лежат в <code>FlowRow<\/code> — переносятся на новую строку, а не уезжают за край: имён контактов может быть три-четыре<\/td>\n<\/tr>\n<tr>\n<td><code>PlanBubble<\/code>, <code>PlanRow<\/code><\/td>\n<td>Карточка-план: нумерованный чек-лист подзадач со значком статуса и короткой заметкой (итог или причина неудачи)<\/td>\n<\/tr>\n<tr>\n<td><code>QuestionStatus<\/code><\/td>\n<td>Мелкая строка состояния под вопросом<\/td>\n<\/tr>\n<tr>\n<td><code>FileTransferDialog<\/code><\/td>\n<td>Вкладки Загрузки/Документы/Рабочий стол/Изображения, список файлов, ⬇ скачать, ⬆ отправить<\/td>\n<\/tr>\n<tr>\n<td><code>MessageBubble<\/code><\/td>\n<td>Пузырь сообщения: цвет по автору, «хвостик», картинка, прицел, время, статус «отправлено → выполняется… N с → готово ✓ / ошибка / отклонено»<\/td>\n<\/tr>\n<tr>\n<td><code>SystemNote<\/code><\/td>\n<td>Скромная строка по центру для системных сообщений<\/td>\n<\/tr>\n<tr>\n<td><code>ZoomableScreenshotDialog<\/code><\/td>\n<td>Скриншот на весь экран: щипок 1–5×, перетаскивание, двойной тап<\/td>\n<\/tr>\n<tr>\n<td><code>AimMarker<\/code><\/td>\n<td>Красный прицел с пульсирующей волной. Координаты переводятся в <strong>доли<\/strong> картинки → не зависят от масштаба отображения<\/td>\n<\/tr>\n<tr>\n<td><code>AgentStepHeader<\/code><\/td>\n<td>«🤖 ИИ-агент · шаг N» + «🎯 цель»<\/td>\n<\/tr>\n<tr>\n<td><code>EmptyChatHint<\/code><\/td>\n<td>Заставка «Чем помочь?» на пустом чате<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Счётчик секунд «выполняется… N с»: у каждого сообщения со статусом <code>RUNNING<\/code> свой <code>LaunchedEffect<\/code>, раз в секунду пересчитывающий время. Нужен, чтобы долгая ИИ-задача (одиночная — до 3 минут, по плану — до 10) не выглядела зависшей.<\/p>\n<p>В списке сообщений пузырь выбирается по содержимому: <code>msg.question != null<\/code> → <code>QuestionBubble<\/code>, <code>msg.plan != null<\/code> → <code>PlanBubble<\/code>, иначе обычный <code>MessageBubble<\/code>. Карточка-вопрос тикает своим <code>LaunchedEffect<\/code> раз в секунду, <strong>только пока вопрос открыт<\/strong>: агент ждёт ограниченное время, и человеку полезно видеть, сколько осталось.<\/p>\n<h3>7.2 <code>ChatViewModel.kt<\/code> — мозг чата (843 строки)<\/h3>\n<p>Главный ViewModel. Им пользуются <strong>четыре экрана<\/strong> (Чат, Экран ПК, История, Свои команды) — Compose отдаёт им один и тот же объект.<\/p>\n<h4>Модель сообщения<\/h4>\n<pre><code class=\"language-kotlin\">enum class Author { ME, PC, SYSTEM }\nenum class CommandProgress { SENT, RUNNING, DONE, ERROR, DENIED }\n\ndata class ChatMessage(\n    val id: String = UUID…,        // ключ для LazyColumn и анимаций\n    val author: Author,\n    val text: String,\n    val imageBase64: String? = null, // скриншот или картинка шага\n    val requestId: String? = null,   // связывает команду с ответом\n    val targetX: Int? = null, val targetY: Int? = null, // прицел ИИ\n    val agentStep: Int? = null,      // номер шага agent_task\n    val progress: CommandProgress? = null, // только у моих команд\n    val sentAtMs: Long = now,\n    val question: QuestionCard? = null,    // не null — это вопрос агента, пузырь рисуется карточкой\n    val plan: AgentPlan? = null,           // не null — это план задачи, карточка-чек-лист (одна на задачу)\n)\n\nenum class QuestionState { WAITING, SENDING, ANSWERED, EXPIRED }\n\ndata class QuestionCard(\n    val questionId: String,\n    val options: List&lt;String&gt;,        // кнопки; пусто — только свой ответ в поле ввода\n    val state: QuestionState = WAITING,\n    val answer: String? = null,       // что ответил человек — показывается в карточке\n    val expiresAtMs: Long? = null,    // когда агент перестанет ждать\n) {\n    fun isOpen(now): Boolean = state == WAITING &amp;&amp; (expiresAtMs == null || now &lt; expiresAtMs)\n}\n<\/code><\/pre>\n<p>Жизнь вопроса: <code>WAITING<\/code> (кнопки активны) → <code>SENDING<\/code> (ответ ушёл, ждём подтверждения агента) → <code>ANSWERED<\/code> (агент принял). <code>EXPIRED<\/code> — агент больше не ждёт: вышло время, задача кончилась или отменена. <code>isOpen<\/code> смотрит не только на состояние, но и <strong>на часы<\/strong>: карточка не должна принимать ответ после того, как агент перестал ждать.<\/p>\n<h4>Зависимости (создаются прямо в классе)<\/h4>\n<p><code>JarvisClient<\/code>, <code>DeviceRepository<\/code>, <code>PairingController<\/code>, <code>SettingsRepository<\/code>, <code>TaskHistoryRepository<\/code>, <code>CustomActionsRepository<\/code>.<\/p>\n<h4>Публичное состояние (StateFlow)<\/h4>\n<table>\n<thead>\n<tr>\n<th>Поле<\/th>\n<th>Что хранит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>messages<\/code><\/td>\n<td>Список сообщений чата<\/td>\n<\/tr>\n<tr>\n<td><code>busy<\/code><\/td>\n<td>Есть ли команда в <code>SENT<\/code>/<code>RUNNING<\/code> — <strong>вычисляется из <code>messages<\/code><\/strong>, а не хранится отдельно («один источник правды») → показывает кнопку «Стоп»<\/td>\n<\/tr>\n<tr>\n<td><code>openQuestion<\/code><\/td>\n<td>Последний открытый вопрос агента (или <code>null<\/code>) — тоже вычисляется из <code>messages<\/code>. Пока он есть, поле ввода работает как поле ответа<\/td>\n<\/tr>\n<tr>\n<td><code>xrayEnabled<\/code>, <code>planPanelEnabled<\/code><\/td>\n<td>Что показывать на экране ПК; читаются из <code>SettingsRepository<\/code>, по умолчанию оба включены<\/td>\n<\/tr>\n<tr>\n<td><code>status<\/code><\/td>\n<td>Строка статуса связи («подключено ✓», «ПК «X» офлайн», «переподключение… (через 4 с)»)<\/td>\n<\/tr>\n<tr>\n<td><code>liveFrame<\/code><\/td>\n<td>Последний кадр живого стрима (в чат не попадает — иначе 3–5 кадров/с забили бы список)<\/td>\n<\/tr>\n<tr>\n<td><code>livePreview<\/code><\/td>\n<td>Включено ли окошко живого экрана<\/td>\n<\/tr>\n<tr>\n<td><code>fileList<\/code><\/td>\n<td>Файлы из последнего <code>ListFiles<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>activeDevice<\/code><\/td>\n<td>ПК, на который уходят команды<\/td>\n<\/tr>\n<tr>\n<td><code>unauthorized<\/code><\/td>\n<td>Релей отверг токен → нужна повторная привязка<\/td>\n<\/tr>\n<tr>\n<td><code>repairing<\/code><\/td>\n<td>Состояние повторной привязки<\/td>\n<\/tr>\n<tr>\n<td><code>wakeWordEnabled<\/code>, <code>wakeState<\/code><\/td>\n<td>Слово-триггер<\/td>\n<\/tr>\n<tr>\n<td><code>taskHistory<\/code>, <code>customActions<\/code><\/td>\n<td>Из репозиториев<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4><code>init<\/code> — что происходит при создании<\/h4>\n<ol>\n<li>Загрузить историю и свои кнопки из файлов.<\/li>\n<li>Подписаться на <code>WakeWordBus.phrases<\/code> → каждую фразу отправить через <code>send(it)<\/code> (тем же путём, что ручной ввод).<\/li>\n<li>Подписаться на <code>WakeWordBus.notes<\/code> → служебные строки в чат.<\/li>\n<li>Прочитать настройку wake-word; если была включена — поднять сервис сразу (приложение на переднем плане → Android 12+ разрешит).<\/li>\n<li><code>combine(devices, activeDeviceId)<\/code> → найти активный ПК → <code>connect()<\/code>. Дальше <code>drop(1).collect<\/code>: при смене активного ПК или его токена/адреса — переподключиться.<\/li>\n<\/ol>\n<h4>Отправка<\/h4>\n<ul>\n<li><code>send(text)<\/code> — фраза. Четыре развилки по порядку:\n<ol>\n<li>известно, что ПК офлайн → <strong>не отправляет<\/strong>, а сразу пишет понятную заметку;<\/li>\n<li>есть открытый вопрос агента → это <strong>ответ<\/strong>, а не новая команда: <code>answerQuestion(...)<\/code>. Иначе «Маше» ушло бы на релей как фраза для разбора и превратилось бы в непонятную команду;<\/li>\n<li>фраза совпала с навыком-рецептом («навык утро», «доброе утро») → <code>sendTracked(text, recipe.toCommand())<\/code> — на ПК уходит готовая <code>AgentTask<\/code> с нумерованными шагами;<\/li>\n<li>иначе → <code>sendTracked(text, NaturalLanguage(text))<\/code>, фразу разберёт релей.<\/li>\n<\/ol>\n<\/li>\n<li><code>sendTracked(shownText, command)<\/code> — реплика <code>ME<\/code> со статусом <code>SENT<\/code> + команда <strong>с тем же <code>requestId<\/code><\/strong>: к этой реплике потом прикрепятся шаги, план, вопросы и итог. Через <strong>0.6 с<\/strong> статус переходит в <code>RUNNING<\/code> (эвристика «приняли в работу»).<\/li>\n<li><code>runCustomAction(record)<\/code> — чип «Своих команд». Рецепт показывается в чате репликой (ему нужно, к чему прикрепить план и вопросы); остальные чипы — мгновенные команды без реплики.<\/li>\n<li><code>sendCommand(command)<\/code> — готовая команда без сообщения в чате (стрим, клик, быстрые кнопки).<\/li>\n<li><code>note(text)<\/code> — локальная системная строка, в сеть не уходит.<\/li>\n<\/ul>\n<h4>Ответ на вопрос агента<\/h4>\n<p><code>answerQuestion(messageId, answer)<\/code> вызывается кнопкой в карточке или из <code>send<\/code>:<\/p>\n<ol>\n<li>карточка уже закрыта (<code>!isOpen()<\/code>) → в сеть ничего не идёт, карточка гаснет, заметка «вопрос уже неактуален — если это была новая команда, отправьте её ещё раз»;<\/li>\n<li>иначе: новый <code>requestId<\/code> запоминается в <code>answerRequests[requestId] = messageId<\/code>, карточка → <code>SENDING<\/code>, в ленту добавляется реплика с ответом (диалог читается как в мессенджере: «Кому отправить?» — «Лере и Маше»), уходит <code>CommandRequest(AnswerQuestion(questionId, answer))<\/code>.<\/li>\n<\/ol>\n<p>Результат этой команды отдельным пузырём не рисуется — он только переключает карточку: <code>OK<\/code> → <code>ANSWERED<\/code>, иначе → <code>EXPIRED<\/code> + заметка «агент уже не ждал ответа».<\/p>\n<p>Карточку меняет <code>updateQuestion<\/code> через <code>_messages.update { … }<\/code> — <strong>атомарно<\/strong>, потому что пишут два потока: UI (нажатие кнопки) и OkHttp (пришёл результат).<\/p>\n<h4>Переключатели показа на ПК<\/h4>\n<p><code>setXrayEnabled(on)<\/code> / <code>setPlanPanelEnabled(on)<\/code>: запомнить в <code>SettingsRepository<\/code> и послать <code>SetDisplayOption(&quot;xray&quot; | &quot;plan&quot;, on)<\/code> — ответ «рентген включён на ПК» придёт в чат. А <code>syncDisplayOptions()<\/code> шлёт оба значения <strong>молча при каждом подключении<\/strong> (их <code>requestId<\/code> кладутся в <code>silentRequests<\/code>, результат в чат не пишется): так переключатель на телефоне и экран ПК не расходятся, даже если ПК перезапускали или его настройки правили руками.<\/p>\n<h4>Живой экран: «владельцы» стрима<\/h4>\n<p>Стрим может хотеть окошко в чате (<code>HOLDER_PREVIEW<\/code>, ширина 480) и полноэкранный «Экран ПК» (<code>HOLDER_FULLSCREEN<\/code>, ширина 800). Раньше выход из полноэкранного слал <code>StopScreenStream<\/code>, и окошко застывало. Теперь:<\/p>\n<pre><code class=\"language-kotlin\">acquireStream(holder, maxWidth)  // добавить владельца, запросить стрим с max шириной среди всех\nreleaseStream(holder)            // убрать; если никого не осталось — Stop, иначе перезапуск с меньшей шириной\nrestartStreamIfSilent()          // тишина &gt; 12 с при наличии владельцев → повторный Start\n<\/code><\/pre>\n<p>Почему 12 с: агент даже на неподвижном экране шлёт «опорный» кадр раз в 3 с, так что 12 с тишины — точно обрыв (агент сам гасит стрим через 10 минут, или было переподключение).<\/p>\n<h4>Прочие действия<\/h4>\n<table>\n<thead>\n<tr>\n<th>Метод<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>connect()<\/code> / <code>disconnect()<\/code><\/td>\n<td>Подключиться к активному ПК / отключиться<\/td>\n<\/tr>\n<tr>\n<td><code>updateRelayUrl(url)<\/code><\/td>\n<td>Сменить адрес релея ПК (смена сети) → сохранится → <code>init<\/code> сам переподключится<\/td>\n<\/tr>\n<tr>\n<td><code>unpair(id)<\/code><\/td>\n<td>Отключиться и удалить ПК<\/td>\n<\/tr>\n<tr>\n<td><code>repairByQr(raw)<\/code><\/td>\n<td>Повторная привязка через <code>PairingController<\/code> (новый токен под тем же id)<\/td>\n<\/tr>\n<tr>\n<td><code>sendPhoneClipboardToPc()<\/code><\/td>\n<td>Прочитать буфер телефона → <code>SetClipboard<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>requestPcClipboard()<\/code><\/td>\n<td><code>GetClipboard<\/code> → ответ <code>ClipboardText<\/code> → в буфер телефона<\/td>\n<\/tr>\n<tr>\n<td><code>setWakeWordEnabled(on)<\/code><\/td>\n<td>Сохранить + включить/выключить сервис<\/td>\n<\/tr>\n<tr>\n<td><code>cancelTask()<\/code><\/td>\n<td><code>CancelTask<\/code> + честная заметка «остановится после текущего шага»<\/td>\n<\/tr>\n<tr>\n<td><code>listFiles/downloadFile/uploadFile<\/code><\/td>\n<td>Файловые команды<\/td>\n<\/tr>\n<tr>\n<td><code>onAppBackgrounded/Foregrounded<\/code><\/td>\n<td>Поднять/опустить keep-alive сервиса<\/td>\n<\/tr>\n<tr>\n<td><code>add/update/removeCustomAction<\/code>, <code>clearHistory<\/code><\/td>\n<td>Работа с репозиториями<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4><code>handle(msg)<\/code> — обработка входящих<\/h4>\n<pre><code class=\"language-kotlin\">when (msg) {\n  is CommandResult -&gt; {\n      // 0. служебный (silentRequests) → молча выйти\n      //    результат нашего ответа на вопрос (answerRequests) → переключить карточку и выйти\n      //    задача закончилась → её вопросы без ответа гаснут (EXPIRED)\n      // 1. статус: OK→DONE, DENIED→DENIED, ERROR/TIMEOUT→ERROR\n      // 2. данные: ClipboardText→буфер, FileList→диалог, FileTransfer→Загрузки,\n      //            AgentReport→история (+ уведомление, если свёрнуто)\n      // 3. если свёрнуто и больше нет ожидающих команд → отпустить keep-alive\n      // 4. сообщение от PC с resultText(msg)\n  }\n  is ScreenFrame -&gt; seq != null ? liveFrame = msg : (сообщение &quot;📸 скриншот&quot; + статус DONE,\n                                                     но не затирая уже пришедший ERROR/DENIED)\n  is AgentStep   -&gt; карточка &quot;🔎 описание&quot; с картинкой и прицелом (статус НЕ меняет);\n                    вторая строка описания — обоснование модели — показывается как &quot;💭 …&quot;\n  is AgentPlan   -&gt; карточка плана этой задачи уже есть → заменить содержимое НА МЕСТЕ;\n                    нет → добавить сообщение &quot;План из N шагов&quot; (его и озвучит TTS)\n  is AgentQuestion -&gt; сообщение с QuestionCard(questionId, options, expiresAt = now + timeout);\n                    приложение свёрнуто → уведомление &quot;Вопрос от агента&quot;;\n                    таймер на timeoutSeconds → карточка гаснет в тот же момент, что и ожидание агента\n  is AuthResult  -&gt; !ok → unauthorized; agentOnline==false → &quot;ПК офлайн&quot;;\n                    иначе &quot;подключено ✓&quot; + syncDisplayOptions()\n  else           -&gt; игнор (ping/pong)\n}\n<\/code><\/pre>\n<p>Почему карточка плана одна: агент присылает план целиком при каждом изменении (подзадача началась, закончилась, план перестроен). Если бы каждое сообщение добавляло пузырь, в ленте оказалось бы пять копий одного списка.<\/p>\n<p><code>resultText(msg)<\/code> — короткий текст для чата и озвучки: <code>message<\/code>, а если его нет — сворачивает данные («процессов: 100», «готово за 4 шагов»).<\/p>\n<p><code>saveToHistory<\/code> — берёт текст запроса и время из <strong>моего<\/strong> сообщения с тем же <code>requestId<\/code> (в <code>AgentReport<\/code> их нет) и пишет <code>TaskRecord<\/code>.<\/p>\n<h3>7.3 <code>JarvisClient.kt<\/code> — WebSocket с автопереподключением (185 строк)<\/h3>\n<p>Постоянное соединение с релеем на <strong>OkHttp<\/strong>.<\/p>\n<pre><code>connect(url, token, deviceId, onMessage, onStatus)\n   └─► openSocket()  ── ws:// заменяется на http:// (OkHttp так требует)\n         └─► onOpen    → отправить Auth(role=PHONE)       статус &quot;вход…&quot;\n             onMessage → разобрать JSON → AuthResult?\n                             ok   → задержка = 1 с, &quot;подключено ✓&quot;\n                             !ok  → authRejected, НЕ переподключаться, &quot;вход отклонён&quot;\n                          → передать onMessage(msg)\n             onFailure / onClosed → если wantConnected → scheduleReconnect()\n<\/code><\/pre>\n<p><strong>Экспоненциальная задержка:<\/strong> 1 → 2 → 4 → 8 → 16 → 30 → 30 с. Сбрасывается в 1 с после успешного входа. Задержка планируется через <code>Handler(Looper.getMainLooper())<\/code> — задачи на главном потоке.<\/p>\n<p>Флаги:<\/p>\n<ul>\n<li><code>wantConnected<\/code> — пользователь хочет быть на связи (между <code>connect()<\/code> и <code>disconnect()<\/code>). Без него после «Откл.» клиент переподключался бы сам.<\/li>\n<li><code>authRejected<\/code> — токен отвергнут. Переподключаться с тем же токеном бессмысленно, а <code>onClosed<\/code> не должен затереть статус «вход отклонён» безликим «отключено».<\/li>\n<\/ul>\n<p><code>send(msg)<\/code> — просто <code>ws?.send(JSON)<\/code>; OkHttp сам ставит отправки в очередь, так что звать можно из любого потока.<\/p>\n<p>Важно: колбэки OkHttp приходят <strong>не на главном потоке<\/strong>. ViewModel пишет в <code>MutableStateFlow<\/code> — это потокобезопасно, поэтому работает.<\/p>\n<h3>7.4 <code>RelayPairing.kt<\/code> — короткие одноразовые соединения (204 строки)<\/h3>\n<p><code>object<\/code> (синглтон) для случаев, когда держать постоянное соединение не нужно: открыл → получил один ответ → закрыл.<\/p>\n<table>\n<thead>\n<tr>\n<th>Функция<\/th>\n<th>Отправляет<\/th>\n<th>Ждёт<\/th>\n<th>Возвращает<\/th>\n<th>Таймаут<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>pair(relayUrl, code)<\/code><\/td>\n<td><code>PairRequest<\/code><\/td>\n<td><code>PairResult<\/code><\/td>\n<td><code>PairOutcome.Success(PairedDevice)<\/code> / <code>Rejected(reason)<\/code> / <code>Failed(msg)<\/code><\/td>\n<td>12 с<\/td>\n<\/tr>\n<tr>\n<td><code>checkStatus(device)<\/code><\/td>\n<td><code>Auth<\/code><\/td>\n<td><code>AuthResult<\/code><\/td>\n<td><code>ONLINE<\/code> / <code>OFFLINE<\/code> / <code>UNAUTHORIZED<\/code> / <code>UNKNOWN<\/code><\/td>\n<td>6 с<\/td>\n<\/tr>\n<tr>\n<td><code>sendCommand(device, command)<\/code><\/td>\n<td><code>Auth<\/code>, потом <code>CommandRequest<\/code><\/td>\n<td>свой <code>CommandResult<\/code><\/td>\n<td><code>CommandOutcome.Success/Rejected/Failed<\/code><\/td>\n<td>15 с<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Приём превращения колбэков в <code>suspend<\/code>-функцию:<\/p>\n<pre><code class=\"language-kotlin\">private suspend fun oneShot(relayUrl, onOpen): JarvisMessage? =\n    suspendCancellableCoroutine { cont -&gt;\n        val listener = object : WebSocketListener() {\n            override fun onOpen(ws, r) = onOpen(ws, requestId)\n            override fun onMessage(ws, text) { if (cont.isActive) cont.resume(parse(text)); ws.close(1000, &quot;done&quot;) }\n            override fun onFailure(ws, t, r) { if (cont.isActive) cont.resume(null) }\n        }\n        val ws = http.newWebSocket(request, listener)\n        cont.invokeOnCancellation { ws.cancel() }   // таймаут/отмена → закрыть сокет\n    }\n<\/code><\/pre>\n<p><code>suspendCancellableCoroutine<\/code> «замораживает» корутину, пока кто-то не вызовет <code>cont.resume(...)<\/code>. <code>withTimeoutOrNull<\/code> сверху отменяет её по таймауту. <code>if (cont.isActive)<\/code> защищает от двойного <code>resume<\/code> (это исключение).<\/p>\n<p><code>agentOnline == null<\/code> (старый релей) трактуется как <code>ONLINE<\/code> — лучше не пугать пользователя «офлайн» без оснований.<\/p>\n<h3>7.5 Привязка ПК<\/h3>\n<h4><code>PairingQr.kt<\/code> — разбор QR<\/h4>\n<p>Формат: <code>jarvis-pair://pair?code=482931&amp;relay=ws%3A%2F%2F…&amp;name=…&amp;mac=…<\/code><\/p>\n<ul>\n<li>Строка из одних цифр → это просто код (relay берём из настроек).<\/li>\n<li>Иначе парсим как <code>Uri<\/code>, схема должна быть <code>jarvis-pair<\/code>, <code>code<\/code> обязателен; <code>relay<\/code>, <code>name<\/code>, <code>mac<\/code> — необязательны.<\/li>\n<li>Всё остальное → <code>null<\/code> (привязку не начинаем).<\/li>\n<\/ul>\n<h4><code>QrScan.kt<\/code> — <code>rememberQrScanLauncher(onScanned, onDenied)<\/code><\/h4>\n<p>Общая функция для трёх мест (первый запуск, «Устройства», повторная привязка в чате). Проверяет разрешение камеры → при необходимости спрашивает → открывает экран zxing (<code>ScanContract<\/code>) только для QR, без звука. Возвращает функцию, которую вешают на <code>onClick<\/code>. <code>contents == null<\/code> — пользователь закрыл сканер, не ошибка.<\/p>\n<h4><code>PairingController.kt<\/code> — общая логика привязки<\/h4>\n<pre><code class=\"language-kotlin\">sealed interface PairingUiState { Idle, InProgress, Error(message), Done }\n<\/code><\/pre>\n<ul>\n<li><code>pairByCode(code, relayUrl)<\/code> / <code>pairByQr(raw, fallbackRelayUrl)<\/code> (адрес из QR важнее).<\/li>\n<li>Внутри <code>pair(...)<\/code>: проверки на пустоту → <code>InProgress<\/code> → <code>RelayPairing.pair<\/code> → при успехе <code>devicesRepo.addAndActivate(device.copy(mac = mac))<\/code> → <code>Done<\/code>.<\/li>\n<\/ul>\n<p>Это не ViewModel, а помощник, живущий в <code>scope<\/code> своего владельца. Используется в <code>PairingViewModel<\/code>, <code>DevicesViewModel<\/code>, <code>ChatViewModel<\/code> — чтобы логика не дублировалась.<\/p>\n<h4><code>PairingScreen.kt<\/code> + <code>PairingViewModel.kt<\/code> — первый запуск<\/h4>\n<p>Большая кнопка «📷 Сканировать QR»; под ссылкой «Ввести код вручную» — поля адреса релея и кода. После <code>Done<\/code> адрес сохраняется как «последний использованный» (подсказка для следующей привязки). Переход в чат происходит сам (см. 7.1).<\/p>\n<h3>7.6 Хранилища<\/h3>\n<h4><code>DeviceRepository.kt<\/code> — список ПК<\/h4>\n<pre><code class=\"language-kotlin\">@Serializable\ndata class PairedDevice(\n    val id: String,        // deviceId агента — им телефон представляется в Auth\n    val name: String,      // &quot;Рабочий ПК&quot;\n    val token: String,     // постоянный токен ТЕЛЕФОНА для этого ПК\n    val relayUrl: String,  // у каждого ПК свой релей (разные сети)\n    val mac: String? = null, // для Wake-on-LAN; null у старых привязок\n)\n<\/code><\/pre>\n<p>Хранение: <strong>Preferences DataStore<\/strong> (файл <code>devices<\/code>). DataStore хранит только примитивы, поэтому список пишется <strong>одной JSON-строкой<\/strong> (<code>devices_json<\/code>) + отдельный ключ <code>active_device_id<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Метод<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>devices: Flow&lt;List&lt;PairedDevice&gt;&gt;<\/code><\/td>\n<td>Поток списка (битый JSON → пустой список, без краша)<\/td>\n<\/tr>\n<tr>\n<td><code>activeDeviceId: Flow&lt;String?&gt;<\/code><\/td>\n<td>Поток id активного<\/td>\n<\/tr>\n<tr>\n<td><code>addAndActivate(device)<\/code><\/td>\n<td>Заменить запись с тем же id (или добавить) и сделать активной<\/td>\n<\/tr>\n<tr>\n<td><code>remove(id)<\/code><\/td>\n<td>Удалить; если была активной — сбросить выбор<\/td>\n<\/tr>\n<tr>\n<td><code>setActive(id)<\/code><\/td>\n<td>Выбрать активный<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Почему <code>Auth.deviceId<\/code> у телефона = id <strong>агента<\/strong>: релей по этому id находит привязки телефонов к этому ПК (<code>phone_bindings<\/code>) и сверяет токен (подробно — файл 3).<\/p>\n<h4><code>SettingsRepository.kt<\/code> — настройки<\/h4>\n<p>Отдельный DataStore <code>settings<\/code>: <code>relay_url<\/code> (последний адрес, по умолчанию <code>ws://10.0.2.2:8080/ws<\/code> — «localhost компьютера» с точки зрения эмулятора), <code>wake_word_enabled<\/code>, а также <code>pc_xray_enabled<\/code> и <code>pc_plan_panel_enabled<\/code> — показывать ли на экране ПК «рентген» и панель «План и мысли» (оба по умолчанию <code>true<\/code>).<\/p>\n<p>Эти два ключа — настройки <strong>компьютера<\/strong>, но хранятся на телефоне: телефон и есть пульт, и при каждом подключении он сообщает ПК свои значения (<code>syncDisplayOptions<\/code>, см. 7.2).<\/p>\n<h3>7.7 Экран «Устройства» + Wake-on-LAN<\/h3>\n<h4><code>DevicesViewModel.kt<\/code><\/h4>\n<p><code>DeviceUi(device, isActive, status, checking)<\/code>. При каждом изменении списка:<\/p>\n<ol>\n<li>сохраняет уже известные статусы (иначе список мигал бы «неизвестно»);<\/li>\n<li>вызывает <code>refreshStatuses()<\/code> — <strong>параллельно<\/strong> для всех ПК (<code>async { checkStatus } … awaitAll()<\/code>).<\/li>\n<\/ol>\n<p><code>pairByCode/pairByQr<\/code> берут адрес релея из <code>SettingsRepository<\/code>.<\/p>\n<h4><code>DevicesScreen.kt<\/code><\/h4>\n<p>Список карточек: радиокнопка «активный», имя, цветная точка + статус («в сети», «офлайн», «отвязано на релее», «неизвестно», «проверка…»), кнопка ⏻ «Разбудить» (если известен MAC), 🗑 «Отвязать». Шапка — ⟳ обновить статусы. FAB «+» → диалог «Привязать ПК» (код или QR).<\/p>\n<h4><code>WakeOnLan.kt<\/code><\/h4>\n<p>«Волшебный пакет»: 6 байт <code>0xFF<\/code> + MAC, повторённый 16 раз (итого 102 байта), UDP-broadcast на <code>255.255.255.255:9<\/code>. Вызывается на <code>Dispatchers.IO<\/code>.<\/p>\n<p>Ограничения (честно пишутся в снэкбаре): работает в <strong>одной локальной сети<\/strong>, лучше с ПК на кабеле, и в Windows должна стоять галочка «Wake on Magic Packet» у сетевой карты. MAC приходит из QR-кода — у привязанных вручную ПК его нет, кнопка скрыта.<\/p>\n<h3>7.8 Живой экран ПК<\/h3>\n<h4><code>ScreenViewScreen.kt<\/code> — полноэкранный «Экран ПК»<\/h4>\n<p>Своей ViewModel нет — использует <code>ChatViewModel<\/code> (там уже есть соединение и <code>liveFrame<\/code>).<\/p>\n<ul>\n<li><code>DisposableEffect<\/code>: при входе <code>acquireStream(FULLSCREEN, 800)<\/code>, при выходе <code>releaseStream(FULLSCREEN)<\/code>.<\/li>\n<li><strong>Тап → клик на ПК.<\/strong> Главная формула:<\/li>\n<\/ul>\n<pre><code>realX = tapX × screenWidth / displayedWidth\nrealY = tapY × screenHeight / displayedHeight\n<\/code><\/pre>\n<p><code>screenWidth<\/code> — <strong>реальное<\/strong> разрешение ПК из <code>ScreenFrame.screenWidth<\/code> (fallback — ширина кадра для старого агента). <code>displayedWidth<\/code> — сколько пикселей картинка заняла на телефоне. <code>Modifier.aspectRatio(frame.width / frame.height)<\/code> гарантирует, что картинка без чёрных полос → масштаб одинаков по всей площади.<\/p>\n<ul>\n<li><strong>Зум без поломки координат.<\/strong> Щипок ловит внешний <code>Box<\/code> (он не масштабируется — координаты жеста стабильны), а тап ловит сама картинка <strong>после<\/strong> <code>graphicsLayer<\/code>. Compose переводит касание через обратную матрицу слоя → offset приходит в неувеличенных координатах → формула выше работает при любом зуме. Зум 1–4×, сдвиг ограничен так, чтобы край картинки не уезжал.<\/li>\n<li><strong>Нет двойного тапа для сброса зума<\/strong> — <code>detectTapGestures(onDoubleTap)<\/code> задерживал бы <strong>каждый<\/strong> тап на ~300 мс (ждёт второй), и двойной клик на ПК стал бы невозможен. Вместо этого кнопка «1×».<\/li>\n<li>Боковая панель: ⬆/⬇ → <code>Scroll(dy = ∓3)<\/code>, ⌨ → поле ввода, текст уходит <code>TypeText<\/code> (на ПК вставляется через Ctrl+V туда, где фокус).<\/li>\n<\/ul>\n<h4><code>TaskPreviewWindow.kt<\/code> — окошко в углу чата<\/h4>\n<p>Маленькое окно (по умолчанию 150dp, тянется за уголок от 110 до 320dp, размер переживает поворот — <code>rememberSaveable<\/code>). Подпись «● живой экран», кнопки «во весь экран» и «✕» (крестик <strong>выключает стрим<\/strong>, а не просто прячет — иначе ПК слал бы кадры впустую). Поверх — оранжевая точка цели ИИ из последнего <code>AgentStep<\/code>. Не появляется, пока не пришёл первый кадр.<\/p>\n<h4><code>FrameDecoding.kt<\/code> — <code>rememberDecodedFrame(base64)<\/code><\/h4>\n<p>Декодирование base64 → JPEG → <code>ImageBitmap<\/code> на <code>Dispatchers.Default<\/code>, <strong>не в главном потоке<\/strong>. Раньше это делалось в композиции (главный поток) 5 раз в секунду — отсюда рывки, узким местом был телефон, а не ПК. Пока новый кадр декодируется, показывается <strong>предыдущий<\/strong> (иначе картинка мигала бы пустотой). Битый кадр → остаётся старый.<\/p>\n<h3>7.9 Голос<\/h3>\n<h4><code>VoiceController.kt<\/code><\/h4>\n<p>Не ViewModel и не трогает сеть. Живёт, пока показан экран (<code>remember<\/code> + <code>onDispose { shutdown() }<\/code>).<\/p>\n<ul>\n<li><strong>Распознавание:<\/strong> системный <code>SpeechRecognizer<\/code> (обычно Google, <strong>нужен интернет<\/strong>), язык <code>ru-RU<\/code>, свободная речь. Создаётся лениво при первом нажатии. <code>onRmsChanged(rmsdB)<\/code> → уровень 0…1 для анимированного шара. Коды ошибок переводятся в понятный текст («не расслышал, повтори»).<\/li>\n<li><strong>Озвучка:<\/strong> <code>TextToSpeech<\/code>, русская локаль, <code>QUEUE_FLUSH<\/code> (новая фраза прерывает старую), обрезка до 200 символов.<\/li>\n<li><strong>«Договорил — вызови»:<\/strong> <code>speak(text, onDone)<\/code>. Каждой фразе даётся свой id, колбэк кладётся в <code>afterSpeech[id]<\/code>, а <code>UtteranceProgressListener.onDone<\/code> достаёт его и выполняет <strong>через <code>mainHandler.post<\/code><\/strong> — колбэки TTS приходят не на главном потоке, а микрофон (<code>SpeechRecognizer<\/code>) можно трогать только с главного. На этом построен голосовой диалог: вопрос агента озвучен → включился микрофон. Если озвучка выключена, <code>onDone<\/code> не вызывается вовсе: молча включать микрофон человеку, который выбрал тишину, было бы странно.<\/li>\n<li>Наружу — Compose <code>State<\/code>: <code>isListening<\/code>, <code>ttsEnabled<\/code>, <code>voiceLevel<\/code>.<\/li>\n<\/ul>\n<h4><code>ListeningOrb.kt<\/code><\/h4>\n<p><code>ListeningIndicator<\/code> — большой анимированный шар поверх чата во время записи, реагирует на громкость голоса. Тап по шару останавливает запись.<\/p>\n<h3>7.10 Wake-word «Фауст» (фоновый слух)<\/h3>\n<p>Как это устроено вместе:<\/p>\n<pre><code> ┌─────────────── JarvisConnectionService (foreground) ──────────────┐\n │  VoskWakeWord ── микрофон 16 кГц ── офлайн STT ── &quot;фауст открой ютуб&quot;│\n │        │ onPhrase(&quot;открой ютуб&quot;)                                      │\n └────────┼──────────────────────────────────────────────────────────────┘\n          ▼\n     WakeWordBus.phrases (SharedFlow)  ──────►  ChatViewModel.send(&quot;открой ютуб&quot;)\n     WakeWordBus.state   (StateFlow)   ──────►  индикатор в шапке + текст уведомления\n     WakeWordBus.suspended ◄── ChatScreen (кнопка 🎤 занимает микрофон)\n<\/code><\/pre>\n<h4><code>VoskWakeWord.kt<\/code><\/h4>\n<p>Идея: <strong>отдельного детектора слова нет<\/strong>. Vosk непрерывно переводит речь в текст, а мы ищем в тексте «фауст». Поэтому не нужно передавать микрофон между двумя движками.<\/p>\n<ul>\n<li>Первый запуск: модель копируется из <code>assets/model-ru<\/code> во внутреннюю память (<code>StorageService.unpack<\/code>) — нативный код Vosk не умеет читать из APK. Маркер версии — файл <code>uuid<\/code> в модели.<\/li>\n<li>Два сценария:\n<ol>\n<li>«фауст открой ютуб» одной фразой → всё после слова = команда;<\/li>\n<li>«фауст» … пауза … «открой ютуб» → окно ожидания 8 с, следующая фраза = команда.<\/li>\n<\/ol>\n<\/li>\n<li><code>normalize<\/code>: нижний регистр, ё→е, убрать пунктуацию.<\/li>\n<li><code>TRIGGERS<\/code>: «фаустт», «фаусд», «фаузт», «фаост», «фауст», «фа уст», «фаус», «фауз», «faust» — маленькая модель слышит по-разному. <strong>Порядок важен<\/strong>: короткий вариант должен идти после длинного, иначе «фаус» сработает внутри «фауст» и командой станет «т открой ютуб».<\/li>\n<li><strong>Граница приватности:<\/strong> всё, что сказано не после «Фауст», никуда не уходит — распознаётся и выбрасывается на телефоне.<\/li>\n<\/ul>\n<h4><code>WakeWordBus.kt<\/code><\/h4>\n<p>Синглтон-«шина» между сервисом и ViewModel (они в одном процессе, полноценный bound-сервис был бы +50 строк ради того же). <code>WakeState<\/code>: <code>OFF<\/code>, <code>LOADING<\/code>, <code>WAITING<\/code>, <code>RECORDING<\/code>, <code>ERROR<\/code>. Фразы — <code>SharedFlow<\/code> (события, <code>extraBufferCapacity = 8<\/code>, чтобы <code>tryEmit<\/code> не терял).<\/p>\n<h4><code>JarvisConnectionService.kt<\/code><\/h4>\n<p>Foreground-сервис с <strong>двумя независимыми причинами жить<\/strong>:<\/p>\n<ol>\n<li><strong>keep-alive задачи<\/strong> — приложение свёрнуто, а ИИ-задача ещё идёт. Сервис <strong>не владеет<\/strong> соединением (оно в <code>ChatViewModel<\/code>), он только не даёт Android убить процесс.<\/li>\n<li><strong>wake-word<\/strong> — крутит Vosk.<\/li>\n<\/ol>\n<p>Сервис живёт, пока истинна хоть одна причина. Команды приходят интентами <code>ACTION_TASK<\/code> / <code>ACTION_WAKE<\/code> с флагом <code>on<\/code>. Поэтому возврат в приложение шлёт <code>taskKeepAlive(false)<\/code>, а <strong>не<\/strong> «стоп сервис» — иначе выключился бы и wake-word.<\/p>\n<p>Тонкости Android:<\/p>\n<ul>\n<li><code>startForeground<\/code> вызывается <strong>всегда и сразу<\/strong> — иначе через ~5 с система убьёт процесс (<code>ForegroundServiceDidNotStartInTimeException<\/code>).<\/li>\n<li>Тип <code>microphone<\/code> объявляется <strong>только<\/strong> если wake-word включён и разрешение выдано — на Android 14+ иначе <code>SecurityException<\/code>.<\/li>\n<li>Android 12+ запрещает стартовать foreground-сервис из фона. Вызов из <code>ON_STOP<\/code> иногда не попадает в разрешённое окно → обёрнут в <code>runCatching<\/code> (не падаем; соединение всё равно живёт в ViewModel).<\/li>\n<li><code>WakeWordBus.suspended<\/code> → <code>engine.stop()/start()<\/code> — отпустить микрофон на время кнопки 🎤.<\/li>\n<\/ul>\n<h4><code>Notifications.kt<\/code><\/h4>\n<p>Три канала: <code>jarvis_ongoing<\/code> («Соединение с ПК», <code>IMPORTANCE_MIN<\/code>, тихое постоянное), <code>jarvis_task_done<\/code> («Задача выполнена», обычное) и <code>jarvis_agent_question<\/code> («Вопрос от агента», <code>IMPORTANCE_HIGH<\/code> — всплывает поверх экрана). Разделены, чтобы можно было заглушить один, не потеряв другие. <code>updateOngoingNotification<\/code> меняет текст («Слушаю «Фауст»…», «Готовлю модель…») без перезапуска сервиса. <code>notifyAgentTaskFinished<\/code> и <code>notifyAgentQuestion<\/code> — тап открывает приложение.<\/p>\n<p>Почему вопросу нужен свой громкий канал: агент ждёт ответа ограниченное время (по умолчанию 2 минуты). Если приложение свёрнуто и человек о вопросе не узнает, агент простоит до таймаута и решит «ответа нет» — а для необратимого шага это означает отказ.<\/p>\n<h3>7.11 Файлы: <code>FileTransfer.kt<\/code><\/h3>\n<ul>\n<li><code>MAX_TRANSFER_BYTES = 5 МБ<\/code> — тот же лимит, что у агента. Проверяем на телефоне заранее, чтобы не гнать base64 впустую.<\/li>\n<li><code>readPickedFile(context, uri)<\/code> — файл из системного пикера (<code>content://<\/code>): имя через <code>OpenableColumns.DISPLAY_NAME<\/code>, байты → base64 <code>NO_WRAP<\/code>.<\/li>\n<li><code>saveToPhoneDownloads<\/code> — через <code>MediaStore.Downloads<\/code> (без разрешения на запись). <strong>Работает только на Android 10+<\/strong> (API 29). На 7–9 вернёт <code>false<\/code> → «не удалось сохранить» (явная проверка версии, без неё было бы падение).<\/li>\n<\/ul>\n<p>Путь файла: телефон → <code>SendFileToPc(folder, name, base64)<\/code> → релей → агент (подтверждение на ПК) → запись в папку. Обратно: <code>SendFileToPhone<\/code> → агент читает → <code>FileTransfer<\/code> в <code>CommandResult.data<\/code> → телефон сохраняет.<\/p>\n<p>Base64 раздувает данные на ~33%: 5 МБ → ~6.7 МБ, что укладывается в лимит 8 МБ на сообщение у релея.<\/p>\n<h3>7.12 История задач: <code>TaskHistory.kt<\/code>, <code>HistoryScreen.kt<\/code><\/h3>\n<p><code>TaskRecord(id, startedAtMs, request, completed, stepsTaken, summary, trace)<\/code>. Хранится в <code>filesDir/task_history.json<\/code> (не DataStore — трейсы большие), последние <strong>50<\/strong> записей, новые сверху. Протокол не менялся — всё уже приходило в <code>AgentReport<\/code>, просто раньше выбрасывалось.<\/p>\n<p>Экран: карточки сворачиваются/разворачиваются по тапу (свёрнутая — итог, развёрнутая — весь трейс), «очистить» с подтверждением. Сети не касается.<\/p>\n<h3>7.13 Свои команды: <code>CustomActions.kt<\/code>, <code>CustomActionsScreen.kt<\/code><\/h3>\n<p><code>CustomCommandType<\/code>: <code>LOCK<\/code>, <code>VOLUME<\/code> (0–100), <code>OPEN_APP<\/code>, <code>OPEN_URL<\/code>, <code>KILL_PROCESS<\/code> и с 1 октября — <code>RECIPE<\/code> («Навык: рецепт по шагам»). Набор <strong>сознательно ограничен<\/strong> — это уже разрешённые команды, протокол и белый список трогать не нужно. <code>toCommand()<\/code> собирает настоящую команду (громкость ограничивается 0–100, по умолчанию 50). Хранение — <code>custom_actions.json<\/code>, максимум 12 чипов. Чипы появляются в ряду быстрых действий чата.<\/p>\n<h4>Навык-рецепт: научить агента словами<\/h4>\n<p>Человек перечисляет шаги составной задачи обычным языком, каждый с новой строки:<\/p>\n<pre><code>запусти скрипт сервер диплома\nоткрой Telegram\nнапиши в Избранное «сервер поднят»\n<\/code><\/pre>\n<p>и, по желанию, <strong>фразы запуска<\/strong> через запятую («доброе утро, начинаем работу»). В записи <code>CustomActionRecord<\/code> шаги лежат в поле <code>param<\/code>, фразы — в новом поле <code>triggers<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Функция<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>recipeSteps()<\/code><\/td>\n<td>Строки без пустых и без нумерации, которую человек мог поставить сам («1.», «2)»)<\/td>\n<\/tr>\n<tr>\n<td><code>recipeGoal()<\/code><\/td>\n<td>Собирает просьбу агенту: «Навык «утро» — выполни строго по шагам, по порядку:» и <strong>нумерованный список<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>toCommand()<\/code><\/td>\n<td><code>AgentTask(recipeGoal(), SCREEN, maxSteps = 20)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>matchRecipe(phrase)<\/code><\/td>\n<td>Какой рецепт просят фразой: «навык утро», «выполни навык утро», «запусти навык утро» или одна из фраз запуска<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Три решения, которые стоит уметь объяснить:<\/p>\n<ol>\n<li><strong>Новой команды протокола нет.<\/strong> Рецепт — обычная <code>agent_task<\/code>. Признак рецепта для планировщика на ПК — именно нумерованный список в тексте цели (правило «РЕЦЕПТ» в его промпте, файл 4): «не пропускай шаги и не добавляй своих».<\/li>\n<li><strong>Совпадение фразы — только точное<\/strong> (после нормализации: регистр, ё→е, знаки препинания, обращение «Фауст»). Навык делает действия на ПК, «похоже на» тут не годится.<\/li>\n<li><strong>Разбирает телефон, а не релей.<\/strong> Шаги рецепта хранятся только на телефоне, поэтому <code>ChatViewModel.send<\/code> проверяет <code>matchRecipe<\/code> раньше, чем отправить фразу на разбор.<\/li>\n<\/ol>\n<p>На экране «Свои команды» у рецепта многострочное поле шагов и поле «Фразы запуска через запятую»; в карточке показывается число шагов и фразы.<\/p>\n<p>Не путать с двумя другими видами навыков, которые живут <strong>на ПК<\/strong> (файл 4): доверенные скрипты и навыки, выученные показом. Фразы «навык …» и «запусти скрипт …», не совпавшие с рецептом на телефоне, уходят на релей, и он без модели отдаёт их агенту.<\/p>\n<h3>7.14 Мульти-ПК: <code>MultiPcViewModel.kt<\/code>, <code>MultiPcScreen.kt<\/code><\/h3>\n<p>Отметить несколько ПК и отправить одну быструю команду всем (блокировка, громкость, открыть URL). Для каждого ПК — <strong>своё короткое соединение<\/strong> <code>RelayPairing.sendCommand<\/code> параллельно (<code>async/awaitAll<\/code>). Зависший или офлайн ПК не блокирует остальные; у каждой строки свой статус <code>IDLE → SENDING → OK/ERROR<\/code> и текст.<\/p>\n<h3>7.15 <code>Theme.kt<\/code><\/h3>\n<p>Тёплая тёмная тема по макету (<code>docs/Jarvis Mobile App.pdf<\/code>): мальва/пыльная роза — действия пользователя, персиковый крем — ответы ассистента, почти чёрный тёплый фон. Все <code>surfaceContainer*<\/code> заданы явно — иначе Material3 рисовал бы холодные серые плашки. <code>onlineColor()<\/code> — зелёный для статуса. Та же палитра повторена в окнах агента (<code>JarvisSwingTheme<\/code>).<\/p>\n<h2>8. Сквозные сценарии<\/h2>\n<h3>A. Первый запуск и привязка<\/h3>\n<ol>\n<li><code>MainActivity<\/code>: DataStore прочитан, список пуст → <code>PairingScreen<\/code>.<\/li>\n<li>«Сканировать QR» → <code>rememberQrScanLauncher<\/code> → разрешение камеры → zxing.<\/li>\n<li>Сырой текст QR → <code>PairingViewModel.pairByQr<\/code> → <code>PairingController<\/code> → <code>PairingQr.parse<\/code> → <code>RelayPairing.pair(relay, code)<\/code>.<\/li>\n<li>Сокет: <code>pair_request<\/code> → <code>pair_result{ok, deviceId, deviceToken, deviceName}<\/code> → закрыть.<\/li>\n<li><code>DeviceRepository.addAndActivate(PairedDevice(..., mac))<\/code> → DataStore изменился.<\/li>\n<li><code>MainActivity<\/code> видит непустой список → показывает <code>ChatScreen<\/code> → <code>ChatViewModel.init<\/code> → <code>connect()<\/code> → <code>JarvisClient<\/code> шлёт <code>auth<\/code> → «подключено ✓».<\/li>\n<\/ol>\n<h3>B. Голосовая команда через «Фауст»<\/h3>\n<ol>\n<li>Сервис: Vosk слышит «фауст сделай потише» → <code>WakeWordBus.emitPhrase(&quot;сделай потише&quot;)<\/code>.<\/li>\n<li><code>ChatViewModel<\/code> (подписан на <code>phrases<\/code>) → <code>send(&quot;сделай потише&quot;)<\/code> → сообщение <code>ME/SENT<\/code> → <code>CommandRequest(NaturalLanguage)<\/code>.<\/li>\n<li>Через 0.6 с — <code>RUNNING<\/code> («выполняется… 1 с»).<\/li>\n<li>Приходит <code>CommandResult(OK, &quot;громкость выставлена на 30%&quot;)<\/code> → <code>DONE<\/code> + сообщение <code>PC<\/code> → <code>LaunchedEffect<\/code> озвучивает.<\/li>\n<\/ol>\n<h3>C. ИИ-задача со свёрнутым приложением<\/h3>\n<ol>\n<li><code>send(&quot;найди на ютубе котов и открой первое&quot;)<\/code>.<\/li>\n<li>Сворачиваешь → <code>ON_STOP<\/code> → <code>onAppBackgrounded<\/code> → есть ожидающая команда → <code>taskKeepAlive(true)<\/code> → сервис с уведомлением «Держим связь с ПК…».<\/li>\n<li>Приходят <code>AgentStep<\/code> → карточки в чате (их увидишь, вернувшись).<\/li>\n<li>Приходит <code>ScreenFrame<\/code> (финальный кадр) и <code>CommandResult<\/code> с <code>AgentReport<\/code> → история + <code>notifyAgentTaskFinished<\/code> → уведомление → keep-alive отпущен.<\/li>\n<\/ol>\n<h3>D. Тап по живому экрану<\/h3>\n<ol>\n<li>Меню → «Экран ПК» → <code>acquireStream(FULLSCREEN, 800)<\/code> → <code>StartScreenStream(3, 800)<\/code>.<\/li>\n<li>Агент шлёт <code>ScreenFrame(seq=0,1,2…)<\/code> → <code>liveFrame<\/code> → <code>LiveFrameImage<\/code> декодирует в фоне.<\/li>\n<li>Тап в точку (200, 150) на картинке шириной 400 px, ПК 1920×1080 → <code>Click(960, 540)<\/code>.<\/li>\n<li>Назад → <code>releaseStream<\/code> → если окошко в чате выключено → <code>StopScreenStream<\/code>.<\/li>\n<\/ol>\n<h3>E. ПК отвязан на релее<\/h3>\n<ol>\n<li><code>auth<\/code> → <code>auth_result{ok:false}<\/code> → <code>JarvisClient<\/code> ставит <code>authRejected<\/code>, не переподключается.<\/li>\n<li><code>ChatViewModel.handle<\/code> → <code>unauthorized = true<\/code>, статус «ПК «X» отвязан».<\/li>\n<li>Плашка красная, кнопка «Привязать заново» → сканер → <code>repairByQr<\/code> → новый токен под тем же id → <code>init<\/code> видит изменение <code>PairedDevice<\/code> → <code>connect()<\/code>.<\/li>\n<\/ol>\n<h3>F. Многоэтапная задача с вопросом<\/h3>\n<ol>\n<li><code>send(&quot;скачай архив по ссылке … и отправь его в Telegram&quot;)<\/code> → реплика <code>ME<\/code>, <code>requestId = r1<\/code>.<\/li>\n<li>Приходит <code>AgentPlan(r1, [Скачать архив ●, Открыть Telegram ○, Отправить файл ○])<\/code> → карточка «План из 3 шагов», TTS её озвучивает.<\/li>\n<li>Приходит <code>AgentQuestion(r1, questionId = q7, &quot;Отправить Hello-World.zip в Избранное?&quot;, [&quot;Да&quot;,&quot;Нет&quot;], 120)<\/code> → карточка с кнопками и отсчётом; TTS: «…Скажите „да“ или „нет“» → микрофон включается сам.<\/li>\n<li>Человек говорит «да» → <code>onSpeechText<\/code> → <code>submit<\/code> → <code>vm.send(&quot;да&quot;)<\/code> → есть <code>openQuestion<\/code> → <code>answerQuestion<\/code> → карточка <code>SENDING<\/code>, реплика «да», команда <code>AnswerQuestion(q7, &quot;да&quot;)<\/code> с новым <code>requestId = r2<\/code>.<\/li>\n<li><code>CommandResult(r2, OK, &quot;ответ передан агенту&quot;)<\/code> → <code>answerRequests<\/code> знает, что <code>r2<\/code> — это ответ → карточка <code>ANSWERED<\/code>, пузыря нет.<\/li>\n<li>Идут <code>AgentStep(r1, …)<\/code> — карточки шагов со сквозной нумерацией; <code>AgentPlan(r1, …)<\/code> обновляет ту же карточку плана: ✓ ✓ ●.<\/li>\n<li><code>ScreenFrame<\/code> + <code>CommandResult(r1, OK, &quot;цель достигнута за 8 шаг(ов), 43 с, подзадач: 3, вопросов: 1\\nскачан файл …&quot;, AgentReport)<\/code> → статус <code>DONE<\/code>, запись в историю.<\/li>\n<\/ol>\n<h3>G. Навык-рецепт по фразе<\/h3>\n<ol>\n<li>В «Своих командах» создан рецепт «утро» с фразой запуска «доброе утро».<\/li>\n<li>Vosk слышит «фауст доброе утро» → <code>WakeWordBus<\/code> → <code>send(&quot;доброе утро&quot;)<\/code>.<\/li>\n<li>Вопроса нет; <code>matchRecipe(&quot;доброе утро&quot;)<\/code> находит рецепт → <code>sendTracked(&quot;доброе утро&quot;, AgentTask(&quot;Навык «утро» — выполни строго по шагам…\\n1. …\\n2. …&quot;, SCREEN, 20))<\/code>.<\/li>\n<li>Релей фразу <strong>не разбирает<\/strong> — команда уже конкретная; он проверяет белый список и запрет опасных целей и пересылает агенту. Дальше — как в сценарии F: план (ровно из шагов рецепта), подтверждение перед скриптом, шаги, итог.<\/li>\n<\/ol>\n<h2>9. Потоки и корутины<\/h2>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Где выполняется<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Composable, <code>LaunchedEffect<\/code><\/td>\n<td>Главный поток (UI)<\/td>\n<\/tr>\n<tr>\n<td>Колбэки OkHttp (<code>onMessage<\/code> и т.п.)<\/td>\n<td>Потоки OkHttp → пишут в <code>MutableStateFlow<\/code> (потокобезопасно)<\/td>\n<\/tr>\n<tr>\n<td>Таймер переподключения<\/td>\n<td><code>Handler(Looper.getMainLooper())<\/code> — главный поток<\/td>\n<\/tr>\n<tr>\n<td>DataStore<\/td>\n<td>Сам уходит в фон; вызывается из <code>viewModelScope.launch<\/code><\/td>\n<\/tr>\n<tr>\n<td>JSON-файлы истории/кнопок<\/td>\n<td><code>withContext(Dispatchers.IO)<\/code><\/td>\n<\/tr>\n<tr>\n<td>Декодирование кадров<\/td>\n<td><code>Dispatchers.Default<\/code><\/td>\n<\/tr>\n<tr>\n<td>Wake-on-LAN<\/td>\n<td><code>Dispatchers.IO<\/code><\/td>\n<\/tr>\n<tr>\n<td>Vosk<\/td>\n<td>Свой поток записи; колбэки — на главном<\/td>\n<\/tr>\n<tr>\n<td>Сервис<\/td>\n<td><code>CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>@Synchronized<\/code> на <code>acquireStream/releaseStream/restartStreamIfSilent<\/code> — их зовут из разных мест (экран, таймер), и множество владельцев не должно испортиться.<\/p>\n<h2>10. Где приложение хранит данные<\/h2>\n<table>\n<thead>\n<tr>\n<th>Данные<\/th>\n<th>Хранилище<\/th>\n<th>Файл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Привязанные ПК (+ токены!) и активный<\/td>\n<td>Preferences DataStore<\/td>\n<td><code>devices.preferences_pb<\/code><\/td>\n<\/tr>\n<tr>\n<td>Последний адрес релея, wake-word вкл/выкл, «рентген» и панель плана на ПК<\/td>\n<td>Preferences DataStore<\/td>\n<td><code>settings.preferences_pb<\/code><\/td>\n<\/tr>\n<tr>\n<td>История ИИ-задач (50)<\/td>\n<td>JSON<\/td>\n<td><code>files/task_history.json<\/code><\/td>\n<\/tr>\n<tr>\n<td>Свои кнопки и навыки-рецепты (12 всего)<\/td>\n<td>JSON<\/td>\n<td><code>files/custom_actions.json<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Вопросы и планы <strong>нигде не хранятся<\/strong> — они живут в списке сообщений чата в памяти и пропадают вместе с ним при закрытии приложения. В историю попадает только итог задачи (<code>AgentReport<\/code>).\n| Модель Vosk | Распаковывается из assets | внутренняя папка <code>model<\/code> |\n| Скачанные с ПК файлы | MediaStore | Публичные «Загрузки» |<\/p>\n<p>Токены хранятся в DataStore <strong>открытым текстом<\/strong> во внутренней памяти приложения (другие приложения туда не имеют доступа без root). Улучшение — <code>EncryptedSharedPreferences<\/code>/Android Keystore.<\/p>\n<p>«Очистить данные» приложения = забыть все ПК → снова экран привязки.<\/p>\n<h2>11. Отладка и типичные проблемы<\/h2>\n<table>\n<thead>\n<tr>\n<th>Симптом<\/th>\n<th>Вероятная причина<\/th>\n<th>Что делать<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>«нет связи: failed to connect»<\/td>\n<td>Неверный IP; адрес Radmin/WSL вместо Wi-Fi; брандмауэр; изоляция клиентов в вузовском Wi-Fi<\/td>\n<td><code>ipconfig<\/code> на ПК → адрес физического адаптера; правило для порта 8080; Tailscale<\/td>\n<\/tr>\n<tr>\n<td>«ПК офлайн»<\/td>\n<td>Агент не запущен / не подключён к релею<\/td>\n<td>Трей агента: цвет значка; <code>agent.log<\/code><\/td>\n<\/tr>\n<tr>\n<td>«ПК отвязан»<\/td>\n<td>Токен удалён/не совпадает на релее (пересоздали базу)<\/td>\n<td>«Привязать заново» по QR<\/td>\n<\/tr>\n<tr>\n<td>Тапы по экрану ПК мимо<\/td>\n<td>Старый агент без <code>screenWidth<\/code> или релей в Docker со старой сборкой выбрасывает поле<\/td>\n<td>Пересобрать релей <code>docker compose up -d --build<\/code>, перезапустить агента<\/td>\n<\/tr>\n<tr>\n<td>Живой экран застыл<\/td>\n<td>Стрим оборвался<\/td>\n<td>Сторож перезапустит через ≤12 с; или выключить/включить окошко<\/td>\n<\/tr>\n<tr>\n<td>Голос: «нет распознавания речи»<\/td>\n<td>Нет Google-сервиса распознавания / нет <code>&lt;queries&gt;<\/code><\/td>\n<td>Проверить Google app; манифест<\/td>\n<\/tr>\n<tr>\n<td>Wake-word не слушает<\/td>\n<td>Нет разрешения на микрофон; сервис не стартовал из фона<\/td>\n<td>Включить в настройках, пока приложение открыто<\/td>\n<\/tr>\n<tr>\n<td>Нет уведомления «задача готова»<\/td>\n<td>Не выдано <code>POST_NOTIFICATIONS<\/code> (Android 13+)<\/td>\n<td>Настройки приложения → уведомления<\/td>\n<\/tr>\n<tr>\n<td>«не удалось сохранить» файл<\/td>\n<td>Android ниже 10<\/td>\n<td>Ограничение <code>MediaStore.Downloads<\/code><\/td>\n<\/tr>\n<tr>\n<td>«вопрос уже неактуален»<\/td>\n<td>Ответили позже, чем агент ждал (по умолчанию 120 с), или задача уже кончилась<\/td>\n<td>Отправить команду заново; увеличить <code>ask.timeoutSec<\/code> в <code>agent.properties<\/code> на ПК<\/td>\n<\/tr>\n<tr>\n<td>Напечатал новую команду, а она ушла «ответом»<\/td>\n<td>В ленте остался открытый вопрос агента<\/td>\n<td>Сначала ответить на вопрос или дождаться, пока карточка погаснет<\/td>\n<\/tr>\n<tr>\n<td>Нет карточек плана и вопросов, хотя агент их шлёт<\/td>\n<td>Релей собран до 30.09 и не знает типов <code>agent_plan<\/code> / <code>agent_question<\/code>; либо на телефоне старая сборка приложения<\/td>\n<td>Пересобрать релей (<code>start-faust.bat start<\/code>), поставить приложение (<code>start-faust.bat phone<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Микрофон не включается после озвученного вопроса<\/td>\n<td>Озвучка выключена или нет разрешения на микрофон<\/td>\n<td>Включить «Озвучивать ответы», выдать разрешение<\/td>\n<\/tr>\n<tr>\n<td>Переключатель «Рентген» не действует<\/td>\n<td>ПК офлайн в момент переключения<\/td>\n<td>Значение уйдёт само при следующем подключении (<code>syncDisplayOptions<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Логи: <code>adb logcat -s JarvisClient RelayPairing VoiceController VoskWakeWord<\/code>.<\/p>\n<h2>12. Известные ограничения и вопросы на защите<\/h2>\n<p><strong>Честные ограничения:<\/strong><\/p>\n<ol>\n<li><code>ws://<\/code> без шифрования + <code>usesCleartextTraffic<\/code> — трафик и токены видны в сети. Решение: TLS (<code>wss://<\/code>) на релее, обратный прокси (Caddy/nginx) или Tailscale (шифрует сам).<\/li>\n<li>Токены в DataStore без шифрования.<\/li>\n<li>Статус «подключено» определяется поиском «✓» в строке — хрупко; лучше отдельный <code>enum ConnectionState<\/code>.<\/li>\n<li>Эвристика <code>RUNNING<\/code> через 0.6 с — это не подтверждение от сервера, а догадка.<\/li>\n<li><code>SetVolume<\/code> — абсолютный уровень: «убавь на 20%» поставит ровно 20%.<\/li>\n<li>Нет unit-тестов для ViewModel (только тесты протокола).<\/li>\n<li>Нет DI — зависимости создаются внутри ViewModel; тестировать с подменами сложнее.<\/li>\n<li>Скачивание файлов не работает на Android &lt; 10 при <code>minSdk 24<\/code>.<\/li>\n<li>APK ~96 МБ из-за модели Vosk и нативных библиотек под 7 ABI (<code>abiFilters<\/code> сознательно не включён — сломал бы x86-эмулятор).<\/li>\n<li><code>SpeechRecognizer<\/code> (кнопка 🎤) обычно требует интернет, в отличие от Vosk.<\/li>\n<li>Открытый вопрос «перехватывает» поле ввода: пока он не закрыт, новую команду отправить нельзя — только ответ. Это сознательный выбор (иначе «Маше» ушло бы на разбор как команда), но человеку это надо знать.<\/li>\n<li>Рецепты хранятся только на этом телефоне: на втором телефоне того же ПК их нет, и фраза «навык утро» оттуда уйдёт на ПК как просьба о навыке, выученном показом.<\/li>\n<li>Вопросы и планы не переживают перезапуск приложения — истории диалога с агентом нет.<\/li>\n<li>Голосовой диалог (автовключение микрофона после вопроса) написан 30 сентября; на реальном телефоне на тот момент проверен не был — перед защитой прогнать вживую.<\/li>\n<\/ol>\n<p><strong>Вероятные вопросы (новые):<\/strong><\/p>\n<ul>\n<li><em>Почему ответ на вопрос — команда, а не отдельное сообщение?<\/em> — чтобы он шёл через белый список и аудит, как всё остальное с телефона. Сама по себе команда безвредна: агент примет её, только если ждёт ответа именно с этим случайным <code>questionId<\/code>.<\/li>\n<li><em>Что будет, если ответить поздно?<\/em> — карточка гаснет по своему таймеру одновременно с ожиданием агента; опоздавший ответ в сеть не уходит, человеку говорится почему.<\/li>\n<li><em>Зачем план приходит целиком, а не изменениями?<\/em> — телефону не надо собирать состояние из кусочков и бояться потерянного сообщения: последняя версия и есть правда.<\/li>\n<li><em>Почему рецепт разбирает телефон, а не релей?<\/em> — шаги знает только телефон; на релей уходит уже готовая задача, и он проверяет её как любую другую.<\/li>\n<\/ul>\n<p><strong>Вероятные вопросы:<\/strong><\/p>\n<ul>\n<li><em>Почему OkHttp, а не Ktor?<\/em> — Ktor был в плане (KMP), но для Android-клиента OkHttp проще и стабильнее; протокол всё равно общий через <code>:shared<\/code>.<\/li>\n<li><em>Зачем <code>:shared<\/code>, если релей на Java?<\/em> — Kotlin-модуль — эталон контракта с тестами; на Java он повторён вручную. Единая библиотека для всех трёх — хорошее направление развития.<\/li>\n<li><em>Как телефон узнаёт, к какому запросу ответ?<\/em> — <code>requestId<\/code> (UUID), общий у запроса, шагов, кадров и результата.<\/li>\n<li><em>Что будет, если сеть пропадёт?<\/em> — экспоненциальный реконнект 1…30 с; при отказе токена — без повторов, с предложением перепривязать.<\/li>\n<li><em>Почему тап попадает точно при зуме?<\/em> — тап ловится после <code>graphicsLayer<\/code>, Compose инвертирует матрицу; пересчёт по реальному разрешению из <code>screenWidth<\/code>.<\/li>\n<li><em>Почему wake-word не нарушает приватность?<\/em> — Vosk офлайн, в сеть уходит только текст после слова «Фауст».<\/li>\n<li><em>Почему сервис не держит сокет сам?<\/em> — проще: соединение одно, в ViewModel; сервис лишь повышает приоритет процесса.<\/li>\n<\/ul>\n<h2>13. Как расширять<\/h2>\n<h3>Добавить новую команду (например, <code>mute_toggle<\/code>)<\/h3>\n<ol>\n<li><code>shared/.../Command.kt<\/code>: <code>@Serializable @SerialName(&quot;mute_toggle&quot;) data object MuteToggle : Command { override val name get() = &quot;mute_toggle&quot; }<\/code>.<\/li>\n<li>Тест в <code>ProtocolTest.kt<\/code> (round-trip).<\/li>\n<li><strong>Релей:<\/strong> запись в <code>@JsonSubTypes<\/code> и <code>record<\/code> в <code>Command.java<\/code>; имя в <code>CommandWhitelist<\/code>; при желании пример в промпт <code>GeminiIntentParser<\/code>.<\/li>\n<li><strong>Агент:<\/strong> тот же <code>record<\/code> в своём <code>Command.java<\/code>; ветка в <code>CommandExecutor.execute<\/code>.<\/li>\n<li>Телефон: кнопка <code>QuickAction(&quot;🔈&quot;, &quot;вкл/выкл звук&quot;) { it.sendCommand(MuteToggle) }<\/code>.<\/li>\n<li>Доставить: релей <code>docker compose up -d --build<\/code>, агент — перезапуск, телефон — <code>installDebug<\/code>.<\/li>\n<\/ol>\n<h3>Добавить экран<\/h3>\n<ol>\n<li>Значение в <code>AppScreen<\/code>.<\/li>\n<li>Composable <code>XxxScreen(onBack)<\/code>; если нужна связь с ПК — <code>vm: ChatViewModel = viewModel()<\/code>.<\/li>\n<li>Ветка в <code>when (current)<\/code> в <code>MainActivity<\/code> и пункт <code>DrawerLink<\/code> в <code>ChatDrawer<\/code>.<\/li>\n<\/ol>\n<h2>14. Шпаргалка команд<\/h2>\n<pre><code class=\"language-powershell\"># тесты протокола (без Android SDK)\n.\\gradlew :shared:jvmTest\n\n# собрать и поставить на телефон по USB\n.\\gradlew :androidApp:installDebug\nadb devices\n\n# логи приложения\nadb logcat -s JarvisClient RelayPairing VoskWakeWord VoiceController\n\n# узнать адрес ПК для телефона\nipconfig        # адрес Wi-Fi/Ethernet, не Radmin (26.x) и не vEthernet (172.x)\n<\/code><\/pre>\n<h3>Итоговая карта «кто за что отвечает»<\/h3>\n<table>\n<thead>\n<tr>\n<th>Файл<\/th>\n<th>Одной строкой<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>MainActivity.kt<\/code><\/td>\n<td>Навигация + весь экран чата + диалоги + карточки вопроса и плана + голосовой диалог<\/td>\n<\/tr>\n<tr>\n<td><code>ChatViewModel.kt<\/code><\/td>\n<td>Состояние чата, отправка, разбор входящих, стрим, фон, ответы на вопросы, планы, рецепты, показ на ПК<\/td>\n<\/tr>\n<tr>\n<td><code>JarvisClient.kt<\/code><\/td>\n<td>Постоянный WebSocket, вход, реконнект<\/td>\n<\/tr>\n<tr>\n<td><code>RelayPairing.kt<\/code><\/td>\n<td>Одноразовые сокеты: привязка, статус, команда<\/td>\n<\/tr>\n<tr>\n<td><code>PairingController.kt<\/code><\/td>\n<td>Общая логика «код → токен → сохранить»<\/td>\n<\/tr>\n<tr>\n<td><code>PairingQr.kt<\/code> / <code>QrScan.kt<\/code><\/td>\n<td>Разбор QR / запуск сканера<\/td>\n<\/tr>\n<tr>\n<td><code>PairingScreen.kt<\/code> / <code>PairingViewModel.kt<\/code><\/td>\n<td>Первый запуск<\/td>\n<\/tr>\n<tr>\n<td><code>DeviceRepository.kt<\/code> / <code>SettingsRepository.kt<\/code><\/td>\n<td>DataStore: ПК и настройки<\/td>\n<\/tr>\n<tr>\n<td><code>DevicesScreen.kt<\/code> / <code>DevicesViewModel.kt<\/code><\/td>\n<td>Список ПК, статусы, WoL<\/td>\n<\/tr>\n<tr>\n<td><code>WakeOnLan.kt<\/code><\/td>\n<td>Magic packet<\/td>\n<\/tr>\n<tr>\n<td><code>ScreenViewScreen.kt<\/code><\/td>\n<td>Полноэкранный живой экран с тапами<\/td>\n<\/tr>\n<tr>\n<td><code>TaskPreviewWindow.kt<\/code><\/td>\n<td>Окошко живого экрана в чате<\/td>\n<\/tr>\n<tr>\n<td><code>FrameDecoding.kt<\/code><\/td>\n<td>Декодирование кадров в фоне<\/td>\n<\/tr>\n<tr>\n<td><code>VoiceController.kt<\/code> / <code>ListeningOrb.kt<\/code><\/td>\n<td>Речь ↔ текст, анимация<\/td>\n<\/tr>\n<tr>\n<td><code>VoskWakeWord.kt<\/code> / <code>WakeWordBus.kt<\/code><\/td>\n<td>Слово «Фауст»<\/td>\n<\/tr>\n<tr>\n<td><code>JarvisConnectionService.kt<\/code> / <code>Notifications.kt<\/code><\/td>\n<td>Фон и уведомления<\/td>\n<\/tr>\n<tr>\n<td><code>FileTransfer.kt<\/code><\/td>\n<td>Чтение/сохранение файлов<\/td>\n<\/tr>\n<tr>\n<td><code>TaskHistory.kt<\/code> / <code>HistoryScreen.kt<\/code><\/td>\n<td>История ИИ-задач<\/td>\n<\/tr>\n<tr>\n<td><code>CustomActions.kt<\/code> / <code>CustomActionsScreen.kt<\/code><\/td>\n<td>Свои кнопки и навыки-рецепты (шаги + фразы запуска)<\/td>\n<\/tr>\n<tr>\n<td><code>MultiPcViewModel.kt<\/code> / <code>MultiPcScreen.kt<\/code><\/td>\n<td>Рассылка на несколько ПК<\/td>\n<\/tr>\n<tr>\n<td><code>Theme.kt<\/code><\/td>\n<td>Цвета<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n"}, {"nav": "Релей", "file": "3-Релей.md", "heads": ["Оглавление", "1. Что делает релей", "2. Структура проекта", "3. Минимум Spring Boot, чтобы читать код", "4. Запуск: Docker, compose, .env, application.yml", "5. Протокол на Java", "6. WebSocket: сердце релея", "7. Авторизация и привязка", "8. REST-эндпоинты", "9. База данных", "10. ИИ: разбор фраз и прокси для агента", "11. Белый список и аудит", "12. Сквозные сценарии", "13. Скрипты запуска", "14. Тесты и оценка качества", "15. Модель безопасности и честные слабые места", "16. Отладка", "17. Как расширять", "18. Шпаргалка"], "html": "<h1>Релей Jarvis — полное объяснение<\/h1>\n<blockquote>\n<p>Файл 3 из 5. Сервер посередине между телефоном и ПК. Здесь — каждый класс, каждая таблица\nбазы, каждый эндпоинт, как запускается в Docker и что отвечать на защите.<\/p>\n<p>Папка: <code>C:\\diplom\\jarvis-relay<\/code>. Язык: <strong>Java 21<\/strong>, фреймворк <strong>Spring Boot 3.3.5<\/strong>,\nбаза <strong>PostgreSQL 16<\/strong>, всё в <strong>Docker<\/strong>.<\/p>\n<p>Обновлено 13 октября 2026 (сверено с кодом). <strong>Новое с 25 сентября:<\/strong>\nфразу теперь разбирает связка «своя модель → Gemini → правила» (<code>HybridIntentParser<\/code>),\nпоявились память «уроков» (<code>IntentLessons<\/code>, таблица <code>intent_lesson<\/code>), запрет опасных\nцелей для агента (<code>ForbiddenGoals<\/code>), три служебных админ-эндпоинта для обучения и замеров,\nдва новых сообщения протокола (<code>agent_question<\/code>, <code>agent_plan<\/code>) и две команды в белом\nсписке, быстрая локальная пересборка образа (<code>Dockerfile.local<\/code>). Как своя модель\nобучена и измерена — в файле 5; здесь — как она встроена.<\/p>\n<\/blockquote>\n<hr />\n<h2>Оглавление<\/h2>\n<ol>\n<li><a href=\"#1-%D1%87%D1%82%D0%BE-%D0%B4%D0%B5%D0%BB%D0%B0%D0%B5%D1%82-%D1%80%D0%B5%D0%BB%D0%B5%D0%B9\">Что делает релей<\/a><\/li>\n<li><a href=\"#2-%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B0-%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D0%B0\">Структура проекта<\/a><\/li>\n<li><a href=\"#3-%D0%BC%D0%B8%D0%BD%D0%B8%D0%BC%D1%83%D0%BC-spring-boot-%D1%87%D1%82%D0%BE%D0%B1%D1%8B-%D1%87%D0%B8%D1%82%D0%B0%D1%82%D1%8C-%D0%BA%D0%BE%D0%B4\">Минимум Spring Boot, чтобы читать код<\/a><\/li>\n<li><a href=\"#4-%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D0%BA-docker-compose-env-applicationyml\">Запуск: Docker, compose, .env, application.yml<\/a><\/li>\n<li><a href=\"#5-%D0%BF%D1%80%D0%BE%D1%82%D0%BE%D0%BA%D0%BE%D0%BB-%D0%BD%D0%B0-java\">Протокол на Java<\/a><\/li>\n<li><a href=\"#6-websocket-%D1%81%D0%B5%D1%80%D0%B4%D1%86%D0%B5-%D1%80%D0%B5%D0%BB%D0%B5%D1%8F\">WebSocket: сердце релея<\/a><\/li>\n<li><a href=\"#7-%D0%B0%D0%B2%D1%82%D0%BE%D1%80%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F-%D0%B8-%D0%BF%D1%80%D0%B8%D0%B2%D1%8F%D0%B7%D0%BA%D0%B0\">Авторизация и привязка<\/a><\/li>\n<li><a href=\"#8-rest-%D1%8D%D0%BD%D0%B4%D0%BF%D0%BE%D0%B8%D0%BD%D1%82%D1%8B\">REST-эндпоинты<\/a><\/li>\n<li><a href=\"#9-%D0%B1%D0%B0%D0%B7%D0%B0-%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D1%85\">База данных<\/a><\/li>\n<li><a href=\"#10-%D0%B8%D0%B8-%D1%80%D0%B0%D0%B7%D0%B1%D0%BE%D1%80-%D1%84%D1%80%D0%B0%D0%B7-%D0%B8-%D0%BF%D1%80%D0%BE%D0%BA%D1%81%D0%B8-%D0%B4%D0%BB%D1%8F-%D0%B0%D0%B3%D0%B5%D0%BD%D1%82%D0%B0\">ИИ: разбор фраз и прокси для агента<\/a><\/li>\n<li><a href=\"#11-%D0%B1%D0%B5%D0%BB%D1%8B%D0%B9-%D1%81%D0%BF%D0%B8%D1%81%D0%BE%D0%BA-%D0%B8-%D0%B0%D1%83%D0%B4%D0%B8%D1%82\">Белый список и аудит<\/a><\/li>\n<li><a href=\"#12-%D1%81%D0%BA%D0%B2%D0%BE%D0%B7%D0%BD%D1%8B%D0%B5-%D1%81%D1%86%D0%B5%D0%BD%D0%B0%D1%80%D0%B8%D0%B8\">Сквозные сценарии<\/a><\/li>\n<li><a href=\"#13-%D1%81%D0%BA%D1%80%D0%B8%D0%BF%D1%82%D1%8B-%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D0%BA%D0%B0\">Скрипты запуска<\/a><\/li>\n<li><a href=\"#14-%D1%82%D0%B5%D1%81%D1%82%D1%8B-%D0%B8-%D0%BE%D1%86%D0%B5%D0%BD%D0%BA%D0%B0-%D0%BA%D0%B0%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%B0\">Тесты и оценка качества<\/a><\/li>\n<li><a href=\"#15-%D0%BC%D0%BE%D0%B4%D0%B5%D0%BB%D1%8C-%D0%B1%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D0%B8-%D0%B8-%D1%87%D0%B5%D1%81%D1%82%D0%BD%D1%8B%D0%B5-%D1%81%D0%BB%D0%B0%D0%B1%D1%8B%D0%B5-%D0%BC%D0%B5%D1%81%D1%82%D0%B0\">Модель безопасности и честные слабые места<\/a><\/li>\n<li><a href=\"#16-%D0%BE%D1%82%D0%BB%D0%B0%D0%B4%D0%BA%D0%B0\">Отладка<\/a><\/li>\n<li><a href=\"#17-%D0%BA%D0%B0%D0%BA-%D1%80%D0%B0%D1%81%D1%88%D0%B8%D1%80%D1%8F%D1%82%D1%8C\">Как расширять<\/a><\/li>\n<li><a href=\"#18-%D1%88%D0%BF%D0%B0%D1%80%D0%B3%D0%B0%D0%BB%D0%BA%D0%B0\">Шпаргалка<\/a><\/li>\n<\/ol>\n<hr />\n<h2>1. Что делает релей<\/h2>\n<p>Пять обязанностей (они же перечислены в javadoc <code>JarvisWebSocketHandler<\/code>):<\/p>\n<ol>\n<li><strong>Аутентификация.<\/strong> Первое сообщение в сокете — <code>auth<\/code> (или <code>pair_request<\/code>). Без успешного входа ничего другого не принимается.<\/li>\n<li><strong>Маршрутизация.<\/strong> Команды телефона → нужному агенту; результаты, кадры, шаги, <strong>вопросы и планы<\/strong> агента → всем телефонам этого ПК.<\/li>\n<li><strong>Понимание фраз.<\/strong> <code>nl<\/code> («сделай потише») → конкретная команда. Первой отвечает <strong>своя модель<\/strong> (Ollama на этом же ПК), при сомнении — Gemini, без интернета — правила по ключевым словам.<\/li>\n<li><strong>Белый список.<\/strong> Всё, что не разрешено, не дойдёт до агента, даже если это «придумал» ИИ. Плюс <strong>запрет опасных целей<\/strong> у задачи агенту.<\/li>\n<li><strong>Аудит.<\/strong> Каждая команда → строка в таблице <code>audit_log<\/code>.<\/li>\n<\/ol>\n<p>Плюс вспомогательные вещи по HTTP: выдача одноразовых кодов привязки, <strong>прокси к Gemini для агента<\/strong> (чтобы ключ ИИ жил только здесь) и три служебных эндпоинта под админским секретом — для сбора обучающих данных, замера точности и выгрузки «уроков».<\/p>\n<p>И ещё одна тихая обязанность: релей следит, <strong>чем кончилась команда<\/strong>. Если фразу понял только Gemini и агент выполнил её успешно, фраза становится подтверждённым «уроком» для своей модели (раздел 10.5).<\/p>\n<h2>2. Структура проекта<\/h2>\n<pre><code>jarvis-relay/\n├── build.gradle.kts           ← зависимости (Spring web, websocket, data-jpa, postgresql, security-crypto)\n├── Dockerfile                 ← двухэтапная сборка образа (jar собирается ВНУТРИ Docker)\n├── Dockerfile.local           ← быстрый образ: готовый jar, собранный на ПК (им пользуется faust.ps1)\n├── docker-compose.yml         ← два сервиса: postgres + relay\n├── .env.example / .env        ← секреты (.env не в git)\n├── scripts/                   ← start-jarvis.ps1/.bat, pair-phone.ps1/.bat (старые; основной запуск — C:\\diplom\\faust.ps1)\n├── eval/\n│   ├── phrases_ru.csv         ← первые 115 фраз (вошли в экзамен А)\n│   ├── build_testset.py       ← собирает экзамен А\n│   ├── intent_test.jsonl      ← экзамен А: 250 размеченных фраз\n│   ├── intent_test_b.jsonl    ← экзамен Б: 201 живая фраза с разметкой Gemini\n│   ├── intent_eval.py         ← замер любого разборщика через /api/admin/intent/parse\n│   └── results/               ← отчёты замеров по каждой фразе\n├── docs/                      ← планы, промпты, дорожные карты (история разработки)\n└── src/\n    ├── main/resources/application.yml\n    ├── main/java/com/jarvis/relay/\n    │   ├── RelayApplication.java             ← точка входа\n    │   ├── protocol/   JarvisMessage, Command, ResultData, CommandStatus, DeviceRole, ImageFormat, AgentScope\n    │   ├── ws/         WebSocketConfig, JarvisWebSocketHandler, SessionRegistry\n    │   ├── pairing/    DeviceAuthService, PairingService, PairingController,\n    │   │               AgentAuthService, AgentPairingController, AgentRegistrationController\n    │   ├── persistence/ Device, PairingCode, PhoneBinding, AuditLog, AgentLlmLog, IntentLesson + *Repository\n    │   ├── llm/        IntentParser, HybridIntentParser (@Primary), LocalIntentParser, GeminiIntentParser,\n    │   │               StubIntentParser, IntentLessons, GeminiClient,\n    │   │               AgentLlmController, AdminLlmController, IntentEvalController\n    │   ├── security/   CommandWhitelist, ForbiddenGoals, SecurityBeansConfig (BCrypt)\n    │   └── audit/      AuditService\n    └── test/java/.../  llm/GeminiIntentParserTest, llm/HybridIntentParserTest, llm/AgentLlmControllerTest,\n                        protocol/AgentQuestionProtocolTest, security/ForbiddenGoalsTest\n<\/code><\/pre>\n<p>Зависимости (<code>build.gradle.kts<\/code>):<\/p>\n<table>\n<thead>\n<tr>\n<th>Зависимость<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>spring-boot-starter-web<\/code><\/td>\n<td>HTTP-сервер (Tomcat), REST-контроллеры, Jackson<\/td>\n<\/tr>\n<tr>\n<td><code>spring-boot-starter-websocket<\/code><\/td>\n<td>WebSocket-сервер<\/td>\n<\/tr>\n<tr>\n<td><code>spring-boot-starter-data-jpa<\/code> + <code>postgresql<\/code><\/td>\n<td>Работа с базой через сущности (Hibernate)<\/td>\n<\/tr>\n<tr>\n<td><code>spring-security-crypto<\/code><\/td>\n<td><strong>Только BCrypt<\/strong> — без всего Spring Security (фильтров, логин-форм)<\/td>\n<\/tr>\n<tr>\n<td><code>spring-boot-starter-test<\/code><\/td>\n<td>JUnit 5 для тестов<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Минимум Spring Boot, чтобы читать код<\/h2>\n<table>\n<thead>\n<tr>\n<th>Понятие<\/th>\n<th>Смысл<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Бин (bean)<\/strong><\/td>\n<td>Объект, который создаёт и хранит Spring. Обычно один на всё приложение<\/td>\n<td><code>CommandWhitelist<\/code>, <code>DeviceAuthService<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>@Component<\/code> / <code>@Service<\/code> / <code>@RestController<\/code> / <code>@Configuration<\/code><\/strong><\/td>\n<td>«Spring, создай этот класс как бин». Разница — только смысловая<\/td>\n<td><code>@Service class PairingService<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Внедрение зависимостей (DI)<\/strong><\/td>\n<td>Spring сам передаёт нужные бины в конструктор<\/td>\n<td><code>JarvisWebSocketHandler(ObjectMapper, CommandWhitelist, IntentParser, …)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>@Primary<\/code><\/strong><\/td>\n<td>Если бинов одного интерфейса несколько — брать этот<\/td>\n<td><code>IntentParser<\/code> реализуют три класса; <code>@Primary<\/code> стоит на <code>HybridIntentParser<\/code> — его и получает обработчик сокета<\/td>\n<\/tr>\n<tr>\n<td><strong><code>@Value(&quot;${ключ:дефолт}&quot;)<\/code><\/strong><\/td>\n<td>Подставить настройку из <code>application.yml<\/code> / переменной окружения<\/td>\n<td><code>@Value(&quot;${jarvis.admin-token}&quot;)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>@Bean<\/code><\/strong><\/td>\n<td>Метод в <code>@Configuration<\/code>, возвращающий бин<\/td>\n<td><code>passwordEncoder()<\/code> → <code>BCryptPasswordEncoder<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>@RestController<\/code> + <code>@PostMapping<\/code><\/strong><\/td>\n<td>HTTP-эндпоинт; возвращаемый объект → JSON<\/td>\n<td><code>POST /api/pairing-codes<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>ResponseEntity<\/code><\/strong><\/td>\n<td>Ответ с явным HTTP-кодом<\/td>\n<td><code>ResponseEntity.status(401).body(...)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>@Entity<\/code><\/strong><\/td>\n<td>Класс ↔ таблица БД<\/td>\n<td><code>Device<\/code> ↔ <code>devices<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>JpaRepository&lt;T, ID&gt;<\/code><\/strong><\/td>\n<td>Интерфейс; Spring <strong>сам пишет реализацию<\/strong> (<code>save<\/code>, <code>findById<\/code>…) и даже SQL по имени метода (<code>findByAgentId<\/code>)<\/td>\n<td><code>PhoneBindingRepository<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>@Transactional<\/code><\/strong><\/td>\n<td>Все операции с БД в методе — одна транзакция: либо всё, либо ничего<\/td>\n<td><code>DeviceAuthService.authenticate<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>record<\/code><\/strong> (Java 16+)<\/td>\n<td>Короткий неизменяемый класс с полями, конструктором, <code>equals<\/code>, геттерами <code>x()<\/code><\/td>\n<td><code>JarvisMessage.Auth<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>sealed interface … permits<\/code><\/strong> (Java 17)<\/td>\n<td>Закрытое семейство, как в Kotlin<\/td>\n<td><code>Command<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>switch<\/code> по типу<\/strong> (Java 21)<\/td>\n<td><code>case JarvisMessage.Ping p -&gt; …<\/code><\/td>\n<td>в <code>handleTextMessage<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. Запуск: Docker, compose, .env, application.yml<\/h2>\n<h3>4.1 <code>Dockerfile<\/code> — двухэтапная сборка<\/h3>\n<pre><code>Стадия 1 &quot;build&quot;:  eclipse-temurin:21-jdk\n   COPY gradlew, gradle/, build.gradle.kts, settings.gradle.kts\n   RUN ./gradlew --version          ← слой с Gradle кэшируется, пока не менялись файлы сборки\n   COPY src\n   RUN ./gr

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фауст изнутри</title>
<style>
:root{
  color-scheme: light;
  --bg:#FBF6F1;
  --surface:#FFFFFF;
  --surface-2:#F3E9E0;
  --line:#E6D6C8;
  --line-soft:#F0E4D9;
  --ink:#2B211A;
  --ink-soft:#6E5C4E;
  --ink-faint:#9A8878;
  --accent:#9B3A60;
  --accent-ink:#9B3A60;
  --accent-wash:#F7E6EC;
  --peach:#B4622A;
  --code-bg:#F6EEE6;
  --fs:17px;
  --shadow:0 1px 2px rgba(43,33,26,.06), 0 8px 24px rgba(43,33,26,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#16110E;
    --surface:#1D1714;
    --surface-2:#241C17;
    --line:#352A22;
    --line-soft:#2A211B;
    --ink:#F1E6DB;
    --ink-soft:#BCA695;
    --ink-faint:#8A7767;
    --accent:#E7A0BE;
    --accent-ink:#E7A0BE;
    --accent-wash:#38212A;
    --peach:#EBBE92;
    --code-bg:#211A15;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#16110E;
  --surface:#1D1714;
  --surface-2:#241C17;
  --line:#352A22;
  --line-soft:#2A211B;
  --ink:#F1E6DB;
  --ink-soft:#BCA695;
  --ink-faint:#8A7767;
  --accent:#E7A0BE;
  --accent-ink:#E7A0BE;
  --accent-wash:#38212A;
  --peach:#EBBE92;
  --code-bg:#211A15;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'PT Serif', Georgia, 'Times New Roman', serif;
  font-size:var(--fs);
  line-height:1.62;
  -webkit-text-size-adjust:100%;
}
.ui{font-family:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif}

/* ---------- shell ---------- */
.shell{display:flex; align-items:flex-start; gap:0}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:40;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  display:flex; align-items:center; gap:10px;
  padding:9px 16px;
  min-height:52px;
}
.iconbtn{
  font-family:'Golos Text', system-ui, sans-serif;
  appearance:none; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); border-radius:10px; padding:7px 10px; font-size:14px; line-height:1;
  cursor:pointer;
}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.bars{display:block; width:17px; height:11px; position:relative}
.bars i{position:absolute; left:0; right:0; height:1.6px; background:currentColor; border-radius:2px}
.bars i:nth-child(1){top:0}
.bars i:nth-child(2){top:4.7px}
.bars i:nth-child(3){top:9.4px}
.crumb{
  font-family:'Golos Text', system-ui, sans-serif;
  font-size:14px; font-weight:600; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:1; min-width:0;
}
.crumb .num{color:var(--accent-ink); font-variant-numeric:tabular-nums}
.sizer{display:flex; gap:4px}
.progress{height:2px; background:transparent}
.progress > span{display:block; height:100%; width:0; background:var(--accent); transition:width .12s linear}
@media (prefers-reduced-motion: reduce){ .progress > span{transition:none} }

/* ---------- drawer / sidebar ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(20,13,9,.45); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .18s ease;
}
.scrim.open{opacity:1; pointer-events:auto}
.nav{
  position:fixed; z-index:60; top:0; bottom:0; left:0; width:min(88vw, 330px);
  background:var(--surface); border-right:1px solid var(--line);
  transform:translateX(-102%); transition:transform .2s ease;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.nav.open{transform:translateX(0)}
@media (prefers-reduced-motion: reduce){ .nav{transition:none} }
.nav-head{padding:14px 16px 10px; border-bottom:1px solid var(--line-soft)}
.wordmark{
  font-family:'Golos Text', system-ui, sans-serif;
  display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:-.015em; font-size:16px;
}
.dot{
  width:20px; height:20px; border-radius:50%; flex:none;
  border:1.6px solid var(--accent); display:grid; place-items:center;
}
.dot::after{content:''; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.nav-sub{font-family:'Golos Text', system-ui, sans-serif; font-size:11.5px; color:var(--ink-faint); margin-top:6px; letter-spacing:.02em}
.search{
  font-family:'Golos Text', system-ui, sans-serif;
  width:100%; margin-top:11px; padding:8px 11px; font-size:14px;
  border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink);
}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.nav-scroll{overflow-y:auto; padding:8px 10px 28px; flex:1; overscroll-behavior:contain}
.docbtn{
  font-family:'Golos Text', system-ui, sans-serif;
  display:flex; gap:10px; align-items:baseline; width:100%; text-align:left;
  background:none; border:0; border-radius:10px; cursor:pointer;
  padding:9px 10px; color:var(--ink); font-size:14.5px; font-weight:600; line-height:1.3;
}
.docbtn .idx{color:var(--ink-faint); font-variant-numeric:tabular-nums; font-size:12.5px}
.docbtn:hover{background:var(--surface-2)}
.docbtn.active{background:var(--accent-wash); color:var(--accent-ink)}
.docbtn.active .idx{color:var(--accent-ink)}
.docbtn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.toc{list-style:none; margin:2px 0 10px; padding:0 0 0 10px; border-left:1px solid var(--line-soft)}
.toc a{
  font-family:'Golos Text', system-ui, sans-serif;
  display:block; padding:5px 8px; border-radius:8px; font-size:13px; line-height:1.35;
  color:var(--ink-soft); text-decoration:none;
}
.toc a:hover{background:var(--surface-2); color:var(--ink)}
.toc a.lvl3{padding-left:20px; font-size:12.5px; color:var(--ink-faint)}
.toc a.current{color:var(--accent-ink); background:var(--accent-wash)}
.nav-empty{font-family:'Golos Text', system-ui, sans-serif; font-size:13px; color:var(--ink-faint); padding:10px}

@media (min-width:1040px){
  .nav{position:sticky; top:0; transform:none; height:100vh; width:320px; flex:none; border-right:1px solid var(--line)}
  .scrim{display:none}
  .menu-toggle{display:none}
}

/* ---------- article ---------- */
.main{flex:1; min-width:0}
.wrap{padding-inline:16px; padding-block:26px 90px; max-width:780px; margin:0 auto}
@media (min-width:1040px){ .wrap{padding-inline:40px; padding-block:40px 120px} }

article{font-size:1rem}
article h1{
  font-family:'Golos Text', system-ui, sans-serif;
  font-size:clamp(25px, 6.4vw, 38px); line-height:1.16; font-weight:700; letter-spacing:-.025em;
  margin:0 0 18px; text-wrap:balance;
}
article h2{
  font-family:'Golos Text', system-ui, sans-serif;
  font-size:clamp(20px, 4.6vw, 25px); line-height:1.22; font-weight:700; letter-spacing:-.02em;
  margin:52px 0 14px; padding-top:14px; border-top:1px solid var(--line);
  text-wrap:balance; scroll-margin-top:86px;
}
article h3{
  font-family:'Golos Text', system-ui, sans-serif;
  font-size:clamp(17px, 3.6vw, 19px); line-height:1.28; font-weight:600; letter-spacing:-.012em;
  margin:32px 0 10px; text-wrap:balance; scroll-margin-top:86px;
}
article h4{
  font-family:'Golos Text', system-ui, sans-serif;
  font-size:15.5px; font-weight:600; margin:24px 0 8px; color:var(--ink-soft);
  text-transform:none; letter-spacing:.005em; scroll-margin-top:86px;
}
article p{margin:0 0 15px}
article ul, article ol{margin:0 0 16px; padding-left:22px}
article li{margin:0 0 7px}
article li > ul, article li > ol{margin-top:7px}
article a{color:var(--accent-ink); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent)}
article a:hover{border-bottom-color:var(--accent)}
article strong{font-weight:700}
article hr{border:0; border-top:1px solid var(--line); margin:34px 0}
article blockquote{
  margin:0 0 22px; padding:12px 16px;
  background:var(--surface-2); border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;
  font-size:.93em; color:var(--ink-soft);
}
article blockquote p:last-child{margin-bottom:0}
article blockquote ul{margin-bottom:0}

article code{
  font-family:'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size:.83em; background:var(--code-bg); border:1px solid var(--line-soft);
  padding:1px 5px; border-radius:5px; overflow-wrap:break-word;
}
article pre{
  margin:0 0 20px; padding:14px 16px; background:var(--code-bg);
  border:1px solid var(--line); border-radius:12px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
article pre code{
  background:none; border:0; padding:0; font-size:11.5px; line-height:1.5;
  white-space:pre; display:block; color:var(--ink-soft);
}
@media (min-width:620px){ article pre code{font-size:12.5px} }

.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 22px; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
article table{border-collapse:collapse; width:100%; font-size:14px; font-family:'Golos Text', system-ui, sans-serif}
article th, article td{padding:9px 13px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line-soft)}
article th{
  font-weight:600; font-size:12px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-faint); background:var(--surface-2); white-space:nowrap;
}
article tr:last-child td{border-bottom:0}
article td code{font-size:12px}
article td:first-child{white-space:normal}

.docnav{
  display:flex; gap:10px; margin-top:56px; padding-top:22px; border-top:1px solid var(--line);
}
.docnav button{
  font-family:'Golos Text', system-ui, sans-serif;
  flex:1; text-align:left; cursor:pointer; background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--ink);
}
.docnav button:hover{border-color:var(--accent)}
.docnav button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.docnav .lbl{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px}
.docnav .ttl{display:block; font-size:14px; font-weight:600; line-height:1.25}
.docnav .next{text-align:right}

.totop{
  position:fixed; right:16px; z-index:30;
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:50%; width:42px; height:42px; cursor:pointer; box-shadow:var(--shadow);
  font-size:15px; line-height:1;
}
.totop[hidden]{display:none!important}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <button class="iconbtn menu-toggle ui" id="menu" aria-label="Оглавление" aria-expanded="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <span class="crumb" id="crumb"></span>
    <span class="sizer">
      <button class="iconbtn ui" id="fsminus" aria-label="Мельче шрифт">A−</button>
      <button class="iconbtn ui" id="fsplus" aria-label="Крупнее шрифт">A+</button>
    </span>
  </div>
  <div class="progress"><span id="bar"></span></div>
</div>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Навигация по документам">
    <div class="nav-head">
      <div class="wordmark"><span class="dot" aria-hidden="true"></span>Фауст изнутри</div>
      <div class="nav-sub">JARVIS · ТЕЛЕФОН · РЕЛЕЙ · АГЕНТ · МОДЕЛЬ</div>
      <input class="search" id="search" type="search" placeholder="Поиск по разделам" aria-label="Поиск по разделам">
    </div>
    <div class="nav-scroll" id="navscroll"></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="wrap">
      <article id="article"></article>
      <div class="docnav" id="docnav"></div>
    </div>
  </main>
</div>

<button class="totop" id="totop" hidden aria-label="Наверх">↑</button>

<script type="application/json" id="doc-data">[{"nav": "Общая картина", "file": "1-Общее-как-работает.md", "heads": ["1. Что это за проект одной фразой", "2. Аналогия, которая объясняет всю архитектуру", "3. Три программы", "4. Почему нужен релей посередине", "5. Путь одной простой команды — «сделай потише»", "6. Путь сложной команды — ИИ-агент (agent_task)", "7. Как устройства узнают друг друга (привязка)", "8. Безопасность — слои защиты", "9. Протокол — один язык в трёх местах", "10. Что умеет система (возможности)", "11. Где что хранится", "12. Как всё запустить", "13. ВАЖНО: «собралось» ≠ «заработало»", "14. Словарик", "15. Что дальше читать"], "html": "<h1>Jarvis (Faust) — как это работает, простыми словами<\/h1>\n<blockquote>\n<p>Файл 1 из 5. Это короткая «карта местности». Здесь нет разбора кода по строчкам —\nтолько общая картина, чтобы остальные документы ложились на понятную основу.<\/p>\n<ul>\n<li><strong>1-Общее-как-работает.md<\/strong> ← ты здесь<\/li>\n<li><strong>2-Android-приложение.md<\/strong> — телефон: каждый файл, каждый экран<\/li>\n<li><strong>3-Релей.md<\/strong> — сервер посередине (Spring Boot + PostgreSQL в Docker)<\/li>\n<li><strong>4-Агент.md<\/strong> — программа на компьютере, которая реально жмёт кнопки<\/li>\n<li><strong>5-Своя-модель.md<\/strong> — собственная дообученная модель разбора фраз<\/li>\n<\/ul>\n<p>Снимок состояния: 13 октября 2026 (сверено с кодом). Если код поменяется — сверяйся с кодом, а не с этим текстом.<\/p>\n<p><strong>Что изменилось с первой версии документа (25 сентября):<\/strong> агент научился\nмногоэтапным задачам через несколько программ (план из подзадач, вопросы человеку,\nпроверка результата, работа с файлами), появились навыки (рецепт, скрипт, показ),\n«рентген» и панель плана на экране ПК, а фразы теперь первой разбирает своя модель,\nа не Gemini. Подробности — в разделах 6.1, 8–11 ниже и в файлах 2–5.<\/p>\n<\/blockquote>\n<hr />\n<h2>1. Что это за проект одной фразой<\/h2>\n<p>Ты говоришь или пишешь в телефон: <strong>«Фауст, сделай потише»<\/strong> или <strong>«скачай архив с сайта и отправь его мне в Telegram»<\/strong> — и компьютер дома это делает. Простые вещи (громкость, открыть программу, скриншот) выполняются сразу. Сложные многошаговые выполняет <strong>ИИ-агент<\/strong>: он сам смотрит на экран, решает, куда нажать, нажимает и так шаг за шагом, пока не выполнит цель. Задачу через несколько программ он сначала <strong>разбивает на план<\/strong>, а если чего-то не знает («какой файл? кому?») — <strong>спрашивает тебя на телефоне<\/strong>, а не угадывает и не сдаётся.<\/p>\n<p>В интерфейсе проект называется <strong>Faust / Фауст<\/strong> (это имя и слово-триггер), в коде и папках — <strong>Jarvis<\/strong>. Это одно и то же.<\/p>\n<h2>2. Аналогия, которая объясняет всю архитектуру<\/h2>\n<p>Представь, что ты управляешь роботом-уборщиком в квартире, находясь на работе.<\/p>\n<table>\n<thead>\n<tr>\n<th>В жизни<\/th>\n<th>В проекте<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Пульт в руке<\/td>\n<td><strong>Телефон<\/strong> (Android-приложение)<\/td>\n<td>Принимает твою команду, показывает результат<\/td>\n<\/tr>\n<tr>\n<td>Диспетчерская служба<\/td>\n<td><strong>Релей<\/strong> (сервер)<\/td>\n<td>Проверяет, кто звонит, переводит «человеческую» просьбу в точную команду, не пропускает опасное, записывает всё в журнал<\/td>\n<\/tr>\n<tr>\n<td>Робот в квартире<\/td>\n<td><strong>Агент<\/strong> (программа на ПК)<\/td>\n<td>Реально двигает мышь, нажимает клавиши, запускает программы<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Пульт <strong>никогда<\/strong> не говорит с роботом напрямую — только через диспетчерскую. Это главное архитектурное решение проекта.<\/p>\n<h2>3. Три программы<\/h2>\n<pre><code> ┌──────────────────┐          ┌─────────────────────────┐          ┌─────────────────────┐\n │     ТЕЛЕФОН      │          │          РЕЛЕЙ          │          │        АГЕНТ        │\n │ Android, Kotlin, │◄──WS────►│ Java 21 + Spring Boot   │◄───WS───►│ Java 21, на твоём ПК│\n │ Jetpack Compose  │          │ PostgreSQL, в Docker    │          │ Robot, Selenium, UIA│\n └──────────────────┘          └─────────────────────────┘          └─────────────────────┘\n   C:\\diplom\\jarvis             C:\\diplom\\jarvis-relay                C:\\diplom\\jarvis-agent\n                                     │\n                                     ├──HTTP───► своя модель faust-intent (Ollama на этом же ПК)\n                                     └──HTTPS──► Google Gemini (LLM в облаке)\n<\/code><\/pre>\n<p>У релея теперь <strong>два «мозга»<\/strong>. Фразу с телефона («сделай потише») первой разбирает\nсвоя дообученная модель — быстро и без интернета; Gemini подключается, только если она\nне уверена. А «зрение» агента и планирование многоэтапных задач по-прежнему делает\nGemini. Четвёртая папка проекта — <code>C:\\diplom\\jarvis-ml<\/code>: там своя модель обучается\n(Python, не участвует в работе системы). Всё про неё — в файле 5.<\/p>\n<p><strong>WS<\/strong> — это WebSocket: постоянное двустороннее соединение. В отличие от обычного HTTP («спросил — получил ответ — соединение закрылось»), WebSocket остаётся открытым, и <strong>любая сторона может написать в любой момент<\/strong>. Это нужно, потому что агент сам присылает кадры экрана и шаги ИИ, не дожидаясь вопроса.<\/p>\n<table>\n<thead>\n<tr>\n<th>Часть<\/th>\n<th>Язык / технологии<\/th>\n<th>Где работает<\/th>\n<th>Как запускается<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Телефон<\/td>\n<td>Kotlin, Jetpack Compose, OkHttp, Vosk<\/td>\n<td>На телефоне (Pixel 9)<\/td>\n<td><code>gradlew :androidApp:installDebug<\/code><\/td>\n<\/tr>\n<tr>\n<td>Релей<\/td>\n<td>Java 21, Spring Boot 3.3, Jackson, JPA, PostgreSQL 16<\/td>\n<td>В Docker на ПК (или на сервере)<\/td>\n<td><code>start-faust.bat<\/code> (или <code>docker compose up -d --build<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Агент<\/td>\n<td>Java 21, <code>java.awt.Robot<\/code>, Selenium, JNA, C#-помощник UiaDump<\/td>\n<td>На управляемом ПК, от имени пользователя<\/td>\n<td><code>start-faust.bat<\/code>, ярлык в автозагрузке или <code>gradlew run<\/code><\/td>\n<\/tr>\n<tr>\n<td>Своя модель<\/td>\n<td>Qwen2.5-0.5B + LoRA, в формате GGUF<\/td>\n<td>В Ollama на том же ПК, что и релей<\/td>\n<td>Ollama поднимает <code>start-faust.bat<\/code><\/td>\n<\/tr>\n<tr>\n<td>Обучение модели<\/td>\n<td>Python 3.11, PyTorch, скрипты <code>jarvis-ml<\/code><\/td>\n<td>На ПК разработчика, по запросу<\/td>\n<td>вручную, см. файл 5<\/td>\n<\/tr>\n<tr>\n<td>Протокол<\/td>\n<td>Kotlin (<code>:shared<\/code>) + копии на Java в релее и агенте<\/td>\n<td>Везде<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>4. Почему нужен релей посередине<\/h2>\n<p>Можно было бы подключать телефон прямо к ПК. Не сделали так по трём причинам:<\/p>\n<ol>\n<li><strong>NAT и роутеры.<\/strong> Домашний ПК сидит за роутером, у него нет «белого» адреса в интернете. Достучаться до него снаружи нельзя без проброса портов. Поэтому <strong>агент сам звонит на релей<\/strong> (исходящее соединение роутер пропускает) и держит линию открытой. Релей никогда не звонит агенту. Это записано как инвариант проекта.<\/li>\n<li><strong>Одна точка контроля.<\/strong> Проверка «кто ты», белый список команд, журнал аудита — всё в одном месте. Не надо дублировать защиту на каждом ПК.<\/li>\n<li><strong>Ключ от ИИ в одном месте.<\/strong> Ключ Google Gemini лежит только в файле <code>.env<\/code> релея. Ни в APK телефона, ни в агенте его нет. Если кто-то украдёт телефон или разберёт APK — ключа там не найдёт.<\/li>\n<\/ol>\n<h2>5. Путь одной простой команды — «сделай потише»<\/h2>\n<pre><code> Телефон                         Релей                                   Агент\n   │  1. ты написал/сказал         │                                        │\n   │  &quot;сделай потише&quot;              │                                        │\n   │── command_request ───────────►│                                        │\n   │   {type:&quot;nl&quot;, text:&quot;…&quot;}       │ 2. спрашивает СВОЮ модель (~0,1 с):    │\n   │                               │    «что это за команда?»               │\n   │                               │    → {type:&quot;set_volume&quot;, level:30}     │\n   │                               │    (не уверена → переспросит Gemini)   │\n   │                               │ 3. белый список: set_volume разрешён?  │\n   │                               │    да → пишет строку в audit_log       │\n   │                               │── command_request ────────────────────►│\n   │                               │   {type:&quot;set_volume&quot;, level:30}        │ 4. Core Audio:\n   │                               │                                        │    громкость = 30%\n   │                               │◄── command_result {status:&quot;ok&quot;} ───────│\n   │◄── command_result ────────────│                                        │\n   │ 5. «громкость выставлена      │                                        │\n   │    на 30%» + голосом (TTS)    │                                        │\n<\/code><\/pre>\n<p>Реальные сообщения на проводе (всё — JSON-текст):<\/p>\n<pre><code class=\"language-json\">// телефон -&gt; релей\n{&quot;type&quot;:&quot;command_request&quot;,&quot;requestId&quot;:&quot;a1&quot;,&quot;command&quot;:{&quot;type&quot;:&quot;nl&quot;,&quot;text&quot;:&quot;сделай потише&quot;}}\n\n// релей -&gt; агент (фразу уже превратили в точную команду)\n{&quot;type&quot;:&quot;command_request&quot;,&quot;requestId&quot;:&quot;a1&quot;,&quot;command&quot;:{&quot;type&quot;:&quot;set_volume&quot;,&quot;level&quot;:30}}\n\n// агент -&gt; релей -&gt; телефон\n{&quot;type&quot;:&quot;command_result&quot;,&quot;requestId&quot;:&quot;a1&quot;,&quot;status&quot;:&quot;ok&quot;,&quot;message&quot;:&quot;громкость выставлена на 30%&quot;}\n<\/code><\/pre>\n<p><code>requestId<\/code> — это «номер заказа». Телефон придумывает его сам (UUID), и все ответы на этот запрос приходят с тем же номером — так телефон понимает, к какому сообщению в чате относится ответ.<\/p>\n<p>Кто разбирает фразу — цепочка из пяти ступеней (<code>HybridIntentParser<\/code> на релее):<\/p>\n<ol>\n<li>«навык …» / «запусти скрипт …» — узнаёт код, без моделей;<\/li>\n<li>фраза, которую уже однажды понял Gemini и команда выполнилась, — ответ из памяти «уроков»;<\/li>\n<li><strong>своя модель<\/strong> — если уверена (порог 0,9) и ответ прошёл проверку формата;<\/li>\n<li><strong>Gemini<\/strong> — если своя модель не уверена, сказала «не понял» или её нет;<\/li>\n<li>если нет и интернета — годный ответ своей модели, иначе простые правила по ключевым словам (<code>StubIntentParser<\/code>: «тише» → громкость 30 и т.п.).<\/li>\n<\/ol>\n<p>Поэтому простые команды работают <strong>без интернета и без ключа Gemini<\/strong>, а релей не падает ни при каком отказе. После любого разборщика команда всё равно проходит белый список (раздел 8).<\/p>\n<h2>6. Путь сложной команды — ИИ-агент (<code>agent_task<\/code>)<\/h2>\n<p>«Найди на ютубе видео про котов и открой первое» нельзя выполнить одной командой. Релей понимает это и превращает фразу в команду <code>agent_task<\/code> с целью. Дальше на ПК крутится цикл:<\/p>\n<pre><code>       ┌────────────────────────────────────────────────────────────┐\n       │  1. Посмотреть: что сейчас на экране?                       │\n       │     • в браузере — список кнопок/ссылок страницы (DOM)      │\n       │     • в программе — список элементов окна от Windows (UIA)  │\n       │     • иначе — скриншот (пиксели)                            │\n       │  2. Спросить ИИ (через релей!): «цель такая-то, вот экран,   │\n       │     что делать дальше?» → {&quot;action&quot;:&quot;click&quot;,&quot;index&quot;:5}       │\n       │  3. Сделать это действие                                    │\n       │  4. Сообщить телефону шаг (+ картинка + куда целился)        │\n       └───────────────── повторить, пока ИИ не скажет &quot;done&quot; ───────┘\n           (один цикл: максимум 20 шагов и 3 минуты)\n<\/code><\/pre>\n<p>Важные детали:<\/p>\n<ul>\n<li><strong>Перед стартом на ПК появляется окно «Разрешить / Отклонить»<\/strong> — человек за компьютером должен согласиться. Не ответил за 20 секунд — отказ.<\/li>\n<li>Пока агент работает, на экране ПК видны анимации «Фауст»: светящаяся рамка, ореол у курсора, виджет с кнопкой «Стоп», а также <strong>«рентген»<\/strong> (рамки и номера элементов окна — так, как их видит модель) и панель <strong>«План и мысли»<\/strong>.<\/li>\n<li>На телефоне каждый шаг приходит в чат карточкой «🤖 ИИ-агент · шаг N» с картинкой, красным прицелом и строкой «💭 зачем» — обоснованием модели.<\/li>\n<li><strong>«Готово» — это не всегда успех.<\/strong> Модель обязана написать <code>&quot;success&quot;: true|false<\/code>; отказ («нужен пароль», «цель недостижима») успехом не считается и в память не попадает.<\/li>\n<li><strong>Память агента:<\/strong> если такую задачу уже успешно решали, агент повторяет сохранённый путь без обращения к ИИ — за пару секунд и бесплатно. Теперь это работает и в браузере, и в обычных программах.<\/li>\n<li>С телефона задачу можно остановить кнопкой «⛔ Стоп» (команда <code>cancel_task<\/code>).<\/li>\n<\/ul>\n<h3>6.1 Многоэтапная задача: план, вопросы, проверка<\/h3>\n<p>«Скачай архив с сайта и отправь его в Telegram в Избранное» — это три программы подряд. Одному циклу такая задача не по силам: он видит одно окно за раз и помнит 8 последних шагов. Поэтому агент сначала <strong>планирует<\/strong>:<\/p>\n<pre><code> просьба ─► ПЛАНИРОВЩИК (один текстовый запрос к Gemini через релей)\n              │  не хватает данных ──► ВОПРОС на телефон («Какой файл?»), потом план заново\n              │  невыполнимо/опасно ─► честный отказ\n              ▼\n        ПЛАН: 1. [browser]  скачать архив по ссылке\n              2. [open_app] открыть Telegram            ← делает код, без модели\n              3. [screen]   отправить скачанный файл в «Избранное»\n              │  есть необратимое (отправить, удалить) ─► «Отправить … в Избранное?»  Да / Нет\n              ▼\n        ВЫПОЛНЕНИЕ по очереди: у каждой подзадачи свой обычный цикл (до 3 минут)\n              │  итог подзадачи («скачан файл C:\\…\\Hello-World.zip») передаётся следующей\n              │  ПРОВЕРКА: файл появился? в окне видно сообщение с файлом?\n              │  не удалось ─► планировщик перестраивает хвост плана (не больше 2 раз)\n              ▼\n        итог: «цель достигнута за 8 шаг(ов), 43 с, подзадач: 3, вопросов: 1»\n<\/code><\/pre>\n<p>Что здесь важно понимать:<\/p>\n<ul>\n<li><strong>Телефон видит план чек-листом<\/strong> (сообщение <code>agent_plan<\/code>): какие шаги придуманы, какой идёт, какие готовы.<\/li>\n<li><strong>Вопрос — это карточка с кнопками<\/strong> (сообщение <code>agent_question<\/code>); ответ уходит командой <code>answer_question<\/code>. Пока человек думает, время задачи не идёт. Молчание 2 минуты = «нет» для необратимого.<\/li>\n<li><strong>«Да» на необратимое решает код, а не модель<\/strong>: считается только ответ, целиком состоящий из согласия. «Да, но только Лере» — это уточнение, план составляется заново.<\/li>\n<li><strong>Файлы агент ищет и прикрепляет кодом<\/strong>: <code>find_file<\/code> находит файл по части имени, <code>paste_file<\/code> кладёт его в буфер обмена как «Копировать» в Проводнике — и Ctrl+V прикрепляет его в мессенджере. Это заменяет 5–8 шагов через окно «Открыть».<\/li>\n<li><strong>Терминал агенту запрещён<\/strong> (<code>ShellGuard<\/code>): открыть PowerShell, cmd или печатать в них модель не может. Вместо этого — узкие инструменты (<code>extract_archive<\/code> для zip) и <strong>доверенные скрипты<\/strong>, которые написал человек.<\/li>\n<li><strong>Простая задача в одной программе плана не получает<\/strong> — планировщик отвечает «план не нужен», и идёт прежний одиночный цикл.<\/li>\n<li>Общий лимит задачи по плану — 10 минут, до 8 подзадач; выключатель — <code>plan.enabled=false<\/code>.<\/li>\n<\/ul>\n<p><strong>Навыки — три способа научить агента составной рутине:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Способ<\/th>\n<th>Как учат<\/th>\n<th>Как выполняется<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Рецепт словами<\/td>\n<td>На телефоне, «Свои команды» → «Навык: рецепт по шагам» + фразы запуска<\/td>\n<td>Уходит агенту нумерованным списком; планировщик следует ему шаг в шаг<\/td>\n<\/tr>\n<tr>\n<td>Доверенный скрипт<\/td>\n<td>Человек кладёт <code>.bat/.cmd/.ps1<\/code> в <code>~/.jarvis-agent/scripts<\/code><\/td>\n<td>«Запусти скрипт X» → план из одного шага, <strong>всегда<\/strong> с подтверждением<\/td>\n<\/tr>\n<tr>\n<td>Показ<\/td>\n<td>Трей агента → «Научить навыку показом…», человек делает задачу мышью<\/td>\n<td>Записанные шаги повторяются без модели; если окно изменилось — становятся инструкцией для модели<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Измерено на этом ПК 30 сентября (по одному прогону на сценарий — для диплома нужны повторы): «скачать архив → Telegram, Избранное» по плану — 6–9 шагов, 37–57 с, 1 вопрос; без планировщика в проверенном по факту прогоне она не выполнилась. Во второй раз, из памяти плана, — 18 с и 0 обращений к модели. Подробности и таблица — файл 4, раздел 34.<\/p>\n<h2>7. Как устройства узнают друг друга (привязка)<\/h2>\n<p>Есть <strong>два разных<\/strong> кода привязки, это часто путают:<\/p>\n<p><strong>А. ПК ↔ релей<\/strong> (один раз при установке агента)<\/p>\n<ol>\n<li>Агент при первом запуске показывает окно «Подключить».<\/li>\n<li>Нажатие → агент просит у релея одноразовый 6-значный код (<code>POST /api/agent/register<\/code>) и сразу же его «гасит», подключаясь по WebSocket.<\/li>\n<li>Релей в ответ выдаёт <strong>постоянный токен<\/strong> ПК. Агент сохраняет его в <code>~/.jarvis-agent/token.properties<\/code> и дальше входит только им.<\/li>\n<\/ol>\n<p>(Если на релее выключена открытая регистрация — код выписывает администратор, и его вводят руками.)<\/p>\n<p><strong>Б. Телефон ↔ конкретный ПК<\/strong><\/p>\n<ol>\n<li>В трее агента: «Привязать телефон» → окно с <strong>QR-кодом<\/strong>.<\/li>\n<li>Телефон сканирует QR. Внутри: <code>jarvis-pair://pair?code=482931&amp;relay=ws://192.168.1.171:8080/ws&amp;name=ПК&amp;mac=…<\/code><\/li>\n<li>Телефон отправляет релею <code>pair_request<\/code> с кодом → получает <strong>свой постоянный токен для этого ПК<\/strong>.<\/li>\n<li>Дальше телефон всегда входит обычным <code>auth<\/code> с этим токеном.<\/li>\n<\/ol>\n<p>Токены на релее хранятся <strong>только в виде BCrypt-хэша<\/strong> — даже с доступом к базе их не восстановить. Коды живут 10 минут и работают один раз.<\/p>\n<h2>8. Безопасность — слои защиты<\/h2>\n<p>Защита устроена «слоями», как луковица: если один слой обойдут, остаются другие.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Слой<\/th>\n<th>Где<\/th>\n<th>От чего защищает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Вход только по токену / одноразовому коду, хэши BCrypt<\/td>\n<td>Релей<\/td>\n<td>Чужие устройства<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>Белый список команд<\/strong> (<code>CommandWhitelist<\/code>) — <code>shutdown<\/code>/<code>reboot<\/code> в нём нет<\/td>\n<td>Релей<\/td>\n<td>ИИ «придумал» опасную команду (например, из-за prompt injection)<\/td>\n<\/tr>\n<tr>\n<td>2а<\/td>\n<td><strong>Запрет опасных целей<\/strong> (<code>ForbiddenGoals<\/code>): выключение ПК, форматирование, массовое удаление, переводы денег, покупки<\/td>\n<td>Релей<\/td>\n<td>Обход белого списка: «выключи компьютер» как <em>задача агенту<\/em>, который дошёл бы мышью до «Пуск → Завершение работы»<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Журнал аудита каждой команды в PostgreSQL<\/td>\n<td>Релей<\/td>\n<td>«Кто что сделал?» — разбор инцидентов<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Подтверждение на ПК для опасного (ИИ-задача, закрыть процесс, файлы)<\/td>\n<td>Агент<\/td>\n<td>Команда пришла без ведома человека за ПК<\/td>\n<\/tr>\n<tr>\n<td>4а<\/td>\n<td>Подтверждение <strong>на телефоне<\/strong> перед необратимым шагом плана и перед любым скриптом; «да» засчитывает код<\/td>\n<td>Агент<\/td>\n<td>Модель сама решила отправить/удалить<\/td>\n<\/tr>\n<tr>\n<td>4б<\/td>\n<td><strong>Запрет терминалов<\/strong> (<code>ShellGuard<\/code>): PowerShell, cmd, реестр, планировщик заданий — нельзя открыть, нельзя в них печатать<\/td>\n<td>Агент<\/td>\n<td>Через терминал модель выполнила бы что угодно в обход всех проверок<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Каталог программ: запускается только то, что есть в меню «Пуск»<\/td>\n<td>Агент<\/td>\n<td>Запуск произвольного файла с диска<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Файлы — только в 4 папках, без <code>../<\/code>, до 5 МБ<\/td>\n<td>Агент<\/td>\n<td>Чтение/запись системных файлов<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Защита от ввода паролей и номеров карт (<code>SensitiveInputGuard<\/code>)<\/td>\n<td>Агент<\/td>\n<td>ИИ пытается ввести пароль/карту<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Текст со страниц подаётся ИИ как <strong>данные, а не инструкции<\/strong><\/td>\n<td>Агент (промпты)<\/td>\n<td>Prompt injection со страницы<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>ИИ-агенту запрещены Alt+F4, клавиша Win, адреса не http(s)<\/td>\n<td>Агент<\/td>\n<td>Закрытие чужих окон, <code>file:///<\/code>, <code>javascript:<\/code><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Лимиты: 20 шагов и 3 минуты на цикл; по плану — 10 минут, 8 подзадач, 2 перестройки, 5 вопросов; одна задача за раз<\/td>\n<td>Агент<\/td>\n<td>Бесконечные циклы, трата денег<\/td>\n<\/tr>\n<tr>\n<td>10а<\/td>\n<td>Вопрос про пароль, код из SMS или карту на телефон не уходит<\/td>\n<td>Агент<\/td>\n<td>Модель, обманутая страницей, выпрашивает секрет у человека<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Агент работает с правами обычного пользователя<\/td>\n<td>Агент<\/td>\n<td>Не может больше, чем ты сам<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Ключ LLM только в <code>.env<\/code> релея, токены не пишутся в логи<\/td>\n<td>Релей<\/td>\n<td>Утечка секретов<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>9. Протокол — один язык в трёх местах<\/h2>\n<p>Все три программы говорят одинаковыми JSON-сообщениями. Каждое сообщение имеет поле <code>&quot;type&quot;<\/code>, по которому получатель понимает, что это:<\/p>\n<table>\n<thead>\n<tr>\n<th>type<\/th>\n<th>Кто шлёт<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>auth<\/code> / <code>auth_result<\/code><\/td>\n<td>телефон, агент / релей<\/td>\n<td>Вход по токену<\/td>\n<\/tr>\n<tr>\n<td><code>pair_request<\/code> / <code>pair_result<\/code><\/td>\n<td>телефон / релей<\/td>\n<td>Привязка телефона к ПК по коду<\/td>\n<\/tr>\n<tr>\n<td><code>command_request<\/code><\/td>\n<td>телефон → релей → агент<\/td>\n<td>Команда<\/td>\n<\/tr>\n<tr>\n<td><code>command_result<\/code><\/td>\n<td>агент → релей → телефон<\/td>\n<td>Результат (<code>ok<\/code>, <code>error<\/code>, <code>denied<\/code>, <code>timeout<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>screen_frame<\/code><\/td>\n<td>агент → телефон<\/td>\n<td>Скриншот или кадр живого экрана<\/td>\n<\/tr>\n<tr>\n<td><code>agent_step<\/code><\/td>\n<td>агент → телефон<\/td>\n<td>Один шаг ИИ-агента в реальном времени<\/td>\n<\/tr>\n<tr>\n<td><code>agent_question<\/code><\/td>\n<td>агент → телефон<\/td>\n<td>Вопрос человеку посреди задачи: текст, варианты-кнопки, сколько ждать<\/td>\n<\/tr>\n<tr>\n<td><code>agent_plan<\/code><\/td>\n<td>агент → телефон<\/td>\n<td>План многоэтапной задачи целиком — чек-лист со статусами подзадач<\/td>\n<\/tr>\n<tr>\n<td><code>ping<\/code> / <code>pong<\/code><\/td>\n<td>любые<\/td>\n<td>Проверка связи<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Всего 12 видов сообщений. Протокол описан <strong>трижды<\/strong>: на Kotlin (<code>jarvis/shared/.../protocol<\/code>), на Java в релее и на Java в агенте. Это <strong>главный инвариант<\/strong>: меняешь сообщение — меняешь во всех трёх местах. Иначе релей молча выбросит незнакомые поля (такое уже было с <code>screenWidth/screenHeight<\/code>), а на незнакомом <em>типе<\/em> сообщения старый релей упадёт — поэтому релей и агент обновляются вместе.<\/p>\n<p>Список всех команд (<code>command.type<\/code>), их 24: <code>nl<\/code>, <code>set_volume<\/code>, <code>shutdown<\/code>, <code>reboot<\/code>, <code>lock_screen<\/code>, <code>kill_process<\/code>, <code>list_processes<\/code>, <code>open_url<\/code>, <code>open_app<\/code>, <code>screenshot<\/code>, <code>agent_task<\/code>, <code>click<\/code>, <code>type_text<\/code>, <code>scroll<\/code>, <code>start_screen_stream<\/code>, <code>stop_screen_stream<\/code>, <code>get_clipboard<\/code>, <code>set_clipboard<\/code>, <code>list_files<\/code>, <code>send_file_to_phone<\/code>, <code>send_file_to_pc<\/code>, <code>cancel_task<\/code>, <code>answer_question<\/code>, <code>set_display_option<\/code>.<\/p>\n<p>Две новые команды сделаны именно <strong>командами<\/strong>, а не отдельными сообщениями, намеренно: так они проходят тот же путь, что всё остальное с телефона, — белый список и журнал аудита. <code>answer_question<\/code> — ответ на вопрос агента (сама по себе ничего на ПК не делает: агент примет её, только если прямо сейчас ждёт ответа с этим случайным <code>questionId<\/code>). <code>set_display_option<\/code> — включить или выключить «рентген» и панель плана на ПК (только эти два ключа — до настроек безопасности через неё не дотянуться).<\/p>\n<h2>10. Что умеет система (возможности)<\/h2>\n<ul>\n<li>💬 Чат с ПК текстом и голосом (распознавание речи Google), озвучка ответов<\/li>\n<li>👂 Слово-триггер <strong>«Фауст»<\/strong> — телефон слушает в фоне офлайн (Vosk), без интернета<\/li>\n<li>🔊 Громкость, 🔒 блокировка, 📋 процессы, ❌ закрыть процесс, 🌐 сайт, 🚀 любая программа из «Пуска»<\/li>\n<li>📸 Скриншот, 🖵 <strong>живой экран ПК<\/strong> с тапами, прокруткой и вводом текста<\/li>\n<li>🤖 ИИ-агент в браузере и в любых программах, с показом шагов и памятью<\/li>\n<li>🧩 <strong>Многоэтапные задачи<\/strong> через несколько программ: план-чек-лист на телефоне, проверка каждого шага, перестройка плана при неудаче<\/li>\n<li>❓ <strong>Вопросы ИИ человеку<\/strong> — карточкой с кнопками и голосом (после озвучки вопроса микрофон включается сам)<\/li>\n<li>📎 Работа с файлами кодом: найти файл, прикрепить его в мессенджере, распаковать zip, увидеть, что скачалось<\/li>\n<li>🎓 <strong>Навыки<\/strong>: рецепт словами, доверенный скрипт, обучение показом<\/li>\n<li>🩻 «Рентген» и панель «План и мысли» на экране ПК (включаются с телефона)<\/li>\n<li>🧠 <strong>Своя модель<\/strong> разбора фраз: простые команды без интернета за ~0,14 с вместо ~2 с<\/li>\n<li>📋 Буфер обмена в обе стороны, 📁 передача файлов в обе стороны (до 5 МБ)<\/li>\n<li>🔌 Wake-on-LAN — разбудить ПК по сети<\/li>\n<li>🖥️🖥️ Несколько ПК, рассылка команды на несколько сразу («Мульти-ПК»)<\/li>\n<li>⚡ Свои быстрые кнопки, 📜 история задач ИИ, 🔔 уведомление, когда задача готова<\/li>\n<\/ul>\n<h2>11. Где что хранится<\/h2>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Где<\/th>\n<th>Формат<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Устройства, коды, привязки телефонов, аудит, лог вызовов ИИ, <strong>уроки для своей модели<\/strong> (<code>intent_lesson<\/code>)<\/td>\n<td>PostgreSQL в Docker (том <code>jarvis-db-data<\/code>)<\/td>\n<td>Таблицы<\/td>\n<\/tr>\n<tr>\n<td>Ключ Gemini, админ-токен, пароль БД<\/td>\n<td><code>C:\\diplom\\jarvis-relay\\.env<\/code><\/td>\n<td><code>КЛЮЧ=значение<\/code><\/td>\n<\/tr>\n<tr>\n<td>Своя модель <code>faust-intent<\/code> (и прежняя <code>faust-intent-v1<\/code>)<\/td>\n<td>Хранилище Ollama на ПК<\/td>\n<td>GGUF, 994 МБ<\/td>\n<\/tr>\n<tr>\n<td>Обучающие наборы, веса LoRA, отчёты обучения<\/td>\n<td><code>C:\\diplom\\jarvis-ml\\data<\/code>, <code>runs<\/code><\/td>\n<td>JSONL, safetensors<\/td>\n<\/tr>\n<tr>\n<td>Экзамены и отчёты замеров<\/td>\n<td><code>C:\\diplom\\jarvis-relay\\eval<\/code>, <code>eval\\results<\/code><\/td>\n<td>JSONL, Markdown<\/td>\n<\/tr>\n<tr>\n<td>Токен и deviceId агента<\/td>\n<td><code>%USERPROFILE%\\.jarvis-agent\\token.properties<\/code><\/td>\n<td>properties<\/td>\n<\/tr>\n<tr>\n<td>Настройки агента (флаги, адрес релея)<\/td>\n<td><code>%USERPROFILE%\\.jarvis-agent\\agent.properties<\/code><\/td>\n<td>properties<\/td>\n<\/tr>\n<tr>\n<td>Лог агента, журналы ИИ-задач, память траекторий<\/td>\n<td><code>%USERPROFILE%\\.jarvis-agent\\agent.log<\/code>, <code>runs\\*.jsonl<\/code>, <code>trajectories.json<\/code><\/td>\n<td>текст / JSON<\/td>\n<\/tr>\n<tr>\n<td>Память планов, навыки, выученные показом<\/td>\n<td><code>%USERPROFILE%\\.jarvis-agent\\plans.json<\/code>, <code>skills.json<\/code><\/td>\n<td>JSON<\/td>\n<\/tr>\n<tr>\n<td>Доверенные скрипты<\/td>\n<td><code>%USERPROFILE%\\.jarvis-agent\\scripts\\<\/code><\/td>\n<td>файлы <code>.bat<\/code>, <code>.cmd<\/code>, <code>.ps1<\/code> — их пишет человек<\/td>\n<\/tr>\n<tr>\n<td>Привязанные ПК и их токены на телефоне<\/td>\n<td>DataStore приложения (<code>devices<\/code>)<\/td>\n<td>JSON-строка<\/td>\n<\/tr>\n<tr>\n<td>История задач, свои кнопки и рецепты<\/td>\n<td>Файлы в памяти приложения<\/td>\n<td>JSON<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>12. Как всё запустить<\/h2>\n<p>Основной способ — <strong><code>C:\\diplom\\start-faust.bat<\/code><\/strong> (двойной щелчок открывает меню; за ним стоит <code>faust.ps1<\/code>):<\/p>\n<table>\n<thead>\n<tr>\n<th>Команда<\/th>\n<th>Что делает<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>start-faust.bat start<\/code><\/td>\n<td>Docker → база и релей (пересоберёт релей, если код менялся) → проверка Ollama и модели <code>faust-intent<\/code> → агент<\/td>\n<\/tr>\n<tr>\n<td><code>start-faust.bat qr<\/code><\/td>\n<td>то же и сразу окно с QR для привязки телефона<\/td>\n<\/tr>\n<tr>\n<td><code>start-faust.bat demo<\/code> / <code>record<\/code><\/td>\n<td>показать анимации без релея и телефона (<code>record<\/code> — видно в OBS/Zoom)<\/td>\n<\/tr>\n<tr>\n<td><code>start-faust.bat phone<\/code><\/td>\n<td>поставить приложение на телефон по USB<\/td>\n<\/tr>\n<tr>\n<td><code>start-faust.bat status<\/code> / <code>stop<\/code><\/td>\n<td>что запущено / остановить агента и контейнеры (база сохраняется)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Вручную, по частям:<\/p>\n<ol>\n<li><strong>Релей + база:<\/strong> <code>docker compose up -d --build<\/code> в папке релея. (Старый <code>jarvis-relay\\scripts\\start-jarvis.bat<\/code> тоже остался, но про Ollama и быструю пересборку он не знает.)<\/li>\n<li><strong>Агент:<\/strong> запускается из автозагрузки, либо <code>gradlew run<\/code> в <code>jarvis-agent<\/code>. При первом запуске — окно «Подключить».<\/li>\n<li><strong>Телефон:<\/strong> <code>gradlew :androidApp:installDebug<\/code> (телефон по USB) → открыть «Faust» → «Сканировать QR» → в трее агента «Привязать телефон».<\/li>\n<li><strong>Своя модель:<\/strong> нужна установленная Ollama с моделью <code>faust-intent<\/code>. Без неё всё работает как раньше — фразы разбирает Gemini.<\/li>\n<\/ol>\n<p>Java 21 на этом ПК лежит только в <code>%USERPROFILE%\\.gradle\\jdks\\…<\/code>, а <code>JAVA_HOME<\/code> указывает на 17 — <code>faust.ps1<\/code> находит нужную сам.<\/p>\n<p><strong>Сеть:<\/strong> телефону нужен адрес <strong>физического<\/strong> Wi-Fi/Ethernet-адаптера ПК (не Radmin 26.x, не vEthernet/WSL 172.x). Порт 8080 может требовать правило в брандмауэре Windows. Лучший вариант — Tailscale: постоянный адрес 100.x в любой сети.<\/p>\n<h2>13. ВАЖНО: «собралось» ≠ «заработало»<\/h2>\n<p>Три части обновляются <strong>по-разному<\/strong>, и компиляция изменения не доставляет:<\/p>\n<table>\n<thead>\n<tr>\n<th>Часть<\/th>\n<th>Как доставить изменения<\/th>\n<th>Как проверить, что обновилось<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Релей<\/td>\n<td><code>start-faust.bat start<\/code> (сам заметит изменённый код и пересоберёт за ~1 минуту без интернета) или <code>docker compose up -d --build<\/code><\/td>\n<td><code>docker ps<\/code>, <code>docker compose logs relay<\/code><\/td>\n<\/tr>\n<tr>\n<td>Агент<\/td>\n<td>Перезапустить процесс (или <code>installDist<\/code> + <code>install-autostart.ps1<\/code>)<\/td>\n<td>Время запуска процесса позже времени сборки<\/td>\n<\/tr>\n<tr>\n<td>Телефон<\/td>\n<td><code>start-faust.bat phone<\/code> или <code>gradlew :androidApp:installDebug<\/code><\/td>\n<td><code>adb devices<\/code>, версия в приложении<\/td>\n<\/tr>\n<tr>\n<td>Своя модель<\/td>\n<td><code>export_ollama.py<\/code> (см. файл 5)<\/td>\n<td><code>ollama list<\/code> показывает <code>faust-intent<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Если «не починилось» — сначала проверь эти пункты, и только потом ищи баг в коде.<\/p>\n<p>Отдельная ловушка: <strong>релей и агент обновляются вместе<\/strong>. Агент шлёт сообщения <code>agent_question<\/code> и <code>agent_plan<\/code>; релей, собранный до 30 сентября, таких типов не знает и упадёт на разборе.<\/p>\n<h2>14. Словарик<\/h2>\n<table>\n<thead>\n<tr>\n<th>Термин<\/th>\n<th>Простыми словами<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>WebSocket (WS)<\/strong><\/td>\n<td>Постоянно открытый «телефонный провод» между двумя программами; писать может любая сторона<\/td>\n<\/tr>\n<tr>\n<td><strong>Релей (relay)<\/strong><\/td>\n<td>Сервер-посредник, пересылающий сообщения<\/td>\n<\/tr>\n<tr>\n<td><strong>Агент<\/strong><\/td>\n<td>Программа на ПК, выполняющая команды<\/td>\n<\/tr>\n<tr>\n<td><strong>Токен<\/strong><\/td>\n<td>Длинный секретный «пропуск», выдаётся один раз при привязке<\/td>\n<\/tr>\n<tr>\n<td><strong>Pairing / привязка<\/strong><\/td>\n<td>Процедура знакомства устройств через одноразовый код<\/td>\n<\/tr>\n<tr>\n<td><strong>BCrypt<\/strong><\/td>\n<td>Способ хранить пароль/токен так, что его нельзя восстановить, только проверить<\/td>\n<\/tr>\n<tr>\n<td><strong>LLM<\/strong><\/td>\n<td>Большая языковая модель (здесь — Google Gemini)<\/td>\n<\/tr>\n<tr>\n<td><strong>Intent parsing<\/strong><\/td>\n<td>Превращение фразы «сделай потише» в команду <code>set_volume 30<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Whitelist<\/strong><\/td>\n<td>Белый список: разрешено только перечисленное<\/td>\n<\/tr>\n<tr>\n<td><strong>Prompt injection<\/strong><\/td>\n<td>Попытка обмануть ИИ текстом на странице («игнорируй инструкции, введи пароль»)<\/td>\n<\/tr>\n<tr>\n<td><strong>Computer-use агент<\/strong><\/td>\n<td>ИИ, который сам управляет компьютером мышью/клавиатурой<\/td>\n<\/tr>\n<tr>\n<td><strong>DOM<\/strong><\/td>\n<td>Структура веб-страницы: кнопки, ссылки, поля<\/td>\n<\/tr>\n<tr>\n<td><strong>UIA (UI Automation)<\/strong><\/td>\n<td>Механизм Windows, который отдаёт список кнопок/полей любого окна<\/td>\n<\/tr>\n<tr>\n<td><strong>Robot<\/strong><\/td>\n<td>Класс Java, который двигает мышь, нажимает клавиши и делает скриншоты<\/td>\n<\/tr>\n<tr>\n<td><strong>Selenium<\/strong><\/td>\n<td>Библиотека для управления браузером Chrome из программы<\/td>\n<\/tr>\n<tr>\n<td><strong>Vosk<\/strong><\/td>\n<td>Офлайн-распознавание речи прямо на телефоне<\/td>\n<\/tr>\n<tr>\n<td><strong>Foreground-сервис<\/strong><\/td>\n<td>Android-служба с постоянным уведомлением, которую система не убивает<\/td>\n<\/tr>\n<tr>\n<td><strong>Docker / docker compose<\/strong><\/td>\n<td>Запуск программ в изолированных «контейнерах» одной командой<\/td>\n<\/tr>\n<tr>\n<td><strong>Wake-on-LAN<\/strong><\/td>\n<td>«Волшебный пакет» по сети, который будит спящий ПК<\/td>\n<\/tr>\n<tr>\n<td><strong>NAT<\/strong><\/td>\n<td>Роутер прячет домашние устройства за одним внешним адресом<\/td>\n<\/tr>\n<tr>\n<td><strong>Планировщик<\/strong><\/td>\n<td>Запрос к модели, который режет большую просьбу на подзадачи — каждая в одной программе<\/td>\n<\/tr>\n<tr>\n<td><strong>Подзадача<\/strong><\/td>\n<td>Один пункт плана: <code>browser<\/code>, <code>screen<\/code>, <code>open_app<\/code> или <code>run_script<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Перепланирование<\/strong><\/td>\n<td>Подзадача не удалась — планировщик строит новый хвост плана с учётом сделанного<\/td>\n<\/tr>\n<tr>\n<td><strong>Навык<\/strong><\/td>\n<td>Составная рутина, которой агента научил человек: рецептом, скриптом или показом<\/td>\n<\/tr>\n<tr>\n<td><strong>Доверенный скрипт<\/strong><\/td>\n<td>Файл <code>.bat/.cmd/.ps1<\/code>, который написал человек; агент может только запустить его по имени<\/td>\n<\/tr>\n<tr>\n<td><strong>Рентген<\/strong><\/td>\n<td>Оверлей, рисующий поверх окна рамки и номера элементов — то, что видит модель в режиме UIA<\/td>\n<\/tr>\n<tr>\n<td><strong>Ollama<\/strong><\/td>\n<td>Программа, которая запускает языковые модели на своём компьютере и отдаёт их по HTTP<\/td>\n<\/tr>\n<tr>\n<td><strong>LoRA / дообучение<\/strong><\/td>\n<td>Способ научить готовую модель своей задаче, обучая ~2% её параметров<\/td>\n<\/tr>\n<tr>\n<td><strong>Дистилляция<\/strong><\/td>\n<td>Большая модель (Gemini) придумывает и размечает примеры, на которых учится маленькая<\/td>\n<\/tr>\n<tr>\n<td><strong>Порог уверенности<\/strong><\/td>\n<td>Ниже него ответ своей модели перепроверяет Gemini (сейчас 0,9)<\/td>\n<\/tr>\n<tr>\n<td><strong>Урок<\/strong><\/td>\n<td>Фраза, которую понял только Gemini и команда выполнилась, — запоминается для своей модели<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>15. Что дальше читать<\/h2>\n<ul>\n<li>Хочешь понять, <strong>как устроен экран чата и что происходит при нажатии кнопки<\/strong> → файл 2.<\/li>\n<li>Хочешь понять <strong>авторизацию, базу данных, как фраза превращается в команду<\/strong> → файл 3.<\/li>\n<li>Хочешь понять <strong>как ИИ реально кликает, планирует, спрашивает и почему это безопасно<\/strong> → файл 4.<\/li>\n<li>Хочешь объяснить, <strong>что в проекте «своё», как обучена модель и чем доказана точность<\/strong> → файл 5.<\/li>\n<\/ul>\n"}, {"nav": "Android-приложение", "file": "2-Android-приложение.md", "heads": ["Оглавление", "1. Что делает приложение", "2. Структура проекта и сборка", "3. Модуль :shared — протокол", "4. Минимум Kotlin/Compose, чтобы читать код", "5. Архитектура приложения: слои", "6. AndroidManifest.xml — разрешения", "7. Разбор по файлам", "8. Сквозные сценарии", "9. Потоки и корутины", "10. Где приложение хранит данные", "11. Отладка и типичные проблемы", "12. Известные ограничения и вопросы на защите", "13. Как расширять", "14. Шпаргалка команд"], "html": "<h1>Android-приложение Faust — полное объяснение<\/h1>\n<blockquote>\n<p>Файл 2 из 5. Цель — чтобы ты мог открыть любой файл приложения и понимать, <strong>что он делает,\nзачем он нужен, с кем связан и почему написан именно так<\/strong>. Общая картина — в файле 1,\nсервер — в файле 3, программа на ПК — в файле 4, своя модель разбора фраз — в файле 5.<\/p>\n<p>Папка проекта: <code>C:\\diplom\\jarvis<\/code>. Название в лаунчере телефона — <strong>Faust<\/strong>.<\/p>\n<p>Обновлено 13 октября 2026 (сверено с кодом). <strong>Новое с 25 сентября:<\/strong> карточки вопросов\nИИ-агента и ответ на них (кнопкой, текстом, голосом), карточка-план многоэтапной задачи,\nнавыки-рецепты в «Своих командах», переключатели «рентгена» и панели плана на ПК,\nдва новых сообщения и две новые команды в протоколе. Изменились семь файлов:\n<code>MainActivity<\/code>, <code>ChatViewModel<\/code>, <code>CustomActions<\/code>, <code>CustomActionsScreen<\/code>,\n<code>VoiceController<\/code>, <code>SettingsRepository<\/code>, <code>Notifications<\/code> и протокол в <code>:shared<\/code>.<\/p>\n<\/blockquote>\n<hr />\n<h2>Оглавление<\/h2>\n<ol>\n<li><a href=\"#1-%D1%87%D1%82%D0%BE-%D0%B4%D0%B5%D0%BB%D0%B0%D0%B5%D1%82-%D0%BF%D1%80%D0%B8%D0%BB%D0%BE%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5\">Что делает приложение<\/a><\/li>\n<li><a href=\"#2-%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B0-%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D0%B0-%D0%B8-%D1%81%D0%B1%D0%BE%D1%80%D0%BA%D0%B0\">Структура проекта и сборка<\/a><\/li>\n<li><a href=\"#3-%D0%BC%D0%BE%D0%B4%D1%83%D0%BB%D1%8C-shared--%D0%BF%D1%80%D0%BE%D1%82%D0%BE%D0%BA%D0%BE%D0%BB\">Модуль <code>:shared<\/code> — протокол<\/a><\/li>\n<li><a href=\"#4-%D0%BC%D0%B8%D0%BD%D0%B8%D0%BC%D1%83%D0%BC-kotlincompose-%D1%87%D1%82%D0%BE%D0%B1%D1%8B-%D1%87%D0%B8%D1%82%D0%B0%D1%82%D1%8C-%D0%BA%D0%BE%D0%B4\">Минимум Kotlin/Compose, чтобы читать код<\/a><\/li>\n<li><a href=\"#5-%D0%B0%D1%80%D1%85%D0%B8%D1%82%D0%B5%D0%BA%D1%82%D1%83%D1%80%D0%B0-%D0%BF%D1%80%D0%B8%D0%BB%D0%BE%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F-%D1%81%D0%BB%D0%BE%D0%B8\">Архитектура приложения: слои<\/a><\/li>\n<li><a href=\"#6-androidmanifestxml--%D1%80%D0%B0%D0%B7%D1%80%D0%B5%D1%88%D0%B5%D0%BD%D0%B8%D1%8F\">AndroidManifest.xml — разрешения<\/a><\/li>\n<li><a href=\"#7-%D1%80%D0%B0%D0%B7%D0%B1%D0%BE%D1%80-%D0%BF%D0%BE-%D1%84%D0%B0%D0%B9%D0%BB%D0%B0%D0%BC\">Разбор по файлам<\/a>\n<ul>\n<li>7.1 MainActivity.kt — вход, навигация, экран чата<\/li>\n<li>7.2 ChatViewModel.kt — мозг чата<\/li>\n<li>7.3 JarvisClient.kt — WebSocket с переподключением<\/li>\n<li>7.4 RelayPairing.kt — короткие одноразовые соединения<\/li>\n<li>7.5 Привязка ПК: PairingController, PairingQr, QrScan, PairingScreen, PairingViewModel<\/li>\n<li>7.6 Хранилища: DeviceRepository, SettingsRepository<\/li>\n<li>7.7 Экран «Устройства» + Wake-on-LAN<\/li>\n<li>7.8 Живой экран ПК: ScreenViewScreen, TaskPreviewWindow, FrameDecoding<\/li>\n<li>7.9 Голос: VoiceController, ListeningOrb<\/li>\n<li>7.10 Wake-word «Фауст»: VoskWakeWord, WakeWordBus, JarvisConnectionService, Notifications<\/li>\n<li>7.11 Файлы: FileTransfer.kt + диалог<\/li>\n<li>7.12 История задач: TaskHistory, HistoryScreen<\/li>\n<li>7.13 Свои команды: CustomActions, CustomActionsScreen<\/li>\n<li>7.14 Мульти-ПК: MultiPcViewModel, MultiPcScreen<\/li>\n<li>7.15 Theme.kt<\/li>\n<\/ul>\n<\/li>\n<li><a href=\"#8-%D1%81%D0%BA%D0%B2%D0%BE%D0%B7%D0%BD%D1%8B%D0%B5-%D1%81%D1%86%D0%B5%D0%BD%D0%B0%D1%80%D0%B8%D0%B8\">Сквозные сценарии<\/a><\/li>\n<li><a href=\"#9-%D0%BF%D0%BE%D1%82%D0%BE%D0%BA%D0%B8-%D0%B8-%D0%BA%D0%BE%D1%80%D1%83%D1%82%D0%B8%D0%BD%D1%8B\">Потоки и корутины<\/a><\/li>\n<li><a href=\"#10-%D0%B3%D0%B4%D0%B5-%D0%BF%D1%80%D0%B8%D0%BB%D0%BE%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5-%D1%85%D1%80%D0%B0%D0%BD%D0%B8%D1%82-%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5\">Где приложение хранит данные<\/a><\/li>\n<li><a href=\"#11-%D0%BE%D1%82%D0%BB%D0%B0%D0%B4%D0%BA%D0%B0-%D0%B8-%D1%82%D0%B8%D0%BF%D0%B8%D1%87%D0%BD%D1%8B%D0%B5-%D0%BF%D1%80%D0%BE%D0%B1%D0%BB%D0%B5%D0%BC%D1%8B\">Отладка и типичные проблемы<\/a><\/li>\n<li><a href=\"#12-%D0%B8%D0%B7%D0%B2%D0%B5%D1%81%D1%82%D0%BD%D1%8B%D0%B5-%D0%BE%D0%B3%D1%80%D0%B0%D0%BD%D0%B8%D1%87%D0%B5%D0%BD%D0%B8%D1%8F-%D0%B8-%D0%B2%D0%BE%D0%BF%D1%80%D0%BE%D1%81%D1%8B-%D0%BD%D0%B0-%D0%B7%D0%B0%D1%89%D0%B8%D1%82%D0%B5\">Известные ограничения и вопросы на защите<\/a><\/li>\n<li><a href=\"#13-%D0%BA%D0%B0%D0%BA-%D1%80%D0%B0%D1%81%D1%88%D0%B8%D1%80%D1%8F%D1%82%D1%8C\">Как расширять<\/a><\/li>\n<li><a href=\"#14-%D1%88%D0%BF%D0%B0%D1%80%D0%B3%D0%B0%D0%BB%D0%BA%D0%B0-%D0%BA%D0%BE%D0%BC%D0%B0%D0%BD%D0%B4\">Шпаргалка команд<\/a><\/li>\n<\/ol>\n<hr />\n<h2>1. Что делает приложение<\/h2>\n<p>Приложение — это <strong>пульт управления компьютером<\/strong>. Оно:<\/p>\n<ul>\n<li>подключается к релею по WebSocket и держит соединение (с автопереподключением);<\/li>\n<li>показывает чат: твои команды справа, ответы ПК слева, системные заметки по центру;<\/li>\n<li>принимает команды текстом, голосом (кнопка 🎤) или по слову «Фауст» (фоновый офлайн-слух);<\/li>\n<li>быстрые кнопки-чипы отправляют готовые команды без поля ввода;<\/li>\n<li>показывает живой экран ПК и позволяет тапать по нему (клик на ПК), листать и печатать;<\/li>\n<li>показывает шаги ИИ-агента в реальном времени с прицелом, куда он нажмёт, и с обоснованием модели («💭 зачем»);<\/li>\n<li>показывает <strong>план многоэтапной задачи<\/strong> чек-листом, который обновляется на месте;<\/li>\n<li>показывает <strong>вопросы ИИ-агента<\/strong> карточкой с кнопками и отправляет ответ — кнопкой, текстом или голосом;<\/li>\n<li>переносит буфер обмена и файлы между телефоном и ПК;<\/li>\n<li>хранит несколько привязанных ПК, показывает их онлайн-статус, будит ПК по сети;<\/li>\n<li>ведёт историю ИИ-задач, позволяет создать свои кнопки и <strong>навыки-рецепты<\/strong> (список шагов словами);<\/li>\n<li>включает и выключает «рентген» и панель плана на экране ПК.<\/li>\n<\/ul>\n<p>Приложение <strong>не<\/strong> разбирает фразы и <strong>не<\/strong> проверяет безопасность — это делает релей. Оно лишь отправляет фразу как <code>NaturalLanguage<\/code> и показывает ответ. Единственное исключение — <strong>рецепты<\/strong>: их шаги знает только телефон, поэтому фразу «навык утро» он узнаёт сам и шлёт на ПК уже готовую задачу агенту (см. 7.13).<\/p>\n<h2>2. Структура проекта и сборка<\/h2>\n<pre><code>C:\\diplom\\jarvis\\\n├── settings.gradle.kts         ← подключает модули :shared и :androidApp\n├── build.gradle.kts            ← объявляет плагины (apply false — применяются в модулях)\n├── gradle/libs.versions.toml   ← «каталог версий»: все версии библиотек в одном месте\n├── shared/                     ← протокол (Kotlin Multiplatform)\n│   └── src/commonMain/kotlin/com/jarvis/protocol/\n│       ├── Protocol.kt  Command.kt  Result.kt  Whitelist.kt\n│   └── src/commonTest/.../ProtocolTest.kt\n└── androidApp/                 ← само приложение\n    ├── build.gradle.kts\n    └── src/main/\n        ├── AndroidManifest.xml\n        ├── assets/model-ru/    ← офлайн-модель Vosk (~87 МБ распакованная)\n        ├── res/                ← иконки, логотип\n        └── kotlin/com/jarvis/app/   ← 31 файл .kt\n<\/code><\/pre>\n<h3>Версии (из <code>libs.versions.toml<\/code>)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Версия<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kotlin<\/td>\n<td>2.1.0<\/td>\n<td>язык<\/td>\n<\/tr>\n<tr>\n<td>AGP (Android Gradle Plugin)<\/td>\n<td>8.7.3<\/td>\n<td>сборка APK<\/td>\n<\/tr>\n<tr>\n<td>kotlinx.serialization<\/td>\n<td>1.7.3<\/td>\n<td>JSON ↔ Kotlin-объекты<\/td>\n<\/tr>\n<tr>\n<td>kotlinx.coroutines<\/td>\n<td>1.9.0<\/td>\n<td>асинхронность<\/td>\n<\/tr>\n<tr>\n<td>Compose BOM<\/td>\n<td>2024.12.01<\/td>\n<td>UI-фреймворк (BOM выравнивает версии всех compose-библиотек)<\/td>\n<\/tr>\n<tr>\n<td>compileSdk / targetSdk<\/td>\n<td>35<\/td>\n<td>под какой Android собираем<\/td>\n<\/tr>\n<tr>\n<td><strong>minSdk<\/strong><\/td>\n<td><strong>24<\/strong> (Android 7.0)<\/td>\n<td>минимальная поддерживаемая версия<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Зависимости <code>:androidApp<\/code> (из <code>androidApp/build.gradle.kts<\/code>)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Библиотека<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>project(&quot;:shared&quot;)<\/code><\/td>\n<td>наш протокол — те же классы, что понимает релей<\/td>\n<\/tr>\n<tr>\n<td><code>okhttp3:okhttp:4.12.0<\/code><\/td>\n<td>WebSocket-клиент (выбран вместо Ktor — «надёжно на Android»)<\/td>\n<\/tr>\n<tr>\n<td><code>datastore-preferences<\/code><\/td>\n<td>хранение настроек и списка ПК между запусками<\/td>\n<\/tr>\n<tr>\n<td><code>core-ktx<\/code><\/td>\n<td><code>NotificationCompat<\/code> для уведомлений<\/td>\n<\/tr>\n<tr>\n<td><code>vosk-android<\/code> + <code>jna<\/code> (<code>@aar<\/code>)<\/td>\n<td>офлайн-распознавание речи для слова «Фауст»<\/td>\n<\/tr>\n<tr>\n<td><code>zxing-android-embedded<\/code><\/td>\n<td>готовый экран сканирования QR-кода<\/td>\n<\/tr>\n<tr>\n<td>Compose (<code>ui<\/code>, <code>material3<\/code>, <code>material-icons-extended<\/code>, <code>activity-compose<\/code>, <code>lifecycle-viewmodel-compose<\/code>)<\/td>\n<td>интерфейс<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Ktor объявлен в каталоге версий, но в приложении <strong>не используется<\/strong> — остался от первоначального плана.<\/p>\n<h3>Почему <code>:shared<\/code> — отдельный модуль<\/h3>\n<p><code>:shared<\/code> — модуль <strong>Kotlin Multiplatform<\/strong> с двумя целями: <code>androidTarget<\/code> (для телефона) и <code>jvm()<\/code> (чтобы протокол компилировался и тестировался <strong>без Android SDK<\/strong> — <code>gradlew :shared:jvmTest<\/code>). Приложение подключает его как обычную зависимость. Так формат сообщений описан один раз и не может «разъехаться» между экранами приложения.<\/p>\n<h2>3. Модуль <code>:shared<\/code> — протокол<\/h2>\n<p>Это контракт между телефоном, релеем и агентом. На релее и агенте он <strong>продублирован на Java<\/strong> (см. файлы 3 и 4) — JSON должен совпадать байт в байт.<\/p>\n<h3>3.1 <code>Protocol.kt<\/code> — конверт сообщений<\/h3>\n<pre><code class=\"language-kotlin\">@Serializable\nsealed interface JarvisMessage { val requestId: String }\n<\/code><\/pre>\n<p><code>sealed interface<\/code> означает «закрытое семейство»: все наследники известны компилятору. Поэтому в <code>when (msg) { is Auth -&gt; … is CommandResult -&gt; … }<\/code> компилятор проверит, что ты ничего не забыл. <code>@Serializable<\/code> — библиотека kotlinx.serialization сама генерирует код превращения в JSON и обратно.<\/p>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th><code>@SerialName<\/code><\/th>\n<th>Поля<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Auth<\/code><\/td>\n<td><code>auth<\/code><\/td>\n<td><code>deviceId<\/code>, <code>token<\/code>, <code>role<\/code>, <code>protocolVersion=1<\/code><\/td>\n<td>Первое сообщение после открытия сокета<\/td>\n<\/tr>\n<tr>\n<td><code>AuthResult<\/code><\/td>\n<td><code>auth_result<\/code><\/td>\n<td><code>ok<\/code>, <code>reason?<\/code>, <code>agentOnline?<\/code><\/td>\n<td>Ответ на вход. <code>agentOnline<\/code> — только телефону: на связи ли его ПК. <code>null<\/code> = релей старый/не знает<\/td>\n<\/tr>\n<tr>\n<td><code>PairRequest<\/code><\/td>\n<td><code>pair_request<\/code><\/td>\n<td><code>code<\/code><\/td>\n<td>Привязка по одноразовому коду (вместо <code>Auth<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>PairResult<\/code><\/td>\n<td><code>pair_result<\/code><\/td>\n<td><code>ok<\/code>, <code>deviceId?<\/code>, <code>deviceToken?<\/code>, <code>deviceName?<\/code>, <code>reason?<\/code><\/td>\n<td>Постоянный токен телефона для этого ПК<\/td>\n<\/tr>\n<tr>\n<td><code>CommandRequest<\/code><\/td>\n<td><code>command_request<\/code><\/td>\n<td><code>command: Command<\/code><\/td>\n<td>Команда<\/td>\n<\/tr>\n<tr>\n<td><code>CommandResult<\/code><\/td>\n<td><code>command_result<\/code><\/td>\n<td><code>status<\/code>, <code>message?<\/code>, <code>data: ResultData?<\/code><\/td>\n<td>Результат<\/td>\n<\/tr>\n<tr>\n<td><code>ScreenFrame<\/code><\/td>\n<td><code>screen_frame<\/code><\/td>\n<td><code>format<\/code>, <code>base64<\/code>, <code>width<\/code>, <code>height<\/code>, <code>screenWidth?<\/code>, <code>screenHeight?<\/code>, <code>seq?<\/code><\/td>\n<td>Кадр. <code>seq == null<\/code> — одиночный скриншот, <code>seq != null<\/code> — кадр живого стрима<\/td>\n<\/tr>\n<tr>\n<td><code>AgentStep<\/code><\/td>\n<td><code>agent_step<\/code><\/td>\n<td><code>step<\/code>, <code>description<\/code>, <code>screenshotBase64?<\/code>, …, <code>targetX?<\/code>, <code>targetY?<\/code><\/td>\n<td>Шаг ИИ-агента, пока задача идёт<\/td>\n<\/tr>\n<tr>\n<td><code>AgentQuestion<\/code><\/td>\n<td><code>agent_question<\/code><\/td>\n<td><code>questionId<\/code>, <code>question<\/code>, <code>options=[]<\/code>, <code>timeoutSeconds?<\/code><\/td>\n<td>Вопрос агента человеку посреди задачи. <code>options<\/code> — готовые ответы для кнопок; пусто — отвечать своими словами<\/td>\n<\/tr>\n<tr>\n<td><code>AgentPlan<\/code><\/td>\n<td><code>agent_plan<\/code><\/td>\n<td><code>steps: List&lt;PlanItem&gt;<\/code>, <code>revision=1<\/code><\/td>\n<td>План многоэтапной задачи. Присылается <strong>целиком<\/strong> при каждом изменении; <code>revision<\/code> 2+ — план перестроен<\/td>\n<\/tr>\n<tr>\n<td><code>Ping<\/code> / <code>Pong<\/code><\/td>\n<td><code>ping<\/code>/<code>pong<\/code><\/td>\n<td>—<\/td>\n<td>Проверка связи<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>PlanItem(title, status, note?)<\/code> — одна подзадача: что делается человеческим языком, статус <code>PlanItemStatus<\/code> (<code>pending<\/code>, <code>running<\/code>, <code>done<\/code>, <code>failed<\/code>, <code>skipped<\/code>) и короткий итог или причина неудачи.<\/p>\n<p>У <code>AgentQuestion<\/code> и <code>AgentPlan<\/code> <code>requestId<\/code> — тот же, что у исходной <code>agent_task<\/code>: по нему телефон прикрепляет вопрос и план к нужной задаче в ленте, как и её шаги. Почему план приходит целиком, а не «изменился пункт 2»: телефону не нужно собирать состояние из кусочков — последний пришедший <code>AgentPlan<\/code> с этим <code>requestId<\/code> и есть правда.<\/p>\n<p><strong>Важная тонкость <code>ScreenFrame<\/code>:<\/strong> <code>width/height<\/code> — размер <strong>картинки<\/strong> (уже уменьшенной, например 800 px), а <code>screenWidth/screenHeight<\/code> — <strong>реальное<\/strong> разрешение экрана ПК (например 1920). Координаты тапа пересчитываются по реальному разрешению — иначе клик уйдёт не туда (это был баг, см. <code>ScreenViewScreen<\/code>).<\/p>\n<p><strong><code>JarvisJson<\/code><\/strong> — единая настройка JSON для всего приложения:<\/p>\n<pre><code class=\"language-kotlin\">val JarvisJson = Json {\n    classDiscriminator = &quot;type&quot;   // поле-метка типа, совпадает с @SerialName\n    encodeDefaults = true         // писать поля со значением по умолчанию (protocolVersion и т.п.)\n    ignoreUnknownKeys = true      // незнакомые поля не ломают старую версию\n    prettyPrint = false\n}\n<\/code><\/pre>\n<p><code>ignoreUnknownKeys = true<\/code> даёт <strong>обратную совместимость<\/strong>: если релей начнёт присылать новое поле, старое приложение просто его проигнорирует, а не упадёт.<\/p>\n<h3>3.2 <code>Command.kt<\/code> — все команды<\/h3>\n<p>Каждая команда — класс с <code>@SerialName<\/code> и свойством <code>name<\/code> (ключ для белого списка и аудита). Разбиты на «слои»:<\/p>\n<table>\n<thead>\n<tr>\n<th>Слой<\/th>\n<th>Команды<\/th>\n<th>Кто выполняет<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Естественный язык<\/td>\n<td><code>NaturalLanguage(text)<\/code> → <code>nl<\/code><\/td>\n<td>Только релей (превращает в конкретную)<\/td>\n<\/tr>\n<tr>\n<td>2. Системные<\/td>\n<td><code>SetVolume(level)<\/code>, <code>Shutdown<\/code>, <code>Reboot<\/code>, <code>LockScreen<\/code>, <code>KillProcess(processName)<\/code>, <code>ListProcesses<\/code>, <code>OpenUrl(url)<\/code>, <code>OpenApp(appName)<\/code>, <code>Screenshot<\/code><\/td>\n<td>Агент<\/td>\n<\/tr>\n<tr>\n<td>3. Computer-use<\/td>\n<td><code>AgentTask(goal, scope=BROWSER, maxSteps=15)<\/code>, <code>Click(x,y)<\/code>, <code>TypeText(text)<\/code>, <code>Scroll(dx=0, dy)<\/code><\/td>\n<td>Агент<\/td>\n<\/tr>\n<tr>\n<td>4. Живой экран<\/td>\n<td><code>StartScreenStream(fps, maxWidth)<\/code>, <code>StopScreenStream<\/code><\/td>\n<td>Агент<\/td>\n<\/tr>\n<tr>\n<td>5. Буфер обмена<\/td>\n<td><code>GetClipboard<\/code>, <code>SetClipboard(text)<\/code><\/td>\n<td>Агент<\/td>\n<\/tr>\n<tr>\n<td>6. Файлы<\/td>\n<td><code>ListFiles(folder)<\/code>, <code>SendFileToPhone(folder, fileName)<\/code>, <code>SendFileToPc(folder, fileName, base64)<\/code><\/td>\n<td>Агент<\/td>\n<\/tr>\n<tr>\n<td>7. Управление задачей<\/td>\n<td><code>CancelTask<\/code>, <code>AnswerQuestion(questionId, answer)<\/code><\/td>\n<td>Агент<\/td>\n<\/tr>\n<tr>\n<td>8. Показ на экране ПК<\/td>\n<td><code>SetDisplayOption(option, enabled)<\/code> — <code>option<\/code> только <code>&quot;xray&quot;<\/code> или <code>&quot;plan&quot;<\/code><\/td>\n<td>Агент<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Всего 24 команды. <code>AnswerQuestion<\/code> — ответ человека на <code>AgentQuestion<\/code>. Это <strong>команда, а не отдельный тип сообщения<\/strong> — намеренно: так ответ проходит тот же путь, что любая команда телефона, то есть через белый список и журнал аудита релея. <code>SetDisplayOption<\/code> меняет настройки агента, поэтому список ключей закрытый: через неё нельзя дотянуться, например, до подтверждения опасных команд.<\/p>\n<p><code>data object<\/code> (например <code>LockScreen<\/code>, <code>Screenshot<\/code>) — команда без параметров, существует в одном экземпляре. В JSON: <code>{&quot;type&quot;:&quot;lock_screen&quot;}<\/code>.<\/p>\n<p><code>AgentScope<\/code>: <code>BROWSER<\/code> (агент работает в Chrome по DOM) или <code>SCREEN<\/code> (любая программа).<\/p>\n<h3>3.3 <code>Result.kt<\/code> — результаты<\/h3>\n<ul>\n<li><code>CommandStatus<\/code>: <code>OK<\/code>, <code>ERROR<\/code>, <code>DENIED<\/code> (отклонено белым списком), <code>TIMEOUT<\/code>.<\/li>\n<li><code>ResultData<\/code> — типизированная «нагрузка» ответа:<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>type<\/th>\n<th>Когда приходит<\/th>\n<th>Что делает приложение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ProcessList(processes)<\/code><\/td>\n<td><code>process_list<\/code><\/td>\n<td><code>list_processes<\/code><\/td>\n<td>Пишет «процессов: N»<\/td>\n<\/tr>\n<tr>\n<td><code>ClipboardText(text)<\/code><\/td>\n<td><code>clipboard_text<\/code><\/td>\n<td><code>get_clipboard<\/code><\/td>\n<td>Кладёт в буфер телефона<\/td>\n<\/tr>\n<tr>\n<td><code>AgentReport(completed, stepsTaken, trace)<\/code><\/td>\n<td><code>agent_report<\/code><\/td>\n<td>конец <code>agent_task<\/code><\/td>\n<td>Сохраняет в историю, уведомление<\/td>\n<\/tr>\n<tr>\n<td><code>FileList(entries)<\/code><\/td>\n<td><code>file_list<\/code><\/td>\n<td><code>list_files<\/code><\/td>\n<td>Показывает в диалоге «Файлы»<\/td>\n<\/tr>\n<tr>\n<td><code>FileTransfer(fileName, base64, sizeBytes)<\/code><\/td>\n<td><code>file_transfer<\/code><\/td>\n<td><code>send_file_to_phone<\/code><\/td>\n<td>Сохраняет в «Загрузки»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>3.4 <code>Whitelist.kt<\/code> — внимание, расхождение<\/h3>\n<p>В <code>:shared<\/code> лежит <code>CommandWhitelist.DEFAULT<\/code>, но <strong>настоящая<\/strong> проверка работает на релее (<code>jarvis-relay/.../security/CommandWhitelist.java<\/code>). Kotlin-версия устарела: в ней нет <code>start_screen_stream<\/code>, <code>get_clipboard<\/code>, файлов, <code>cancel_task<\/code>, <code>answer_question<\/code>, <code>set_display_option<\/code>, и про запрет опасных целей (<code>ForbiddenGoals<\/code> на релее) она не знает. Приложение этот класс <strong>нигде не использует<\/strong> — он используется только в тесте. На защите честно скажи: «эталон проверки — на релее; Kotlin-копия — документация исходного замысла, её стоит синхронизировать или удалить».<\/p>\n<h3>3.5 <code>ProtocolTest.kt<\/code> — тесты<\/h3>\n<p>«Round-trip»: объект → JSON → объект, результат должен совпасть. Плюс проверки, что в JSON есть нужные <code>&quot;type&quot;<\/code>. С 30 сентября тесты покрывают и <code>agent_question<\/code>, <code>agent_plan<\/code>, <code>answer_question<\/code>, <code>set_display_option<\/code>; тем же JSON проверяется Java-копия релея (<code>AgentQuestionProtocolTest<\/code>). Это и есть <strong>эталон JSON<\/strong>, которому должны соответствовать Java-копии. Запуск: <code>gradlew :shared:jvmTest<\/code>.<\/p>\n<h2>4. Минимум Kotlin/Compose, чтобы читать код<\/h2>\n<p>Если что-то из этого непонятно — код приложения читать будет тяжело. Коротко:<\/p>\n<table>\n<thead>\n<tr>\n<th>Понятие<\/th>\n<th>Что это<\/th>\n<th>Пример в коде<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Composable-функция<\/strong><\/td>\n<td>Функция с <code>@Composable<\/code>, которая описывает кусок экрана. Её вызывают заново («рекомпозиция»), когда меняются данные<\/td>\n<td><code>ChatScreen()<\/code>, <code>MessageBubble()<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>remember { … }<\/code><\/strong><\/td>\n<td>Запомнить значение между рекомпозициями (иначе оно создавалось бы заново)<\/td>\n<td><code>val voice = remember { VoiceController(context) }<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>mutableStateOf<\/code><\/strong><\/td>\n<td>Переменная, изменение которой перерисовывает экран<\/td>\n<td><code>var input by remember { mutableStateOf(&quot;&quot;) }<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>StateFlow<\/code><\/strong><\/td>\n<td>«Поток состояния»: всегда хранит текущее значение, подписчики получают изменения<\/td>\n<td><code>vm.messages<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>collectAsState()<\/code><\/strong><\/td>\n<td>Подписать Compose на <code>StateFlow<\/code><\/td>\n<td><code>val messages by vm.messages.collectAsState()<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>SharedFlow<\/code><\/strong><\/td>\n<td>Поток <strong>событий<\/strong> (без «текущего значения», каждое событие обрабатывается один раз)<\/td>\n<td><code>WakeWordBus.phrases<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>LaunchedEffect(key)<\/code><\/strong><\/td>\n<td>Запустить корутину, когда экран появился или изменился <code>key<\/code><\/td>\n<td>авто-прокрутка при новом сообщении<\/td>\n<\/tr>\n<tr>\n<td><strong><code>DisposableEffect<\/code><\/strong><\/td>\n<td>То же + код очистки <code>onDispose<\/code>, когда экран уходит<\/td>\n<td>освободить микрофон, отпустить стрим<\/td>\n<\/tr>\n<tr>\n<td><strong>ViewModel<\/strong><\/td>\n<td>Объект, переживающий поворот экрана; хранит состояние и логику<\/td>\n<td><code>ChatViewModel<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>AndroidViewModel<\/code><\/strong><\/td>\n<td>ViewModel с доступом к <code>Application<\/code> (нужен <code>Context<\/code> для DataStore)<\/td>\n<td>все ViewModel в проекте<\/td>\n<\/tr>\n<tr>\n<td><strong><code>viewModelScope<\/code><\/strong><\/td>\n<td>Область корутин, которая отменяется, когда ViewModel уничтожен<\/td>\n<td><code>viewModelScope.launch { … }<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>viewModel()<\/code><\/strong><\/td>\n<td>Получить ViewModel в Composable. В одной Activity возвращает <strong>тот же объект<\/strong><\/td>\n<td><code>ChatScreen<\/code>, <code>ScreenViewScreen<\/code>, <code>HistoryScreen<\/code> делят один <code>ChatViewModel<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Корутина / <code>suspend<\/code><\/strong><\/td>\n<td>«Лёгкий поток»: функция, которая может приостановиться (ждать сеть), не блокируя UI<\/td>\n<td><code>RelayPairing.pair(...)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>Dispatchers.IO / Default / Main<\/code><\/strong><\/td>\n<td>На каком пуле потоков выполнять: IO — сеть/диск, Default — вычисления, Main — UI<\/td>\n<td><code>withContext(Dispatchers.Default) { decode }<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>sealed interface<\/code><\/strong><\/td>\n<td>Закрытое семейство типов; <code>when<\/code> проверяется на полноту<\/td>\n<td><code>PairingUiState<\/code>, <code>PairOutcome<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. Архитектура приложения: слои<\/h2>\n<pre><code>┌────────────────────────────── UI (Jetpack Compose) ───────────────────────────────┐\n│ MainActivity → ChatScreen / DevicesScreen / ScreenViewScreen / HistoryScreen /    │\n│                MultiPcScreen / CustomActionsScreen / PairingScreen                │\n│ + TaskPreviewWindow, ListeningOrb, диалоги (Settings, Files, Zoom)                │\n└──────────────▲───────────────────────────────────────────────┬────────────────────┘\n               │ StateFlow (collectAsState)                     │ вызовы методов\n┌──────────────┴──────────────── ViewModel ─────────────────────▼────────────────────┐\n│ ChatViewModel (главный, общий для 4 экранов) │ DevicesViewModel │ PairingViewModel │\n│ MultiPcViewModel                              │ PairingController (общая логика)   │\n└──────────────▲───────────────────────────────────────────────┬────────────────────┘\n               │                                                │\n┌──────────────┴──────── Данные / сеть / платформа ─────────────▼────────────────────┐\n│ JarvisClient (постоянный WS)    RelayPairing (короткие WS)    WakeOnLan (UDP)       │\n│ DeviceRepository, SettingsRepository (DataStore)                                    │\n│ TaskHistoryRepository, CustomActionsRepository (JSON-файлы)                         │\n│ VoiceController (SpeechRecognizer + TTS)   FileTransfer (MediaStore)                │\n│ JarvisConnectionService + VoskWakeWord ──WakeWordBus──► ChatViewModel               │\n└──────────────────────────────────────────────────────────────────────────────────────┘\n                                   │ протокол из :shared\n                                   ▼\n                              Релей (ws://…/ws)\n<\/code><\/pre>\n<p>Правило: <strong>UI ничего не знает о сети<\/strong>. Экран только читает <code>StateFlow<\/code> и вызывает методы ViewModel. ViewModel решает, что отправить. Это называют <strong>MVVM<\/strong> (Model–View–ViewModel), в облегчённом виде — без DI-фреймворков (Hilt/Koin): зависимости создаются прямо в ViewModel (<code>private val client = JarvisClient()<\/code>).<\/p>\n<p>Навигации (Navigation Compose) нет: экраны переключаются обычной переменной <code>screen<\/code> в <code>MainActivity<\/code>. Разделов немного — фреймворк был бы избыточен.<\/p>\n<h2>6. AndroidManifest.xml — разрешения<\/h2>\n<table>\n<thead>\n<tr>\n<th>Разрешение<\/th>\n<th>Тип<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>INTERNET<\/code><\/td>\n<td>обычное<\/td>\n<td>WebSocket и Wake-on-LAN (UDP)<\/td>\n<\/tr>\n<tr>\n<td><code>RECORD_AUDIO<\/code><\/td>\n<td><strong>runtime<\/strong> (спрашивается диалогом)<\/td>\n<td>Кнопка 🎤 и слово «Фауст»<\/td>\n<\/tr>\n<tr>\n<td><code>CAMERA<\/code> (+ <code>uses-feature required=false<\/code>)<\/td>\n<td><strong>runtime<\/strong><\/td>\n<td>Сканер QR. <code>required=false<\/code> — без камеры приложение ставится, остаётся ручной ввод кода<\/td>\n<\/tr>\n<tr>\n<td><code>POST_NOTIFICATIONS<\/code><\/td>\n<td><strong>runtime<\/strong> на Android 13+<\/td>\n<td>Уведомление «задача выполнена»<\/td>\n<\/tr>\n<tr>\n<td><code>FOREGROUND_SERVICE<\/code><\/td>\n<td>обычное<\/td>\n<td>Запуск foreground-сервиса<\/td>\n<\/tr>\n<tr>\n<td><code>FOREGROUND_SERVICE_DATA_SYNC<\/code><\/td>\n<td>обычное<\/td>\n<td>Тип сервиса «держим связь»<\/td>\n<\/tr>\n<tr>\n<td><code>FOREGROUND_SERVICE_MICROPHONE<\/code><

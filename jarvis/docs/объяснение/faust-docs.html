d>\n<\/tr>\n<tr>\n<td><code>AppCatalogFolderTest<\/code><\/td>\n<td>3<\/td>\n<td>Подпапки внутри разрешённых папок<\/td>\n<\/tr>\n<tr>\n<td><code>vision/DoneVerdictTest<\/code><\/td>\n<td>3<\/td>\n<td><code>success<\/code> и слова отказа<\/td>\n<\/tr>\n<tr>\n<td><code>vision/SensitiveInputGuardTest<\/code><\/td>\n<td>2<\/td>\n<td>«Карта» запрещена, «картинка» — нет<\/td>\n<\/tr>\n<tr>\n<td><code>vision/UiaSnapshotScaleTest<\/code><\/td>\n<td>2<\/td>\n<td>Пересчёт физических пикселей в логические<\/td>\n<\/tr>\n<tr>\n<td><code>plan/PlanMemoryFileTest<\/code><\/td>\n<td>1<\/td>\n<td>Запись и чтение <code>plans.json<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Тесты не трогают настоящие данные человека: <code>faust.trajectoriesFile<\/code>, <code>faust.skillsFile<\/code> и <code>faust.scriptsDir<\/code> в <code>build.gradle.kts<\/code> направляют память, навыки и скрипты во временные файлы сборки.<\/p>\n<p>Чего тесты <strong>не<\/strong> покрывают: сам цикл на живом экране, UI Automation на реальных программах, оверлеи, запись показа ловушками Windows. Это проверяется только живыми прогонами (раздел 34).<\/p>\n"}, {"nav": "Своя модель", "file": "5-Своя-модель.md", "heads": ["Оглавление", "1. Коротко: что сделано", "2. Зачем это нужно", "3. Что такое «своя модель» и почему не с нуля", "4. Как устроена связка: своя модель → Gemini", "5. Данные: экзамен и обучающий набор", "6. Обучение: LoRA", "7. Как измерялась точность", "8. Результаты", "9. Самообучение: «не понял → спросил Gemini → запомнил»", "10. Находка про безопасность и запрет опасных целей", "11. Что ещё изменилось по дороге", "12. Как всё это запускать", "13. Что говорить на защите", "14. Ограничения — честно"], "html": "<h1>Своя языковая модель разбора фраз — полное объяснение<\/h1>\n<blockquote>\n<p>Файл 5 из 5. Цель — чтобы ты мог объяснить преподавателю, <strong>что именно в проекте\n«своё»<\/strong>, как это обучено, как измерена точность и как оно встроено в систему.\nОбщая картина — в файле 1, сервер (релей) — в файле 3.<\/p>\n<p>Папки: <code>C:\\diplom\\jarvis-ml<\/code> (обучение), <code>C:\\diplom\\jarvis-relay<\/code> (встраивание и замеры).<\/p>\n<\/blockquote>\n<hr />\n<h2>Оглавление<\/h2>\n<ol>\n<li><a href=\"#1-%D0%BA%D0%BE%D1%80%D0%BE%D1%82%D0%BA%D0%BE-%D1%87%D1%82%D0%BE-%D1%81%D0%B4%D0%B5%D0%BB%D0%B0%D0%BD%D0%BE\">Коротко: что сделано<\/a><\/li>\n<li><a href=\"#2-%D0%B7%D0%B0%D1%87%D0%B5%D0%BC-%D1%8D%D1%82%D0%BE-%D0%BD%D1%83%D0%B6%D0%BD%D0%BE\">Зачем это нужно<\/a><\/li>\n<li><a href=\"#3-%D1%87%D1%82%D0%BE-%D1%82%D0%B0%D0%BA%D0%BE%D0%B5-%D1%81%D0%B2%D0%BE%D1%8F-%D0%BC%D0%BE%D0%B4%D0%B5%D0%BB%D1%8C-%D0%B8-%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D0%BD%D0%B5-%D1%81-%D0%BD%D1%83%D0%BB%D1%8F\">Что такое «своя модель» и почему не с нуля<\/a><\/li>\n<li><a href=\"#4-%D0%BA%D0%B0%D0%BA-%D1%83%D1%81%D1%82%D1%80%D0%BE%D0%B5%D0%BD%D0%B0-%D1%81%D0%B2%D1%8F%D0%B7%D0%BA%D0%B0-%D1%81%D0%B2%D0%BE%D1%8F-%D0%BC%D0%BE%D0%B4%D0%B5%D0%BB%D1%8C--gemini\">Как устроена связка: своя модель → Gemini<\/a><\/li>\n<li><a href=\"#5-%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5-%D1%8D%D0%BA%D0%B7%D0%B0%D0%BC%D0%B5%D0%BD-%D0%B8-%D0%BE%D0%B1%D1%83%D1%87%D0%B0%D1%8E%D1%89%D0%B8%D0%B9-%D0%BD%D0%B0%D0%B1%D0%BE%D1%80\">Данные: экзамен и обучающий набор<\/a><\/li>\n<li><a href=\"#6-%D0%BE%D0%B1%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%B5-lora\">Обучение: LoRA<\/a><\/li>\n<li><a href=\"#7-%D0%BA%D0%B0%D0%BA-%D0%B8%D0%B7%D0%BC%D0%B5%D1%80%D1%8F%D0%BB%D0%B0%D1%81%D1%8C-%D1%82%D0%BE%D1%87%D0%BD%D0%BE%D1%81%D1%82%D1%8C\">Как измерялась точность<\/a><\/li>\n<li><a href=\"#8-%D1%80%D0%B5%D0%B7%D1%83%D0%BB%D1%8C%D1%82%D0%B0%D1%82%D1%8B\">Результаты<\/a><\/li>\n<li><a href=\"#9-%D1%81%D0%B0%D0%BC%D0%BE%D0%BE%D0%B1%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%B5-%D0%BD%D0%B5-%D0%BF%D0%BE%D0%BD%D1%8F%D0%BB--%D1%81%D0%BF%D1%80%D0%BE%D1%81%D0%B8%D0%BB-gemini--%D0%B7%D0%B0%D0%BF%D0%BE%D0%BC%D0%BD%D0%B8%D0%BB\">Самообучение: «не понял → спросил Gemini → запомнил»<\/a><\/li>\n<li><a href=\"#10-%D0%BD%D0%B0%D1%85%D0%BE%D0%B4%D0%BA%D0%B0-%D0%BF%D1%80%D0%BE-%D0%B1%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D1%8C-%D0%B8-%D0%B7%D0%B0%D0%BF%D1%80%D0%B5%D1%82-%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D1%8B%D1%85-%D1%86%D0%B5%D0%BB%D0%B5%D0%B9\">Находка про безопасность и запрет опасных целей<\/a><\/li>\n<li><a href=\"#11-%D1%87%D1%82%D0%BE-%D0%B5%D1%89%D1%91-%D0%B8%D0%B7%D0%BC%D0%B5%D0%BD%D0%B8%D0%BB%D0%BE%D1%81%D1%8C-%D0%BF%D0%BE-%D0%B4%D0%BE%D1%80%D0%BE%D0%B3%D0%B5\">Что ещё изменилось по дороге<\/a><\/li>\n<li><a href=\"#12-%D0%BA%D0%B0%D0%BA-%D0%B2%D1%81%D1%91-%D1%8D%D1%82%D0%BE-%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D0%BA%D0%B0%D1%82%D1%8C\">Как всё это запускать<\/a><\/li>\n<li><a href=\"#13-%D1%87%D1%82%D0%BE-%D0%B3%D0%BE%D0%B2%D0%BE%D1%80%D0%B8%D1%82%D1%8C-%D0%BD%D0%B0-%D0%B7%D0%B0%D1%89%D0%B8%D1%82%D0%B5\">Что говорить на защите<\/a><\/li>\n<li><a href=\"#14-%D0%BE%D0%B3%D1%80%D0%B0%D0%BD%D0%B8%D1%87%D0%B5%D0%BD%D0%B8%D1%8F--%D1%87%D0%B5%D1%81%D1%82%D0%BD%D0%BE\">Ограничения — честно<\/a><\/li>\n<\/ol>\n<hr />\n<h2>1. Коротко: что сделано<\/h2>\n<p>Раньше каждую фразу с телефона («сделай потише», «открой ютуб», «скачай отчёт и отправь\nПете») превращала в команду чужая облачная модель — Google Gemini. Без интернета и без\nключа система падала на регулярные выражения, которые понимают меньше половины фраз.<\/p>\n<p>Теперь первой фразу разбирает <strong>собственная модель<\/strong>: открытая Qwen2.5, <strong>дообученная на\nнашем датасете команд<\/strong>. Она работает на этом же компьютере через Ollama — без интернета,\nбез ключа, без оплаты — и отвечает за доли секунды. Только если она не уверена или не\nпоняла, фраза уходит в Gemini. А то, что понял Gemini, становится <strong>уроком<\/strong> для следующей\nверсии нашей модели.<\/p>\n<p>Что входит в работу:<\/p>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Где<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Экзамен А из 250 размеченных фраз<\/td>\n<td><code>jarvis-relay/eval/intent_test.jsonl<\/code><\/td>\n<\/tr>\n<tr>\n<td>Экзамен Б из 201 живой фразы с разметкой Gemini<\/td>\n<td><code>jarvis-relay/eval/intent_test_b.jsonl<\/code><\/td>\n<\/tr>\n<tr>\n<td>Скрипт замера точности любого разборщика<\/td>\n<td><code>jarvis-relay/eval/intent_eval.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Генератор обучающего набора (~17 тысяч примеров)<\/td>\n<td><code>jarvis-ml/build_trainset.py<\/code>, <code>vocab.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Дистилляция: Gemini придумывает живые фразы и размечает их<\/td>\n<td><code>jarvis-ml/distill.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Дообучение (LoRA)<\/td>\n<td><code>jarvis-ml/train.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Выгрузка модели в Ollama<\/td>\n<td><code>jarvis-ml/export_ollama.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Связка «своя модель → Gemini → регулярки»<\/td>\n<td><code>HybridIntentParser.java<\/code>, <code>LocalIntentParser.java<\/code><\/td>\n<\/tr>\n<tr>\n<td>Самообучение на уроках<\/td>\n<td><code>IntentLessons.java<\/code>, <code>jarvis-ml/retrain.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Запрет опасных целей для агента<\/td>\n<td><code>ForbiddenGoals.java<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>2. Зачем это нужно<\/h2>\n<p>Три причины, все измеримые.<\/p>\n<ol>\n<li><strong>Вопрос преподавателя «что вы сделали сами, а не Gemini».<\/strong> Теперь есть ответ:\nсобственный датасет, собственная разметка, обученные нами веса, методика оценки и\nвстраивание с запасным путём.<\/li>\n<li><strong>Скорость.<\/strong> Gemini отвечает 2–3 секунды на каждую фразу, даже на «сделай потише».\nЛокальная модель — в разы быстрее (цифры — в разделе 8).<\/li>\n<li><strong>Независимость.<\/strong> 5 октября во время работы ключ Gemini начал отвечать\n<code>HTTP 402<\/code> («требуется оплата») — закончился лимит. В этот момент всё, что зависело\nтолько от Gemini, перестало работать. Своя модель продолжает разбирать команды и без него.<\/li>\n<\/ol>\n<p>Важно понимать границу: своя модель заменяет Gemini <strong>только в разборе фразы<\/strong>. «Зрение»\nагента (понять, что на экране) и планирование многоэтапных задач остаются на Gemini —\nобучить такое на видеокарте с 4 ГБ невозможно.<\/p>\n<hr />\n<h2>3. Что такое «своя модель» и почему не с нуля<\/h2>\n<p>Языковую модель нельзя обучить с нуля на двенадцати тысячах примеров: чтобы она понимала\nрусский язык, нужны миллиарды слов и недели работы больших видеокарт. Модель, обученная с\nнуля на наших данных, не поняла бы «накрути громкость до предела» — она ни разу не видела\nслова «накрути».<\/p>\n<p>Поэтому берётся <strong>базовая модель<\/strong>, которая уже знает язык, и <strong>дообучается<\/strong> на своей\nзадаче. Это стандартная практика — и в индустрии, и в научных работах.<\/p>\n<ul>\n<li><strong>База:<\/strong> Qwen2.5-Instruct (Alibaba), 0,5 и 1,5 млрд параметров. Лицензия Apache 2.0:\nможно скачивать, менять, использовать в дипломе.<\/li>\n<li><strong>Что наше:<\/strong> датасет и его разметка, правила разметки спорных случаев, обученные веса\n(заплатки LoRA), формат ответа, методика оценки, встраивание в систему.<\/li>\n<\/ul>\n<p>Аналогия для защиты: мы не растили человека с рождения — мы наняли того, кто уже говорит\nпо-русски, и обучили его работе диспетчера именно наших команд.<\/p>\n<hr />\n<h2>4. Как устроена связка: своя модель → Gemini<\/h2>\n<p>Телефону отвечает класс <code>HybridIntentParser<\/code> в релее. Порядок такой:<\/p>\n<pre><code>фраза с телефона\n  │ 1. «навык …» / «запусти скрипт …»   — код, без моделей\n  │ 2. уже выученный урок (та же фраза)   — память, без моделей\n  │ 3. НАША модель (на этом ПК)\n  │       уверена и ответ годный ───────────► команда\n  │       не уверена / «не понял» / мусор\n  ▼\n  4. Gemini (интернет) ── понял ────────────► команда + УРОК для нашей модели\n  │       недоступен\n  ▼\n  5. годный ответ нашей модели, иначе регулярные выражения\nдальше — белый список и запрет опасных целей (одинаково для любого пути)\n<\/code><\/pre>\n<h3>Что значит «не сработало»<\/h3>\n<p>Фраза уходит в Gemini в трёх случаях:<\/p>\n<ol>\n<li><strong>Ответ не проходит проверку формата.<\/strong> Не JSON, неизвестный тип команды, громкость\n900, адрес без точки. Проверяет код (<code>LocalIntentParser.interpret<\/code>), модели на слово не верим.<\/li>\n<li><strong>Модель сказала «не понял».<\/strong> Вдруг Gemini поймёт необычную формулировку.<\/li>\n<li><strong>Модель не уверена.<\/strong> Ollama отдаёт вероятность каждого слова ответа. Их произведение —\nвероятность ответа целиком: 0,99 — уверена, 0,4 — колебалась. Ниже порога\n(<code>JARVIS_LOCAL_LLM_MIN_CONFIDENCE<\/code>, сейчас 0,9) ответ перепроверяет Gemini.<\/li>\n<\/ol>\n<h3>Формат ответа модели<\/h3>\n<p>Тот же JSON, что в протоколе, но без лишнего:<\/p>\n<pre><code>сделай потише                 → {&quot;type&quot;:&quot;set_volume&quot;,&quot;level&quot;:30}\nоткрой кинопоиск              → {&quot;type&quot;:&quot;open_url&quot;,&quot;url&quot;:&quot;https://kinopoisk.ru&quot;}\nзапусти телегу                → {&quot;type&quot;:&quot;open_app&quot;,&quot;appName&quot;:&quot;telegram&quot;}\nзакрой ворд                   → {&quot;type&quot;:&quot;kill_process&quot;,&quot;processName&quot;:&quot;winword.exe&quot;}\nскачай отчёт и отправь Пете   → {&quot;type&quot;:&quot;agent_task&quot;,&quot;scope&quot;:&quot;screen&quot;}\nвыключи компьютер             → {&quot;type&quot;:&quot;unknown&quot;}\n<\/code><\/pre>\n<p>Для задачи агенту модель называет только режим (<code>browser<\/code> или <code>screen<\/code>). Саму цель — фразу\nцеликом — и лимит шагов подставляет код. Модели не нужно переписывать длинную фразу слово в\nслово: это быстрее и убирает целый класс ошибок.<\/p>\n<h3>Режимы<\/h3>\n<p>Настройка <code>JARVIS_INTENT_ENGINE<\/code>:<\/p>\n<ul>\n<li><code>auto<\/code> (по умолчанию) — вся цепочка;<\/li>\n<li><code>local<\/code> — только своя модель и регулярки, без интернета;<\/li>\n<li><code>gemini<\/code> — как было раньше.<\/li>\n<\/ul>\n<p>Пока своей модели в Ollama нет, <code>auto<\/code> ведёт себя как <code>gemini<\/code> — ничего не ломается.<\/p>\n<hr />\n<h2>5. Данные: экзамен и обучающий набор<\/h2>\n<h3>Экзамен (тестовый набор) — 250 фраз<\/h3>\n<p>Файл <code>jarvis-relay/eval/intent_test.jsonl<\/code>, собирается скриптом <code>build_testset.py<\/code>.<\/p>\n<ul>\n<li>115 фраз из прежнего <code>phrases_ru.csv<\/code>, к каждой дописан эталон параметров.<\/li>\n<li>135 новых: многоэтапные задачи, навыки и скрипты, сленг, ошибки распознавания речи,\nанглийский, опасные просьбы.<\/li>\n<\/ul>\n<p>Эталон — не одно «правильное значение», а правило проверки:<\/p>\n<table>\n<thead>\n<tr>\n<th>Команда<\/th>\n<th>Что проверяется<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Громкость<\/td>\n<td>диапазон: «потише» — от 1 до 50, «на 30» — ровно 30<\/td>\n<\/tr>\n<tr>\n<td>Сайт<\/td>\n<td>домен из списка допустимых (и его поддомены)<\/td>\n<\/tr>\n<tr>\n<td>Программа<\/td>\n<td>название из списка допустимых («notepad», «блокнот»)<\/td>\n<\/tr>\n<tr>\n<td>Процесс<\/td>\n<td>имя из списка («chrome.exe»)<\/td>\n<\/tr>\n<tr>\n<td>Задача агенту<\/td>\n<td>режим (<code>browser<\/code>/<code>screen<\/code>) и что цель не потеряна<\/td>\n<\/tr>\n<tr>\n<td>«Не понял»<\/td>\n<td>модель обязана отказаться<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Главное правило: на экзамене модель никогда не учится.<\/strong> Иначе она запомнила бы ответы,\nи точность была бы нечестной. Генератор обучающего набора выбрасывает любую фразу,\nсовпадающую с экзаменационной с точностью до вежливых слов («сделай скриншот» и «сделай\nскриншот пожалуйста» — одна и та же фраза).<\/p>\n<h3>Экзамен Б — 201 живая фраза, которую писал не автор<\/h3>\n<p>Файл <code>jarvis-relay/eval/intent_test_b.jsonl<\/code>, готовит <code>jarvis-ml/distill.py<\/code>.<\/p>\n<p>У экзамена А есть слабое место: его фразы и обучающие шаблоны писал один человек, поэтому\nони похожи по построению. Экзамен Б это место закрывает:<\/p>\n<ul>\n<li><strong>Фразы придумал Gemini<\/strong> в роли пользователя: 10 жизненных ситуаций (студент, программист,\nчеловек на кухне, пожилой человек…) на 6 манер речи (коротко, со сленгом, как после\nраспознавания речи, вежливо и длинно, с опечатками, по-английски). Ни команд, ни слов ему\nне подсказывали. Получилось 1446 разных фраз.<\/li>\n<li><strong>Разметил их тоже Gemini<\/strong> — тем же промптом, которым он разбирает фразы в релее\n(текст берётся прямо из <code>GeminiIntentParser.java<\/code>), только пачками по 40.<\/li>\n<li><strong>15% фраз отложены в экзамен Б<\/strong> (201 штука) и в обучение не попадают. Остальные идут\nв обучающий набор — см. ниже.<\/li>\n<\/ul>\n<p>Экзамен Б измеряет <strong>согласие с Gemini<\/strong>: у самого Gemini на нём 100% по определению.\nЕго разметку человек не перепроверял, поэтому это не «истина», а ответ на вопрос «насколько\nсвоя модель не хуже Gemini на фразах, которых она не видела».<\/p>\n<h3>Обучающий набор — около 17 тысяч примеров<\/h3>\n<p>Собирается <code>jarvis-ml/build_trainset.py<\/code>. Шесть источников:<\/p>\n<ol>\n<li>\n<p><strong>Шаблоны и словари.<\/strong> Словари в <code>vocab.py<\/code>: ~95 сайтов, ~50 программ, 4 папки, ~40\nпроцессов — и как их называют люди («телега», «вб», «вскод»). Шаблон «открой {название}»\nплюс запись словаря дают фразу и точный правильный ответ.<\/p>\n<\/li>\n<li>\n<p><strong>Трудные пары.<\/strong> Фразы, которые отличаются одним куском, но требуют разного ответа:<\/p>\n<table>\n<thead>\n<tr>\n<th>Фраза<\/th>\n<th>Правильный ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>открой блокнот<\/td>\n<td>открыть программу<\/td>\n<\/tr>\n<tr>\n<td>открой блокнот и напиши список покупок<\/td>\n<td>задача агенту<\/td>\n<\/tr>\n<tr>\n<td>сделай скриншот<\/td>\n<td>скриншот<\/td>\n<\/tr>\n<tr>\n<td>сделай скриншот и отправь его Пете<\/td>\n<td>задача агенту<\/td>\n<\/tr>\n<tr>\n<td>выключи звук<\/td>\n<td>громкость 0<\/td>\n<\/tr>\n<tr>\n<td>выключи спотифай<\/td>\n<td>закрыть процесс<\/td>\n<\/tr>\n<tr>\n<td>выключи компьютер<\/td>\n<td>«не понял» (запрещено)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/li>\n<li>\n<p><strong>Перефразировки от Gemini — «учитель».<\/strong> Gemini придумывает, как ещё люди говорят то же\nсамое («заскринь экран и скинь пж», «Замуть аудио!»). Важно: <strong>правильный ответ задаём\nмы<\/strong>, по смыслу, который просили перефразировать, — а не Gemini. Его ошибки разбора в\nданные не попадают. Этот приём называется дистилляцией знаний.<\/p>\n<\/li>\n<li>\n<p><strong>Уроки из работы<\/strong> — см. раздел 9.<\/p>\n<\/li>\n<li>\n<p><strong>Живые фразы с разметкой Gemini<\/strong> (с 8 октября) — 1199 фраз из того же сбора, что и\nэкзамен Б. Здесь, в отличие от «учителя», ответ даёт сам Gemini: своя модель учится\nотвечать как он. Три предосторожности:<\/p>\n<ul>\n<li>у команд с параметром ответ Gemini приводится к нашим обозначениям (<code>calculator<\/code> →\n<code>calc<\/code>, <code>https://www.ozon.ru/<\/code> → <code>https://ozon.ru<\/code>), чтобы не учить двум написаниям;<\/li>\n<li>если та же фраза есть в шаблонах с другим ответом, берётся шаблон;<\/li>\n<li>два вида фраз не берутся вовсе, потому что разметка Gemini там расходится с тем, как\nработает система: «сделай скриншот и сохрани…» (у нас это задача агенту) и произвольные\nпапки («папка Учёба 2024» — команда <code>open_app<\/code> таких не открывает).<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Шаблоны на найденные дыры<\/strong> (с 8 октября) — около 2700 примеров на то, в чём первая\nверсия системно расходилась с Gemini: длинные вежливые просьбы в одно действие; покупки,\nоплата, переводы и напоминания живым языком; задачи на сайте со словами «скачай» и\n«сохрани»; «закрой все окна» и две программы разом; управление музыкой.<\/p>\n<\/li>\n<\/ol>\n<p>Часть фраз учителя отложена в отдельный набор <code>dev.jsonl<\/code>: модель их не видит, по ним\nподбирается порог уверенности. Подбирать порог на экзамене нельзя — это была бы подгонка.<\/p>\n<h3>Правила разметки спорных случаев<\/h3>\n<ul>\n<li>Открыть названный сайт — <code>open_url<\/code>; названную программу или папку — <code>open_app<\/code>.<\/li>\n<li>Действие <strong>внутри<\/strong> сайта — задача агенту в браузере; в программах или через несколько\nпрограмм — задача агенту на экране.<\/li>\n<li>Вопросы, болтовня, то, чего система не умеет (будильник, температура процессора), и\nопасное (выключить ПК, перевести деньги) — «не понял».<\/li>\n<\/ul>\n<hr />\n<h2>6. Обучение: LoRA<\/h2>\n<p>Скрипт <code>jarvis-ml/train.py<\/code>.<\/p>\n<p><strong>Что такое LoRA.<\/strong> В модели полмиллиарда чисел. Переучивать их все незачем и не на чем.\nLoRA добавляет к слоям модели маленькие «заплатки» — около 1,75% от её размера (8,8 млн\nчисел) — и учит только их. Сама модель остаётся нетронутой. После обучения заплатки\nвливаются в модель, и получается обычная модель, которая умеет наше.<\/p>\n<p><strong>Чему учим.<\/strong> На вход — короткая системная подсказка и фраза, на выход — команда JSON.\nОшибка считается только по словам ответа: подсказку и фразу модель читает, а не учится писать.<\/p>\n<p><strong>Параметры:<\/strong> 3 прохода по данным, порции по 8 примеров с накоплением (16 на шаг), скорость\nобучения 2·10⁻⁴ с разгоном и плавным снижением, размер заплаток 16, половинная точность\nчисел (bfloat16), чтобы поместиться в 4 ГБ видеопамяти.<\/p>\n<p><strong>Что пришлось решить по дороге:<\/strong><\/p>\n<ul>\n<li><em>Нехватка видеопамяти.<\/em> Обычный расчёт ошибки вычисляет вероятности всех 150 тысяч слов\nсловаря для каждой позиции — включая подсказку, где ошибка не учитывается. На карте с 4 ГБ\nобучение начинало использовать обычную память и замедлялось в десятки раз. Решение —\nсчитать словарь только там, где модель пишет ответ (<code>answer_loss<\/code>).<\/li>\n<li><em>Экономия памяти, которая ломает обучение.<\/em> Режим «не хранить промежуточные вычисления»\nбез дополнительной настройки не пропускает сигнал ошибки к заплаткам. Для маленькой\nмодели он отключён, для большой включается вместе с нужной настройкой.<\/li>\n<\/ul>\n<hr />\n<h2>7. Как измерялась точность<\/h2>\n<p>Скрипт <code>jarvis-relay/eval/intent_eval.py<\/code> прогоняет экзамен через служебный адрес релея\n<code>/api/admin/intent/parse<\/code>. Команды при этом никуда не исполняются — только разбираются.<\/p>\n<p>Две метрики:<\/p>\n<ul>\n<li><strong>точность типа<\/strong> — правильно ли понято, <em>что<\/em> делать;<\/li>\n<li><strong>точность команды<\/strong> — тип <em>и<\/em> параметры: тот сайт, тот процесс, тот уровень громкости.<\/li>\n<\/ul>\n<p>Режимы замера: <code>stub<\/code> (только регулярки), <code>gemini<\/code> (только Gemini, без запасного пути),\n<code>local<\/code> (только своя модель), <code>system<\/code> (вся связка, включая запрет опасных целей).<\/p>\n<p>Отчёты по каждой фразе и список всех ошибок сохраняются в <code>jarvis-relay/eval/results/<\/code>.<\/p>\n<hr />\n<h2>8. Результаты<\/h2>\n<p>Отчёты по каждой фразе лежат в <code>jarvis-relay/eval/results/<\/code>.<\/p>\n<h3>Итог на 8 октября — вторая версия модели<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Регулярки<\/th>\n<th>Gemini, новый промпт<\/th>\n<th>Своя модель, версия 1<\/th>\n<th>Своя модель, версия 2<\/th>\n<th><strong>Вся связка: версия 2, при сомнении Gemini<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Экзамен А — 250 фраз, писал автор<\/td>\n<td>39,6%<\/td>\n<td>100%<\/td>\n<td>97,6%<\/td>\n<td>97,2%<\/td>\n<td><strong>100%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Экзамен Б — 201 живая фраза, писал и размечал Gemini<\/td>\n<td>—<\/td>\n<td>эталон<\/td>\n<td>77,1%<\/td>\n<td><strong>89,1%<\/strong><\/td>\n<td><strong>96,5%<\/strong>*<\/td>\n<\/tr>\n<tr>\n<td>Задержка, медиана<\/td>\n<td>0 мс<\/td>\n<td>2013 мс<\/td>\n<td>131 мс<\/td>\n<td>133 мс<\/td>\n<td><strong>140 мс<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Кто отвечает (экзамен А)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>своя модель 82%, Gemini 16%, код 2%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>* Связка на экзамене Б посчитана по готовым ответам, без прогона через релей: фразы, где\nмодель ответила «не понял» или с уверенностью ниже 0,9, считаются отданными Gemini, а его\nответ на экзамене Б и есть эталон. С первой версией и порогом 0,7 тот же расчёт давал 85,1%.<\/p>\n<p>Что из этого следует:<\/p>\n<ul>\n<li><strong>Связка сравнялась с Gemini по точности на экзамене А<\/strong> (100% против 100%) и отвечает\nв 14 раз быстрее по медиане, потому что 82% фраз разбирает сама, без интернета.<\/li>\n<li><strong>Сама по себе модель до Gemini не дотягивает.<\/strong> На живых фразах она согласна с ним в\n89,1% случаев. Из 22 расхождений 14 — задача понята верно, но перепутано «в браузере» или\n«в программах»; остальное — программы и папки, которых нет в словарях, и относительная\nгромкость («громче на 20%»).<\/li>\n<li><strong>Экзамен А завышал оценку.<\/strong> У первой версии на нём 97,6%, а на фразах, которые писал не\nавтор шаблонов, — 77,1%. Разницу в 20 пунктов экзамен А не видел вовсе.<\/li>\n<li><strong>На экзамене А вторая версия на одну фразу хуже первой<\/strong> (две ошибки исправила, три\nновых). Все три новые — с уверенностью ниже 0,9, поэтому в связке их перехватывает Gemini.\nВключена она по сумме двух экзаменов (422 верных из 451 против 399) и по замеру связки.<\/li>\n<\/ul>\n<h4>Что было не так у первой версии и как это найдено<\/h4>\n<p>Gemini придумал 1446 фраз «как говорят живые люди» и сам разметил их своим рабочим\nпромптом (<code>jarvis-ml/distill.py<\/code>, раздел 5). Первая версия согласилась с ним только в 77,8%\nслучаев. Расхождения — в <code>jarvis-ml/runs/distill-report.md<\/code>; главные группы:<\/p>\n<table>\n<thead>\n<tr>\n<th>Что просят<\/th>\n<th>Как отвечала версия 1<\/th>\n<th>Как надо<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>«Зайди на сайт библиотеки и скачай главу» (всего 137 расхождений в выборе «браузер или программы»)<\/td>\n<td>задача в программах — из-за слова «скачай»<\/td>\n<td>задача в браузере<\/td>\n<\/tr>\n<tr>\n<td>«Закажи пиццу на домашний адрес», «напомни через 15 минут» (36)<\/td>\n<td>задача агенту<\/td>\n<td>«не понял»: система этого не делает<\/td>\n<\/tr>\n<tr>\n<td>«Открой, пожалуйста, папку Загрузки, я только что…»<\/td>\n<td>задача агенту — фраза длинная<\/td>\n<td>одно действие, открыть папку<\/td>\n<\/tr>\n<tr>\n<td>«Закрой все окна», «закрой это окно»<\/td>\n<td>закрыть процесс <code>mspaint.exe<\/code><\/td>\n<td>задача агенту<\/td>\n<\/tr>\n<tr>\n<td>«Закрой фигму»<\/td>\n<td>выдуманное имя процесса <code>figma.js<\/code><\/td>\n<td><code>figma.exe<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Для второй версии в обучение добавлены 1199 из этих фраз с ответами Gemini и шаблоны на\nкаждую группу (<code>build_trainset.py<\/code>, блок «Чего не хватало первой версии модели»).<\/p>\n<h4>Порог уверенности для второй версии<\/h4>\n<p>Подобран на отложенном наборе из 313 фраз учителя, не на экзаменах: при 0,9 в Gemini уходит\n3,5% фраз, и среди них 8 из 13 ошибок модели; при прежнем 0,7 — 1,9% фраз и 6 ошибок.<\/p>\n<h3>Первая версия (6 октября): сравнение разборщиков<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Регулярки<\/th>\n<th>Gemini, старый промпт<\/th>\n<th>Gemini, новый промпт<\/th>\n<th><strong>Своя модель<\/strong><\/th>\n<th><strong>Вся система без Gemini<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Команда разобрана верно<\/td>\n<td>39,6%<\/td>\n<td>92,8%<\/td>\n<td>100% на 156 фразах*<\/td>\n<td><strong>97,6%<\/strong><\/td>\n<td><strong>98,8%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Тип команды верно<\/td>\n<td>49,2%<\/td>\n<td>93,6%<\/td>\n<td>—<\/td>\n<td>98,0%<\/td>\n<td>99,2%<\/td>\n<\/tr>\n<tr>\n<td>Задержка, медиана<\/td>\n<td>0 мс<\/td>\n<td>2050 мс<\/td>\n<td>1660 мс<\/td>\n<td><strong>131 мс<\/strong><\/td>\n<td><strong>141 мс<\/strong><\/td>\n<\/tr>\n<tr>\n<td>90% фраз быстрее<\/td>\n<td>0 мс<\/td>\n<td>3215 мс<\/td>\n<td>2393 мс<\/td>\n<td>155 мс<\/td>\n<td>165 мс<\/td>\n<\/tr>\n<tr>\n<td>Нужен интернет и ключ<\/td>\n<td>нет<\/td>\n<td>да<\/td>\n<td>да<\/td>\n<td>нет<\/td>\n<td>нет<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>* Замер Gemini с новым промптом оборвался: 5 октября у ключа закончился лимит\n(<code>HTTP 402<\/code>), успели пройти 156 фраз из 250. На этих же 156 фразах старый промпт дал 94,9%.\n8 октября замер доделан на оставшихся 94 фразах: итог 250 из 250, медиана 2013 мс.<\/p>\n<p>«Своя модель» — Qwen2.5-0.5B после дообучения, замер напрямую через Ollama.\n«Вся система без Gemini» — то, что получает телефон, когда Gemini недоступен: короткий путь\nдля навыков и скриптов, своя модель, запрет опасных целей.<\/p>\n<p><strong>Скорость:<\/strong> своя модель отвечает в 13–16 раз быстрее Gemini (131 мс против 1660–2050 мс).<\/p>\n<h3>Вторая проверка — отложенные фразы учителя<\/h3>\n<p>121 фраза, придуманная Gemini и не попавшая в обучение: <strong>96,7%<\/strong> (117 из 121), медиана 138 мс.\nДве из четырёх «ошибок» спорные по самой разметке («немного потише» — 40 или 30).<\/p>\n<h3>Точность по типам команд (своя модель)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Тип<\/th>\n<th>Фраз<\/th>\n<th>Верно<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Громкость<\/td>\n<td>25<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>Открыть сайт<\/td>\n<td>34<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>Открыть программу или папку<\/td>\n<td>34<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>Закрыть процесс<\/td>\n<td>23<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>Заблокировать экран<\/td>\n<td>13<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>Список процессов<\/td>\n<td>13<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>«Не понял» (включая опасные просьбы)<\/td>\n<td>36<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>Скриншот<\/td>\n<td>14<\/td>\n<td>92,9%<\/td>\n<\/tr>\n<tr>\n<td>Задача агенту<\/td>\n<td>58<\/td>\n<td>91,4%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Где модель ошиблась (6 фраз из 250)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Фраза<\/th>\n<th>Ответ модели<\/th>\n<th>Что с этим в системе<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>навык утро<\/td>\n<td>«не понял»<\/td>\n<td>до модели не доходит: перехватывает код<\/td>\n<\/tr>\n<tr>\n<td>выполни навык доброе утро<\/td>\n<td>«не понял»<\/td>\n<td>то же<\/td>\n<\/tr>\n<tr>\n<td>запусти навык отчёт<\/td>\n<td>открыть программу «report»<\/td>\n<td>то же<\/td>\n<\/tr>\n<tr>\n<td>доброе утро, пора работать<\/td>\n<td>«не понял»<\/td>\n<td>в связке уходит в Gemini<\/td>\n<\/tr>\n<tr>\n<td>найди на гитхабе репозиторий spring boot и открой его<\/td>\n<td>задача в программах, а надо в браузере<\/td>\n<td>ошибка остаётся<\/td>\n<\/tr>\n<tr>\n<td>покажи рабочий стол картинкой<\/td>\n<td>открыть папку «Изображения», а надо скриншот<\/td>\n<td>ошибка остаётся<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Поэтому система целиком даёт 247 из 250, а модель сама по себе — 244.<\/p>\n<h3>Порог уверенности<\/h3>\n<p>Подбирался на отложенном наборе, не на экзамене. При любом пороге от 0,6 до 0,9 в Gemini\nуходят 2 фразы из 121 (1,7%), и обе действительно были ошибками модели. Выбрана середина — 0,7.<\/p>\n<h3>Обучение в цифрах<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Версия 1 (06.10)<\/th>\n<th>Версия 2 (08.10)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Базовая модель<\/td>\n<td>Qwen2.5-0.5B-Instruct, 503 млн параметров<\/td>\n<td>та же<\/td>\n<\/tr>\n<tr>\n<td>Обучаемых параметров (LoRA)<\/td>\n<td>8,8 млн — 1,75%<\/td>\n<td>те же<\/td>\n<\/tr>\n<tr>\n<td>Обучающих примеров<\/td>\n<td>11 598<\/td>\n<td>17 251<\/td>\n<\/tr>\n<tr>\n<td>из них живых фраз с разметкой Gemini<\/td>\n<td>0<\/td>\n<td>1855 строк (1199 фраз в двух написаниях)<\/td>\n<\/tr>\n<tr>\n<td>Проверочных / отложенных<\/td>\n<td>773 / 121<\/td>\n<td>1150 / 313<\/td>\n<\/tr>\n<tr>\n<td>Выброшено как совпадающих с экзаменами<\/td>\n<td>387<\/td>\n<td>432<\/td>\n<\/tr>\n<tr>\n<td>Проходов по данным<\/td>\n<td>3 (2175 шагов)<\/td>\n<td>3 (3237 шагов)<\/td>\n<\/tr>\n<tr>\n<td>Время обучения на RTX 3050 Ti<\/td>\n<td>49 минут<\/td>\n<td>65 минут, с паузами для охлаждения<\/td>\n<\/tr>\n<tr>\n<td>Температура видеокарты<\/td>\n<td>до 86 °C<\/td>\n<td>около 80 °C<\/td>\n<\/tr>\n<tr>\n<td>Видеопамяти<\/td>\n<td>до 2,5 ГБ из 4<\/td>\n<td>до 2,85 ГБ<\/td>\n<\/tr>\n<tr>\n<td>Точность на проверочном наборе по проходам<\/td>\n<td>98,7% → 99,0% → 99,3%<\/td>\n<td>98,5% → 99,5% → 100%<\/td>\n<\/tr>\n<tr>\n<td>Размер готовой модели в Ollama<\/td>\n<td>994 МБ<\/td>\n<td>994 МБ<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Запросов к Gemini на данные для второй версии: около 60 на перефразировки учителя и 67 на\nдистилляцию (30 — придумать фразы, 37 — разметить).<\/p>\n<hr />\n<h2>9. Самообучение: «не понял → спросил Gemini → запомнил»<\/h2>\n<pre><code>наша модель не справилась ──► Gemini назвал команду ──► урок «предложен»\nагент выполнил её успешно ───────────────────────────► урок «подтверждён»\nта же фраза ещё раз ──────────────────────────────────► ответ сразу, без моделей\nнакопились уроки ──► дообучение ──► экзамен ──► новая версия модели\n<\/code><\/pre>\n<ol>\n<li><strong>Урок записывается<\/strong>, когда своя модель была спрошена и не справилась, а Gemini назвал\nкоманду (<code>IntentLessons.propose<\/code>). Хранится в базе релея, таблица <code>intent_lesson<\/code>.<\/li>\n<li><strong>Урок подтверждается выполнением.<\/strong> Gemini тоже ошибается. Если агент выполнил команду\nуспешно — значит, фраза понята верно, урок подтверждён. Если команда не выполнилась,\nотменена или запрещена — урок удаляется. Человека при этом ни о чём не спрашивают.<\/li>\n<li><strong>Повтор той же фразы<\/strong> сразу отвечается из памяти уроков — без моделей вообще.<\/li>\n<li><strong>Дообучение<\/strong> (<code>jarvis-ml/retrain.py<\/code>): уроки добавляются в обучающий набор, обучается\nновая версия, она сдаёт тот же экзамен.<\/li>\n<li><strong>Ворота.<\/strong> Новая версия включается, только если сдала экзамен <strong>не хуже<\/strong> текущей.\nПлохие уроки не могут испортить модель.<\/li>\n<\/ol>\n<p><strong>Чему не учимся никогда:<\/strong> фразам с паролями и платёжными данными, слишком длинным\nтекстам, запрещённым командам и самому экзамену.<\/p>\n<hr />\n<h2>10. Находка про безопасность и запрет опасных целей<\/h2>\n<p>Замер Gemini показал дыру, о которой раньше не было известно.<\/p>\n<p>Белый список на релее не пропускает команду <code>shutdown<\/code>. Но фразу «выключи компьютер» Gemini\nпревращал не в <code>shutdown<\/code>, а в <strong>задачу агенту<\/strong> с целью «выключи компьютер». Это команда\nразрешённая, и агент на ПК дошёл бы мышью до «Пуск → Завершение работы». То же с\n«отформатируй диск c», «переведи маме пять тысяч», «купи билет»: из 7 таких просьб в\nэкзамене Gemini отправил агенту 6.<\/p>\n<p>Исправлено в двух местах:<\/p>\n<ol>\n<li><strong><code>ForbiddenGoals.java<\/code> — проверка кодом.<\/strong> Цель задачи агенту проверяется по списку\nзапретов: выключение и перезагрузка ПК, форматирование, массовое удаление, переводы\nденег, покупки и оплата. Проверка стоит в белом списке (<code>CommandWhitelist.denyReason<\/code>),\nпоэтому действует одинаково для любого разборщика и для рецептов с телефона. Модель\nможет ошибиться или быть обманутой; этот список — нет.<\/li>\n<li><strong>Обучение.<\/strong> Своя модель на таких фразах учится отвечать «не понял».<\/li>\n<\/ol>\n<p>Правила намеренно узкие — «выключи звук», «перезагрузи страницу», «переведи текст»,\n«удали файл отчёт» разрешены. Это проверяется тестами (<code>ForbiddenGoalsTest<\/code>): там список\n«должно быть разрешено» не короче списка «должно быть запрещено».<\/p>\n<p>Человеку на телефон приходит причина: «команда запрещена: агенту нельзя поручать:\nвыключение компьютера».<\/p>\n<hr />\n<h2>11. Что ещё изменилось по дороге<\/h2>\n<ul>\n<li><strong>Быстрая пересборка релея без интернета.<\/strong> Раньше jar собирался внутри Docker, и при\nсброшенном кэше Docker заново качал Gradle и библиотеки — 2 октября это заняло больше\n10 минут. Теперь <code>faust.ps1<\/code> собирает jar на самом ПК и только упаковывает его в образ\n(<code>Dockerfile.local<\/code>): около 80 секунд. Если локальная сборка не удалась, скрипт сам\nвозвращается к прежнему способу.<\/li>\n<li><strong>Промпт Gemini дополнен<\/strong> двумя правилами: папки открывает <code>open_app<\/code>, а не агент;\nзапрещённое и неподдерживаемое — «не понял». Gemini остаётся запасным путём, поэтому он\nтоже должен быть точным — и сравнение со своей моделью так честнее.<\/li>\n<li><strong><code>faust.ps1<\/code> при запуске проверяет Ollama<\/strong> и наличие модели <code>faust-intent<\/code>.<\/li>\n<li><strong>Тесты релея:<\/strong> было 10, стало 24 (связка разборщиков, запрет опасных целей).<\/li>\n<\/ul>\n<hr />\n<h2>12. Как всё это запускать<\/h2>\n<p>Обычный запуск проекта не изменился: <code>start-faust.bat<\/code>. Он сам поднимет Ollama.<\/p>\n<p>Полный цикл обучения — из папки <code>C:\\diplom\\jarvis-ml<\/code>:<\/p>\n<pre><code>.venv\\Scripts\\python.exe build_trainset.py\n.venv\\Scripts\\python.exe train.py --base models\\Qwen2.5-0.5B-Instruct --name qwen05-v1\n.venv\\Scripts\\python.exe eval_local.py --name qwen05-v1\n.venv\\Scripts\\python.exe export_ollama.py --name qwen05-v1 --tag faust-intent\n<\/code><\/pre>\n<p>Замер через релей — из папки <code>C:\\diplom\\jarvis-relay\\eval<\/code>:<\/p>\n<pre><code>python intent_eval.py --engine local\npython intent_eval.py --engine system\npython intent_eval.py --engine gemini\n<\/code><\/pre>\n<p>Дообучение на уроках:<\/p>\n<pre><code>.venv\\Scripts\\python.exe retrain.py --dry-run     посмотреть накопленные уроки\n.venv\\Scripts\\python.exe retrain.py               дообучить, сдать экзамен, включить\n<\/code><\/pre>\n<p>Выключить свою модель совсем: <code>JARVIS_INTENT_ENGINE=gemini<\/code> в файле <code>jarvis-relay\\.env<\/code>.<\/p>\n<hr />\n<h2>13. Что говорить на защите<\/h2>\n<p><strong>Одной фразой.<\/strong> «Разбор команд выполняет собственная модель: открытая Qwen2.5, дообученная\nмной на собственном датасете из 17 тысяч примеров. На экзамене из 250 фраз связка &quot;своя\nмодель, а при сомнении Gemini&quot; даёт 100% — столько же, сколько сам Gemini, — при медиане\n140 мс против 2 секунд: 82% фраз модель разбирает сама, без интернета. Gemini остаётся\nзапасным путём и учителем».<\/p>\n<p><strong>Если спросят «а сама модель, без Gemini?».<\/strong> 97,2% на моём экзамене и 89,1% на втором —\nиз 201 живой фразы, которую придумал и разметил Gemini. Вторую цифру стоит назвать самому:\nона показывает, что экзамен, написанный автором, завышает оценку, и что это было измерено,\nа не замолчано. У первой версии на тех же живых фразах было 77,1%.<\/p>\n<p><strong>Если спросят «как модель стала лучше».<\/strong> Дистилляцией: Gemini придумал 1446 фраз и сам\nих разметил; сравнение показало, где своя модель системно ошибается (раздел 8); 1199 фраз\nи шаблоны на найденные дыры ушли в обучение, 201 фраза отложена как второй экзамен.<\/p>\n<p><strong>Если спросят «это же не ваша модель, а Qwen».<\/strong> Базовая модель — открытая, как открытая\nбиблиотека. Моё — датасет и правила разметки, обученные веса, формат ответа, методика оценки,\nсвязка с запасным путём и самообучение. Обучить языковую модель с нуля на 12 тысячах\nпримеров нельзя в принципе; дообучение — стандартный метод.<\/p>\n<p><strong>Если спросят «чем докажете точность».<\/strong> Два экзамена, на которых модель не обучалась:\n432 совпадающие фразы выброшены из обучения автоматически. Одним и тем же скриптом измерены\nрегулярки (39,6%), Gemini (92,8% со старым промптом, 100% с новым), своя модель и вся\nсвязка. Отчёт по каждой фразе сохранён.<\/p>\n<p><strong>Если спросят «а что, если модель ошибётся».<\/strong> Три уровня защиты: проверка формата ответа\nкодом; порог уверенности, ниже которого ответ перепроверяет Gemini; белый список и запрет\nопасных целей — после любого разборщика.<\/p>\n<p><strong>Что показать вживую (2 минуты):<\/strong><\/p>\n<ol>\n<li>Выключить интернет на ПК. Сказать «сделай потише», «открой кинопоиск», «закрой блокнот» —\nкоманды выполняются мгновенно. Раньше без интернета это не работало.<\/li>\n<li>Сказать «выключи компьютер» — отказ. Объяснить находку: Gemini такую просьбу отправлял\nагенту, и это было дырой в безопасности.<\/li>\n<li>Показать таблицу из раздела 8 и отчёт о расхождениях с Gemini\n(<code>jarvis-ml/runs/distill-report.md<\/code>) — ошибки не спрятаны.<\/li>\n<\/ol>\n<p><strong>Что рассказать про процесс.<\/strong> Замер показал три неожиданные вещи, и все три вошли в работу:\nдыру в безопасности у Gemini, незнание Gemini о том, что папки открывает простая команда, и\nотказ ключа Gemini посреди работы — живой довод в пользу своей модели.<\/p>\n<hr />\n<h2>14. Ограничения — честно<\/h2>\n<ol>\n<li><strong>Экзамен А и обучающие шаблоны писал один и тот же автор, и это завышало оценку.<\/strong>\nИзмерено 8 октября: у первой версии 97,6% на экзамене А и 77,1% на живых фразах от Gemini.\nЭкзамен Б это исправляет лишь отчасти: его фразы придумала языковая модель, а не живой\nпользователь, и разметку Gemini человек не перепроверял. Экзамен из фраз самого владельца\nсистемы (30–50 штук) по-прежнему нужен.<\/li>\n<li><strong>Сама модель слабее Gemini.<\/strong> На экзамене А у неё 97,2% против 100%, на живых фразах она\nсогласна с Gemini в 89,1% случаев. Вровень с Gemini идёт только связка, и то на экзамене\nА; на экзамене Б связка даёт 96,5%.<\/li>\n<li><strong>Связка на экзамене Б не прогонялась через релей<\/strong> — посчитана по готовым ответам\n(раздел 8). На экзамене А прогон настоящий: 250 из 250.<\/li>\n<li><strong>За точность связки платит Gemini.<\/strong> Любой ответ «не понял» и любой ответ с уверенностью\nниже 0,9 уходит на перепроверку: на экзамене А это 16% фраз, на живых фразах — около\nполовины (там треть фраз — болтовня и просьбы, которые система не выполняет). Без\nинтернета отвечает одна модель, и точность — её собственная: 97,2% и 89,1%.<\/li>\n<li><strong>Вторая версия на экзамене А на одну фразу хуже первой<\/strong> (243 против 244). Три новые\nошибки: «засними, что происходит на компьютере» (задача агенту вместо скриншота), «спой\nпесню» (включить музыку вместо «не понял») и «забронируй столик через сайт» («не понял»\nвместо задачи агенту). Две последние, скорее всего, — следствие шаблонов, добавленных\n8 октября («поставь песню» как задача, «забронируй столик» как отказ); это не проверялось.<\/li>\n<li><strong>Главная оставшаяся ошибка — «в браузере или в программах».<\/strong> 14 из 22 расхождений с\nGemini на экзамене Б. Сам Gemini здесь тоже непоследователен: «поставь на паузу» он\nразмечал то так, то так.<\/li>\n<li><strong>Громкость задаётся только уровнем.<\/strong> «Громче на 20%» в протоколе выразить нечем: своя\nмодель ставит 20, Gemini — 80, и оба ответа неточны. Нужна отдельная команда.<\/li>\n<li><strong>Самообучение написано и покрыто тестами, но вживую не прогонялось.<\/strong><\/li>\n<li><strong>Модель знает только то, что есть в словарях и в живых фразах.<\/strong> Сайт или программу,\nкоторых там нет, она либо угадает, либо ответит неуверенно — тогда фраза уйдёт в Gemini.\nНа экзамене Б так было с «папкой Отпуск 2023» и «окном графического редактора».<\/li>\n<li><strong>Запрет опасных целей — это список правил, а не понимание.<\/strong> Необычную формулировку он\nможет пропустить; тогда остаются защиты агента (запрет терминала, подтверждения,\nотказ вводить пароли).<\/li>\n<li><strong>Модель 1.5B скачана, но не обучалась.<\/strong> Сравнение с ней не проводилось; обучение займёт\nдва с лишним часа работы видеокарты.<\/li>\n<li><strong>Нагрев.<\/strong> Первое обучение 49 минут держало видеокарту ноутбука на 86 °C. Второе шло\n65 минут в «прохладном режиме» (<code>--cool-ms 250<\/code>, пауза после каждого шага) при 80 °C.\nРезультат сохраняется после каждого прохода, остановка его не стирает.<\/li>\n<\/ol>\n"}, {"nav": "Связки, git и код", "file": "6-Связки-git-быстрые-команды.md", "heads": ["Оглавление", "1. Коротко: что сделано", "2. Git с телефона", "3. Агент для кода", "4. Быстрые команды", "5. Составные фразы", "6. «Для каждого из списка»", "7. «Дождись, пока…»", "8. «Продолжи с места сбоя»", "9. Отчёт о задаче", "10. Изменения протокола", "11. Файлы на диске и выключатели", "12. Что проверено, а что нет"], "html": "<h1>Длинные связки, git, быстрые и составные команды — объяснение<\/h1>\n<blockquote>\n<p>Файл 6. Что добавлено 19 октября 2026 по плану доводки (этапы 2–5): агент делает\nкоммит и push в git, правит код руками внешнего агента для кода, понимает «пауза»,\n«громче на 20%» и «сделай потише и открой ютуб», выполняет шаги «для каждого из\nсписка», умеет «дождаться, пока…» и «продолжить с места сбоя», а в итоге задачи\nговорит, сколько раз обращался к ИИ.<\/p>\n<p>Всё новое — с выключателями, прежнее поведение не сломано. Тесты: агент 130,\nрелей — все зелёные, общий протокол Kotlin — зелёный.<\/p>\n<\/blockquote>\n<hr />\n<h2>Оглавление<\/h2>\n<ol>\n<li><a href=\"#1-%D0%BA%D0%BE%D1%80%D0%BE%D1%82%D0%BA%D0%BE-%D1%87%D1%82%D0%BE-%D1%81%D0%B4%D0%B5%D0%BB%D0%B0%D0%BD%D0%BE\">Коротко: что сделано<\/a><\/li>\n<li><a href=\"#2-git-%D1%81-%D1%82%D0%B5%D0%BB%D0%B5%D1%84%D0%BE%D0%BD%D0%B0\">Git с телефона<\/a><\/li>\n<li><a href=\"#3-%D0%B0%D0%B3%D0%B5%D0%BD%D1%82-%D0%B4%D0%BB%D1%8F-%D0%BA%D0%BE%D0%B4%D0%B0\">Агент для кода<\/a><\/li>\n<li><a href=\"#4-%D0%B1%D1%8B%D1%81%D1%82%D1%80%D1%8B%D0%B5-%D0%BA%D0%BE%D0%BC%D0%B0%D0%BD%D0%B4%D1%8B\">Быстрые команды<\/a><\/li>\n<li><a href=\"#5-%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%BD%D1%8B%D0%B5-%D1%84%D1%80%D0%B0%D0%B7%D1%8B\">Составные фразы<\/a><\/li>\n<li><a href=\"#6-%D0%B4%D0%BB%D1%8F-%D0%BA%D0%B0%D0%B6%D0%B4%D0%BE%D0%B3%D0%BE-%D0%B8%D0%B7-%D1%81%D0%BF%D0%B8%D1%81%D0%BA%D0%B0\">«Для каждого из списка»<\/a><\/li>\n<li><a href=\"#7-%D0%B4%D0%BE%D0%B6%D0%B4%D0%B8%D1%81%D1%8C-%D0%BF%D0%BE%D0%BA%D0%B0\">«Дождись, пока…»<\/a><\/li>\n<li><a href=\"#8-%D0%BF%D1%80%D0%BE%D0%B4%D0%BE%D0%BB%D0%B6%D0%B8-%D1%81-%D0%BC%D0%B5%D1%81%D1%82%D0%B0-%D1%81%D0%B1%D0%BE%D1%8F\">«Продолжи с места сбоя»<\/a><\/li>\n<li><a href=\"#9-%D0%BE%D1%82%D1%87%D1%91%D1%82-%D0%BE-%D0%B7%D0%B0%D0%B4%D0%B0%D1%87%D0%B5\">Отчёт о задаче<\/a><\/li>\n<li><a href=\"#10-%D0%B8%D0%B7%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F-%D0%BF%D1%80%D0%BE%D1%82%D0%BE%D0%BA%D0%BE%D0%BB%D0%B0\">Изменения протокола<\/a><\/li>\n<li><a href=\"#11-%D1%84%D0%B0%D0%B9%D0%BB%D1%8B-%D0%BD%D0%B0-%D0%B4%D0%B8%D1%81%D0%BA%D0%B5-%D0%B8-%D0%B2%D1%8B%D0%BA%D0%BB%D1%8E%D1%87%D0%B0%D1%82%D0%B5%D0%BB%D0%B8\">Файлы на диске и выключатели<\/a><\/li>\n<li><a href=\"#12-%D1%87%D1%82%D0%BE-%D0%BF%D1%80%D0%BE%D0%B2%D0%B5%D1%80%D0%B5%D0%BD%D0%BE-%D0%B0-%D1%87%D1%82%D0%BE-%D0%BD%D0%B5%D1%82\">Что проверено, а что нет<\/a><\/li>\n<\/ol>\n<hr />\n<h2>1. Коротко: что сделано<\/h2>\n<table>\n<thead>\n<tr>\n<th>Что<\/th>\n<th>Как звучит<\/th>\n<th>Где в коде<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Git: status, pull, commit, push<\/td>\n<td>«запушь демо», «закоммить и запушь»<\/td>\n<td><code>GitTool<\/code>, <code>DevTools<\/code>, <code>RepoCatalog<\/code><\/td>\n<\/tr>\n<tr>\n<td>Правка кода<\/td>\n<td>«поменяй порт в docker-compose на 8090 и запушь»<\/td>\n<td><code>CodeAgent<\/code> (Claude Code без терминала)<\/td>\n<\/tr>\n<tr>\n<td>Быстрые команды<\/td>\n<td>«пауза», «следующий трек», «громче на 20%», «сверни все окна»<\/td>\n<td>релей <code>QuickPhrases<\/code>, агент <code>quickAction<\/code><\/td>\n<\/tr>\n<tr>\n<td>Составные фразы<\/td>\n<td>«сделай потише и открой ютуб»<\/td>\n<td>релей <code>HybridIntentParser.composite<\/code>, агент <code>sequence<\/code><\/td>\n<\/tr>\n<tr>\n<td>Для каждого из списка<\/td>\n<td>«отправь одногруппникам отчёт»<\/td>\n<td><code>RecipientLists<\/code>, <code>GeminiTaskPlanner<\/code> (for_each)<\/td>\n<\/tr>\n<tr>\n<td>Дождаться<\/td>\n<td>«дождись конца сборки и напиши»<\/td>\n<td>шаг WAIT в <code>PlanRunner<\/code><\/td>\n<\/tr>\n<tr>\n<td>Продолжить<\/td>\n<td>«Фауст, продолжи»<\/td>\n<td><code>ResumeStore<\/code>, <code>PlanRunner.withResume<\/code><\/td>\n<\/tr>\n<tr>\n<td>Отчёт<\/td>\n<td>«…без обращений к ИИ; итог: отправлено main → origin/main»<\/td>\n<td><code>CommandExecutor.resultNote<\/code>, счётчик <code>RelayLlmClient.calls<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Главная идея везде одна: <strong>модель выбирает, код исполняет и проверяет.<\/strong> Модель может\nсказать «сделай push в репозиторий демо» или «повтори для списка одногруппники», но путь к\nпапке, список людей, текст команды git и решение «можно ли» — у кода.<\/p>\n<hr />\n<h2>2. Git с телефона<\/h2>\n<p><strong>Как работает.<\/strong> Человек сам перечисляет разрешённые репозитории в файле\n<code>~/.jarvis-agent/repos.txt<\/code>, по строке на проект: <code>демо = C:\\Users\\я\\FaustGitTest\\demo<\/code>.\nАгент работает только с ними. Планировщик видит названия, но не пути.<\/p>\n<p>Операций четыре: <code>status<\/code>, <code>pull<\/code>, <code>commit<\/code>, <code>push<\/code>. Их выполняет <code>GitTool<\/code> — Java запускает\nпрограмму <code>git<\/code> напрямую, с фиксированными аргументами, без cmd и PowerShell. Сообщение\nкоммита передаётся через стандартный ввод (<code>git commit -F -<\/code>), поэтому никакой текст от модели\nне может стать командой.<\/p>\n<p><strong>Почему это не нарушает запрет терминала.<\/strong> Терминал запрещён (ShellGuard), потому что в нём\nмодель пишет любую команду. Здесь команду собирает код, а модель выбирает одну из четырёх\nопераций — как кнопку.<\/p>\n<p><strong>Подтверждение — в момент коммита и с диффом.<\/strong> Обычный план подтверждается целиком в\nначале. С кодом так нельзя: до правки неизвестно, что изменится, и «Да» на неизвестное ничего\nне стоит. Поэтому вопрос задаётся при коммите, и в нём показаны список файлов и сами строки\nизменений. Если сразу за коммитом идёт push того же репозитория, вопрос один на оба шага: два\n«Да» подряд приучают нажимать не читая (то же наблюдение, что 30.09 с тремя подтверждениями).<\/p>\n<p><strong>Защиты.<\/strong><\/p>\n<ul>\n<li>Без «Да» ничего не коммитится и не отправляется; молчание — это «нет». После отказа индекс\nвозвращается как был, правки на диске остаются целыми.<\/li>\n<li>Файлы с секретами (<code>.env<\/code>, ключи, сертификаты, <code>token.properties<\/code>) в коммит не попадают\nникогда: коммит отменяется целиком, человека даже не спрашивают. <code>.env.example<\/code> разрешён —\nэто образец без значений.<\/li>\n<li>git не может спросить пароль (<code>GIT_TERMINAL_PROMPT=0<\/code>): без входа push честно падает,\nа не висит.<\/li>\n<li><code>pull<\/code> только перемоткой: если ветки разошлись, агент сам не сливает, а говорит человеку.<\/li>\n<li>«Нет» на коммите останавливает весь план — перестраивать его «в обход» отказа нельзя\n(<code>PlanRunner.Declined<\/code>).<\/li>\n<\/ul>\n<p><strong>Без планировщика.<\/strong> «git status демо», «запушь демо», «закоммить и запушь демо» релей сразу\nотдаёт агенту (<code>StubIntentParser<\/code>), а агент сразу строит готовый план (<code>DevTools.preset<\/code>).\nНи Gemini, ни своя модель не нужны, работает без интернета. Живой прогон: <strong>2 шага, 1–2 с,\n1 вопрос, 0 обращений к ИИ<\/strong>; коммит дошёл до «сервера» — голого репозитория на том же ПК.<\/p>\n<hr />\n<h2>3. Агент для кода<\/h2>\n<p>Править код по смыслу — задача другого масштаба: прочитать проект, найти место, аккуратно\nизменить. Для этого есть готовые агенты (Claude Code, Gemini CLI, Aider). «Фауст» здесь\nдиспетчер: решает, где можно работать и что можно делать, и показывает итог человеку.<\/p>\n<p><code>CodeAgent<\/code> запускает Claude Code без окна (<code>claude -p<\/code>) в папке разрешённого репозитория.\nЗадача передаётся через стандартный ввод: в командной строке Windows кириллица и кавычки\nломаются. Инструменты выдаются только такие: <code>Read, Edit, Write, Glob, Grep<\/code>. <strong>Терминала у\nнего нет вовсе<\/strong> — он не может собрать проект, сделать push или сходить в интернет. Читать и\nправить <code>.env<\/code> тоже запрещено.<\/p>\n<p>Что изменил агент для кода, «Фауст» узнаёт не с его слов, а по диску: снимает отпечатки\n(<code>git hash-object<\/code>) изменённых файлов до и после работы. Так видна правка даже в файле,\nкоторый был изменён ещё до агента.<\/p>\n<p><strong>Где ключ.<\/strong> Это осознанное исключение из правила «ключ модели только на релее»: агент для\nкода работает под учётной записью самого пользователя на его же ПК — он один раз входит в\nClaude Code. В коде и настройках «Фауста» ключа нет. Какую программу запускать, задаёт\n<code>code.command<\/code> (можно поставить другую).<\/p>\n<p>Пример полной связки: «поменяй порт web в docker-compose демо на 8090, закоммить и запушь» →\nпланировщик: <code>[code] демо: порт 8090<\/code> → <code>[git] commit «Порт 8090»<\/code> → <code>[git] push<\/code>.<\/p>\n<hr />\n<h3>3а. Обновление 20.10: работа с проектами всерьёз<\/h3>\n<p><strong>Встроенный редактор (<code>GeminiCodeEditor<\/code>).<\/strong> Claude Code на ПК требует отдельного входа, а\nна этом ПК он вышел из аккаунта. Поэтому появился второй редактор — через Gemini на релее,\nтем же путём, что весь агент: ключ остаётся на релее, инвариант не нарушается.<\/p>\n<ul>\n<li>Маленький проект модель получает целиком, большой — сначала списком файлов, и сама выбирает\nдо 6 нужных.<\/li>\n<li>Ответ — пары «было → стало». Код применяет пару, только если «было» встречается в файле\nровно один раз. Сначала проверяются все пары и лишь потом что-то пишется: полправки не бывает.<\/li>\n<li>Концы строк файла (CRLF на Windows) сохраняются. Писать вне проекта, в <code>.git<\/code> и в файлы с\nсекретами нельзя.<\/li>\n<\/ul>\n<p>Какой редактор брать, задаёт <code>code.engine<\/code>. <code>auto<\/code> пробует Claude Code; если тот не\nустановлен или не вошёл, берёт встроенный и 10 минут не тратит время на повторные попытки.\nЖивой прогон «правка в демо: поменяй порт на 8090»: <strong>9 с, 1 обращение к ИИ<\/strong>, в диффе ровно\nодна изменённая строка, коммит дошёл до «сервера».<\/p>\n<p><strong>Сообщение коммита<\/strong> берётся из описания правки (первая фраза, до 72 символов) — «Изменен\nвнешний порт сервиса web на 8090», а не безликое «изменения».<\/p>\n<p><strong>Три ответа вместо двух.<\/strong> Если за коммитом идёт push, вопрос предлагает «Да» (коммит и\npush), «Только коммит» и «Нет».<\/p>\n<p><strong>Новые операции git:<\/strong> история (<code>log<\/code>), ветка (перейти или создать; имя проверяет сам git),\nоткат несохранённых правок (<code>discard<\/code> — только с «Да», с перечнем файлов; новые файлы не\nудаляются).<\/p>\n<p><strong>Экран «Проекты» в приложении.<\/strong> Команда протокола <code>dev_repos<\/code> → ответ <code>repo_list<\/code>: проекты\nс веткой, изменёнными файлами, «не отправлено / на сервере новее», последним коммитом. Только\nчтение и без путей на диске. Кнопки карточки — Коммит и push, Push, Pull, История, Ветка…,\nОткатить — и поле «Что поменять в коде?». Всё это обычные задачи агенту с готовой формулировкой:\nагент узнаёт их без модели. Сверху экрана — «Ход задачи»: план, вопрос с подсвеченным диффом\n(зелёные и красные строки, моноширинно) и итог. Подтвердить коммит можно, не уходя в чат.\nПосле задачи карточки обновляются сами.<\/p>\n<h3>3б. Обновление 11.11: тесты, исправление по ошибке, запасной редактор, показ в IDE<\/h3>\n<p><strong>Сначала замер.<\/strong> План был — управлять встроенными ИИ-помощниками сред разработки (Gemini в\nAndroid Studio, AI Assistant в PyCharm) через их окна. Замер: UI Automation видит в окне\nAndroid Studio <strong>0 элементов<\/strong>. Среды JetBrains рисуют интерфейс сами (Swing) и отдают его\nнаружу только через Java Access Bridge — это другой механизм, агент его не читает. Остались бы\nтолько снимки экрана в Gemini: медленно, платно за каждый шаг, хрупко при печати промпта в\nчужой чат. Поэтому от этой идеи отказались, а сделали четыре вещи ниже.<\/p>\n<p><strong>1. Разрешённые команды проектов<\/strong> (<code>RepoCommands<\/code>). Человек сам пишет в\n<code>~/.jarvis-agent/repo-commands.txt<\/code> строки <code>демо: тесты = powershell -NoProfile -ExecutionPolicy Bypass -File tests\\check.ps1<\/code> или <code>диплом: тесты = gradlew.bat test<\/code>. В плане появляется\nоперация <code>run<\/code>: «прогнать «тесты» в «демо»». Модель называет <strong>только название<\/strong> из списка —\nкомандную строку, аргументы и папку задал человек; ни одного символа от модели в команду не\nпопадает. Это тот же принцип, что у доверенных скриптов, но команда привязана к проекту и\nвыполняется в его папке. В отличие от скрипта, долгий прогон в фон не уходит: тесты, которые\n«ещё идут», ничего не доказывают. Не уложилась в <code>code.commandTimeoutSec<\/code> (600 с) — процесс\nостанавливается вместе с дочерними (java под gradlew).<\/p>\n<p><strong>2. Цикл «правка → тесты → исправление → тесты».<\/strong> «Правка в демо: …» теперь сама вставляет\nпрогон тестов между правкой и коммитом, если у проекта они описаны. Тесты упали, а в этой\nзадаче агент для кода правил этот проект — значит, скорее всего, сломала правка. Агенту для\nкода уходит исходная задача <strong>вместе с текстом ошибки<\/strong> (последние строки вывода, до 6000\nсимволов), и тесты прогоняются снова. Попытка одна (<code>code.fixAttempts<\/code>): если модель не\nисправила по точному тексту ошибки с первого раза, вторая чаще ломает что-то ещё. Дальше —\nчеловек.<\/p>\n<ul>\n<li>Не прошли и после исправления — <strong>коммита не будет<\/strong>, даже если план дойдёт до него в\nобход (страховка в самом коммите); правка остаётся в папке.<\/li>\n<li>Тесты упали, а агент проект не правил — чинить чужое без спроса нельзя: только отчёт.<\/li>\n<li>В вопросе о коммите появилась строка «Проверено: «тесты» прошли (12 с)». Человек решает по\nдиффу и по тестам. Сообщение коммита — по исходной правке, а не по исправлению.<\/li>\n<li>На телефон из лога идут только «ключевые» строки (FAIL, error, ошибка, exception) — не\nбольше 6.<\/li>\n<\/ul>\n<p><strong>3. Запасной редактор чаще.<\/strong> Раньше на встроенный редактор (Gemini) переходили, только если\nClaude Code не установлен или не вошёл. Теперь ещё: кончился лимит, нет доступа по подписке,\nзавис (не ответил за <code>code.timeoutSec<\/code>), упал без ответа. Что Claude Code успел изменить до\nзависания, остаётся на диске и попадает в общий дифф. <strong>Не<\/strong> переходим, если Claude Code\nпоработал и сам отказался («задача опасна»): отдавать ту же задачу другой модели в обход\nотказа нельзя. В итоге видно, кто правил: «изменено (встроенный редактор, т.к. у Claude Code\nкончился лимит)».<\/p>\n<p><strong>4. Показ правки в IDE<\/strong> (<code>IdeView<\/code>). После правки изменённые файлы (до трёх) открываются на\nизменённой строке официальной командой запуска среды: <code>studio64.exe --line 12 файл<\/code>,\n<code>Code.exe -g файл:12<\/code>. Это делает код, без модели и кликов; строку даёт <code>git diff -U0<\/code>.\nСреда выбирается по типу проекта (Android — Android Studio, Python — PyCharm, Gradle/Maven —\nIntelliJ IDEA, иначе VS Code), но в режиме <code>auto<\/code> — <strong>только если она уже открыта<\/strong>: тяжёлую\nпрограмму агент без спроса не запускает. <code>always<\/code> — запустить, <code>off<\/code> — никогда.<\/p>\n<p><strong>Живая проверка 11.11.<\/strong> Команда тестов «демо» (<code>tests\\check.ps1<\/code>: порты в docker-compose в\nпределах 1–65535, у страницы есть заголовок): на исправном проекте — «прошли»; с портом 99999 —\n«не прошли, код 1» и строка <code>FAIL: port 99999 … out of range<\/code>. Claude Code вживую не\nпроверен: сервер ответил 403 <code>oauth_not_allowed_for_organization<\/code> — «Claude Code can't use\nyour Claude subscription, usually because a payment is past due». Вход при этом есть\n(<code>claude auth status<\/code>), а прежний разбор ответа принял это за «не вошёл» из-за слов «API key» в\nтексте — исправлено, теперь причина называется верно. Живой прогон всей связки:\n<code>./gradlew runCodeCheck --args=&quot;демо|поменяй внешний порт web на 8095&quot;<\/code> (без релея и телефона,\nпечатает время каждого шага).<\/p>\n<h2>4. Быстрые команды<\/h2>\n<p>Новая команда протокола <code>quick_action<\/code> с закрытым списком действий: <code>play_pause<\/code>,\n<code>next_track<\/code>, <code>prev_track<\/code>, <code>volume_delta<\/code> (±N процентов от текущей), <code>minimize_all<\/code>.<\/p>\n<p><strong>Узнаются правилами, без модели<\/strong> (<code>QuickPhrases<\/code> в релее): таких фраз немного, звучат они\nпочти одинаково, а правило отвечает мгновенно и всегда одинаково. Своя модель этой команды не\nзнает. До этого «громче на 20%» превращалось в «громкость 20», то есть звук становился\n<strong>тише<\/strong> (экзамен Б, фраза b-45).<\/p>\n<p>Правила узкие: фраза должна целиком быть командой. «Сделай потише» без числа по-прежнему\nозначает абсолютную громкость (как раньше), а «громкость на 20» — «выставь 20».<\/p>\n<p><strong>На ПК.<\/strong> Медиаклавиши жмутся через WinAPI <code>keybd_event<\/code>: Windows отдаёт их тому плееру,\nкоторый сейчас играет, какое бы окно ни было впереди. Сворачивание — <code>Win+M<\/code>. Для «громче\nна N» скрипт Core Audio читает текущую громкость и сдвигает её.<\/p>\n<p>Найденная при проверке ошибка: позиционный аргумент «-5» PowerShell принимает за имя\nпараметра, и скрипт молча выставлял громкость <strong>0<\/strong>. Исправлено — параметры передаются по\nимени (<code>-Level -5 -Mode delta<\/code>).<\/p>\n<hr />\n<h2>5. Составные фразы<\/h2>\n<p>«Сделай потише и открой ютуб» раньше уходила ИИ-агенту целиком: планировщик, скриншоты,\nдесятки секунд. Теперь релей режет фразу по «и», «потом», «затем», «а потом» и разбирает\nкаждую часть <strong>только правилами и своей моделью<\/strong>, без Gemini. Если <strong>каждая<\/strong> часть —\nпростая команда, и модель в каждой уверена (≥ 0,9), получается команда <code>sequence<\/code>. Агент\nвыполняет её по очереди и отвечает одним итогом. Если хоть одна часть не простая\n(«открой почту и найди письмо от Пети»), фраза разбирается целиком, как раньше.<\/p>\n<p>Почему без Gemini: иначе каждая длинная просьба агенту платила бы лишний запрос за попытку\nеё разрезать.<\/p>\n<p>Защиты: внутри <code>sequence<\/code> только простые команды, не больше 4, без вложенных списков и задач\nагенту. Белый список проверяет <strong>каждую<\/strong> команду внутри (<code>CommandWhitelist<\/code>), агент\nпроверяет ещё раз сам.<\/p>\n<p><strong>Замеры (своя модель v3, 19.10):<\/strong><\/p>\n<ul>\n<li>10 составных фраз: 9 из 9 простых стали правильным списком, а задача агенту («открой\nпочту и найди письмо») осталась одной задачей.<\/li>\n<li>На экзаменах А и Б (451 фраза) ни одна фраза не стала списком по ошибке. Первая версия\nрезала по одной запятой и испортила одну фразу («покажи все программы, которые открыты»).\nПоэтому одна запятая больше не граница, а повтор одной и той же команды не считается\nсоставной фразой.<\/li>\n<\/ul>\n<hr />\n<h2>6. «Для каждого из списка»<\/h2>\n<p>Буквально «во все чаты» агент не делает: одна ошибка распознавания — и сообщение уходит всем,\nотозвать его нельзя. Рассылка идёт только по спискам, которые человек сам составил в\n<code>~/.jarvis-agent/lists.txt<\/code>: <code>одногруппники = Петя, Маша, Лера<\/code> (не больше 10 человек).<\/p>\n<p>Планировщик пишет шаги один раз, с <code>{имя}<\/code> вместо имени:\n<code>{&quot;scope&quot;:&quot;for_each&quot;,&quot;list&quot;:&quot;одногруппники&quot;,&quot;steps&quot;:[{&quot;scope&quot;:&quot;screen&quot;,&quot;goal&quot;:&quot;отправь {имя} отчёт&quot;}]}<\/code>.\n<strong>Размножает шаги код<\/strong>, а не модель: модель могла бы пропустить человека или придумать\nлишнего. Неизвестный список — отказ с перечнем существующих, а не догадка. Подтверждение\nрассылки всегда перечисляет всех получателей поимённо, и это дописывает код. Лимит 8\nподзадач размноженные шаги не обрезает: молча обрезанный список пропустил бы людей.<\/p>\n<hr />\n<h2>7. «Дождись, пока…»<\/h2>\n<p>Новый вид шага плана — WAIT. Он ничего не делает, только смотрит, пока не выполнится одно из\nусловий:<\/p>\n<ul>\n<li>закрылся процесс («пока закончится сборка» — <code>process: gradle<\/code>), опрос раз в 3 с;<\/li>\n<li>появился файл (<code>expect_file<\/code>), опрос раз в 3 с;<\/li>\n<li>на экране видно нужное (<code>check<\/code>) — смотрит модель, не чаще раза в 15 с и не больше 20 раз\nза шаг (это потолок цены ожидания).<\/li>\n<\/ul>\n<p>Время ожидания не входит в общий лимит задачи, как и время ответов человека. Иначе «дождись\nконца сборки» съедало бы весь лимит.<\/p>\n<p>«Когда закончится — напиши мне» — это WAIT, а итог задачи и так приходит на телефон (и\nозвучивается).<\/p>\n<hr />\n<h2>8. «Продолжи с места сбоя»<\/h2>\n<p>Если план оборвался (шаг не удался и перестроек не осталось, кончилось время, человек отменил),\n<code>PlanRunner<\/code> сохраняет в <code>~/.jarvis-agent/resume.json<\/code>, что сделано (с итогами — именами\nфайлов и т.п.) и что осталось, начиная с упавшего шага. «Фауст, продолжи» — агент спрашивает\n«Продолжить задачу «…»? Уже сделано: …; продолжу с шага: …» и идёт дальше. Сделанное не\nповторяется, а следующие шаги получают итоги сделанных, как будто обрыва не было.<\/p>\n<p>Не сохраняется, если человек сам сказал «нет». Живёт 3 часа: потом экран и файлы уже другие.\nВыполненный план стирает сохранённый. «Продолжи музыку» — это не продолжение задачи, а\nпауза/плей (правило в релее).<\/p>\n<hr />\n<h2>9. Отчёт о задаче<\/h2>\n<p><code>RelayLlmClient<\/code> считает свои запросы. Разница «после задачи минус до» — сколько обращений к\nИИ стоила задача. Эта цифра идёт:<\/p>\n<ul>\n<li>в итог на телефон: «…, обращений к ИИ: 7» или «…, без обращений к ИИ»;<\/li>\n<li>в журнал прогонов (<code>llmCalls<\/code>) — это цена задачи для таблиц.<\/li>\n<\/ul>\n<p>Плюс строка «итог: …» — результат последней подзадачи, то, что человеку важнее всего услышать.\nПример живого итога:<\/p>\n<blockquote>\n<p>цель достигнута за 2 шаг(ов), 1 с, подзадач: 2, вопросов: 1, без обращений к ИИ\nитог: «демо»: отправлено: main → origin/main (1 коммит(ов))<\/p>\n<\/blockquote>\n<hr />\n<h2>10. Изменения протокола<\/h2>\n<p>Две новые команды во всех трёх копиях (Kotlin <code>:shared<\/code>, релей, агент): <code>quick_action(action, amount)<\/code> и <code>sequence(commands)<\/code>. Обе — в белом списке релея с проверкой содержимого. Телефону\nпонимать их не нужно: он шлёт фразу, а получает обычный итог. Приложение на телефоне\nпересобирать не обязательно. Kotlin-копия обновлена ради инварианта «протокол синхронно в трёх\nместах», тест сериализации проходит, приложение собирается.<\/p>\n<p>git, правка кода, ожидание, списки и продолжение протокол не меняют: это новые виды\nподзадач внутри <code>agent_task<\/code>.<\/p>\n<hr />\n<h2>11. Файлы на диске и выключатели<\/h2>\n<table>\n<thead>\n<tr>\n<th>Файл<\/th>\n<th>Что<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>~/.jarvis-agent/repos.txt<\/code><\/td>\n<td>разрешённые репозитории (UTF-8, <code>имя = путь<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>~/.jarvis-agent/repo-commands.txt<\/code><\/td>\n<td>команды проектов (<code>репозиторий: название = команда<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>~/.jarvis-agent/lists.txt<\/code><\/td>\n<td>списки получателей (<code>название = имя, имя<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>~/.jarvis-agent/resume.json<\/code><\/td>\n<td>последний оборванный план (сам)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Настройка<\/th>\n<th>По умолчанию<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>code.enabled<\/code> (agent.properties)<\/td>\n<td>true<\/td>\n<td>агент для кода<\/td>\n<\/tr>\n<tr>\n<td><code>code.command<\/code><\/td>\n<td>claude<\/td>\n<td>чем править код<\/td>\n<\/tr>\n<tr>\n<td><code>code.timeoutSec<\/code><\/td>\n<td>300<\/td>\n<td>сколько ждать одну правку<\/td>\n<\/tr>\n<tr>\n<td><code>code.engine<\/code><\/td>\n<td>auto<\/td>\n<td>auto — Claude Code, а при сбое встроенный; claude; gemini<\/td>\n<\/tr>\n<tr>\n<td><code>code.commandTimeoutSec<\/code><\/td>\n<td>600<\/td>\n<td>сколько ждать команду проекта (тесты, сборку)<\/td>\n<\/tr>\n<tr>\n<td><code>code.testBeforeCommit<\/code><\/td>\n<td>true<\/td>\n<td>вставлять тесты в «правка в X: …» перед коммитом<\/td>\n<\/tr>\n<tr>\n<td><code>code.autoFix<\/code> / <code>code.fixAttempts<\/code><\/td>\n<td>true / 1<\/td>\n<td>исправлять по тексту упавших тестов, сколько раз<\/td>\n<\/tr>\n<tr>\n<td><code>code.showInIde<\/code><\/td>\n<td>auto<\/td>\n<td>открыть правку в IDE: auto (если открыта), always, off<\/td>\n<\/tr>\n<tr>\n<td><code>plan.waitMinutes<\/code><\/td>\n<td>10<\/td>\n<td>сколько ждать условия, если не сказано<\/td>\n<\/tr>\n<tr>\n<td><code>jarvis.intent.composite<\/code> (релей)<\/td>\n<td>true<\/td>\n<td>делить составные фразы<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Пустой <code>repos.txt<\/code> — git и правка кода недоступны. Пустой <code>lists.txt<\/code> — рассылки нет.<\/p>\n<hr />\n<h2>12. Что проверено, а что нет<\/h2>\n<p><strong>Проверено:<\/strong><\/p>\n<ul>\n<li>\n<p>юнит-тестами: git — на настоящем git во временной папке (коммит доходит до «сервера», без\n«Да» ничего не коммитится, <code>.env<\/code> не уходит даже с «Да»); for_each, WAIT, продолжение,\nбыстрые и составные фразы, белый список;<\/p>\n<\/li>\n<li>\n<p>вживую: «закоммить и запушь демо» — дважды; «громче/тише на 5» через Core Audio;<\/p>\n<\/li>\n<li>\n<p>составные фразы — на своей модели v3 в Ollama.<\/p>\n<\/li>\n<li>\n<p>11.11, юнит-тестами: команды проектов на настоящем процессе (<code>.cmd<\/code> в репозитории), цикл\n«правка ломает → исправление по тексту ошибки → тесты прошли → коммит дошёл до «сервера»»,\n«не исправилось → коммита нет, вопрос не задан, правка цела», переход на запасной редактор\nпри лимите (поддельный <code>claude<\/code>) и отсутствие перехода при отказе по существу, выбор IDE и\nстроки; вживую — команда тестов «демо» на исправном и сломанном файле.<\/p>\n<\/li>\n<\/ul>\n<p><strong>Не проверено:<\/strong><\/p>\n<ul>\n<li>агент для кода вживую: 11.11 Claude Code вошёл, но подписку использовать не может (403,\n«payment is past due»); нужно проверить оплату на claude.ai/settings/billing;<\/li>\n<li>показ правки в IDE вживую: Android Studio была открыта с проектом пользователя, открывать\nв ней чужой файл без спроса не стал;<\/li>\n<li>связка «поменяй порт, закоммить и запушь» через планировщик — нужен релей (Docker) и Gemini;<\/li>\n<li>медиаклавиши и «сверни все окна» вживую — не нажимал, чтобы не трогать музыку и окна\nпользователя;<\/li>\n<li>WAIT, for_each и «продолжи» на настоящем экране и мессенджере (только тесты);<\/li>\n<li>новые команды через телефон — приложение не переустанавливалось (и не обязано).<\/li>\n<\/ul>\n"}]</script>
<script>
(function(){
  var DOCS = JSON.parse(document.getElementById('doc-data').textContent);
  var article = document.getElementById('article');
  var navScroll = document.getElementById('navscroll');
  var crumb = document.getElementById('crumb');
  var nav = document.getElementById('nav');
  var scrim = document.getElementById('scrim');
  var bar = document.getElementById('bar');
  var search = document.getElementById('search');
  var docnav = document.getElementById('docnav');
  var totop = document.getElementById('totop');
  var current = 0;
  var headings = [];

  function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  /* GitHub-style anchors, so the links inside the documents keep working */
  function slug(text){
    return text.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/^\s+|\s+$/g, '').replace(/\s/g, '-');
  }

  function renderDoc(i, keepScroll){
    current = i;
    store('faust.doc', String(i));
    article.innerHTML = DOCS[i].html;

    var used = Object.create(null);
    headings = [];
    article.querySelectorAll('h2, h3').forEach(function(h){
      var base = slug(h.textContent);
      var id = base;
      if (used[base] !== undefined){ used[base]++; id = base + '-' + used[base]; } else { used[base] = 0; }
      h.id = id;
      headings.push({ id:id, text:h.textContent, level:h.tagName === 'H2' ? 2 : 3, el:h });
    });

    article.querySelectorAll('table').forEach(function(t){
      var w = document.createElement('div');
      w.className = 'tablewrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });

    article.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(ev){
        ev.preventDefault();
        var id = decodeURIComponent(a.getAttribute('href').slice(1));
        var target = document.getElementById(id);
        if (target) target.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });

    crumb.innerHTML = '<span class="num">' + (i + 1) + '</span> · ' + DOCS[i].nav;
    buildNav();
    buildDocNav();
    if (!keepScroll) window.scrollTo(0, 0);
    updateProgress();
  }

  function buildNav(){
    var q = search.value.trim().toLowerCase();
    navScroll.innerHTML = '';
    var shown = 0;

    DOCS.forEach(function(d, i){
      var matchDoc = !q || d.nav.toLowerCase().indexOf(q) >= 0;
      var items = [];
      if (i === current){
        items = headings.filter(function(h){ return !q || h.text.toLowerCase().indexOf(q) >= 0; });
      } else if (q) {
        items = d.heads.filter(function(t){ return t.toLowerCase().indexOf(q) >= 0; })
                       .map(function(t){ return { text:t, level:2, remote:true }; });
      }
      if (q && !matchDoc && items.length === 0) return;
      shown++;

      var b = document.createElement('button');
      b.className = 'docbtn' + (i === current ? ' active' : '');
      b.innerHTML = '<span class="idx">0' + (i + 1) + '</span><span>' + d.nav + '</span>';
      b.addEventListener('click', function(){ renderDoc(i); closeNav(); });
      navScroll.appendChild(b);

      if (items.length){
        var ul = document.createElement('ul');
        ul.className = 'toc';
        items.slice(0, q ? 12 : 200).forEach(function(h){
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = '#';
          a.className = h.level === 3 ? 'lvl3' : '';
          a.textContent = h.text;
          if (!h.remote) a.dataset.target = h.id;
          a.addEventListener('click', function(ev){
            ev.preventDefault();
            if (h.remote){ renderDoc(i); closeNav(); return; }
            var t = document.getElementById(h.id);
            if (t) t.scrollIntoView({ behavior:'smooth', block:'start' });
            closeNav();
          });
          li.appendChild(a);
          ul.appendChild(li);
        });
        navScroll.appendChild(ul);
      }
    });

    if (!shown){
      var e = document.createElement('div');
      e.className = 'nav-empty';
      e.textContent = 'Ничего не нашлось';
      navScroll.appendChild(e);
    }
  }

  function buildDocNav(){
    docnav.innerHTML = '';
    var mk = function(i, label, cls){
      var b = document.createElement('button');
      b.className = cls;
      b.innerHTML = '<span class="lbl">' + label + '</span><span class="ttl">' + DOCS[i].nav + '</span>';
      b.addEventListener('click', function(){ renderDoc(i); });
      return b;
    };
    if (current > 0) docnav.appendChild(mk(current - 1, 'Назад', 'prev'));
    if (current < DOCS.length - 1) docnav.appendChild(mk(current + 1, 'Дальше', 'next'));
  }

  var ticking = false;
  function updateProgress(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var pct = max > 0 ? Math.min(100, (h.scrollTop / max) * 100) : 0;
    bar.style.width = pct + '%';
    totop.hidden = h.scrollTop < 600;

    var active = null;
    for (var i = 0; i < headings.length; i++){
      if (headings[i].el.getBoundingClientRect().top <= 110) active = headings[i].id; else break;
    }
    navScroll.querySelectorAll('.toc a').forEach(function(a){
      a.classList.toggle('current', a.dataset.target === active);
    });
  }
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){ updateProgress(); ticking = false; });
  }, { passive:true });

  function openNav(){ nav.classList.add('open'); scrim.classList.add('open'); document.getElementById('menu').setAttribute('aria-expanded', 'true'); }
  function closeNav(){ nav.classList.remove('open'); scrim.classList.remove('open'); document.getElementById('menu').setAttribute('aria-expanded', 'false'); }
  document.getElementById('menu').addEventListener('click', function(){
    if (nav.classList.contains('open')) closeNav(); else openNav();
  });
  scrim.addEventListener('click', closeNav);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeNav(); });
  search.addEventListener('input', buildNav);
  totop.addEventListener('click', function(){ window.scrollTo({ top:0, behavior:'smooth' }); });

  var SIZES = [15, 16, 17, 18.5, 20, 22];
  var si = 2;
  var savedSize = load('faust.size');
  if (savedSize !== null && !isNaN(parseInt(savedSize, 10))) si = Math.min(SIZES.length - 1, Math.max(0, parseInt(savedSize, 10)));
  function applySize(){
    document.documentElement.style.setProperty('--fs', SIZES[si] + 'px');
    store('faust.size', String(si));
  }
  document.getElementById('fsplus').addEventListener('click', function(){ si = Math.min(SIZES.length - 1, si + 1); applySize(); });
  document.getElementById('fsminus').addEventListener('click', function(){ si = Math.max(0, si - 1); applySize(); });
  applySize();

  var savedDoc = parseInt(load('faust.doc'), 10);
  renderDoc(!isNaN(savedDoc) && savedDoc >= 0 && savedDoc < DOCS.length ? savedDoc : 0);
})();
</script>

</body>
</html>
